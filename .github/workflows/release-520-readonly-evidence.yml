name: release-521-readonly-evidence
on:
  push:
    branches: [ops/release-520-evidence-20261025]
    paths: [.github/workflows/release-520-readonly-evidence.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install paramiko
      - name: Observe installed revision, startup and compact evidence without writes
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import os,paramiko,shlex
          remote="import json,subprocess,os,time,pathlib,urllib.request,sqlite3,hashlib\nexpected='c5f14a3c0a2a1411460404c5152bd050fe0bed5a'\nactual=subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True).strip()\nassert actual==expected,(actual,expected)\nprint('INSTALLED_SHA='+actual)\nprint('OBSERVED_UTC='+time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()))\nstatus=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','-p','NRestarts','-p','ActiveState','-p','SubState','-p','ExecMainStartTimestamp'],text=True)\nprint('SERVICE='+json.dumps(dict(line.split('=',1) for line in status.splitlines())))\npid=next(line.split('=',1)[1] for line in status.splitlines() if line.startswith('MainPID='))\nif pid!='0':\n lines=pathlib.Path('/proc/'+pid+'/status').read_text().splitlines()\n print('MEMORY='+json.dumps([line for line in lines if line.startswith(('VmRSS:','VmHWM:','Threads:'))]))\nhttp_ready=False\nphases=subprocess.check_output(['journalctl','-u','seiltanzer','--since','-20 minutes','--no-pager','-n','200'],text=True)\nprint('STARTUP_PHASES='+json.dumps([line for line in phases.splitlines() if 'STARTUP_PHASE' in line][-14:]))\nfor route in ('/api/state','/api/research/runtime/worker-status','/api/ai/snapshot/status','/api/research/mathematical-edge'):\n try:\n  start=time.monotonic()\n  with urllib.request.urlopen('http://127.0.0.1:8790'+route,timeout=5) as response: data=json.loads(response.read(2000000))\n  if route=='/api/state':\n   http_ready=True\n   feeds=(data.get('tick') or data).get('feeds') or {}; price=feeds.get('price') or {}\n   selected={k:price.get(k) for k in ('status','fallback','source','source_id','source_ts')}\n  elif route.endswith('worker-status'):\n   worker=data.get('worker') or data\n   selected={k:worker.get(k) for k in ('current_phase','core_stage','core_stage_started_ts','last_duration_ms','last_error','memory_pressure','acceptance_gate_active')}\n  elif route=='/api/research/mathematical-edge': selected={k:data.get(k) for k in ('state','published_for_sha','family_market_model_summary','configured_instruments')}\n  else: selected={k:data.get(k) for k in ('ready','building','last_error','current_trade_id','snapshot_trade_id','age_sec','build_n','canonical_quote_available')}\n  print('HTTP='+json.dumps({'route':route,'ms':round((time.monotonic()-start)*1000,2),'data':selected}))\n except Exception as exc: print('HTTP_ERROR='+json.dumps({'route':route,'error':type(exc).__name__+':'+str(exc)[:180]}))\nroot=pathlib.Path('/opt/seiltanzer/data/research')\nfor name in ('mathematical_edge_latest.json','edge_family_sources_latest.json','fomc_prospective_latest.json','ede_v13_latest_audit.json'):\n p=root/name\n if not p.exists():print('REPORT='+json.dumps({'name':name,'exists':False}));continue\n if p.stat().st_size>2000000: print('REPORT='+json.dumps({'name':name,'error':'size bound'}));continue\n raw=p.read_bytes();data=json.loads(raw)\n print('REPORT='+json.dumps({'name':name,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'published_for_sha':data.get('published_for_sha'),'contract_version':data.get('contract_version'),'family_summary':data.get('family_market_model_summary')}))\ndb=pathlib.Path('/opt/seiltanzer/data/trades.db')\nprint('CAPACITY='+json.dumps({'db_bytes':db.stat().st_size,'wal_bytes':pathlib.Path(str(db)+'-wal').stat().st_size if pathlib.Path(str(db)+'-wal').exists() else 0,'free_bytes':__import__('shutil').disk_usage(db.parent).free}))\nif not http_ready:\n print('SQL_SKIPPED_DURING_STARTUP=1')\n raise SystemExit(0)\ntry:\n c=sqlite3.connect(db.as_uri()+'?mode=ro',uri=True,timeout=1);c.execute('PRAGMA query_only=ON')\n rows=c.execute('SELECT family,period,source_url,fetched_at,available_at,first_source_receipt_json,latest_source_receipt_json FROM macro_numeric_releases ORDER BY fetched_at DESC LIMIT 8').fetchall()\n for family,period,url,fetched,available,first,latest in rows:\n  first=json.loads(first) if first else {};latest=json.loads(latest) if latest else {}\n  print('MACRO_RECEIPT='+json.dumps({'family':family,'period':period,'first_source_url':url,'last_source_url':latest.get('source_url'),'fetched_at':fetched,'available_at':available,'first_receipt_present':bool(first),'series':[r.get('series_id') for r in latest.get('series_receipts',[])]}))\n c.close()\nexcept Exception as exc:print('MACRO_RECEIPT_ERROR='+type(exc).__name__+':'+str(exc)[:180])\n"
          c=paramiko.SSHClient()
          c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          c.connect('94.241.171.182',username='root',password=os.environ['SSH_PASSWORD'],timeout=20,auth_timeout=20,look_for_keys=False,allow_agent=False)
          command='/opt/seiltanzer/.venv/bin/python -c '+shlex.quote(remote)
          _,stdout,stderr=c.exec_command(command,timeout=90)
          print(stdout.read(65536).decode())
          error=stderr.read(8192).decode()
          if error: print(error)
          status=stdout.channel.recv_exit_status()
          c.close()
          raise SystemExit(status)
          PY
