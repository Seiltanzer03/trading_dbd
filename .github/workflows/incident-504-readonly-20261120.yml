name: incident-504-readonly-20261120
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths: ['.github/workflows/incident-504-readonly-20261120.yml']
permissions:
  contents: read
jobs:
  diagnosis:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ops/diagnose-terminal-504-20261120'
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Check the public routes without retaining response bodies
        run: |
          for route in / /api/state; do
            printf 'outside_before route=%s ' "$route"
            curl -sS -o /dev/null --connect-timeout 3 --max-time 9 \
              -w 'http=%{http_code} connect=%{time_connect} first_byte=%{time_starttransfer} total=%{time_total}\n' \
              "http://94.241.171.182:8790$route" || true
          done
      - name: Read listener, service, and recent resource diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          timeout: 15s
          command_timeout: 2m
          script: |
            set -u
            date -u '+diagnostic_utc=%FT%TZ'
            git -C /opt/seiltanzer rev-parse --verify HEAD
            systemctl show seiltanzer -p ActiveState -p SubState -p Result -p ExecMainStatus -p NRestarts -p MainPID -p MemoryCurrent -p MemoryPeak -p ActiveEnterTimestamp
            systemctl is-active nginx caddy || true
            df -Pk / /opt/seiltanzer
            free -m
            uptime
            ss -ltn | awk 'NR == 1 || /:(80|443|8790)[[:space:]]/'
            pid=$(systemctl show seiltanzer -p MainPID --value)
            if [ "$pid" -gt 0 ] 2>/dev/null; then
              ps -p "$pid" -o pid,stat,pcpu,pmem,rss,etimes,comm,wchan:24 || true
            fi
            for route in / /api/state; do
              printf 'loopback route=%s ' "$route"
              curl -sS -o /dev/null --connect-timeout 2 --max-time 8 \
                -w 'http=%{http_code} connect=%{time_connect} first_byte=%{time_starttransfer} total=%{time_total}\n' \
                "http://127.0.0.1:8790$route" || true
            done
            python3 - <<'PY'
            from collections import Counter
            import datetime
            import json
            import re
            import subprocess

            safe_patterns = {
                "oom": r"out of memory|oom.kill|killed process",
                "disk_full": r"no space left|database or disk is full|disk headroom",
                "sqlite_lock": r"database (?:table )?is locked|SQLITE_BUSY",
                "startup_phase": r"^STARTUP_PHASE phase=",
                "upstream_timeout": r"upstream timed out|gateway time.out",
                "task_exception": r"exception in ASGI|Traceback \(most recent call last\)",
                "storage_timeout": r"snapshot.*(?:deadline|timed out)|(?:deadline|timed out).*snapshot",
                "listener_ready": r"Uvicorn running|Application startup complete",
                "stopping": r"(?:Stopping|Stopped) seiltanzer",
            }
            for name, command in (
                ("service", ["-u", "seiltanzer"]),
                ("kernel", ["-k"]),
                ("proxy", ["-u", "nginx", "-u", "caddy"]),
            ):
                proc = subprocess.run(
                    ["journalctl", "-b", "--since", "-100 minutes", "--no-pager",
                     "-n", "1100", "-o", "json", *command],
                    text=True, capture_output=True, timeout=20, check=False,
                )
                totals = Counter()
                latest = {}
                for line in proc.stdout.splitlines():
                    try:
                        row = json.loads(line)
                        body = row.get("MESSAGE", "")
                        if not isinstance(body, str):
                            continue
                        ts = datetime.datetime.fromtimestamp(
                            int(row.get("__REALTIME_TIMESTAMP", 0)) / 1e6, datetime.timezone.utc
                        ).isoformat(timespec="seconds")
                    except (ValueError, TypeError):
                        continue
                    for key, rex in safe_patterns.items():
                        if re.search(rex, body, flags=re.I):
                            totals[key] += 1
                            latest[key] = ts
                    match = re.search(r'"GET (/|/api/state)(?:\?[^ ]*)? HTTP/[^"]+" ([0-9]{3})', body)
                    if match:
                        key = "get_" + match.group(1) + "_" + match.group(2)
                        totals[key] += 1
                        latest[key] = ts
                print(name, json.dumps({"totals": totals, "latest_utc": latest}, sort_keys=True))
            PY
            python3 - <<'PY'
            import json
            import math
            import re
            import subprocess
            import urllib.request
            from collections import Counter

            def read_cached(path, limit):
                with urllib.request.urlopen("http://127.0.0.1:8790" + path, timeout=5) as response:
                    body = response.read(limit + 1)
                if len(body) > limit:
                    raise ValueError("response size bound exceeded")
                value = json.loads(body)
                if not isinstance(value, dict):
                    raise ValueError("unexpected cached response")
                return value

            def obj(value):
                return value if isinstance(value, dict) else {}

            def finite(value):
                return type(value) in (int, float) and math.isfinite(value)

            def summary(state, status):
                tick = obj(state.get("tick"))
                feeds = obj(tick.get("feeds"))
                chain = obj(feeds.get("chain"))
                options = obj(tick.get("options_summary"))
                derivatives = obj(tick.get("option_derivative_state"))
                chain_error = str(chain.get("error") or "")
                cache = obj(chain.get("cache_fallback"))
                market = obj(tick.get("market"))
                raw_metrics = obj(derivatives.get("metrics"))
                confidences = [row.get("confidence") for row in raw_metrics.values()
                               if isinstance(row, dict) and finite(row.get("confidence"))]
                snapshots = state.get("ai_history")
                instrument = tick.get("instrument")
                return {
                    "scope": "cached_read_only_no_new_analysis",
                    "current_instrument": instrument if isinstance(instrument, str)
                                          and re.fullmatch(r"[A-Z0-9_]{2,16}", instrument) else None,
                    "active_trade_present": bool(tick.get("trade")),
                    "saved_reviews_for_active_trade": len(snapshots) if isinstance(snapshots, list) else 0,
                    "snapshot_available": status.get("ready") is True,
                    "option_context_available": bool(options),
                    "option_market_available": market.get("available") is True,
                    "option_age_s": round(options["chain_age_sec"], 1)
                                    if finite(options.get("chain_age_sec")) else None,
                    "option_cache_used": cache.get("used") is True,
                    "density_integrity_error": next((code for code in (
                        "OPTION_DENSITY_CENTER_MISMATCH", "OPTION_DENSITY_CENTER_UNAVAILABLE"
                    ) if code in chain_error), None),
                    "derivatives_available": derivatives.get("available") is True,
                    "derivative_sample_count": derivatives.get("sample_count")
                                               if type(derivatives.get("sample_count")) is int else None,
                    "metrics_with_confidence": len(confidences),
                    "metrics_below_25_pct_confidence": sum(value < 0.25 for value in confidences),
                }

            def startup_timings():
                phases = subprocess.run(
                    ["journalctl", "-u", "seiltanzer", "-b", "--since", "-6 hours",
                     "-n", "40", "--no-pager", "-o", "json", "--grep", "^STARTUP_PHASE phase="],
                    capture_output=True, text=True, timeout=12, check=False,
                )
                allowed = ("begin", "storage.prepare.begin", "storage.prepare.complete",
                           "app.create.complete", "schema.backup.begin", "schema.backup.complete",
                           "storage.runtime.begin", "storage.runtime.complete", "routes.complete", "uvicorn.run")
                starts = {}
                for line in phases.stdout.splitlines():
                    row = json.loads(line)
                    match = re.fullmatch(r"STARTUP_PHASE phase=([a-z.]+) elapsed_sec=([0-9.]+)",
                                         str(row.get("MESSAGE") or ""))
                    if not match or match[1] not in allowed:
                        continue
                    key = str(row.get("_PID") or "")
                    group = starts.setdefault(key, {"first_utc_epoch": None, "phase_elapsed_s": {}})
                    stamp = row.get("__REALTIME_TIMESTAMP")
                    if isinstance(stamp, str) and stamp.isdecimal() and group["first_utc_epoch"] is None:
                        group["first_utc_epoch"] = int(stamp) // 1_000_000
                    group["phase_elapsed_s"][match[1]] = round(float(match[2]), 3)
                return list(starts.values())[-3:]

            def readiness_summary(data):
                ready = obj(data.get("startup_integrity"))
                local = obj(data.get("last_local_backup"))
                allowed_scopes = {
                    "pre_engine_source", "post_engine_source", "post_schema_authoritative_source"
                }
                scope = ready.get("verification_scope")
                actions = data.get("recovery_actions")
                accepted_actions = ("serve_without_backup_under_low_disk",
                                    "reuse_stale_verified_backup_for_availability",
                                    "defer_schema_identity_backup_to_offhost",
                                    "defer_impossible_background_backup")
                present_actions = {row.get("action") for row in actions if isinstance(row, dict)} \
                    if isinstance(actions, list) else set()
                return {
                    "request_time_integrity_scan": data.get("request_time_integrity_scan"),
                    "startup_quick_check_passed": ready.get("ok") is True,
                    "startup_verification_scope": scope if scope in allowed_scopes else None,
                    "startup_local_backup_reused": ready.get("backup_reused") is True,
                    "verified_local_backup_available": local.get("verified") is True,
                    "schema_identity_backup_deferred": ready.get("schema_identity_backup_created") is False,
                    "durability_degraded": ready.get("durability_degraded") is True,
                    "recovery_actions": [name for name in accepted_actions if name in present_actions],
                }

            def provider_transport_counts():
                history = subprocess.run(
                    ["journalctl", "-u", "seiltanzer", "--since", "-24 hours",
                     "-n", "220", "--no-pager", "-o", "json", "--grep",
                     '"stage":"provider(?:_http|_fallback)?"'],
                    capture_output=True, text=True, timeout=12, check=False,
                )
                stages = Counter()
                errors = Counter()
                allowed_errors = {"HTTPStatusError", "ConnectError", "ProxyError", "ReadTimeout",
                                  "ConnectTimeout", "WriteTimeout", "RemoteProtocolError", "TimeoutError",
                                  "RuntimeError", "ValueError", "TypeError"}
                for line in history.stdout.splitlines():
                    row = json.loads(line)
                    message = row.get("MESSAGE")
                    if not isinstance(message, str) or len(message) > 2048:
                        continue
                    try:
                        trace = json.loads(message[message.index('{"request_id":'):])
                    except (ValueError, TypeError):
                        continue
                    if trace.get("stage") == "provider_http" and trace.get("event") == "end":
                        error = trace.get("exception_class")
                        if error is None:
                            stages["transport_completed"] += 1
                        else:
                            stages["transport_failed"] += 1
                            errors[error if error in allowed_errors else "other"] += 1
                    elif trace.get("stage") == "provider_fallback" and trace.get("event") == "error":
                        stages["deterministic_fallback_events"] += 1
                return {"last_24h_retained_trace_counts": dict(stages), "transport_failure_classes": dict(errors)}

            def main():
                print("service_startup_timings " + json.dumps(startup_timings(), allow_nan=False))
                state = read_cached("/api/state", 8_000_000)
                status = read_cached("/api/ai/snapshot/status", 128_000)
                print("live_review_summary " + json.dumps(summary(state, status), allow_nan=False, sort_keys=True))
                print("storage_ready_summary " + json.dumps(readiness_summary(
                    read_cached("/api/system/storage/status", 128_000)), allow_nan=False, sort_keys=True))
                print("provider_trace_summary " + json.dumps(provider_transport_counts(), allow_nan=False, sort_keys=True))

            if __name__ == "__main__":
                main()
            PY
      - name: Repeat public checks after the VPS sample
        run: |
          for route in / /api/state; do
            printf 'outside_after route=%s ' "$route"
            curl -sS -o /dev/null --connect-timeout 3 --max-time 9 \
              -w 'http=%{http_code} connect=%{time_connect} first_byte=%{time_starttransfer} total=%{time_total}\n' \
              "http://94.241.171.182:8790$route" || true
          done
