name: history-cutover-fixed-worker-20261021

on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/history-cutover-fixed-worker-20261021.yml]

permissions:
  contents: read
  statuses: read
  actions: read

concurrency:
  group: production-seiltanzer
  queue: max
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-22.04
    timeout-minutes: 210
    env:
      EXPECTED_SHA: bd615fbd5481a61625c31e62d19f91fd2277dcfd
      RESUME_RUN_ID: '39582128571'
      NEW_RUN_ID: ${{ github.run_id }}
      DIAGNOSTIC: 'false'
    steps:
      - name: Admit one resume for this workflow push
        id: once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=15) as response:rows=json.load(response)['workflow_runs']
          matches=[r['id'] for r in rows if r['path']=='.github/workflows/history-cutover-fixed-worker-20261021.yml' and r['event']=='push']
          assert matches
          execute=int(os.environ['GITHUB_RUN_ID'])==min(matches)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('execute='+str(execute).lower()+'\n')
          print(json.dumps({'once_admitted':execute,'first_run_id':min(matches)}))
          PY
      - uses: actions/checkout@v4
        if: steps.once.outputs.execute == 'true'
        with:
          ref: 0dd99cd7ab946e59910b8e5af462b30d11923fcf
      - name: Require reviewed green deployed revision
        if: steps.once.outputs.execute == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$DIAGNOSTIC" = true ]; then test -z "$RESUME_RUN_ID"; fi
          worker_sha=0dd99cd7ab946e59910b8e5af462b30d11923fcf
          test "$(git rev-parse HEAD)" = "$worker_sha"
          # The external builder is fixed without installing code or bypassing
          # the native owner's installed-SHA/fence/rollback/capacity checks.
          for checked_sha in "$EXPECTED_SHA" "$worker_sha"; do
            curl -fsS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPOSITORY/commits/$checked_sha/status" \
              | python3 -c 'import json,sys; rows=json.load(sys.stdin)["statuses"]; latest={}; [latest.setdefault(r["context"],r["state"]) for r in rows]; assert latest.get("ci/full-webkit")=="success"'
          done
          echo "native_application_sha=$EXPECTED_SHA offhost_worker_sha=$worker_sha"
      - name: Reclaim reproducible hosted worker SDKs before frozen capture
        if: steps.once.outputs.execute == 'true'
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # Skip slow SDK deletion only when the complete worst-case worker
          # budget already fits: 3 x 25 GiB images + 2 GiB reserve.
          worker_free_bytes=$(df --output=avail -B1 "$RUNNER_TEMP" | tail -n 1 | tr -d ' ')
          if [ "$worker_free_bytes" -lt "$((77 * 1024 * 1024 * 1024))" ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
            sudo docker image prune -af
          fi
          df -h "$RUNNER_TEMP"
      - uses: actions/setup-python@v5
        if: steps.once.outputs.execute == 'true'
        with:
          python-version: "3.11"
      - name: Install existing image and SSH transports
        if: steps.once.outputs.execute == 'true'
        run: pip install -e . 'boto3>=1.36,<2' 'paramiko>=3.3,<6'
      - name: Run finite native owner and off-host Yandex cutover
        if: steps.once.outputs.execute == 'true'
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          NATIVE_RUN_ID="${RESUME_RUN_ID:-$NEW_RUN_ID}"
          OPTIONS=()
          if [ -n "$RESUME_RUN_ID" ]; then OPTIONS+=(--resume); fi
          if [ "$DIAGNOSTIC" = true ]; then OPTIONS+=(--diagnostic); fi
          python -m scripts.production_history_cutover \
            --expected-sha "$EXPECTED_SHA" --run-id "$NATIVE_RUN_ID" \
            --directory "$RUNNER_TEMP/history-cutover-$NEW_RUN_ID" "${OPTIONS[@]}"
      - name: Preserve public byte pins and actual outcomes only
        if: always() && steps.once.outputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: history-cutover-public-proof-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/history-cutover-${{ github.run_id }}/cutover-plan.json
            ${{ runner.temp }}/history-cutover-${{ github.run_id }}/hot-build-proof.json
            ${{ runner.temp }}/history-cutover-${{ github.run_id }}/full-union-proof.json
            ${{ runner.temp }}/history-cutover-${{ github.run_id }}/result.json
            ${{ runner.temp }}/history-cutover-${{ github.run_id }}/failure.json
            ${{ runner.temp }}/history-cutover-${{ github.run_id }}/capture-proof.json

