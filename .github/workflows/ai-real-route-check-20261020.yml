name: single-real-ai-route-check-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-real-route-check-20261020.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: production-seiltanzer
  queue: max
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Admit one request for this workflow push
        id: once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs?head_sha='+os.environ['GITHUB_SHA']+'&per_page=100'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=15) as response:rows=json.load(response)['workflow_runs']
          matches=[r['id'] for r in rows if r['path']=='.github/workflows/ai-real-route-check-20261020.yml' and r['event']=='push']
          assert matches
          execute=int(os.environ['GITHUB_RUN_ID'])==min(matches)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('execute='+str(execute).lower()+'\n')
          print(json.dumps({'once_admitted':execute,'first_run_id':min(matches)}))
          PY
      - name: One normal AI review, never ACK or broker execution
        if: steps.once.outputs.execute == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 12m
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = feecd3825fb0072bacfe2fdd1f0cc68bb0d24dd2
            test ! -e /opt/seiltanzer/data/cutover.active
            test ! -L /opt/seiltanzer/data/cutover.active
            /opt/seiltanzer/.venv/bin/python -u - <<'PY'
            import asyncio,json,re,subprocess,time,urllib.request,urllib.error
            from pathlib import Path
            pid=int(subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','--value'],timeout=5))
            if pid<=0:raise SystemExit('ACTIVE_PROCESS_REQUIRED')
            values=dict(x.decode(errors='replace').split('=',1) for x in Path(f'/proc/{pid}/environ').read_bytes().split(b'\0') if b'=' in x)
            if values.get('OPENROUTER_PROXY')!='socks5://127.0.0.1:9050':raise SystemExit('VERIFIED_ROUTE_NOT_ACTIVE')
            def call(path,post=False):
                req=urllib.request.Request('http://127.0.0.1:8790'+path,data=b'{}' if post else None,headers={'Content-Type':'application/json'})
                try:response=urllib.request.urlopen(req,timeout=14 if post else 5)
                except urllib.error.HTTPError as exc:response=exc
                with response:
                    raw=response.read(2*1024**2+1)
                    if len(raw)>2*1024**2:raise ValueError('RESPONSE_BOUND')
                    return response.code,json.loads(raw)
            expected='feecd3825fb0072bacfe2fdd1f0cc68bb0d24dd2'
            publication_end=time.monotonic()+480
            research=Path('/opt/seiltanzer/data/research')
            while True:
                pins={}
                for name,limit in [('mathematical_edge_latest.json',500000),('edge_family_sources_latest.json',1000000)]:
                    try:
                        path=research/name
                        if not 0<path.stat().st_size<=limit:raise ValueError('bounded_publication')
                        data=json.loads(path.read_bytes())
                        pins[name]=data.get('published_for_sha')==expected
                    except (OSError,ValueError):pins[name]=False
                if all(pins.values()):break
                if time.monotonic()>=publication_end:
                    print(json.dumps({'publication_ready':pins,'review_posts':0,'acks_sent':0,'broker_orders_sent':0}))
                    raise SystemExit('EXACT_SHA_PUBLICATIONS_NOT_READY_NO_PROVIDER_CALL')
                time.sleep(10)
            print(json.dumps({'publication_ready':pins}))
            async def canonical_clock():
                import websockets
                async with websockets.connect('ws://127.0.0.1:8790/ws',open_timeout=5,close_timeout=2,max_size=2*1024**2) as ws:
                    tick=json.loads(await asyncio.wait_for(ws.recv(),5))
                quote=(tick.get('feeds') or {}).get('price') or {}
                stamp=quote.get('ts') or quote.get('timestamp')
                try:quote_age=time.time()-float(stamp)
                except (TypeError,ValueError):quote_age=None
                return {'tick_ts':tick.get('ts'),'quote_age_sec':round(quote_age,3) if quote_age is not None else None,
                    'status':quote.get('status'),'source':quote.get('source'),'derived':quote.get('derived')}
            end=time.monotonic()+180
            fresh_clocks=[]
            while True:
                code,status=call('/api/ai/snapshot/status')
                if code!=200:raise SystemExit('SNAPSHOT_STATUS_UNAVAILABLE')
                if status.get('current_trade_id') is None:break
                clock=asyncio.run(canonical_clock())
                age=clock['quote_age_sec']
                if status.get('ready') and isinstance(age,(int,float)) and -5<=age<=15:
                    fresh_clocks.append(clock)
                    if len(fresh_clocks)>=3 and fresh_clocks[-1]['tick_ts']!=fresh_clocks[0]['tick_ts']:break
                else:fresh_clocks=[]
                if time.monotonic()>=end:raise SystemExit('SNAPSHOT_NOT_READY_NO_PROVIDER_CALL')
                time.sleep(5)
            print(json.dumps({'kind':'pre_review_live_clocks','observations':fresh_clocks[-3:]}))
            print(json.dumps({'snapshot_ready':status.get('ready'),'snapshot_build_ms':status.get('build_ms'),'snapshot_age_sec':status.get('age_sec'),'snapshot_build_n':status.get('build_n'),'snapshot_invalidated_reason':status.get('invalidated_reason')},sort_keys=True))
            started=time.monotonic();code,body=call('/api/ai/verdict',True)
            if code==400 and (body.get('error') or {}).get('code')=='execution_barrier_reached':
                import math
                proof=body.get('execution_barrier') or {}
                current_r,barrier_r=proof.get('current_r'),proof.get('barrier_r')
                assert proof.get('price_authority') is True and proof.get('execution_confirmed') is False
                assert proof.get('kind') in {'take','stop'}
                assert all(isinstance(value,(int,float)) and not isinstance(value,bool)
                    and math.isfinite(value) for value in (current_r,barrier_r))
                assert current_r>=barrier_r if proof['kind']=='take' else current_r<=barrier_r
                assert (body.get('error') or {}).get('retriable') is False
                print(json.dumps({'kind':'route_outcome','execution_guard_contract':'PASS',
                    'barrier_kind':proof['kind'],'normal_review_delivered':False,
                    'current_llm_observed':False,'provider_calls':0,
                    'execution_confirmed':False,'acks_sent':0,'broker_orders_sent':0},sort_keys=True))
                raise SystemExit(0)
            if code!=200:
                print(json.dumps({'kind':'review_not_delivered','http':code,
                    'api_error_code':(body.get('error') or {}).get('code'),
                    'request_id':(body.get('error') or {}).get('request_id'),
                    'elapsed_ms':round((time.monotonic()-started)*1000,1),
                    'review_posts':1,'acks_sent':0,'broker_orders_sent':0},sort_keys=True))
                raise SystemExit('NORMAL_AI_REVIEW_NOT_DELIVERED')
            shadow=body.get('llm_shadow_decision') or {};audit=body.get('unified_edge_ensemble') or {}
            current=next((x for x in audit.get('components',[]) if x.get('component_id')=='current_llm'),{})
            families=audit.get('edge_families') or []
            families=list(families.values()) if isinstance(families,dict) else families
            for family in families:
                if family.get('family_id') in {'macro','event','order_flow','intermarket','positioning','value_carry','option','session'}:
                    print(json.dumps({k:family.get(k) for k in ('family_id','available','forecast_available','working_assessment_available','model_marginal_score_delta','working_score','working_effective_weight','status','reason')},sort_keys=True))
            selected=next((x for x in audit.get('candidates',[]) if x.get('candidate_id')==audit.get('selected_candidate_id')), {})
            interventions=[x for x in audit.get('candidates',[]) if x.get('policy')!='HOLD']
            reasons={}
            for candidate in interventions:
                reason=candidate.get('ranking_reason') or candidate.get('reason')
                if isinstance(reason,str) and re.fullmatch(r'[A-Z0-9_]{1,120}',reason):
                    reasons[reason]=reasons.get(reason,0)+1
            print(json.dumps({'interventions_total':len(interventions),'interventions_eligible':sum(bool(x.get('eligible')) for x in interventions),'interventions_rankable':sum(bool(x.get('ranking_eligible')) for x in interventions),'admission_reasons':reasons},sort_keys=True))
            for part in selected.get('component_contributions',[]):
                print(json.dumps({k:part.get(k) for k in ('component_id','score','effective_weight','contribution')},sort_keys=True))
            print(json.dumps({'kind':'selected_action','policy':audit.get('selected_policy'),
                'reason':selected.get('ranking_reason') or selected.get('reason'),
                'delta_expected_r':selected.get('delta_expected_r'),
                'delta_cvar_r':selected.get('delta_cvar_r'),
                'without_current_llm':next((row.get('selected_policy') for row in audit.get('counterfactuals',[])
                    if row.get('excluded_component_id')=='current_llm'),None)},sort_keys=True))
            for component in audit.get('components',[]):
                print(json.dumps({'kind':'component',**{k:component.get(k) for k in
                    ('component_id','available','effective_weight','reason','quality_basis','self_confidence_used_for_weight')}},sort_keys=True))
            report=body.get('verdict') or ''
            matches=re.search(r'Audit summary: rows=(\d+)',report)
            print(json.dumps({'metric_audit_rows':int(matches.group(1)) if matches else None,
                'execution_mc_unavailable':'Authoritative execution-MC TAKE vs active STOP: UNAVAILABLE' in report,
                'snapshot_budget':body.get('snapshot_budget'),'edge_context_byte_exclusion':'EXCLUDED_BY_SNAPSHOT_BYTE_BUDGET' in report},sort_keys=True))
            model=body.get('model')
            detail=(body.get('error') or {}).get('message')
            safe_details={'fresh provider timestamp unavailable','fresh authoritative live quote/geometry unavailable','live position geometry changed before comparison','live trade/instrument changed before comparison','live risk geometry unavailable','live execution barrier reached before comparison','explicit empirical bank requires a new frozen build'}
            print(json.dumps({'http':code,'ok':body.get('ok'),'mode':body.get('mode'),'degraded':body.get('degraded'),
                'request_id':body.get('request_id') or (body.get('error') or {}).get('request_id'),
                'api_error_code':(body.get('error') or {}).get('code'),'api_error_detail':detail if detail in safe_details else None,'provider_error_code':(body.get('provider_error') or {}).get('code'),
                'model':model if isinstance(model,str) and re.fullmatch(r'[A-Za-z0-9_./:-]{1,120}',model) else None,
                'shadow_status':shadow.get('status'),'llm_self_confidence':shadow.get('confidence'),'current_llm_weight':current.get('effective_weight'),'current_llm_reason':current.get('reason'),'llm_weight_quality_basis':current.get('quality_basis'),'llm_standalone_action_status':current.get('standalone_action_status'),
                'elapsed_ms':round((time.monotonic()-started)*1000,1),'review_posts':1,'acks_sent':0,'broker_orders_sent':0,
                'automatic_execution_allowed':audit.get('automatic_execution_allowed')},sort_keys=True))
            if code!=200 or not isinstance(body.get('verdict'),str):
                raise SystemExit('NORMAL_AI_REVIEW_NOT_DELIVERED')
            if shadow.get('status')!='ok' or body.get('degraded') is True:
                raise SystemExit('CURRENT_LLM_NOT_AVAILABLE_IN_ACTUAL_REVIEW')
            weight=current.get('effective_weight')
            if (current.get('available') is not True or not isinstance(weight,(int,float))
                    or isinstance(weight,bool) or not 0<weight<=1):
                raise SystemExit('CURRENT_LLM_HAS_NO_OBSERVED_APPLIED_WEIGHT')
            if not selected or audit.get('automatic_execution_allowed') is not False:
                raise SystemExit('UNIFIED_MANUAL_DECISION_AUDIT_UNAVAILABLE')
            PY


