name: ops-q-audit-summary-d175-20260822

on:
  push:
    branches: [ops/final-verify-d175-20260822]
    paths: [.github/workflows/ops-final-verify-d175-20260822.yml]

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: d175d119c02201e36f8199363cf9ca43b0b8082a
    steps:
      - name: Compare full and summary Q audit transport
        id: probe
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 5m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            test "$(systemctl is-active seiltanzer)" = active
            for mode in summary full; do
              if [ "$mode" = summary ]; then
                path='/api/research/g1/q/audit?limit=5000&include_items=false'
              else
                path='/api/research/g1/q/audit?limit=5000&include_items=true'
              fi
              for attempt in 1 2 3; do
                curl -sS --max-time 12 -o "/tmp/q-${mode}-${attempt}.json" \
                  -w "Q_${mode} attempt=$attempt http=%{http_code} bytes=%{size_download} start=%{time_starttransfer} total=%{time_total}\n" \
                  "http://127.0.0.1:8790$path" || true
              done
            done
            python3 - <<'PY'
            import glob,json,os
            for path in sorted(glob.glob('/tmp/q-summary-*.json')):
                try: b=json.load(open(path))
                except Exception as e: print('PARSE',path,type(e).__name__); continue
                print('SUMMARY_BODY',os.path.basename(path),json.dumps({
                  'contract_version':b.get('contract_version'),
                  'refinement_contract_version':b.get('refinement_contract_version'),
                  'scalability_contract_version':b.get('scalability_contract_version'),
                  'attempt_n':b.get('attempt_n'),'captured_n':b.get('captured_n'),
                  'counts':b.get('counts'),'capture_blockers':b.get('capture_blockers'),
                  'items_included':b.get('items_included'),'items_len':len(b.get('items') or []),
                  'overdue_is_contract_failure':b.get('overdue_is_contract_failure'),
                  'slow_q_semantics_unchanged':b.get('slow_q_semantics_unchanged'),
                  'summary_semantics_unchanged':b.get('summary_semantics_unchanged'),
                },sort_keys=True))
            PY

      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.probe.outcome }}
        run: |
          state=success; desc='Production Q summary/full latency comparison completed'
          if [ "$OUTCOME" != success ]; then state=failure; desc='Production Q summary/full latency comparison failed'; fi
          payload=$(python3 - "$state" "$desc" <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'diagnostic/q-audit-summary','description':sys.argv[2],
            'target_url':'${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'}))
          PY
          )
          curl -fsS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${EXPECTED_SHA}" -d "$payload" >/dev/null
