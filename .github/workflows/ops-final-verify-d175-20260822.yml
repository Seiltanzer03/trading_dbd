name: ops-q-audit-diagnostic-d175-20260822

on:
  push:
    branches: [ops/final-verify-d175-20260822]
    paths: [.github/workflows/ops-final-verify-d175-20260822.yml]

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: d175d119c02201e36f8199363cf9ca43b0b8082a
    steps:
      - name: Measure exact production Q audit phases
        id: probe
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 5m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            test "$(systemctl is-active seiltanzer)" = active
            echo '=== ROUTE ==='
            for attempt in 1 2 3; do
              curl -sS --max-time 10 -o /dev/null -w "Q_ROUTE attempt=$attempt http=%{http_code} bytes=%{size_download} start=%{time_starttransfer} total=%{time_total}\n" \
                'http://127.0.0.1:8790/api/research/g1/q/audit?limit=5000' || true
            done
            echo '=== SQLITE PHASES ==='
            /opt/seiltanzer/.venv/bin/python - <<'PY'
            import sqlite3,time
            db='/opt/seiltanzer/data/trades.db'
            con=sqlite3.connect(f'file:{db}?mode=ro',uri=True,timeout=10)
            con.row_factory=sqlite3.Row
            now=time.time()
            def timed(label, sql, args=()):
                t=time.monotonic(); rows=con.execute(sql,args).fetchall(); ms=(time.monotonic()-t)*1000
                print(f'{label} rows={len(rows)} ms={ms:.1f}')
                return rows
            rows=timed('Q_ROWS', '''
              SELECT q.attempt_id,q.attempt_ts,q.target_instrument,q.observation_created,
                     q.created_observation_id,q.blocker_code,p.target_ts,p.resolution_status,
                     p.instrument
              FROM g1_q_capture_attempts q
              LEFT JOIN passive_market_observations p ON p.observation_id=q.created_observation_id
              ORDER BY q.attempt_ts DESC LIMIT ?''',(5000,))
            path=timed('PATH_GLOBAL_MAX','SELECT instrument,MAX(ts) mx FROM passive_market_path GROUP BY instrument')
            bars=timed('BARS_GLOBAL_MAX','SELECT instrument,MAX(bar_end_ts) mx FROM passive_market_bars GROUP BY instrument')
            needs=[]
            for r in rows:
                target=r['target_ts']
                if int(r['observation_created'] or 0)==1 and r['created_observation_id'] and r['resolution_status']!='resolved' and target is not None and float(target)<=now:
                    needs.append(str(r['instrument'] or r['target_instrument'] or ''))
            instruments=sorted(set(x for x in needs if x))
            print('DUE_UNRESOLVED_ROWS',len(needs),'INSTRUMENTS',instruments)
            fast_path={}; fast_bar={}
            t=time.monotonic()
            for instrument in instruments:
                r=con.execute('SELECT ts FROM passive_market_path WHERE instrument=? ORDER BY ts DESC LIMIT 1',(instrument,)).fetchone()
                fast_path[instrument]=float(r[0]) if r else 0.0
                r=con.execute('SELECT bar_end_ts FROM passive_market_bars WHERE instrument=? ORDER BY bar_start_ts DESC LIMIT 1',(instrument,)).fetchone()
                fast_bar[instrument]=float(r[0]) if r else 0.0
            print(f'INDEXED_LATEST instruments={len(instruments)} ms={(time.monotonic()-t)*1000:.1f}')
            global_path={str(r['instrument']):float(r['mx'] or 0) for r in path}
            global_bar={str(r['instrument']):float(r['mx'] or 0) for r in bars}
            print('PATH_MATCH',all(abs(fast_path.get(i,0)-global_path.get(i,0))<1e-6 for i in instruments))
            print('BAR_MATCH',all(abs(fast_bar.get(i,0)-global_bar.get(i,0))<1e-6 for i in instruments))
            con.close()
            PY

      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          state=success
          desc='Production Q audit SQL diagnostic completed'
          if [ "$OUTCOME" != success ]; then state=failure; desc='Production Q audit SQL diagnostic failed'; fi
          payload=$(python3 - "$state" "$desc" <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'diagnostic/q-audit-sql','description':sys.argv[2],
            'target_url':'${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'}))
          PY
          )
          curl -fsS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${EXPECTED_SHA}" -d "$payload" >/dev/null
