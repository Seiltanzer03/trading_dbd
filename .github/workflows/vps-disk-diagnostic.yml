name: vps-disk-diagnostic

on:
  push:
    branches: [codex/vps-disk-diagnostic]
    paths:
      - '.github/workflows/vps-disk-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/vps-disk-diagnostic
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Collect bounded disk metadata
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 root@94.241.171.182 '
            set +e
            echo "=== TIMESTAMP ==="; date -u
            echo "=== FILESYSTEM ==="; df -hT /
            echo "=== TMP TOP LEVEL BYTES ==="; du -x -B1 -d1 /tmp 2>/dev/null | sort -n | tail -80
            echo "=== TMP LARGE FILES >=100MB ==="; find /tmp -xdev -type f -size +100M -printf "%s %TY-%Tm-%TdT%TH:%TM:%TS %p\n" 2>/dev/null | sort -n | tail -100
            echo "=== BACKUP DIRECTORY ==="; find /opt/seiltanzer/data/backups/local -maxdepth 1 -type f -printf "%s %TY-%Tm-%TdT%TH:%TM:%TS %p\n" 2>/dev/null | sort -n
            echo "=== BACKUP OPEN FILE HANDLES ==="; lsof +D /opt/seiltanzer/data/backups/local 2>/dev/null || true
            echo "=== TMP OPEN LARGE HANDLES ==="; lsof +D /tmp 2>/dev/null | awk 'NR==1 || $7 ~ /^[0-9]+$/ && $7 >= 104857600' || true
            echo "=== JOURNAL USAGE ==="; journalctl --disk-usage 2>/dev/null || true
            echo "=== SERVICE STATE ==="; systemctl show seiltanzer -p ActiveState -p SubState -p MainPID -p MemoryCurrent -p MemoryPeak -p NRestarts || true
          ' > diagnostics/vps_disk_report.txt
          cat diagnostics/vps_disk_report.txt
      - name: Commit diagnostic report to diagnostic branch only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/vps_disk_report.txt
          git commit -m 'Record focused VPS disk diagnostic'
          git push origin HEAD:codex/vps-disk-diagnostic
