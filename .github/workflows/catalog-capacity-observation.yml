name: catalog-capacity-observation
on:
  push:
    branches: [ops/catalog-capacity-20261025]
    paths: [.github/workflows/catalog-capacity-observation.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install boto3
      - name: Read only the pinned cold catalog and snapshot manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          python - <<'PY'
          import boto3,hashlib,json,shutil
          from botocore.config import Config
          c=boto3.client('s3',endpoint_url='https://storage.yandexcloud.net',region_name='ru-central1',config=Config(connect_timeout=10,read_timeout=30,retries={'max_attempts':1}))
          bucket='trading-dbd-backups-2026'
          key='research/sqlite-history/v1/d6e8c423f21585f68cd28b0d837eb08c944d2b273bbba59ad963927e33434535/catalogs/7b78d25d13f249f1ab967828675419a6656fe6b69787e5b78644076a54411a63.json'
          with c.get_object(Bucket=bucket,Key=key)['Body'] as body: raw=body.read(8*1024**2+1)
          assert 0<len(raw)<=8*1024**2
          assert hashlib.sha256(raw).hexdigest()=='7b78d25d13f249f1ab967828675419a6656fe6b69787e5b78644076a54411a63'
          v=json.loads(raw)
          print('CATALOG_CAPACITY='+json.dumps({k:v.get(k) for k in ('contract','source_database_size_bytes','maximum_hydrated_bytes','expected_table_counts')}))
          print('PARTITIONS='+json.dumps({'count':len(v['partitions']),'uncompressed_bytes':sum(p['partition']['partition_size_bytes'] for p in v['partitions'])}))
          print('CATALOG_KEYS='+json.dumps(list(v)))
          with c.get_object(Bucket=bucket,Key='backups/v1/daily-slot-3/snapshot.sqlite3.gz.manifest.json')['Body'] as body: m=json.loads(body.read(1048576))
          print('CURRENT_BACKUP='+json.dumps({k:m.get(k) for k in ('database_size_bytes','database_sha256','git_commit','uploaded_ts','cold_history_catalog_sha256')}))
          print('WORKER_DISK='+json.dumps(dict(zip(('total','used','free'),shutil.disk_usage('/')))))
          PY
