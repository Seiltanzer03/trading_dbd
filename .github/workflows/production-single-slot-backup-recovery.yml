name: production-single-slot-backup-recovery

on:
  workflow_run:
    workflows: ["deploy"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact already-green main SHA already delivered to the VPS
        required: true
        type: string

permissions:
  actions: write
  contents: read
  statuses: write

env:
  EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      needs_recovery: ${{ steps.gate.outputs.needs_recovery }}
    steps:
      - name: Verify exact green main SHA and decide recovery
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          current_main=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1)
          test -n "$EXPECTED_SHA"
          test "$current_main" = "$EXPECTED_SHA"

          ci=$(curl -fsS --max-time 8 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${EXPECTED_SHA}/status" \
            | python3 -c 'import json,sys; body=json.load(sys.stdin); states={str(x.get("context")):str(x.get("state")) for x in body.get("statuses",[])}; print(states.get("ci/full-webkit","missing"))')
          echo "RECOVERY_GATE_SHA=$EXPECTED_SHA ci=$ci event=$EVENT_NAME deploy=$DEPLOY_CONCLUSION"
          test "$ci" = success

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            # Manual dispatch is used by the health watcher after repeated public
            # connection failure. Exact-main and green-CI checks above remain mandatory.
            echo "needs_recovery=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$EVENT_NAME" = workflow_run
          test "$DEPLOY_BRANCH" = main
          case "$DEPLOY_CONCLUSION" in
            success)
              echo "needs_recovery=false" >> "$GITHUB_OUTPUT"
              ;;
            failure|cancelled|timed_out)
              echo "needs_recovery=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected deploy conclusion: $DEPLOY_CONCLUSION"
              exit 1
              ;;
          esac

  recover:
    needs: gate
    if: needs.gate.outputs.needs_recovery == 'true'
    concurrency:
      group: production-seiltanzer
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Rotate verified local slot and rebuild exact-SHA recovery point
        id: recovery
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 18m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            root=/opt/seiltanzer/data/backups/local
            live=/opt/seiltanzer/data/trades.db
            test "$root" = /opt/seiltanzer/data/backups/local
            test "$live" = /opt/seiltanzer/data/trades.db
            test -f "$live"
            mkdir -p "$root"

            restart_needed=1
            restore_service_on_exit() {
              if [ "${restart_needed:-1}" = 1 ]; then
                systemctl reset-failed seiltanzer >/dev/null 2>&1 || true
                systemctl start seiltanzer >/dev/null 2>&1 || true
                echo "RECOVERY_SERVICE_RESTORE_ATTEMPTED=1"
              fi
            }
            trap restore_service_on_exit EXIT

            systemctl stop seiltanzer
            if systemctl is-active --quiet seiltanzer; then
              echo "::error::Refusing backup rotation while seiltanzer is active"
              exit 1
            fi
            if ! git -C /opt/seiltanzer cat-file -e "${EXPECTED_SHA}^{commit}" 2>/dev/null; then
              echo "::error::Expected exact SHA is not present on the VPS"
              exit 1
            fi
            git -C /opt/seiltanzer reset --hard "$EXPECTED_SHA"
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            if command -v lsof >/dev/null 2>&1 && lsof -- "$live" >/dev/null 2>&1; then
              echo "::error::Refusing backup rotation while authoritative DB is open"
              exit 1
            fi

            export RECOVERY_STARTED_TS=$(date +%s)
            /usr/bin/python3 - <<'PY'
            import hashlib
            import json
            import os
            import sqlite3
            from pathlib import Path

            root = Path('/opt/seiltanzer/data/backups/local').resolve()
            live = Path('/opt/seiltanzer/data/trades.db').resolve()
            expected_sha = os.environ['EXPECTED_SHA']
            assert root == Path('/opt/seiltanzer/data/backups/local')
            assert live == Path('/opt/seiltanzer/data/trades.db')

            def confined(path: Path) -> bool:
                try:
                    path.resolve().relative_to(root)
                    return True
                except ValueError:
                    return False

            def digest(path: Path) -> str:
                h = hashlib.sha256()
                with path.open('rb') as handle:
                    for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b''):
                        h.update(chunk)
                return h.hexdigest()

            def quick_check(path: Path) -> str:
                conn = sqlite3.connect(f'file:{path}?mode=ro', uri=True, timeout=30)
                try:
                    return str(conn.execute('PRAGMA quick_check').fetchone()[0])
                finally:
                    conn.close()

            live_check = quick_check(live)
            print(f'AUTHORITATIVE_DB_QUICK_CHECK={live_check}')
            if live_check != 'ok':
                raise SystemExit('STOP: authoritative trades.db quick_check failed')

            temp_removed = 0
            temp_bytes = 0
            for temp in root.glob('.*.tmp.sqlite3'):
                temp = temp.resolve()
                if not confined(temp) or temp.parent != root:
                    raise SystemExit(f'STOP: unexpected temp path {temp}')
                temp_bytes += temp.stat().st_size
                temp.unlink()
                temp_removed += 1

            verified = []
            for manifest_path in root.glob('*.manifest.json'):
                manifest_path = manifest_path.resolve()
                if not confined(manifest_path) or manifest_path.parent != root:
                    continue
                try:
                    payload = json.loads(manifest_path.read_text(encoding='utf-8'))
                except Exception:
                    continue
                if payload.get('verified') is not True:
                    continue
                raw = Path(str(payload.get('database_file') or ''))
                backup = (raw if raw.is_absolute() else root / raw).resolve()
                if not confined(backup) or backup.parent != root or not backup.is_file():
                    continue
                expected = str(payload.get('database_sha256') or '').lower()
                if len(expected) != 64:
                    raise SystemExit(f'STOP: verified manifest has no SHA256: {manifest_path.name}')
                actual = digest(backup)
                if actual != expected:
                    raise SystemExit(f'STOP: verified backup SHA mismatch: {backup.name}')
                verified.append((float(payload.get('created_ts') or 0), manifest_path, backup, payload))

            verified.sort(key=lambda row: row[0])
            required = live.stat().st_size + 1024 * 1024 * 1024

            def free_bytes() -> int:
                stat = os.statvfs(root)
                return int(stat.f_bavail) * int(stat.f_frsize)

            removed_pairs = 0
            removed_bytes = 0
            # Every candidate below has already passed manifest=true + SHA256.
            # Remove oldest verified local recovery copies only until one new full
            # live snapshot plus 1 GiB operating reserve can be created.
            for _ts, manifest_path, backup, _payload in verified:
                if free_bytes() >= required:
                    break
                removed_bytes += backup.stat().st_size + manifest_path.stat().st_size
                backup.unlink()
                manifest_path.unlink()
                removed_pairs += 1

            available = free_bytes()
            print(f'INCOMPLETE_BACKUP_TEMPS_REMOVED={temp_removed}')
            print(f'INCOMPLETE_BACKUP_TEMP_BYTES_REMOVED={temp_bytes}')
            print(f'VERIFIED_BACKUP_PAIRS_REMOVED={removed_pairs}')
            print(f'VERIFIED_BACKUP_BYTES_REMOVED={removed_bytes}')
            print(f'BACKUP_REBUILD_REQUIRED_BYTES={required}')
            print(f'BACKUP_REBUILD_AVAILABLE_BYTES={available}')
            if available < required:
                raise SystemExit('STOP: insufficient headroom after verified-backup-only rotation')
            PY

            systemctl reset-failed seiltanzer >/dev/null 2>&1 || true
            systemctl start seiltanzer
            ready=0
            for attempt in $(seq 1 240); do
              active=$(systemctl is-active seiltanzer 2>/dev/null || true)
              code=$(curl -sS -o /tmp/single-slot-recovery-state.json \
                --connect-timeout 1 --max-time 3 -w '%{http_code}' \
                http://127.0.0.1:8790/api/state 2>/dev/null || true)
              echo "single-slot recovery attempt=$attempt/240 active=${active:-unknown} http=${code:-000}"
              if [ "$active" = active ] && [ "$code" = 200 ]; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" != 1 ]; then
              echo "::error::Terminal did not become ready after verified-backup-only rotation"
              systemctl status seiltanzer --no-pager -l || true
              journalctl -u seiltanzer --since '-20 minutes' --no-pager -n 220 || true
              exit 1
            fi

            /usr/bin/python3 - <<'PY'
            import hashlib
            import json
            import os
            import sqlite3
            from pathlib import Path

            root = Path('/opt/seiltanzer/data/backups/local').resolve()
            live = Path('/opt/seiltanzer/data/trades.db').resolve()
            expected_sha = os.environ['EXPECTED_SHA']
            started = float(os.environ['RECOVERY_STARTED_TS'])

            def digest(path: Path) -> str:
                h = hashlib.sha256()
                with path.open('rb') as handle:
                    for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b''):
                        h.update(chunk)
                return h.hexdigest()

            matches = []
            for manifest_path in root.glob('*.manifest.json'):
                try:
                    payload = json.loads(manifest_path.read_text(encoding='utf-8'))
                except Exception:
                    continue
                backup = (root / str(payload.get('database_file') or '')).resolve()
                if (
                    payload.get('verified') is True
                    and payload.get('reason') == 'prestart'
                    and str(payload.get('git_commit') or '') == expected_sha
                    and float(payload.get('created_ts') or 0) >= started
                    and backup.parent == root
                    and backup.is_file()
                ):
                    matches.append((float(payload['created_ts']), payload, backup))
            if not matches:
                raise SystemExit('STOP: no new exact-SHA verified prestart backup')
            matches.sort(key=lambda row: row[0], reverse=True)
            _ts, payload, backup = matches[0]
            expected = str(payload.get('database_sha256') or '').lower()
            if len(expected) != 64 or digest(backup) != expected:
                raise SystemExit('STOP: new exact-SHA backup SHA256 mismatch')

            conn = sqlite3.connect(f'file:{live}?mode=ro', uri=True, timeout=30)
            try:
                result = str(conn.execute('PRAGMA quick_check').fetchone()[0])
            finally:
                conn.close()
            print(f'NEW_EXACT_SHA_BACKUP={backup.name}')
            print(f'NEW_EXACT_SHA_BACKUP_BYTES={backup.stat().st_size}')
            print(f'POST_RECOVERY_DB_QUICK_CHECK={result}')
            if result != 'ok':
                raise SystemExit('STOP: post-recovery trades.db quick_check failed')
            PY

            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            test "$(systemctl is-active seiltanzer)" = active
            restart_needed=0
            df -h /

      - name: Publish exact-SHA recovery status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then
            state=success
            description="Verified local slot rebuilt for exact green SHA"
          else
            state=failure
            description="Single-slot recovery stopped fail-closed"
          fi
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 2 --retry-max-time 30 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${EXPECTED_SHA}" \
            -d "{\"state\":\"$state\",\"context\":\"ops/single-slot-backup-recovery\",\"description\":\"$description\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  redeploy:
    needs: recover
    if: needs.recover.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Trigger existing exact-SHA deploy after recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 2 --retry-max-time 30 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"expected_sha\":\"$EXPECTED_SHA\"}}"
