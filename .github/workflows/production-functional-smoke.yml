name: production-functional-smoke

# Functional smoke is intentionally separate from bounded production-readiness.
# It preserves valuable live-route checks without making heavy research scans part
# of the service-health gate.
on:
  workflow_run:
    workflows: ["production-readiness"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, linux, x64, seiltanzer-prod]
    timeout-minutes: 5
    steps:
      - name: Verify exact SHA and fast operational routes
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory /opt/seiltanzer || true
          SERVER_SHA=$(git -C /opt/seiltanzer rev-parse HEAD)
          test "$SERVER_SHA" = "$EXPECTED_SHA"

          for endpoint in \
            /api/state \
            /api/validation \
            /api/research/counterfactual \
            /api/research/passive/status \
            /api/research/passive/calibration \
            /api/research/passive/edge \
            /api/analytics/gex-migration \
            /api/analytics/regime-phase \
            /api/analytics/wavelet \
            /api/analytics/correlation-graph \
            /api/research/g1/intelligence/status \
            /api/research/g1/management/status; do
            code=$(curl --max-time 20 -sS -o /dev/null -w "%{http_code}" \
              "http://127.0.0.1:8790${endpoint}" || true)
            echo "$endpoint: $code"
            test "$code" = "200"
          done

      - name: Exercise production AI Verdict route
        run: |
          set -euo pipefail
          AI_RESPONSE=$(curl -sS --max-time 65 -w $'\n%{http_code}' \
            -X POST http://127.0.0.1:8790/api/ai/verdict || true)
          AI_STATUS=${AI_RESPONSE##*$'\n'}
          AI_BODY=${AI_RESPONSE%$'\n'*}
          echo "/api/ai/verdict: $AI_STATUS"
          AI_BODY="$AI_BODY" /opt/seiltanzer/.venv/bin/python - <<'PY'
          import json, os
          body = json.loads(os.environ["AI_BODY"])
          assert isinstance(body.get("ok"), bool)
          if body["ok"]:
              assert body.get("mode") in {"llm", "deterministic_fallback"}
              assert isinstance(body.get("verdict"), str) and body["verdict"]
          else:
              assert (body.get("error") or {}).get("code") in {
                  "no_active_trade", "ai_rate_limited", "ai_request_in_progress"
              }
          PY
          test "$AI_STATUS" = "200" -o "$AI_STATUS" = "400" -o "$AI_STATUS" = "429"

      - name: Publish functional smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Fast production analytics and AI Verdict smoke passed"
          else
            state="failure"
            description="Production functional smoke failed"
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${EXPECTED_SHA}" \
            -d "{\"state\":\"$state\",\"context\":\"production/functional-smoke\",\"description\":\"$description\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
