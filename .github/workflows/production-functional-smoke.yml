name: production-functional-smoke

on:
  workflow_run:
    workflows: ["production-readiness"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Exercise bounded production routes and AI Verdict over SSH
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 4m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/production_functional_smoke.py \
              --expected-sha "$EXPECTED_SHA"

      - name: Publish functional smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Bounded analytics, G1S and AI Verdict smoke passed"
          else
            state="failure"
            description="Production functional smoke failed"
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${EXPECTED_SHA}" \
            -d "{\"state\":\"$state\",\"context\":\"production/functional-smoke\",\"description\":\"$description\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
