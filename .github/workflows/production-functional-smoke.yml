name: production-functional-smoke

on:
  workflow_run:
    workflows: ["production-readiness"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Exercise bounded production routes and AI Verdict over SSH
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 4m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/production_functional_smoke.py \
              --expected-sha "$EXPECTED_SHA"

      - name: Verify public terminal from GitHub runner
        run: |
          set -euo pipefail
          url="http://94.241.171.182:8790/api/state"
          for attempt in 1 2 3; do
            if curl -fsS \
              --connect-timeout 3 \
              --max-time 5 \
              --output /tmp/public-state.json \
              "$url"; then
              bytes=$(wc -c < /tmp/public-state.json)
              echo "public terminal PASS attempt=${attempt} bytes=${bytes}"
              exit 0
            fi
            echo "public terminal attempt=${attempt}/3 failed"
            sleep 2
          done
          echo "::error::Public terminal is unreachable at ${url}"
          exit 1

      - name: Diagnose public exposure on smoke failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 1m
          script: |
            set +e
            echo '=== listener 8790 ==='
            ss -ltnp | grep ':8790' || true
            echo '=== service ==='
            systemctl status seiltanzer --no-pager -l || true
            echo '=== local state probe ==='
            curl -sS -o /dev/null -w 'localhost http=%{http_code} connect=%{time_connect}s total=%{time_total}s\n' \
              --connect-timeout 3 --max-time 5 http://127.0.0.1:8790/api/state || true
            echo '=== addresses/routes ==='
            ip -brief address || true
            ip route || true
            echo '=== ufw ==='
            if command -v ufw >/dev/null 2>&1; then ufw status verbose || true; else echo 'ufw not installed'; fi
            echo '=== iptables ==='
            if command -v iptables >/dev/null 2>&1; then iptables -S || true; else echo 'iptables not installed'; fi
            echo '=== nftables ==='
            if command -v nft >/dev/null 2>&1; then nft list ruleset || true; else echo 'nft not installed'; fi

      - name: Publish functional smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Bounded analytics, public endpoint and AI Verdict smoke passed"
          else
            state="failure"
            description="Production functional smoke failed"
          fi
          # The production checks above are authoritative. A transient GitHub
          # Status API 5xx must not turn a passing smoke run red or make the
          # repository look unhealthy after the terminal itself passed.
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 2 --retry-max-time 30 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${EXPECTED_SHA}" \
            -d "{\"state\":\"$state\",\"context\":\"production/functional-smoke\",\"description\":\"$description\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"