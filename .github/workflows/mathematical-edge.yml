name: mathematical-edge

on:
  pull_request:
    branches: [main]
    paths:
      - 'seiltanzer/mathematical_edge*.py'
      - 'seiltanzer/edge_family_market.py'
      - 'seiltanzer/edge_family_native_history.py'
      - 'scripts/*mathematical_edge*.py'
      - 'scripts/export_family_market_history.py'
      - 'scripts/export_native_family_history.py'
      - 'tests/test_mathematical_edge*.py'
      - 'tests/test_edge_family_market.py'
      - 'tests/test_edge_family_native_history.py'
      - 'research_fixtures/mathematical_edge/**'
      - '.github/workflows/mathematical-edge.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
  schedule:
    - cron: '17 3 * * 1-5'

permissions:
  contents: read

concurrency:
  group: mathematical-edge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  working-model:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -q -e '.[dev]' paramiko boto3
      - name: Verify historical family training and bounded runtime
        run: python -m pytest -q tests/test_edge_family_market.py tests/test_edge_family_native_history.py
      - name: Restore hash-verified per-provider market-bar cache
        id: math-source-cache
        uses: actions/cache/restore@v4
        with:
          path: .math-source-cache
          # Collector/config changes invalidate cache semantics. PRs restore only;
          # only main can save, never exporting SSH material or fitted models.
          key: ${{ runner.os }}-math-source-v1-${{ hashFiles('seiltanzer/mathematical_edge_sources.py', 'seiltanzer/config.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-math-source-v1-${{ hashFiles('seiltanzer/mathematical_edge_sources.py', 'seiltanzer/config.py') }}-
      - name: Read cached actual market bars without production writes
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: python -m scripts.export_mathematical_edge_sources --password "$SSH_PASSWORD" --output mathematical_sources.json
      - name: Read existing immutable native family history without database writes
        if: github.event_name != 'pull_request'
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: python -m scripts.export_native_family_history --password "$SSH_PASSWORD" --output "$RUNNER_TEMP/native-family-history.json"
      - name: Read existing private family observations without archive writes
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python -m scripts.export_family_market_history --native-history "$RUNNER_TEMP/native-family-history.json" --output "$RUNNER_TEMP/private-family-history.json"
      - name: Refresh actual bars, fit and validate on runner
        id: math-fit
        run: |
          family_args=()
          if [[ -f "$RUNNER_TEMP/private-family-history.json" ]]; then
            family_args=(--family-history "$RUNNER_TEMP/private-family-history.json")
          fi
          python -m scripts.run_mathematical_edge --sources mathematical_sources.json \
            --refresh-sources --sources-output refreshed_sources.json \
            --cache-dir .math-source-cache --source-budget-seconds 180 \
            --output mathematical_edge_latest.json "${family_args[@]}"
      - name: Save per-provider market-bar cache from trusted main only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.math-fit.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .math-source-cache
          key: ${{ steps.math-source-cache.outputs.cache-primary-key }}
      - name: Publish working model for exact production SHA
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: >-
          python scripts/publish_active_edge_report.py --password "$SSH_PASSWORD"
          --expected-sha "$EXPECTED_SHA" --input mathematical_edge_latest.json
          --remote-name mathematical_edge_latest.json --run-id "${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mathematical-edge-${{ env.EXPECTED_SHA }}
          path: |
            mathematical_edge_latest.json
            mathematical_sources.json
            refreshed_sources.json
          retention-days: 30
