name: mathematical-edge

on:
  pull_request:
    branches: [main]
    paths:
      - 'seiltanzer/mathematical_edge*.py'
      - 'seiltanzer/edge_family_market.py'
      - 'seiltanzer/binance_public_archive.py'
      - 'seiltanzer/binance_event_windows.py'
      - 'seiltanzer/ai_frozen_expert_inputs.py'
      - 'seiltanzer/edge_family_event_archive.py'
      - 'seiltanzer/edge_family_trade_flow.py'
      - 'seiltanzer/edge_family_option_interest.py'
      - 'seiltanzer/edge_family_treasury_factors.py'
      - 'seiltanzer/edge_family_model_retention.py'
      - 'seiltanzer/edge_family_macro_archive.py'
      - 'seiltanzer/macro_historical_offhost_bundle.py'
      - 'seiltanzer/edge_family_native_history.py'
      - 'seiltanzer/native_family_capture_projection.py'
      - 'scripts/*mathematical_edge*.py'
      - 'scripts/export_family_market_history.py'
      - 'scripts/production_model_consumption.py'
      - 'tests/test_production_model_consumption.py'
      - 'scripts/export_official_macro_archive.py'
      - 'scripts/export_native_family_history.py'
      - 'tests/test_mathematical_edge*.py'
      - 'tests/test_edge_family_market.py'
      - 'tests/test_binance_public_archive.py'
      - 'tests/test_binance_event_windows.py'
      - 'tests/test_edge_family_event_archive.py'
      - 'tests/test_edge_family_trade_flow.py'
      - 'tests/test_edge_family_option_interest.py'
      - 'tests/test_edge_family_treasury_factors.py'
      - 'tests/test_edge_family_model_retention.py'
      - 'tests/test_edge_family_macro_archive.py'
      - 'tests/test_edge_family_native_history.py'
      - 'tests/test_native_capture_projection.py'
      - 'tests/test_native_family_history_sampling.py'
      - 'research_fixtures/mathematical_edge/**'
      - '.github/workflows/mathematical-edge.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
  schedule:
    - cron: '17 3 * * 1-5'

permissions:
  contents: read

concurrency:
  group: mathematical-edge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  working-model:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -q -e '.[dev]' paramiko boto3
      - name: Verify historical family training and bounded runtime
        run: python -m pytest -q tests/test_mathematical_edge_sources.py tests/test_mathematical_edge.py tests/test_edge_family_market.py tests/test_edge_family_model_retention.py tests/test_edge_family_macro_archive.py tests/test_macro_historical_offhost_bundle.py tests/test_edge_family_native_history.py tests/test_native_capture_projection.py tests/test_native_family_history_sampling.py tests/test_binance_public_archive.py tests/test_edge_family_event_archive.py tests/test_edge_family_trade_flow.py tests/test_edge_family_option_interest.py tests/test_edge_family_treasury_factors.py tests/test_binance_event_windows.py tests/test_production_model_consumption.py
      - name: Restore hash-verified per-provider market-bar cache
        id: math-source-cache
        uses: actions/cache/restore@v4
        with:
          path: .math-source-cache
          # Collector/config changes invalidate cache semantics. PRs restore only;
          # only main can save, never exporting SSH material or fitted models.
          key: ${{ runner.os }}-math-source-v1-${{ hashFiles('seiltanzer/mathematical_edge_sources.py', 'seiltanzer/config.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-math-source-v1-${{ hashFiles('seiltanzer/mathematical_edge_sources.py', 'seiltanzer/config.py') }}-
            ${{ runner.os }}-math-source-v1-
      - name: Restore compatible frozen family models
        id: family-model-cache
        uses: actions/cache/restore@v4
        with:
          path: .math-family-model-cache
          key: ${{ runner.os }}-family-model-v1-${{ hashFiles('seiltanzer/edge_family_market.py', 'seiltanzer/edge_family_training.py', 'seiltanzer/edge_family_macro_archive.py', 'seiltanzer/edge_family_adapters.py', 'seiltanzer/config.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-family-model-v1-${{ hashFiles('seiltanzer/edge_family_market.py', 'seiltanzer/edge_family_training.py', 'seiltanzer/edge_family_macro_archive.py', 'seiltanzer/edge_family_adapters.py', 'seiltanzer/config.py') }}-
            ${{ runner.os }}-family-model-v1-
      - name: Read cached actual market bars without production writes
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: python -m scripts.export_mathematical_edge_sources --password "$SSH_PASSWORD" --output mathematical_sources.json
      - name: Read existing immutable native family history without database writes
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: python -m scripts.export_native_family_history --password "$SSH_PASSWORD" --output "$RUNNER_TEMP/native-family-history.json"
      - name: Read existing private family observations without archive writes
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: python -m scripts.export_family_market_history --native-history "$RUNNER_TEMP/native-family-history.json" --output "$RUNNER_TEMP/private-family-history.json"
      - name: Read already-installed official historical macro archive without refetching
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: python -m scripts.export_official_macro_archive --password "$SSH_PASSWORD" --output "$RUNNER_TEMP/official-macro-archive.json"
      - name: Refresh actual bars, fit and validate on runner
        id: math-fit
        run: |
          family_args=()
          if [[ -f "$RUNNER_TEMP/private-family-history.json" ]]; then
            family_args=(--family-history "$RUNNER_TEMP/private-family-history.json")
          fi
          macro_args=(--historical-macro-bundle "$RUNNER_TEMP/official-macro-archive.json")
          macro_source_sha=$(python -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["RUNNER_TEMP"])/"official-macro-archive.json").read_text()).get("expected_sha") or "")')
          if [[ -n "$macro_source_sha" ]]; then
            macro_args+=(--macro-source-sha "$macro_source_sha")
          fi
          python -m scripts.run_mathematical_edge --sources mathematical_sources.json \
            --refresh-sources --sources-output refreshed_sources.json \
            --cache-dir .math-source-cache --model-cache-dir .math-family-model-cache --source-budget-seconds 180 \
            --output mathematical_edge_latest.json "${family_args[@]}" "${macro_args[@]}"
      - name: Save per-provider market-bar cache from trusted main only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.math-fit.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .math-source-cache
          key: ${{ steps.math-source-cache.outputs.cache-primary-key }}
      - name: Save frozen family models from trusted main only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.math-fit.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .math-family-model-cache
          key: ${{ steps.family-model-cache.outputs.cache-primary-key }}
      - name: Publish working model for exact production SHA
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: >-
          python scripts/publish_active_edge_report.py --password "$SSH_PASSWORD"
          --expected-sha "$EXPECTED_SHA" --input mathematical_edge_latest.json
          --remote-name mathematical_edge_latest.json --run-id "${{ github.run_id }}"
      - name: Verify actual model consumption on exact production release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: python -m scripts.production_model_consumption --password "$SSH_PASSWORD" --expected-sha "$EXPECTED_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: mathematical-edge-${{ env.EXPECTED_SHA }}
          path: |
            mathematical_edge_latest.json
            mathematical_sources.json
            refreshed_sources.json
          retention-days: 30
