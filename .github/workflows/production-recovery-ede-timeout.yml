name: production-recovery-ede-timeout

on:
  push:
    branches: [ops/recover-production-after-ede-timeout]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Diagnose and recover production after EDE SSH timeout
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: 8eae1a14c3d0f6dbf9d2dd06b600ef119e9b098b
          SMOKE_RUN_ID: "31815048636"
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 8m
          envs: EXPECTED_SHA,SMOKE_RUN_ID
          script: |
            set -euo pipefail
            echo '=== BEFORE RECOVERY ==='
            date -u
            echo "deployed_sha=$(git -C /opt/seiltanzer rev-parse HEAD)"
            systemctl is-active seiltanzer || true
            systemctl list-units --all --plain --no-legend 'seiltanzer-ede-*' || true
            echo '-- listeners --'
            ss -ltnp | grep -E ':(8790|80|443)\b' || true
            echo '-- top cpu --'
            ps -eo pid,ppid,ni,pcpu,pmem,etime,cmd --sort=-pcpu | head -n 20 || true
            echo '-- local probes before --'
            curl -sS -o /dev/null -w 'state code=%{http_code} time=%{time_total}\n' --max-time 5 http://127.0.0.1:8790/api/state || true
            curl -sS -o /dev/null -w 'root code=%{http_code} time=%{time_total}\n' --max-time 5 http://127.0.0.1:8790/ || true

            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"

            # A remote systemd-run service can survive when appleboy/drone-ssh
            # terminates the client at command_timeout. EDE units are research-only;
            # stop only those transient units, never market collection or application data.
            mapfile -t ede_units < <(systemctl list-units --all --plain --no-legend 'seiltanzer-ede-*' | awk '{print $1}' | sed '/^$/d')
            if [ "${#ede_units[@]}" -gt 0 ]; then
              printf 'Stopping orphan EDE units: %s\n' "${ede_units[*]}"
              systemctl stop "${ede_units[@]}" || true
            else
              echo 'No EDE transient units found.'
            fi

            PY=/opt/seiltanzer/.venv/bin/python
            ORCH=/opt/seiltanzer/scripts/production_research_acceptance.py
            "$PY" "$ORCH" release-gate \
              --smoke-run-id "$SMOKE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA" || true

            systemctl restart seiltanzer

            ok=0
            for attempt in $(seq 1 30); do
              active=$(systemctl is-active seiltanzer || true)
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8790/api/state || true)
              echo "recovery_probe attempt=$attempt active=$active code=$code"
              if [ "$active" = active ] && [ "$code" = 200 ]; then
                ok=1
                break
              fi
              sleep 2
            done
            test "$ok" = 1

            echo '=== AFTER RECOVERY ==='
            systemctl list-units --all --plain --no-legend 'seiltanzer-ede-*' || true
            ss -ltnp | grep -E ':(8790|80|443)\b' || true
            curl -sS -o /dev/null -w 'state code=%{http_code} time=%{time_total}\n' --max-time 3 http://127.0.0.1:8790/api/state
            curl -sS -o /dev/null -w 'root code=%{http_code} time=%{time_total}\n' --max-time 3 http://127.0.0.1:8790/ || true
            echo 'PRODUCTION_RECOVERY_PASS'
