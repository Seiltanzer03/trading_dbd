name: production-recovery-ede-timeout

on:
  push:
    branches: [ops/recover-production-after-ede-timeout]

concurrency:
  group: production-emergency-recovery
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Hard-bound recovery after EDE SSH timeout
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: 8eae1a14c3d0f6dbf9d2dd06b600ef119e9b098b
          SMOKE_RUN_ID: "31815048636"
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 6m
          envs: EXPECTED_SHA,SMOKE_RUN_ID
          script: |
            set -euo pipefail
            echo '=== BEFORE HARD RECOVERY ==='
            date -u
            echo "deployed_sha=$(git -C /opt/seiltanzer rev-parse HEAD)"
            systemctl is-active seiltanzer || true
            systemctl list-units --all --plain --no-legend 'seiltanzer-ede-*' || true
            ss -ltnp | grep -E ':(8790|80|443)\b' || true
            ps -eo pid,ppid,ni,pcpu,pmem,etime,cmd --sort=-pcpu | head -n 20 || true
            curl -sS -o /dev/null -w 'before state code=%{http_code} time=%{time_total}\n' --max-time 3 http://127.0.0.1:8790/api/state || true

            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"

            mapfile -t ede_units < <(systemctl list-units --all --plain --no-legend 'seiltanzer-ede-*' | awk '{print $1}' | sed '/^$/d')
            if [ "${#ede_units[@]}" -gt 0 ]; then
              printf 'EDE units before kill: %s\n' "${ede_units[*]}"
              timeout 8s systemctl stop "${ede_units[@]}" || true
              for unit in "${ede_units[@]}"; do
                systemctl kill --kill-who=all --signal=KILL "$unit" || true
                systemctl reset-failed "$unit" || true
              done
            fi

            PY=/opt/seiltanzer/.venv/bin/python
            ORCH=/opt/seiltanzer/scripts/production_research_acceptance.py
            "$PY" "$ORCH" release-gate \
              --smoke-run-id "$SMOKE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA" || true

            # The service is active-but-wedged: bound graceful stop, then force
            # only the application cgroup if it does not leave promptly.
            timeout 12s systemctl stop seiltanzer || true
            if [ "$(systemctl is-active seiltanzer || true)" != inactive ]; then
              systemctl kill --kill-who=all --signal=KILL seiltanzer || true
              sleep 1
            fi
            systemctl reset-failed seiltanzer || true
            systemctl start seiltanzer

            ok=0
            for attempt in $(seq 1 30); do
              active=$(systemctl is-active seiltanzer || true)
              started=$(date +%s%3N)
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8790/api/state || true)
              elapsed=$(( $(date +%s%3N) - started ))
              echo "recovery_probe attempt=$attempt active=$active code=$code elapsed_ms=$elapsed"
              if [ "$active" = active ] && [ "$code" = 200 ] && [ "$elapsed" -lt 3000 ]; then
                ok=1
                break
              fi
              sleep 2
            done
            test "$ok" = 1

            echo '=== AFTER HARD RECOVERY ==='
            systemctl list-units --all --plain --no-legend 'seiltanzer-ede-*' || true
            ss -ltnp | grep -E ':(8790|80|443)\b' || true
            curl -sS -o /dev/null -w 'state code=%{http_code} time=%{time_total}\n' --max-time 3 http://127.0.0.1:8790/api/state
            curl -sS -o /dev/null -w 'root code=%{http_code} time=%{time_total}\n' --max-time 3 http://127.0.0.1:8790/ || true
            echo 'PRODUCTION_RECOVERY_PASS'
