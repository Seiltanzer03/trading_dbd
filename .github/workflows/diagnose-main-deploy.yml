name: diagnose-main-deploy

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect failed main deploy
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 5a5a282a0bea1a80efde6c681b6184945ee11f90
        run: |
          set -euo pipefail
          runs=$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${TARGET_SHA}&event=push&per_page=50")
          echo "$runs" > /tmp/runs.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/runs.json'))
          for r in x.get('workflow_runs',[]):
              print('RUN', r['id'], r['name'], r['status'], r['conclusion'], r['html_url'])
          PY
          run_id=$(python3 - <<'PY'
          import json
          x=json.load(open('/tmp/runs.json'))
          rows=[r for r in x.get('workflow_runs',[]) if r.get('name')=='deploy']
          print(rows[0]['id'] if rows else '')
          PY
          )
          test -n "$run_id"
          jobs=$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${run_id}/jobs?per_page=100")
          echo "$jobs" > /tmp/jobs.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/jobs.json'))
          for j in x.get('jobs',[]):
              print('JOB', j['id'], j['name'], j['status'], j['conclusion'])
              for s in j.get('steps',[]):
                  print(' STEP', s['number'], s['name'], s['status'], s['conclusion'])
          PY
          job_id=$(python3 - <<'PY'
          import json
          x=json.load(open('/tmp/jobs.json'))
          rows=x.get('jobs',[])
          print(rows[0]['id'] if rows else '')
          PY
          )
          test -n "$job_id"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/jobs/${job_id}/logs" \
            -o /tmp/deploy.log
          echo '=== FAILURE TAIL ==='
          tail -n 260 /tmp/deploy.log
