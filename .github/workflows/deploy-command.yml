name: deploy-command

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  statuses: write

jobs:
  deploy-current-main:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.body == '/deploy-current-main' &&
       github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    env:
      HAS_PW: ${{ secrets.SSH_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check whether current main is already deployed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
            --jq '[.statuses[] | select(.context == "production/seiltanzer")][0].state // ""')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$state" = "success" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Current main $sha already has successful production status"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and test current main
        if: steps.gate.outputs.skip != 'true'
        run: |
          pip install -e ".[dev]"
          pytest -q
          node --check seiltanzer/web/js/cone.js
          node --check seiltanzer/web/js/iv_surface.js
          node --check seiltanzer/web/js/levels.js
          node tests/web/cone_interaction_smoke.mjs

      - name: Deploy current main to production
        if: steps.gate.outputs.skip != 'true' && env.HAS_PW == 'true'
        uses: appleboy/ssh-action@v1
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_PROXY: ${{ secrets.OPENROUTER_PROXY }}
          TRADINGVIEW_AUTH_TOKEN: ${{ secrets.TRADINGVIEW_AUTH_TOKEN }}
          TERMINAL_USER: ${{ secrets.TERMINAL_USER }}
          TERMINAL_PASS: ${{ secrets.TERMINAL_PASS }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          envs: OPENROUTER_API_KEY,OPENROUTER_PROXY,TRADINGVIEW_AUTH_TOKEN,TERMINAL_USER,TERMINAL_PASS
          command_timeout: 10m
          script: |
            set -e
            cd /opt/seiltanzer
            git fetch origin main
            git reset --hard origin/main
            /opt/seiltanzer/.venv/bin/pip install --quiet -e /opt/seiltanzer
            systemctl restart seiltanzer
            sleep 4
            echo "active: $(systemctl is-active seiltanzer)"
            echo "HEAD:   $(git -C /opt/seiltanzer rev-parse --short HEAD)"
            echo "http:   $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8790/api/state)"
            test "$(systemctl is-active seiltanzer)" = "active"
            test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8790/api/state)" = "200"

      - name: Publish verified production status
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.gate.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
          HAS_SSH_PASSWORD: ${{ env.HAS_PW }}
        run: |
          if [ "$HAS_SSH_PASSWORD" != "true" ]; then
            state="error"
            description="Production deploy skipped: SSH_PASSWORD is missing"
          elif [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Production active; server HEAD and HTTP 200 verified"
          else
            state="failure"
            description="Tests or production verification failed"
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"production/seiltanzer\",\"description\":\"$description\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
