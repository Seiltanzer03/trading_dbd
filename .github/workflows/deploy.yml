name: deploy

# Production delivery is event-driven by completion of the exact main CI run.
# This avoids occupying a GitHub runner while waiting for another runner to
# finish WebKit, which can deadlock/timeout under account concurrency pressure.
on:
  workflow_run:
    workflows: ["tests"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-seiltanzer
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify automatic deploy trigger
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          test "${{ github.event.workflow_run.conclusion }}" = "success"
          test "${{ github.event.workflow_run.head_branch }}" = "main"
          test -n "$EXPECTED_SHA"
          echo "Deploying successful main CI head SHA: $EXPECTED_SHA"

      - name: Verify manual dispatch already has green exact-SHA CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 8 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${EXPECTED_SHA}/status")
          verdict=$(BODY="$body" python3 - <<'PY'
          import json, os
          body=json.loads(os.environ['BODY'])
          states={str(x.get('context')):str(x.get('state')) for x in body.get('statuses',[])}
          print(states.get('ci/full-webkit','missing'))
          PY
          )
          echo "ci/full-webkit state=$verdict"
          if [ "$verdict" != "success" ]; then
            echo "::error::Manual production delivery requires an already-green exact-SHA ci/full-webkit"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Deliver exact SHA over SSH
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 10m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            git config --global --add safe.directory /opt/seiltanzer || true
            cd /opt/seiltanzer

            echo '=== PRE-DEPLOY SERVICE DIAGNOSTICS ==='
            systemctl status seiltanzer --no-pager -l || true
            echo '=== RECENT SEILTANZER JOURNAL ==='
            journalctl -u seiltanzer --since '-45 minutes' --no-pager -n 220 || true
            echo '=== RECENT KERNEL OOM / KILL EVENTS ==='
            journalctl -k --since '-45 minutes' --no-pager 2>/dev/null \
              | grep -Ei 'out of memory|oom|killed process|memory cgroup' || true
            echo '=== HOST CAPACITY ==='
            free -h || true
            df -h / /opt/seiltanzer || true

            while read -r unit _; do
              [ -n "$unit" ] || continue
              case "$unit" in
                seiltanzer-ede-*.service)
                  echo "Stopping legacy production EDE unit: $unit"
                  timeout 8s systemctl stop "$unit" >/dev/null 2>&1 || true
                  systemctl kill --kill-who=all --signal=KILL "$unit" >/dev/null 2>&1 || true
                  systemctl reset-failed "$unit" >/dev/null 2>&1 || true
                  ;;
              esac
            done < <(systemctl list-units --all --type=service --no-legend 'seiltanzer-ede-*' || true)

            pkill -f '/opt/seiltanzer/scripts/[p]roduction_ede_v13_audit.py' >/dev/null 2>&1 || true
            pkill -f '/opt/seiltanzer/scripts/[p]roduction_ede_transition_audit.py' >/dev/null 2>&1 || true

            git fetch origin main
            git cat-file -e "${EXPECTED_SHA}^{commit}"
            git reset --hard "$EXPECTED_SHA"

            SITE=$(/opt/seiltanzer/.venv/bin/python - <<'PY'
            import site
            print(site.getsitepackages()[0])
            PY
            )
            PYTHONPATH=/opt/seiltanzer /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/g1e1_cleanup_venv.py --site-packages "$SITE" --apply || true
            /opt/seiltanzer/.venv/bin/pip install --quiet -e /opt/seiltanzer

            mkdir -p /etc/systemd/system/seiltanzer.service.d
            cat >/etc/systemd/system/seiltanzer.service.d/20-memory-budget.conf <<'EOF'
            [Service]
            Environment=MALLOC_ARENA_MAX=2
            Environment=MALLOC_TRIM_THRESHOLD_=131072
            Environment=OMP_NUM_THREADS=1
            Environment=OPENBLAS_NUM_THREADS=1
            Environment=MKL_NUM_THREADS=1
            Environment=NUMEXPR_NUM_THREADS=1
            EOF
            systemctl daemon-reload
            systemctl reset-failed seiltanzer >/dev/null 2>&1 || true
            systemctl restart seiltanzer

            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"

            ready=0
            for attempt in $(seq 1 45); do
              active=$(systemctl is-active seiltanzer 2>/dev/null || true)
              result=$(curl -sS -o /tmp/seiltanzer-deploy-state.json \
                --connect-timeout 1 --max-time 3 \
                -w '%{http_code} %{time_total}' \
                http://127.0.0.1:8790/api/state 2>/dev/null || true)
              code=${result%% *}
              elapsed=${result#* }
              echo "post-restart attempt=$attempt active=${active:-unknown} http=${code:-000} seconds=${elapsed:-na}"
              if [ "$active" = "active" ] && [ "$code" = "200" ]; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" != "1" ]; then
              echo '::error::seiltanzer failed real HTTP readiness after restart'
              systemctl status seiltanzer --no-pager -l || true
              journalctl -u seiltanzer --since '-10 minutes' --no-pager -n 180 || true
              exit 1
            fi

            echo '=== POST-RESTART MEMORY ==='
            systemctl show seiltanzer \
              -p MemoryCurrent -p MemoryPeak -p NRestarts -p ActiveState -p SubState || true
            ps -o pid,rss,vsz,etime,cmd -p "$(systemctl show -p MainPID --value seiltanzer)" || true

            if systemctl list-units --all --type=service --no-legend 'seiltanzer-ede-*' | grep -q 'running'; then
              echo "::error::Legacy production EDE unit survived deployment"
              exit 1
            fi
            echo "Delivered exact production SHA: $EXPECTED_SHA"
