name: deploy

# Автоматический production-деплой на self-hosted runner (VPS 94.241.171.182):
# Запускается при каждом push/merge в main и по кнопке workflow_dispatch.
# Сначала выполняются Python и frontend smoke-тесты, затем вызывается root-owned
# скрипт /usr/local/sbin/deploy-seiltanzer через sudo, после чего выставляется
# проверенный commit status production/seiltanzer.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-seiltanzer
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, seiltanzer-prod]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Установка зависимостей и запуск тестов (сломанное не деплоим)
        run: |
          /opt/seiltanzer/.venv/bin/pip install -q -e ".[dev]"
          /opt/seiltanzer/.venv/bin/pytest -q
          node --check seiltanzer/web/js/touch_clock.js
          node --check seiltanzer/web/js/safe_fetch.js
          node --check seiltanzer/web/js/management_ui.js
          node --check seiltanzer/web/js/cone.js
          node --check seiltanzer/web/js/iv_surface.js
          node --check seiltanzer/web/js/levels.js
          node --check seiltanzer/web/js/gex.js
          node --check seiltanzer/web/js/regime_phase.js
          node --check seiltanzer/web/js/wavelet.js
          node --check seiltanzer/web/js/correlation.js
          node --check seiltanzer/web/js/market_bus.js
          node --check seiltanzer/web/js/analytics_mobile.js
          node --check seiltanzer/web/js/premium_analytics_theme.js
          node tests/web/touch_clock_smoke.mjs
          node tests/web/ai_verdict_error_smoke.mjs
          node tests/web/ai_management_decision_smoke.mjs
          node tests/web/fan_cone_touch_consistency_smoke.mjs
          node tests/web/cone_interaction_smoke.mjs
          node tests/web/gex_smoke.mjs
          node tests/web/correlation_modes_smoke.mjs
          node tests/web/plotly_toolbar_smoke.mjs
          node tests/web/real_market_motion_smoke.mjs
          node tests/web/plotly_camera_guard_mobile_smoke.mjs
          node tests/web/analytics_mobile_smoke.mjs
          node tests/web/render_budget_smoke.mjs

      - name: Запуск деплоя на production
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_PROXY: ${{ secrets.OPENROUTER_PROXY }}
          TRADINGVIEW_AUTH_TOKEN: ${{ secrets.TRADINGVIEW_AUTH_TOKEN }}
          TERMINAL_USER: ${{ secrets.TERMINAL_USER }}
          TERMINAL_PASS: ${{ secrets.TERMINAL_PASS }}
        run: |
          sudo /usr/local/sbin/deploy-seiltanzer

      - name: Пост-проверка результатов production-деплоя
        run: |
          git config --global --add safe.directory /opt/seiltanzer || true
          DEPLOYED_COMMIT=$(git -C /opt/seiltanzer rev-parse HEAD)
          EXPECTED_COMMIT=$(git rev-parse HEAD)
          echo "Server current HEAD: $DEPLOYED_COMMIT"
          echo "Expected HEAD: $EXPECTED_COMMIT"
          if [ "$DEPLOYED_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "::error::Commit mismatch! Server HEAD ($DEPLOYED_COMMIT) != Expected ($EXPECTED_COMMIT)"
            exit 1
          fi

          IS_ACTIVE=$(systemctl is-active seiltanzer || true)
          echo "Systemd service status: $IS_ACTIVE"
          if [ "$IS_ACTIVE" != "active" ]; then
            echo "::error::Service is not active ($IS_ACTIVE)"
            exit 1
          fi

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8790/api/state || true)
          echo "Local API HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Local API status is $HTTP_CODE"
            exit 1
          fi

          for endpoint in \
            /api/validation \
            /api/research/counterfactual \
            /api/research/passive/status \
            /api/research/passive/calibration \
            /api/research/passive/edge \
            /api/research/g1/dataset/status \
            /api/research/g1/dataset/cohorts \
            /api/research/g1/dataset/exclusions \
            /api/research/g1/dataset/cuts \
            /api/research/g1/baselines/status \
            /api/research/g1/baselines/cohorts \
            /api/analytics/gex-migration \
            /api/analytics/regime-phase \
            /api/analytics/wavelet \
            /api/analytics/correlation-graph; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8790${endpoint}" || true)
            echo "$endpoint: $code"
            if [ "$code" != "200" ]; then
              echo "::error::$endpoint status is $code"
              exit 1
            fi
          done

          VALIDATION_BODY=$(curl -fsS http://127.0.0.1:8790/api/validation)
          VALIDATION_BODY="$VALIDATION_BODY" /opt/seiltanzer/.venv/bin/python - <<'PY'
          import json, os
          body = json.loads(os.environ["VALIDATION_BODY"])
          q = body.get("q_calibration") or {}
          authority = q.get("authority") or {}
          counterfactual = body.get("counterfactual_replay") or {}
          assert q.get("promotion_allowed") is False
          assert q.get("production_replacement_allowed") is False
          assert authority.get("physical_probability_published") is False
          assert authority.get("sample_count_auto_promotion") is False
          assert counterfactual.get("promotion_allowed") is False
          print(
              "Q->P OOS evidence: "
              f"sample_count={authority.get('sample_count', 0)} "
              f"effective_n={authority.get('effective_independent_n', 0)} "
              f"event_count={authority.get('event_count', 0)} "
              f"status={authority.get('status', 'insufficient_evidence')}"
          )
          PY

          PASSIVE_BODY=$(curl -fsS http://127.0.0.1:8790/api/research/passive/calibration)
          PASSIVE_STATUS=$(curl -fsS http://127.0.0.1:8790/api/research/passive/status)
          PASSIVE_BODY="$PASSIVE_BODY" PASSIVE_STATUS="$PASSIVE_STATUS" /opt/seiltanzer/.venv/bin/python - <<'PY'
          import json, os
          calibration = json.loads(os.environ["PASSIVE_BODY"])
          status = json.loads(os.environ["PASSIVE_STATUS"])
          assert calibration.get("promotion_allowed") is False
          assert calibration.get("sample_count_auto_promotion") is False
          assert calibration.get("authority") == "shadow"
          assert status.get("active_trade_required") is False
          assert status.get("promotion_allowed") is False
          print(
              "Passive evidence: "
              f"raw_n={calibration.get('raw_n', 0)} "
              f"effective_n={calibration.get('effective_n', 0)} "
              f"status={calibration.get('evidence_status', 'INSUFFICIENT')}"
          )
          PY

          G1_STATUS=$(curl -fsS http://127.0.0.1:8790/api/research/g1/dataset/status)
          G1_EXCLUSIONS=$(curl -fsS http://127.0.0.1:8790/api/research/g1/dataset/exclusions)
          G1_STATUS="$G1_STATUS" G1_EXCLUSIONS="$G1_EXCLUSIONS" /opt/seiltanzer/.venv/bin/python - <<'PY'
          import json, os
          status = json.loads(os.environ["G1_STATUS"])
          exclusions = json.loads(os.environ["G1_EXCLUSIONS"])
          assert status.get("g1_stage") == "G.1A"
          assert status.get("dataset_contract_version") == "g1-prospective-dataset-v1"
          assert status.get("authority") == "research_only"
          assert status.get("production_authority") is False
          assert status.get("g1_training_allowed") is False
          assert status.get("physical_probability_published") is False
          assert status.get("promotion_allowed") is False
          assert status.get("production_replacement_allowed") is False
          assert status.get("sample_count_auto_promotion") is False
          print(
              "G1A dataset: "
              f"source={status.get('raw_source_n', 0)} "
              f"current={status.get('current_source_n', 0)} "
              f"measurement_valid={status.get('measurement_valid_n', 0)} "
              f"forecast_eligible={status.get('forecast_eval_eligible_n', 0)} "
              f"q_to_p={status.get('q_to_p_eligible_n', 0)} "
              f"anchors={status.get('unique_anchor_n', 0)} "
              f"effective_n={status.get('effective_n', 0)} "
              f"cohorts={status.get('cohort_count', 0)} "
              f"status={status.get('evidence_status', 'INSUFFICIENT')}"
          )
          print(
              "G1A exclusions: "
              f"total={exclusions.get('total_excluded_n', 0)} "
              f"primary={exclusions.get('primary_reason_counts', {})}"
          )
          PY

          G1B_STATUS=$(curl -fsS http://127.0.0.1:8790/api/research/g1/baselines/status)
          G1B_STATUS="$G1B_STATUS" /opt/seiltanzer/.venv/bin/python - <<'PY'
          import json, os
          status = json.loads(os.environ["G1B_STATUS"])
          q = status.get("terminal_q_identity") or {}
          assert status.get("g1_stage") == "G.1B"
          assert status.get("baseline_contract_version") == "g1-baseline-metrics-v1"
          assert status.get("dataset_contract_version") == "g1-prospective-dataset-v1"
          assert status.get("authority") == "research_only"
          assert status.get("production_authority") is False
          assert status.get("calibrator_fitted") is False
          assert status.get("calibrator_registry_writes") is False
          assert status.get("g1_training_allowed") is False
          assert status.get("physical_probability_published") is False
          assert status.get("promotion_allowed") is False
          assert status.get("production_replacement_allowed") is False
          assert status.get("sample_count_auto_promotion") is False
          assert q.get("physical_probability_published") is False
          print(
              "G1B baselines: "
              f"forecast_n={status.get('raw_forecast_eval_n', 0)} "
              f"effective_n={status.get('effective_n', 0)} "
              f"q_raw={q.get('raw_q_eligible_n', 0)} "
              f"q_effective={q.get('effective_q_n', 0)} "
              f"q_metrics={q.get('metrics_eligible_n', 0)} "
              f"pit_mismatch={q.get('pit_contract_mismatch_n', 0)} "
              f"status={status.get('evidence_status', 'INSUFFICIENT')}"
          )
          PY

          # Exercise the real production AI route, including snapshot
          # persistence and provider/deterministic fallback contract. A terminal
          # without an active trade legitimately returns structured 400.
          AI_RESPONSE=$(curl -sS --max-time 65 -w $'\n%{http_code}' \
            -X POST http://127.0.0.1:8790/api/ai/verdict || true)
          AI_STATUS=${AI_RESPONSE##*$'\n'}
          AI_BODY=${AI_RESPONSE%$'\n'*}
          echo "/api/ai/verdict: $AI_STATUS"
          AI_BODY="$AI_BODY" /opt/seiltanzer/.venv/bin/python - <<'PY'
          import json, os
          body = json.loads(os.environ["AI_BODY"])
          assert isinstance(body.get("ok"), bool)
          if body["ok"]:
              assert body.get("mode") in {"llm", "deterministic_fallback"}
              assert isinstance(body.get("verdict"), str) and body["verdict"]
          else:
              assert (body.get("error") or {}).get("code") in {
                  "no_active_trade", "ai_rate_limited", "ai_request_in_progress"}
          PY
          if [ "$AI_STATUS" != "200" ] && [ "$AI_STATUS" != "400" ] && [ "$AI_STATUS" != "429" ]; then
            echo "::error::/api/ai/verdict unexpected status $AI_STATUS"
            exit 1
          fi

      - name: Публикую проверенный production-статус
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Production active; validation, research, analytics, server HEAD verified"
          else
            state="failure"
            description="Tests or production verification failed"
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"production/seiltanzer\",\"description\":\"$description\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
