name: deploy

# Автоматический production-деплой на self-hosted runner (VPS 94.241.171.182):
# Запускается при каждом push/merge в main и по кнопке workflow_dispatch.
# Сначала выполняются Python и frontend smoke-тесты, затем вызывается root-owned
# скрипт /usr/local/sbin/deploy-seiltanzer через sudo, после чего выставляется
# проверенный commit status production/seiltanzer.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-seiltanzer
  cancel-in-progress: false

permissions:
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, seiltanzer-prod]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Установка зависимостей и запуск тестов (сломанное не деплоим)
        run: |
          /opt/seiltanzer/.venv/bin/pip install -q -e ".[dev]"
          /opt/seiltanzer/.venv/bin/pytest -q
          node --check seiltanzer/web/js/cone.js
          node --check seiltanzer/web/js/iv_surface.js
          node --check seiltanzer/web/js/levels.js
          node tests/web/cone_interaction_smoke.mjs

      - name: Запуск деплоя на production
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_PROXY: ${{ secrets.OPENROUTER_PROXY }}
          TRADINGVIEW_AUTH_TOKEN: ${{ secrets.TRADINGVIEW_AUTH_TOKEN }}
          TERMINAL_USER: ${{ secrets.TERMINAL_USER }}
          TERMINAL_PASS: ${{ secrets.TERMINAL_PASS }}
        run: |
          sudo /usr/local/sbin/deploy-seiltanzer

      - name: Пост-проверка результатов production-деплоя
        run: |
          SERVER_HEAD=$(git -C /opt/seiltanzer rev-parse HEAD)
          EXPECTED_HEAD="${{ github.sha }}"
          echo "EXPECTED: $EXPECTED_HEAD"
          echo "ACTUAL:   $SERVER_HEAD"
          if [ "$SERVER_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "ERROR: Server HEAD ($SERVER_HEAD) does not match expected commit ($EXPECTED_HEAD)"
            exit 1
          fi

          SERVICE_STATUS=$(systemctl is-active seiltanzer || true)
          echo "Service status: $SERVICE_STATUS"
          if [ "$SERVICE_STATUS" != "active" ]; then
            echo "ERROR: Service status is $SERVICE_STATUS"
            exit 1
          fi

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8790/api/state || echo "000")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: /api/state returned HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Публикую проверенный production-статус
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Production active; server HEAD and HTTP 200 verified"
          else
            state="failure"
            description="Tests or production verification failed"
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"production/seiltanzer\",\"description\":\"$description\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
