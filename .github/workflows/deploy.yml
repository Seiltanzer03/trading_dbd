name: deploy

# Delivery only. The authoritative production health verdict is published by
# production-readiness after this workflow completes. Expensive research scans
# and application warm-up must not turn a successful code delivery into a false
# deployment failure.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-seiltanzer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, seiltanzer-prod]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Clean stale Seiltanzer editable-install remnants
        run: |
          set -euo pipefail
          SITE=$(/opt/seiltanzer/.venv/bin/python - <<'PY'
          import site
          print(site.getsitepackages()[0])
          PY
          )
          # Bounded cleanup: only malformed ~*ltanzer* artifacts are eligible.
          # Old root-owned remnants are reported rather than broad-deleted.
          /opt/seiltanzer/.venv/bin/python scripts/g1e1_cleanup_venv.py \
            --site-packages "$SITE" --apply || true

      - name: Pre-deploy regression
        run: |
          set -euo pipefail
          /opt/seiltanzer/.venv/bin/pip install -q -e ".[dev]"
          /opt/seiltanzer/.venv/bin/pytest -q
          node --check seiltanzer/web/js/touch_clock.js
          node --check seiltanzer/web/js/safe_fetch.js
          node --check seiltanzer/web/js/management_ui.js
          node --check seiltanzer/web/js/cone.js
          node --check seiltanzer/web/js/iv_surface.js
          node --check seiltanzer/web/js/levels.js
          node --check seiltanzer/web/js/gex.js
          node --check seiltanzer/web/js/regime_phase.js
          node --check seiltanzer/web/js/wavelet.js
          node --check seiltanzer/web/js/correlation.js
          node --check seiltanzer/web/js/market_bus.js
          node --check seiltanzer/web/js/analytics_mobile.js
          node --check seiltanzer/web/js/premium_analytics_theme.js
          node tests/web/touch_clock_smoke.mjs
          node tests/web/ai_verdict_error_smoke.mjs
          node tests/web/ai_management_decision_smoke.mjs
          node tests/web/fan_cone_touch_consistency_smoke.mjs
          node tests/web/cone_interaction_smoke.mjs
          node tests/web/gex_smoke.mjs
          node tests/web/correlation_modes_smoke.mjs
          node tests/web/plotly_toolbar_smoke.mjs
          node tests/web/real_market_motion_smoke.mjs
          node tests/web/plotly_camera_guard_mobile_smoke.mjs
          node tests/web/analytics_mobile_smoke.mjs
          node tests/web/render_budget_smoke.mjs

      - name: Deliver current main to production
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_PROXY: ${{ secrets.OPENROUTER_PROXY }}
          TRADINGVIEW_AUTH_TOKEN: ${{ secrets.TRADINGVIEW_AUTH_TOKEN }}
          TERMINAL_USER: ${{ secrets.TERMINAL_USER }}
          TERMINAL_PASS: ${{ secrets.TERMINAL_PASS }}
        run: |
          set -euo pipefail
          # The root-owned script still has an eager HTTP probe. A non-zero exit
          # after exact SHA delivery + active systemd is therefore a warning, not
          # the final health verdict. production-readiness owns bounded HTTP,
          # storage, authority and restore acceptance.
          set +e
          sudo /usr/local/sbin/deploy-seiltanzer
          DEPLOY_RC=$?
          set -e

          git config --global --add safe.directory /opt/seiltanzer || true
          EXPECTED=$(git rev-parse HEAD)
          SERVER=$(git -C /opt/seiltanzer rev-parse HEAD 2>/dev/null || true)
          ACTIVE=$(systemctl is-active seiltanzer 2>/dev/null || true)
          echo "expected=$EXPECTED server=${SERVER:-missing} active=${ACTIVE:-unknown} root_script_rc=$DEPLOY_RC"

          if [ "$SERVER" != "$EXPECTED" ]; then
            echo "::error::Production checkout did not reach expected SHA"
            exit 1
          fi
          if [ "$ACTIVE" != "active" ]; then
            echo "::error::Production service is not active after delivery"
            exit 1
          fi
          if [ "$DEPLOY_RC" != "0" ]; then
            echo "::warning::Legacy deploy probe returned $DEPLOY_RC after exact SHA delivery; bounded production-readiness owns final health."
          fi
