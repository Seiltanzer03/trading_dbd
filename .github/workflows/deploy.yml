name: deploy

# Delivery only. GitHub-hosted CI proves the exact SHA first; the tiny production
# VPS must not repeat the full pytest/WebKit/frontend regression and risk starving
# its own self-hosted runner. Final runtime health remains owned by
# production-readiness after delivery.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-seiltanzer
  # A newer main supersedes a queued/stuck delivery of an older SHA. This is
  # especially important if the self-hosted runner temporarily loses contact.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, seiltanzer-prod]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Wait for exact-SHA GitHub CI instead of rerunning it on production
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          verdict=""
          for attempt in $(seq 1 90); do
            body=$(curl -fsS --max-time 5 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${EXPECTED_SHA}/status")
            verdict=$(BODY="$body" /opt/seiltanzer/.venv/bin/python - <<'PY'
          import json, os
          body=json.loads(os.environ['BODY'])
          states={str(x.get('context')):str(x.get('state')) for x in body.get('statuses',[])}
          print(states.get('ci/full-webkit','pending'))
          PY
            )
            echo "ci/full-webkit attempt=$attempt state=$verdict"
            if [ "$verdict" = "success" ]; then break; fi
            if [ "$verdict" = "failure" ] || [ "$verdict" = "error" ]; then
              echo "::error::Exact-SHA CI failed; refusing production delivery"
              exit 1
            fi
            sleep 2
          done
          test "$verdict" = "success"

      - name: Clean stale Seiltanzer editable-install remnants
        run: |
          set -euo pipefail
          SITE=$(/opt/seiltanzer/.venv/bin/python - <<'PY'
          import site
          print(site.getsitepackages()[0])
          PY
          )
          PYTHONPATH="$GITHUB_WORKSPACE" /opt/seiltanzer/.venv/bin/python \
            scripts/g1e1_cleanup_venv.py --site-packages "$SITE" --apply || true

      - name: Deliver current main to production
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_PROXY: ${{ secrets.OPENROUTER_PROXY }}
          TRADINGVIEW_AUTH_TOKEN: ${{ secrets.TRADINGVIEW_AUTH_TOKEN }}
          TERMINAL_USER: ${{ secrets.TERMINAL_USER }}
          TERMINAL_PASS: ${{ secrets.TERMINAL_PASS }}
        run: |
          set -euo pipefail
          # The root-owned script still has an eager HTTP probe. A non-zero exit
          # after exact SHA delivery + active systemd is a warning; bounded
          # production-readiness owns HTTP/storage/research/restore acceptance.
          set +e
          sudo /usr/local/sbin/deploy-seiltanzer
          DEPLOY_RC=$?
          set -e

          git config --global --add safe.directory /opt/seiltanzer || true
          EXPECTED=$(git rev-parse HEAD)
          SERVER=$(git -C /opt/seiltanzer rev-parse HEAD 2>/dev/null || true)
          ACTIVE=$(systemctl is-active seiltanzer 2>/dev/null || true)
          echo "expected=$EXPECTED server=${SERVER:-missing} active=${ACTIVE:-unknown} root_script_rc=$DEPLOY_RC"

          if [ "$SERVER" != "$EXPECTED" ]; then
            echo "::error::Production checkout did not reach expected SHA"
            exit 1
          fi
          if [ "$ACTIVE" != "active" ]; then
            echo "::error::Production service is not active after delivery"
            exit 1
          fi
          if [ "$DEPLOY_RC" != "0" ]; then
            echo "::warning::Legacy deploy probe returned $DEPLOY_RC after exact SHA delivery; bounded production-readiness owns final health."
          fi
