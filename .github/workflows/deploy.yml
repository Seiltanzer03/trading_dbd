name: deploy

# One exact-SHA production transaction. A green `tests` workflow on main is the
# only automatic entry point; delivery, readiness, functional smoke and status
# publication all retain the same EXPECTED_SHA in this workflow. This avoids the
# subtle workflow_run head_sha drift that can occur across chained workflows when
# main advances between stages.
on:
  workflow_run:
    workflows: ["tests"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact already-green main SHA to deploy
        required: true
        type: string

concurrency:
  group: production-seiltanzer
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
      ACCEPTANCE_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Verify automatic deploy trigger
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          test "${{ github.event.workflow_run.conclusion }}" = "success"
          test "${{ github.event.workflow_run.head_branch }}" = "main"
          test -n "$EXPECTED_SHA"
          echo "Atomic production acceptance for successful main CI SHA: $EXPECTED_SHA"

      - name: Verify manual dispatch already has green exact-SHA CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 8 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${EXPECTED_SHA}/status")
          verdict=$(BODY="$body" python3 - <<'PY'
          import json, os
          body=json.loads(os.environ['BODY'])
          states={str(x.get('context')):str(x.get('state')) for x in body.get('statuses',[])}
          print(states.get('ci/full-webkit','missing'))
          PY
          )
          echo "ci/full-webkit state=$verdict"
          if [ "$verdict" != "success" ]; then
            echo "::error::Manual production delivery requires an already-green exact-SHA ci/full-webkit"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build exact-SHA official macro transport bundle off-host
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet -e '.[research]'
          python scripts/build_offhost_macro_bundle.py \
            --expected-sha "$EXPECTED_SHA" \
            --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
            --output "official-macro-${ACCEPTANCE_RUN_ID}.json"

      - name: Transfer verified official macro bundle over deploy channel
        uses: appleboy/scp-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: official-macro-${{ github.run_id }}.json
          target: /tmp

      - name: Deliver exact SHA over SSH
        id: delivery
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
          ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 10m
          envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
          script: |
            set -euo pipefail
            case "$ACCEPTANCE_RUN_ID" in
              ''|*[!0-9]*) echo "Invalid acceptance_run_id"; exit 1 ;;
            esac
            bundle_input="/tmp/official-macro-${ACCEPTANCE_RUN_ID}.json"
            trap 'rm -f -- "$bundle_input"' EXIT
            test -f "$bundle_input"
            cd /opt/seiltanzer

            echo '=== PRE-DEPLOY SERVICE DIAGNOSTICS ==='
            systemctl status seiltanzer --no-pager -l || true
            echo '=== RECENT SEILTANZER JOURNAL ==='
            journalctl -u seiltanzer --since '-45 minutes' --no-pager -n 220 || true
            echo '=== RECENT KERNEL OOM / KILL EVENTS ==='
            journalctl -k --since '-45 minutes' --no-pager 2>/dev/null \
              | grep -Ei 'out of memory|oom|killed process|memory cgroup' || true
            echo '=== HOST CAPACITY BEFORE BOUNDED CLEANUP ==='
            free -h || true
            df -h / /opt/seiltanzer || true

            # A full root filesystem prevents even git from creating its lock and
            # temporary object files. Recover space only from bounded disposable
            # locations before touching repository state. Never delete data/, DB,
            # ledgers, evidence, model outputs or arbitrary application files.
            echo '=== BOUNDED PRE-FETCH DISK CLEANUP ==='
            rm -f /root/.gitconfig.lock >/dev/null 2>&1 || true
            if [ -d /root/.cache ]; then
              find /root/.cache -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + \
                >/dev/null 2>&1 || true
            fi
            rm -rf /root/.npm/_cacache >/dev/null 2>&1 || true
            apt-get clean >/dev/null 2>&1 || true
            journalctl --vacuum-size=128M >/dev/null 2>&1 || true
            find /tmp -xdev -mindepth 1 -maxdepth 1 \
              \( -name 'pip-*' -o -name 'pip-build-*' -o -name 'pip-install-*' \) \
              -mtime +1 -exec rm -rf -- {} + >/dev/null 2>&1 || true
            find /opt/seiltanzer -xdev \
              -path /opt/seiltanzer/data -prune -o \
              -type d \( -name '__pycache__' -o -name '.pytest_cache' \
                -o -name '.mypy_cache' -o -name '.ruff_cache' \) \
              -prune -exec rm -rf -- {} + >/dev/null 2>&1 || true

            # Reuse the already-deployed narrow malformed-editable cleanup before
            # git fetch as well. It is explicitly confined to malformed ~seiltanzer
            # entries under site-packages and is safe to repeat.
            if [ -x /opt/seiltanzer/.venv/bin/python ] \
               && [ -f /opt/seiltanzer/scripts/g1e1_cleanup_venv.py ]; then
              SITE=$(/opt/seiltanzer/.venv/bin/python - <<'PY'
            import site
            print(site.getsitepackages()[0])
            PY
              )
              PYTHONPATH=/opt/seiltanzer /opt/seiltanzer/.venv/bin/python \
                /opt/seiltanzer/scripts/g1e1_cleanup_venv.py \
                --site-packages "$SITE" --apply || true
            fi
            sync || true
            echo '=== HOST CAPACITY AFTER BOUNDED CLEANUP ==='
            df -h / /opt/seiltanzer || true

            free_kb=$(df --output=avail -k / | tail -n 1 | tr -d ' ')
            required_kb=$((512 * 1024))
            if [ "${free_kb:-0}" -lt "$required_kb" ]; then
              echo "::error::Insufficient safe pre-fetch headroom: ${free_kb:-0} KiB < ${required_kb} KiB"
              echo '=== BOUNDED DISK DIAGNOSTICS ==='
              du -xhd1 /opt 2>/dev/null | sort -h | tail -n 30 || true
              du -xhd1 /var 2>/dev/null | sort -h | tail -n 30 || true
              du -xhd1 /root 2>/dev/null | sort -h | tail -n 30 || true
              exit 1
            fi

            rm -f /root/.gitconfig.lock >/dev/null 2>&1 || true
            git config --global --add safe.directory /opt/seiltanzer || true

            while read -r unit _; do
              [ -n "$unit" ] || continue
              case "$unit" in
                seiltanzer-ede-*.service)
                  echo "Stopping legacy production EDE unit: $unit"
                  timeout 8s systemctl stop "$unit" >/dev/null 2>&1 || true
                  systemctl kill --kill-who=all --signal=KILL "$unit" >/dev/null 2>&1 || true
                  systemctl reset-failed "$unit" >/dev/null 2>&1 || true
                  ;;
              esac
            done < <(systemctl list-units --all --type=service --no-legend 'seiltanzer-ede-*' || true)

            pkill -f '/opt/seiltanzer/scripts/[p]roduction_ede_v13_audit.py' >/dev/null 2>&1 || true
            pkill -f '/opt/seiltanzer/scripts/[p]roduction_ede_transition_audit.py' >/dev/null 2>&1 || true

            git fetch origin main
            git cat-file -e "${EXPECTED_SHA}^{commit}"
            git reset --hard "$EXPECTED_SHA"

            SITE=$(/opt/seiltanzer/.venv/bin/python - <<'PY'
            import site
            print(site.getsitepackages()[0])
            PY
            )
            PYTHONPATH=/opt/seiltanzer /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/g1e1_cleanup_venv.py --site-packages "$SITE" --apply || true
            /opt/seiltanzer/.venv/bin/pip install --quiet -e /opt/seiltanzer

            /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/install_offhost_macro_bundle.py \
              --input "$bundle_input" \
              --destination /opt/seiltanzer/data/research/official_macro_offhost_latest.json \
              --expected-sha "$EXPECTED_SHA" \
              --acceptance-run-id "$ACCEPTANCE_RUN_ID"

            echo '=== POST-INSTALL DISK ==='
            df -h / /opt/seiltanzer || true

            mkdir -p /etc/systemd/system/seiltanzer.service.d
            cat >/etc/systemd/system/seiltanzer.service.d/20-memory-budget.conf <<'EOF'
            [Service]
            Environment=MALLOC_ARENA_MAX=2
            Environment=MALLOC_TRIM_THRESHOLD_=131072
            Environment=OMP_NUM_THREADS=1
            Environment=OPENBLAS_NUM_THREADS=1
            Environment=MKL_NUM_THREADS=1
            Environment=NUMEXPR_NUM_THREADS=1
            EOF
            systemctl daemon-reload
            systemctl reset-failed seiltanzer >/dev/null 2>&1 || true

            # A slow shutdown can be SIGKILLed by systemd while the old process
            # owns a young hidden SQLite backup temp. `systemctl stop` returning
            # gives us the safe boundary: no live seiltanzer writer remains, so
            # only those hidden local-backup temps are orphaned and may be removed.
            # Verified recovery points, manifests and the authoritative DB are
            # deliberately outside this exact path/name contract.
            systemctl stop seiltanzer
            if systemctl is-active --quiet seiltanzer; then
              echo "::error::seiltanzer still active after explicit stop"
              exit 1
            fi
            orphan_tmp_n=0
            orphan_tmp_bytes=0
            while IFS= read -r -d '' orphan; do
              case "$orphan" in
                /opt/seiltanzer/data/backups/local/.*.tmp.sqlite3) ;;
                *)
                  echo "::error::Refusing unexpected prestart temp cleanup path: $orphan"
                  exit 1
                  ;;
              esac
              size=$(stat -c '%s' "$orphan" 2>/dev/null || echo 0)
              rm -f -- "$orphan"
              orphan_tmp_n=$((orphan_tmp_n + 1))
              orphan_tmp_bytes=$((orphan_tmp_bytes + size))
            done < <(
              find /opt/seiltanzer/data/backups/local \
                -maxdepth 1 -type f -name '.*.tmp.sqlite3' -print0 2>/dev/null
            )
            echo "DEPLOY_ORPHAN_PRESTART_TEMPS_REMOVED=$orphan_tmp_n"
            echo "DEPLOY_ORPHAN_PRESTART_TEMP_BYTES_REMOVED=$orphan_tmp_bytes"
            systemctl start seiltanzer

            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"

            # The source-of-truth SQLite DB is now roughly 3.7 GiB. Startup still
            # has to finish the durability snapshot and initialization before the
            # real HTTP gate may pass. Production measured about 188 seconds on
            # 2026-08-25, so keep a bounded ~210-second allowance with margin.
            # This does not relax the live route latency/readiness gates below.
            cold_start_attempts=105
            ready=0
            for attempt in $(seq 1 "$cold_start_attempts"); do
              active=$(systemctl is-active seiltanzer 2>/dev/null || true)
              prestart_backup_bytes=$(find /opt/seiltanzer/data/backups/local \
                -maxdepth 1 -type f -name '.*.tmp.sqlite3' -printf '%s\n' \
                2>/dev/null | sort -nr | head -n 1 || true)
              result=$(curl -sS -o /tmp/seiltanzer-deploy-state.json \
                --connect-timeout 1 --max-time 3 \
                -w '%{http_code} %{time_total}' \
                http://127.0.0.1:8790/api/state 2>/dev/null || true)
              code=${result%% *}
              elapsed=${result#* }
              echo "post-restart attempt=$attempt/$cold_start_attempts active=${active:-unknown} http=${code:-000} seconds=${elapsed:-na} prestart_backup_bytes=${prestart_backup_bytes:-0}"
              if [ "$active" = "active" ] && [ "$code" = "200" ]; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" != "1" ]; then
              echo '::error::seiltanzer failed real HTTP readiness after restart'
              systemctl status seiltanzer --no-pager -l || true
              journalctl -u seiltanzer --since '-10 minutes' --no-pager -n 180 || true
              exit 1
            fi

            echo '=== POST-RESTART MEMORY ==='
            systemctl show seiltanzer \
              -p MemoryCurrent -p MemoryPeak -p NRestarts -p ActiveState -p SubState || true
            ps -o pid,rss,vsz,etime,cmd -p "$(systemctl show -p MainPID --value seiltanzer)" || true

            if systemctl list-units --all --type=service --no-legend 'seiltanzer-ede-*' | grep -q 'running'; then
              echo "::error::Legacy production EDE unit survived deployment"
              exit 1
            fi
            echo "Delivered exact production SHA: $EXPECTED_SHA"

      - name: Pause research for exact-SHA production acceptance
        id: preacceptance
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
          ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 12m
          envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            PY=/opt/seiltanzer/.venv/bin/python
            ORCH=/opt/seiltanzer/scripts/production_research_acceptance.py
            gate_owned=0

            cleanup_gate_on_failure() {
              if [ "$gate_owned" -eq 1 ]; then
                "$PY" "$ORCH" release-gate \
                  --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
                  --expected-sha "$EXPECTED_SHA" || true
              fi
            }
            trap cleanup_gate_on_failure EXIT

            # Acquire the existing cooperative lease immediately after the new
            # service first becomes HTTP-ready. The worker may complete its one
            # required core cycle, but cannot start optional maintenance before
            # the restore drill/readiness transaction begins.
            "$PY" "$ORCH" acquire-gate \
              --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA" \
              --ttl-seconds 7200
            gate_owned=1

            "$PY" /opt/seiltanzer/scripts/production_post_research_check.py \
              --expected-sha "$EXPECTED_SHA" \
              --acceptance-run-id "$ACCEPTANCE_RUN_ID"
            "$PY" "$ORCH" validate-gate \
              --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA"

            trap - EXIT
            echo "PRE_ACCEPTANCE_RESEARCH_PAUSED expected_sha=$EXPECTED_SHA acceptance_run_id=$ACCEPTANCE_RUN_ID"

      - name: Verify exact production readiness
        id: readiness
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 10m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/production_readiness_check.py \
              --expected-sha "$EXPECTED_SHA"

      - name: Exercise exact production routes, AI and official macro data
        id: smoke
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 8m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/production_functional_smoke.py \
              --expected-sha "$EXPECTED_SHA"

      - name: Verify public terminal from GitHub runner
        id: public
        run: |
          set -euo pipefail
          url="http://94.241.171.182:8790/api/state"
          for attempt in 1 2 3; do
            if curl -fsS \
              --connect-timeout 3 \
              --max-time 5 \
              --output /tmp/public-state.json \
              "$url"; then
              bytes=$(wc -c < /tmp/public-state.json)
              echo "public terminal PASS attempt=${attempt} bytes=${bytes}"
              exit 0
            fi
            echo "public terminal attempt=${attempt}/3 failed"
            sleep 2
          done
          echo "::error::Public terminal is unreachable at ${url}"
          exit 1

      - name: Start exact-SHA post-deploy research acceptance
        id: orchestration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$EXPECTED_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "::error::Invalid expected_sha: $EXPECTED_SHA"; exit 1 ;;
          esac
          case "$ACCEPTANCE_RUN_ID" in
            ''|*[!0-9]*) echo "::error::Invalid acceptance_run_id: $ACCEPTANCE_RUN_ID"; exit 1 ;;
          esac
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "expected_sha": os.environ["EXPECTED_SHA"],
                  "acceptance_run_id": os.environ["ACCEPTANCE_RUN_ID"],
              },
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 2 --retry-max-time 30 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/production-post-research.yml/dispatches" \
            -d "$payload"
          echo "POST_RESEARCH_DISPATCHED expected_sha=$EXPECTED_SHA acceptance_run_id=$ACCEPTANCE_RUN_ID"

      - name: Release pre-acceptance gate if deploy chain failed
        if: always() && steps.preacceptance.outcome == 'success' && steps.orchestration.outcome != 'success'
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
          ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
          script: |
            /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/production_research_acceptance.py release-gate \
              --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA" || true

      - name: Diagnose production failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            set +e
            echo '=== DEPLOYED SHA ==='
            git -C /opt/seiltanzer rev-parse HEAD || true
            echo '=== SERVICE ==='
            systemctl status seiltanzer --no-pager -l || true
            echo '=== AI SNAPSHOT STATUS ==='
            curl -sS --max-time 5 http://127.0.0.1:8790/api/ai/snapshot/status || true
            echo
            echo '=== MACRO STATUS ==='
            curl -sS --max-time 8 http://127.0.0.1:8790/api/research/macro/status || true
            echo
            echo '=== RECENT JOURNAL ==='
            journalctl -u seiltanzer --since '-15 minutes' --no-pager -n 220 || true

      - name: Publish exact-SHA production statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY: ${{ steps.delivery.outcome }}
          PREACCEPTANCE: ${{ steps.preacceptance.outcome }}
          READINESS: ${{ steps.readiness.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          PUBLIC: ${{ steps.public.outcome }}
          ORCHESTRATION: ${{ steps.orchestration.outcome }}
        run: |
          set -u
          prod_state=failure
          smoke_state=failure
          readiness_state=failure
          if [ "$READINESS" = "success" ]; then readiness_state=success; fi
          if [ "$SMOKE" = "success" ] && [ "$PUBLIC" = "success" ]; then smoke_state=success; fi
          if [ "$DELIVERY" = "success" ] && [ "$PREACCEPTANCE" = "success" ] \
             && [ "$READINESS" = "success" ] \
             && [ "$SMOKE" = "success" ] && [ "$PUBLIC" = "success" ] \
             && [ "$ORCHESTRATION" = "success" ]; then
            prod_state=success
          fi

          publish() {
            state="$1"; context="$2"; description="$3"
            payload="{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-delay 2 --retry-max-time 30 --retry-all-errors \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/statuses/${EXPECTED_SHA}" \
              -d "$payload"
          }

          publish "$prod_state" "production/seiltanzer" \
            "Atomic exact-SHA delivery, readiness and functional acceptance"
          publish "$readiness_state" "g1e/storage-intelligence" \
            "Durability and bounded Intelligence readiness"
          publish "$readiness_state" "g1m/management-edge" \
            "Terminal Management Edge readiness"
          publish "$readiness_state" "g1s/short-horizon" \
            "Fast short-horizon evidence and Q maturity readiness"
          publish "$readiness_state" "g1m/local-feedback" \
            "Local management feedback readiness"
          publish "$smoke_state" "production/functional-smoke" \
            "Bounded analytics, AI Verdict, official macro and public endpoint smoke"

          echo "EXPECTED_SHA=$EXPECTED_SHA acceptance_run_id=$ACCEPTANCE_RUN_ID delivery=$DELIVERY readiness=$READINESS smoke=$SMOKE public=$PUBLIC orchestration=$ORCHESTRATION"
          test "$prod_state" = "success"
