name: deploy

# GitHub-hosted orchestration keeps delivery independent from the GitHub runner
# process installed on the production VPS. Application secrets stay on the VPS;
# this workflow only updates the exact code SHA, installs it and restarts service.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-seiltanzer
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Wait for exact-SHA GitHub CI
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          verdict=""
          for attempt in $(seq 1 90); do
            body=$(curl -fsS --max-time 5 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${EXPECTED_SHA}/status")
            verdict=$(BODY="$body" python3 - <<'PY'
          import json, os
          body=json.loads(os.environ['BODY'])
          states={str(x.get('context')):str(x.get('state')) for x in body.get('statuses',[])}
          print(states.get('ci/full-webkit','pending'))
          PY
            )
            echo "ci/full-webkit attempt=$attempt state=$verdict"
            if [ "$verdict" = "success" ]; then break; fi
            if [ "$verdict" = "failure" ] || [ "$verdict" = "error" ]; then
              echo "::error::Exact-SHA CI failed; refusing production delivery"
              exit 1
            fi
            sleep 2
          done
          test "$verdict" = "success"

      - name: Deliver exact SHA over SSH
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 10m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            git config --global --add safe.directory /opt/seiltanzer || true
            cd /opt/seiltanzer

            # EDE v1.3.13 moves all CPU-heavy EDE work off production. Stop any
            # legacy transient audit unit started by an older workflow before
            # installing the new SHA, so an in-flight pre-offload run cannot keep
            # consuming VPS resources after this deployment.
            while read -r unit _; do
              [ -n "$unit" ] || continue
              case "$unit" in
                seiltanzer-ede-*.service)
                  echo "Stopping legacy production EDE unit: $unit"
                  timeout 8s systemctl stop "$unit" >/dev/null 2>&1 || true
                  systemctl kill --kill-who=all --signal=KILL "$unit" >/dev/null 2>&1 || true
                  systemctl reset-failed "$unit" >/dev/null 2>&1 || true
                  ;;
              esac
            done < <(systemctl list-units --all --type=service --no-legend 'seiltanzer-ede-*' || true)

            # Backstop for a legacy controller whose transient unit metadata was
            # already collected while its child still exists. Bracket the first
            # character so pkill cannot match this SSH shell's own script text.
            pkill -f '/opt/seiltanzer/scripts/[p]roduction_ede_v13_audit.py' >/dev/null 2>&1 || true
            pkill -f '/opt/seiltanzer/scripts/[p]roduction_ede_transition_audit.py' >/dev/null 2>&1 || true

            git fetch origin main
            git cat-file -e "${EXPECTED_SHA}^{commit}"
            git reset --hard "$EXPECTED_SHA"

            SITE=$(/opt/seiltanzer/.venv/bin/python - <<'PY'
            import site
            print(site.getsitepackages()[0])
            PY
            )
            PYTHONPATH=/opt/seiltanzer /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/g1e1_cleanup_venv.py --site-packages "$SITE" --apply || true
            /opt/seiltanzer/.venv/bin/pip install --quiet -e /opt/seiltanzer
            systemctl restart seiltanzer

            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            test "$(systemctl is-active seiltanzer)" = "active"
            if systemctl list-units --all --type=service --no-legend 'seiltanzer-ede-*' | grep -q 'running'; then
              echo "::error::Legacy production EDE unit survived deployment"
              exit 1
            fi
            echo "Delivered exact production SHA: $EXPECTED_SHA"
