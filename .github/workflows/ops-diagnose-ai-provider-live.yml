name: ops-diagnose-ai-provider-live

on:
  push:
    branches:
      - ops/diagnose-ai-provider-live-20260821
    paths:
      - .github/workflows/ops-diagnose-ai-provider-live.yml

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Read-only live AI provider diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 6m
          script: |
            set -euo pipefail
            EXPECTED_SHA=3edd97c48fc9f1b63c80f2dcf4349d9b1ad9d636
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            test "$(systemctl is-active seiltanzer)" = active
            echo '=== RECENT AI VERDICT EVENTS BEFORE PROBE ==='
            journalctl -u seiltanzer --since '-90 minutes' --no-pager \
              | grep 'ai_verdict_event' | tail -n 40 || true
            echo '=== PROVIDER CONFIG (NON-SECRET) ==='
            PID=$(systemctl show -p MainPID --value seiltanzer)
            python3 - "$PID" <<'PY'
            import os, sys
            pid = sys.argv[1]
            raw = open(f'/proc/{pid}/environ','rb').read().split(b'\0')
            env = {}
            for item in raw:
                if b'=' in item:
                    k,v=item.split(b'=',1)
                    env[k.decode(errors='ignore')] = v.decode(errors='ignore')
            for key in ('AI_PROVIDER_TIMEOUT_SEC','AI_PROVIDER_CIRCUIT_SEC','OPENROUTER_MODEL','OPENROUTER_BASE_URL'):
                print(f'{key}={env.get(key,"<unset>")}')
            print('OPENROUTER_API_KEY_PRESENT=' + str(bool(env.get('OPENROUTER_API_KEY'))).lower())
            PY
            echo '=== ONE REAL PUBLIC AI PROBE ==='
            python3 - <<'PY'
            import json, time, urllib.request
            url='http://127.0.0.1:8790/api/ai/verdict'
            started=time.monotonic()
            with urllib.request.urlopen(url, timeout=15.0) as r:
                body=json.loads(r.read().decode('utf-8'))
            elapsed=(time.monotonic()-started)*1000
            result=body.get('result') if isinstance(body.get('result'),dict) else body
            print(json.dumps({
                'http': 200,
                'elapsed_ms': round(elapsed,1),
                'request_id': body.get('request_id') or result.get('request_id'),
                'model': result.get('model'),
                'provider': result.get('provider'),
                'result_mode': body.get('result_mode') or result.get('result_mode'),
                'error_kind': body.get('error_kind') or result.get('error_kind'),
                'verdict_prefix': str(result.get('verdict') or '')[:80],
            }, ensure_ascii=False, sort_keys=True))
            PY
            sleep 1
            echo '=== RECENT AI VERDICT EVENTS AFTER PROBE ==='
            journalctl -u seiltanzer --since '-5 minutes' --no-pager \
              | grep 'ai_verdict_event' | tail -n 12 || true
