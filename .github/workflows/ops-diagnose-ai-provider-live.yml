name: ops-diagnose-ai-provider-live

on:
  push:
    branches:
      - ops/diagnose-ai-provider-live-20260821
    paths:
      - .github/workflows/ops-diagnose-ai-provider-live.yml

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - name: Measure read-only G1S operational snapshot queries
        id: measure
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 4m
          script: |
            set -euo pipefail
            test "$(systemctl is-active seiltanzer)" = active
            /opt/seiltanzer/.venv/bin/python - <<'PY'
            import json, sqlite3, time
            db='file:/opt/seiltanzer/data/trades.db?mode=ro'
            conn=sqlite3.connect(db, uri=True, timeout=2.0)
            conn.row_factory=sqlite3.Row
            conn.execute('PRAGMA query_only=ON')
            queries={
              'cuts500': ('''SELECT c.*,l.model_id FROM g1s_training_cuts c LEFT JOIN g1s_model_cut_links l USING(cut_id) ORDER BY c.created_ts DESC LIMIT ?''',500),
              'barriers5000': ('''SELECT b.*,g.instrument,g.horizon_minutes,g.captured_ts,g.origin FROM g1s_barrier_outcomes b JOIN g1s_observations g USING(observation_id) ORDER BY g.captured_ts DESC,b.barrier_atr_multiple LIMIT ?''',5000),
              'path_metrics5000': ('''SELECT m.*,g.instrument,g.captured_ts,g.target_ts,g.origin FROM g1s_path_metrics m JOIN g1s_observations g USING(observation_id) ORDER BY g.captured_ts DESC LIMIT ?''',5000),
            }
            for name,(sql,limit) in queries.items():
                started=time.monotonic(); rows=conn.execute(sql,(limit,)).fetchall(); elapsed=(time.monotonic()-started)*1000
                encoded=len(json.dumps([dict(r) for r in rows],ensure_ascii=False,default=str).encode())
                print(f'{name}: rows={len(rows)} query_ms={elapsed:.1f} json_bytes={encoded}')
                assert elapsed < 5000, (name,elapsed)
            conn.close()
            PY
      - name: Publish measurement status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.measure.outcome }}
        run: |
          if [ "$OUTCOME" = success ]; then state=success; desc='G1S operational max-limit prewarm queries are bounded'; else state=failure; desc='G1S operational prewarm query measurement failed'; fi
          payload=$(python3 - "$state" "$desc" <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'diagnostic/g1s-prewarm','description':sys.argv[2]}))
          PY
          )
          curl -fsS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "$payload" >/dev/null
