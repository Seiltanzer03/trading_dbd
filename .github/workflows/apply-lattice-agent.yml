name: Apply lattice agent patch
on:
  push:
    branches:
      - agent/lattice-adaptive-window-v21
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lattice-adaptive-window-v21
      - name: Install adaptive lattice files
        shell: bash
        run: |
          cat > /tmp/lattice.b64 <<'EOF'

EOF
          cat > /tmp/lattice_test.b64 <<'EOF'

EOF
          base64 -d /tmp/lattice.b64 | gzip -d > seiltanzer/web/js/lattice.js
          base64 -d /tmp/lattice_test.b64 | gzip -d > tests/web/lattice_scale_smoke.mjs
          rm .github/workflows/apply-lattice-agent.yml
      - name: Validate
        run: |
          node --check seiltanzer/web/js/lattice.js
          node tests/web/lattice_scale_smoke.mjs
          pytest -q
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add seiltanzer/web/js/lattice.js tests/web/lattice_scale_smoke.mjs .github/workflows/apply-lattice-agent.yml
          git commit -m "fix(lattice): persist adaptive trade window"
          git push origin HEAD:agent/lattice-adaptive-window-v21
