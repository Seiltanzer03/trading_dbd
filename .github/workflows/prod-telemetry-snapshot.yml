name: prod-telemetry-snapshot

on:
  push:
    branches:
      - agent/prod-telemetry-snapshot-20260812

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: [self-hosted, linux, x64, seiltanzer-prod]
    timeout-minutes: 5
    steps:
      - name: Read-only production telemetry
        run: |
          set -u
          git config --global --add safe.directory /opt/seiltanzer || true
          echo "SERVER_SHA=$(git -C /opt/seiltanzer rev-parse HEAD)"
          echo "SERVICE=$(systemctl is-active seiltanzer 2>/dev/null || true)"

          for endpoint in \
            /api/research/g1/intelligence/status \
            /api/research/g1/management/status \
            /api/research/g1/management/edge \
            /api/research/g1/calibrators/status; do
            echo "=== $endpoint ==="
            start=$(date +%s%3N)
            body=$(curl -sS --max-time 30 "http://127.0.0.1:8790${endpoint}" 2>&1)
            rc=$?
            end=$(date +%s%3N)
            echo "rc=$rc elapsed_ms=$((end-start))"
            echo "$body"
          done

          echo "=== SQLITE COUNTS ==="
          DB=$(find /opt/seiltanzer -maxdepth 3 -type f -name trades.db -print -quit)
          echo "db=$DB"
          if [ -n "$DB" ]; then
            DB="$DB" /opt/seiltanzer/.venv/bin/python - <<'PY'
          import os, sqlite3, json
          db=os.environ['DB']
          conn=sqlite3.connect(f'file:{db}?mode=ro', uri=True, timeout=5)
          names=[r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")]
          wanted=[]
          for n in names:
              if (n.startswith('g1') or n.startswith('passive') or n.startswith('decision_')
                  or n.startswith('management_') or n in {'position_management_events','trades'}):
                  wanted.append(n)
          counts={}
          for n in wanted:
              try:
                  counts[n]=conn.execute(f'SELECT COUNT(*) FROM "{n}"').fetchone()[0]
              except Exception as e:
                  counts[n]=f'ERROR:{e}'
          print(json.dumps(counts, sort_keys=True))
          for n in wanted:
              if 'q_capture' in n or n in {'g1m_management_observations','g1m_resolutions','g1c_shadow_models','g1c_shadow_predictions'}:
                  cols=[r[1] for r in conn.execute(f'PRAGMA table_info("{n}")')]
                  print('SCHEMA', n, json.dumps(cols))
          conn.close()
          PY
          fi
