name: production-active-edge

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
      acceptance_run_id:
        required: true
        type: string
  schedule:
    - cron: "37 */6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: production-active-edge-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      expected_sha: ${{ steps.contract.outputs.expected_sha }}
      acceptance_run_id: ${{ steps.contract.outputs.acceptance_run_id }}
    steps:
      - name: Resolve explicit dispatch or scheduled contract
        id: contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.expected_sha }}
          DISPATCH_ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          SCHEDULE_SHA: ${{ github.sha }}
          SCHEDULE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test -n "$DISPATCH_SHA"
            case "$DISPATCH_ACCEPTANCE_RUN_ID" in
              ''|*[!0-9]*) echo "invalid acceptance_run_id" >&2; exit 1 ;;
            esac
            echo "expected_sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
            echo "acceptance_run_id=$DISPATCH_ACCEPTANCE_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            test "$EVENT_NAME" = "schedule"
            echo "expected_sha=$SCHEDULE_SHA" >> "$GITHUB_OUTPUT"
            echo "acceptance_run_id=$SCHEDULE_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

  structured:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        horizon: [15, 30, 60, 120, 240]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.expected_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install off-host research runtime
        run: |
          pip install -e ".[dev]"
          pip install paramiko
      - name: Run active structured search
        env:
          HORIZON: ${{ matrix.horizon }}
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          NUMEXPR_NUM_THREADS: "2"
        run: |
          python scripts/run_universal_structured_edge_audit.py \
            --horizons "$HORIZON" \
            --output "active_structured_${HORIZON}m_latest.json"
      - name: Publish compact report to exact production SHA
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
          HORIZON: ${{ matrix.horizon }}
          RUN_ID: ${{ github.run_id }}-${{ matrix.horizon }}
        run: |
          python scripts/publish_active_edge_report.py \
            --password "$SSH_PASSWORD" \
            --expected-sha "$EXPECTED_SHA" \
            --input "active_structured_${HORIZON}m_latest.json" \
            --remote-name "active_structured_${HORIZON}m_latest.json" \
            --run-id "$RUN_ID"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: active-structured-${{ matrix.horizon }}m-${{ needs.resolve.outputs.expected_sha }}
          path: active_structured_${{ matrix.horizon }}m_latest.json
          if-no-files-found: ignore
          retention-days: 30

  ml:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.expected_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install off-host ML research runtime
        run: |
          pip install -e ".[dev,research]"
          pip install paramiko
      - name: Run active ML challenger
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          NUMEXPR_NUM_THREADS: "2"
        run: |
          python scripts/run_ml_challenger_audit.py --output active_ml_latest.json
      - name: Publish compact report to exact production SHA
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
          RUN_ID: ${{ github.run_id }}-ml
        run: |
          python scripts/publish_active_edge_report.py \
            --password "$SSH_PASSWORD" \
            --expected-sha "$EXPECTED_SHA" \
            --input active_ml_latest.json \
            --remote-name active_ml_latest.json \
            --run-id "$RUN_ID"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: active-ml-${{ needs.resolve.outputs.expected_sha }}
          path: active_ml_latest.json
          if-no-files-found: ignore
          retention-days: 30
