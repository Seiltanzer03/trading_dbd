name: production-active-edge

on:
  workflow_run:
    workflows: ["production-functional-smoke"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "37 21 * * 1-5"

permissions:
  contents: read

concurrency:
  group: production-active-edge
  cancel-in-progress: true

jobs:
  structured:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        horizon: [15, 30, 60, 120, 240]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install off-host research runtime
        run: |
          pip install -e ".[dev]"
          pip install paramiko
      - name: Run active structured search
        env:
          HORIZON: ${{ matrix.horizon }}
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          NUMEXPR_NUM_THREADS: "2"
        run: |
          python scripts/run_universal_structured_edge_audit.py \
            --horizons "$HORIZON" \
            --output "active_structured_${HORIZON}m_latest.json"
      - name: Publish compact report to exact production SHA
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          HORIZON: ${{ matrix.horizon }}
          RUN_ID: ${{ github.run_id }}-${{ matrix.horizon }}
        run: |
          python scripts/publish_active_edge_report.py \
            --password "$SSH_PASSWORD" \
            --expected-sha "$EXPECTED_SHA" \
            --input "active_structured_${HORIZON}m_latest.json" \
            --remote-name "active_structured_${HORIZON}m_latest.json" \
            --run-id "$RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: active-structured-${{ matrix.horizon }}m-${{ github.sha }}
          path: active_structured_${{ matrix.horizon }}m_latest.json
          retention-days: 30

  ml:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install off-host ML research runtime
        run: |
          pip install -e ".[dev,research]"
          pip install paramiko
      - name: Run active ML challenger
        env:
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          NUMEXPR_NUM_THREADS: "2"
        run: |
          python scripts/run_ml_challenger_audit.py --output active_ml_latest.json
      - name: Publish compact report to exact production SHA
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_ID: ${{ github.run_id }}-ml
        run: |
          python scripts/publish_active_edge_report.py \
            --password "$SSH_PASSWORD" \
            --expected-sha "$EXPECTED_SHA" \
            --input active_ml_latest.json \
            --remote-name active_ml_latest.json \
            --run-id "$RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: active-ml-${{ github.sha }}
          path: active_ml_latest.json
          retention-days: 30
