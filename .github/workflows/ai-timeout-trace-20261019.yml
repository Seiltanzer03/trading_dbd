name: read-only-ai-timeout-trace
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-timeout-trace-20261019.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Read bounded structural trace for the reported timeout only
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 1m
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = bcb22bb5acbc33ecd3965cae620be693d9c172ba
            PYTHONDONTWRITEBYTECODE=1 /opt/seiltanzer/.venv/bin/python - <<'PY'
            import json,math,subprocess
            request='ai-dae0775f784d45eda2ba'
            stages={'runtime_guard','preflight','route','cached_snapshot','position_finalization',
                'family_bundle','runtime_context','macro_context','reaction_capture','regime_management',
                'review_identity','provider','ensemble','publication','response','snapshot_error',
                'provider_fallback','internal_error','stale_decision','journal_error'}
            events={'start','end','error','submitted','worker_start','worker_end','finish'}
            result=subprocess.run(['journalctl','-u','seiltanzer','--since','2026-10-19 12:10:00 UTC',
                '--until','2026-10-19 12:16:00 UTC','--grep='+request,'--no-pager','-o','cat','-n','300'],
                capture_output=True,timeout=15,check=False)
            rows=[]
            if result.returncode==0 and len(result.stdout)<=2*1024**2:
                for line in result.stdout.splitlines():
                    if len(line)>8192:continue
                    try:value=json.loads(line[line.index(b'{'):])
                    except (ValueError,TypeError):continue
                    if (not isinstance(value,dict) or value.get('request_id')!=request
                            or value.get('stage') not in stages or value.get('event') not in events):continue
                    row={key:value[key] for key in ('stage','event')}
                    for key in ('duration_ms','elapsed_ms','status_code'):
                        number=value.get(key)
                        if type(number) in (int,float) and math.isfinite(number) and 0<=number<=1e9:
                            row[key]=number
                    rows.append(row)
            print(json.dumps(dict(contract='readonly-ai-timeout-trace-v1',request_id=request,
                journal_read_ok=result.returncode==0,bounded=len(result.stdout)<=2*1024**2,
                database_opened=False,llm_called=False,production_mutation=False,rows=rows),sort_keys=True))
            PY
