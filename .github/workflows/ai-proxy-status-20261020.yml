name: read-only-ai-proxy-status-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-proxy-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Locate existing proxy listener without disclosing its credentials
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 1m
          script: |
            set -euo pipefail
            PYTHONDONTWRITEBYTECODE=1 /opt/seiltanzer/.venv/bin/python -u - <<'PY'
            import ipaddress,json,re,subprocess,urllib.parse,time,signal
            signal.signal(signal.SIGALRM,lambda *_: (_ for _ in ()).throw(SystemExit('PROBE_ABSOLUTE_DEADLINE')))
            signal.alarm(35)
            print('PROBE_PHASE=python_started',flush=True)
            from pathlib import Path
            pid=int(subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','--value'],timeout=5))
            print('PROBE_PHASE=service_pid_read',flush=True)
            if pid<=0:raise SystemExit('NO_ACTIVE_PROCESS_ENVIRONMENT')
            values=dict(x.decode(errors='replace').split('=',1) for x in Path(f'/proc/{pid}/environ').read_bytes().split(b'\0') if b'=' in x)
            url=urllib.parse.urlsplit(values.get('OPENROUTER_PROXY',''))
            host=url.hostname or ''
            try:loopback=ipaddress.ip_address(host).is_loopback
            except ValueError:loopback=host.lower()=='localhost'
            print(json.dumps({'proxy_loopback':loopback,'proxy_port':url.port,'proxy_protocol':url.scheme if url.scheme in {'http','https','socks5','socks5h'} else 'unknown','credentials_present':bool(url.username or url.password),'generation_calls':0,'production_mutation':False}))
            units=subprocess.check_output(['systemctl','list-units','--all','--type=service','--no-legend','--plain'],text=True,timeout=5)
            for line in units.splitlines():
                fields=line.split()
                if fields and re.search(r'tor@|^tor\.|squid|privoxy|proxy|xray|sing-box|v2ray|chisel|tunnel',fields[0],re.I):
                    print(json.dumps({'proxy_related_unit':fields[0],'load':fields[1],'active':fields[2],'sub':fields[3]}))
            processes=subprocess.check_output(['ps','-eo','pid,comm'],text=True,timeout=5)
            for line in processes.splitlines():
                if re.search(r'\b(tor|privoxy|squid|xray|sing-box|v2ray|chisel)\b',line):print(line)
            listeners=subprocess.check_output(['ss','-ltnpH'],text=True,timeout=5)
            tor_socks_present=any('127.0.0.1:9050' in line and re.search(r'\("tor",pid=[0-9]+,',line) for line in listeners.splitlines())
            print(json.dumps({'existing_tor_loopback_socks_listener':tor_socks_present}))
            journal=subprocess.check_output(['journalctl','-b','-u','tor@default.service','-n','200','--no-pager','-o','short-iso'],timeout=5,text=True)
            last_bootstrap=None
            for line in journal.splitlines():
                match=re.search(r'Bootstrapped ([0-9]{1,3})% \(([A-Za-z0-9_]+)\)',line)
                if match:
                    last_bootstrap=int(match[1])
                    print(json.dumps({'tor_bootstrap_percent':last_bootstrap,'stage':match[2],'timestamp':line.split()[0]}))
            phases=subprocess.check_output(['journalctl','-b','-u','seiltanzer',f'_PID={pid}','--grep=^STARTUP_PHASE phase=','-n','4','--no-pager','-o','cat'],timeout=5,text=True)
            for line in phases.splitlines():
                if re.fullmatch(r'STARTUP_PHASE phase=[a-z_.]+ elapsed_sec=[0-9.]+',line):print(line)
            print(json.dumps({'network_probe_repeated':False,'generation_calls':0,'production_mutation':False}))
            if tor_socks_present and last_bootstrap==100:
                import httpx
                key=values.get('OPENROUTER_API_KEY','').strip()
                if not key:raise SystemExit('PROVIDER_KEY_NOT_IN_PROCESS_ENVIRONMENT')
                signal.alarm(15)
                started=time.monotonic();probe={'route':'bootstrapped_existing_tor','generation_calls':0,'production_mutation':False}
                print('PROBE_PHASE=ready_tor_auth_get',flush=True)
                try:
                    with httpx.Client(proxy='socks5://127.0.0.1:9050',timeout=8,trust_env=False) as client:
                        response=client.get('https://openrouter.ai/api/v1/auth/key',headers={'Authorization':'Bearer '+key})
                        probe['http_status']=response.status_code
                        probe['response_bytes']=len(response.content)
                except httpx.HTTPError as exc:probe['error_class']=type(exc).__name__
                probe['elapsed_ms']=round((time.monotonic()-started)*1000,1)
                print(json.dumps(probe,sort_keys=True))
            PY
