name: capacity-bootstrap-git-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/capacity-bootstrap-git-20261020.yml]
permissions:
  contents: read
  statuses: read
concurrency:
  group: production-seiltanzer
  queue: max
  cancel-in-progress: false
jobs:
  compact:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Require already-green target before restoring deploy headroom
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1)" = 54a33626f2fc6ece9f75b06528cc5997e02ab345
          curl -fsS --max-time 10 -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/commits/54a33626f2fc6ece9f75b06528cc5997e02ab345/status \
            | python3 -c 'import json,sys; latest={}; [latest.setdefault(r["context"],r["state"]) for r in json.load(sys.stdin)["statuses"]]; assert latest.get("ci/full-webkit")=="success"'
      - name: Rebuild only canonical Git metadata with the existing verified helper
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 9m
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = bcb22bb5acbc33ecd3965cae620be693d9c172ba
            if [ -e /opt/seiltanzer/data/cutover.active ] || [ -L /opt/seiltanzer/data/cutover.active ]; then exit 1; fi
            /usr/bin/python3 /usr/local/lib/seiltanzer-history-start-guard.py --database /opt/seiltanzer/data/trades.db --application-root /opt/seiltanzer
            git -C /opt/seiltanzer diff --exit-code --quiet -- scripts/compact_deployment_git.py
            /usr/bin/python3 /opt/seiltanzer/scripts/compact_deployment_git.py --repo /opt/seiltanzer --expected-sha bcb22bb5acbc33ecd3965cae620be693d9c172ba --apply
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = bcb22bb5acbc33ecd3965cae620be693d9c172ba
            systemctl is-active --quiet seiltanzer
            df -B1 /
            code=$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8790/api/state)
            echo "HTTP=$code"
