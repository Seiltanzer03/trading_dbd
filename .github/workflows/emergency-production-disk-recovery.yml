name: emergency-production-disk-recovery

on:
  push:
    branches: [main]
    paths: [.github/workflows/emergency-production-disk-recovery.yml]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Recover production disk over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 12m
          script: |
            set -euo pipefail
            echo "DISK_BEFORE"
            df -h /
            du -sh /opt/seiltanzer/data/backups/local 2>/dev/null || true

            journalctl --vacuum-size=500M
            if [ -d /root/.cache/pip ]; then
              find /root/.cache/pip -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            fi
            apt-get clean
            if [ -d /opt/actions-runner/_work/_update ]; then
              find /opt/actions-runner/_work/_update -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            fi

            # EDE production audits create immutable SQLite working copies in /tmp.
            # They are research scratch files, not authoritative state. Keep anything
            # recent or currently open and remove only snapshots older than six hours.
            ede_removed=0
            ede_bytes=0
            while IFS= read -r -d '' candidate; do
              if lsof -- "$candidate" >/dev/null 2>&1; then
                echo "KEEP_OPEN_EDE_FILE=$candidate"
                continue
              fi
              size=$(stat -c '%s' "$candidate" 2>/dev/null || echo 0)
              rm -f -- "$candidate"
              ede_removed=$((ede_removed + 1))
              ede_bytes=$((ede_bytes + size))
            done < <(find /tmp -maxdepth 1 -type f \
              \( -name 'seiltanzer-ede-source-*.sqlite3' \
                 -o -name 'seiltanzer-ede-source-*.sqlite3-wal' \
                 -o -name 'seiltanzer-ede-source-*.sqlite3-shm' \) \
              -mmin +360 -print0 2>/dev/null)

            ede_dirs_removed=0
            while IFS= read -r -d '' candidate; do
              if lsof +D "$candidate" 2>/dev/null | tail -n +2 | grep -q .; then
                echo "KEEP_OPEN_EDE_DIR=$candidate"
                continue
              fi
              size=$(du -sb "$candidate" 2>/dev/null | awk '{print $1}')
              size=${size:-0}
              rm -rf -- "$candidate"
              ede_dirs_removed=$((ede_dirs_removed + 1))
              ede_bytes=$((ede_bytes + size))
            done < <(find /tmp -mindepth 1 -maxdepth 1 -type d \
              -name 'ede-v*-production-*' -mmin +360 -print0 2>/dev/null)

            echo "STALE_EDE_FILES_REMOVED=$ede_removed"
            echo "STALE_EDE_DIRS_REMOVED=$ede_dirs_removed"
            echo "STALE_EDE_BYTES_REMOVED=$ede_bytes"
            echo "DISK_AFTER_SYSTEM_CLEAN"
            df -h /

            # The previous workflow checked for 1 GiB here and therefore could
            # never reach its safest large-space recovery on a truly full disk.
            # Stop the terminal briefly, verify the newest local backup pair by
            # SHA256, keep eight newest verified pairs, and remove only older
            # verified pairs plus stale incomplete backup temps. The authoritative
            # trades.db is outside the backup root and can never be unlinked here.
            systemctl stop seiltanzer
            restart_needed=1
            trap 'if [ "${restart_needed:-0}" = 1 ]; then systemctl start seiltanzer || true; fi' EXIT

            /usr/bin/python3 - <<'PY'
            import hashlib, json, time
            from pathlib import Path

            root = Path("/opt/seiltanzer/data/backups/local").resolve()
            authoritative = Path("/opt/seiltanzer/data/trades.db").resolve()
            verified = []

            def confined(path: Path) -> bool:
                try:
                    path.resolve().relative_to(root)
                    return True
                except ValueError:
                    return False

            for manifest in root.glob("*.manifest.json"):
                try:
                    data = json.loads(manifest.read_text(encoding="utf-8"))
                except Exception:
                    continue
                if data.get("verified") is not True:
                    continue
                raw = data.get("database_file")
                if not raw:
                    continue
                database = Path(raw)
                if not database.is_absolute():
                    database = root / database
                database = database.resolve()
                if database == authoritative or not confined(database) or not database.is_file():
                    continue
                stamp = data.get("created_at") or data.get("timestamp") or manifest.stat().st_mtime
                verified.append((str(stamp), manifest.resolve(), database, data))

            if not verified:
                raise SystemExit("STOP: no verified backup pair found")
            verified.sort(key=lambda row: (row[0], row[1].stat().st_mtime), reverse=True)
            _, newest_manifest, newest_database, newest_data = verified[0]
            expected = str(newest_data.get("database_sha256") or "").lower()
            if len(expected) != 64:
                raise SystemExit("STOP: newest verified manifest has no valid database_sha256")
            digest = hashlib.sha256()
            with newest_database.open("rb") as handle:
                for chunk in iter(lambda: handle.read(8 * 1024 * 1024), b""):
                    digest.update(chunk)
            actual = digest.hexdigest()
            print(f"NEWEST_BACKUP={newest_database.name}")
            print(f"NEWEST_SHA_MATCH={actual == expected}")
            if actual != expected:
                raise SystemExit("STOP: newest verified backup SHA256 mismatch")

            keep = verified[:8]
            remove = verified[8:]
            keep_paths = {p for row in keep for p in (row[1], row[2])}
            removed_pairs = 0
            removed_bytes = 0
            for _, manifest, database, _ in remove:
                if manifest in keep_paths or database in keep_paths:
                    continue
                try:
                    removed_bytes += database.stat().st_size
                except OSError:
                    pass
                try:
                    removed_bytes += manifest.stat().st_size
                except OSError:
                    pass
                database.unlink(missing_ok=True)
                manifest.unlink(missing_ok=True)
                removed_pairs += 1

            # Incomplete backup files are never research evidence. Be conservative:
            # retain anything newer than 30 minutes in case a separate backup job is
            # still finalizing it while this recovery started.
            removed_tmp = 0
            cutoff = time.time() - 30 * 60
            for tmp in root.glob(".*.tmp.sqlite3"):
                if tmp.is_file() and confined(tmp) and tmp.stat().st_mtime < cutoff:
                    try:
                        removed_bytes += tmp.stat().st_size
                    except OSError:
                        pass
                    tmp.unlink()
                    removed_tmp += 1
            print(f"VERIFIED_PAIRS_TOTAL={len(verified)}")
            print(f"VERIFIED_PAIRS_KEPT={len(keep)}")
            print(f"VERIFIED_PAIRS_REMOVED={removed_pairs}")
            print(f"STALE_TMP_REMOVED={removed_tmp}")
            print(f"BACKUP_BYTES_REMOVED={removed_bytes}")
            PY

            systemctl start seiltanzer
            restart_needed=0
            test "$(systemctl is-active seiltanzer)" = active

            db_check=$(/usr/bin/python3 - <<'PY'
            import sqlite3
            con=sqlite3.connect("file:/opt/seiltanzer/data/trades.db?mode=ro", uri=True)
            try:
                print(con.execute("PRAGMA quick_check").fetchone()[0])
            finally:
                con.close()
            PY
            )
            echo "DB_QUICK_CHECK=$db_check"
            test "$db_check" = ok

            echo "DISK_AFTER_VERIFIED_BACKUP_PRUNE"
            df -h /
            du -sh /opt/seiltanzer/data/backups/local 2>/dev/null || true
            avail_kb=$(df -Pk / | awk 'NR==2 {print $4}')
            if [ "$avail_kb" -lt 1048576 ]; then
              echo "Less than 1 GiB available after safe system + verified-backup cleanup"
              echo "TOP_LEVEL_DISK_DIAGNOSTICS"
              du -xhd1 /opt 2>/dev/null | sort -h | tail -n 30 || true
              du -xhd1 /var 2>/dev/null | sort -h | tail -n 30 || true
              du -xhd1 /root 2>/dev/null | sort -h | tail -n 30 || true
              exit 20
            fi

            echo "DISK_AFTER"
            df -h /
            systemctl is-active seiltanzer

      - name: Publish recovery status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description="Disk recovered; backup SHA, DB integrity and service verified"
          else
            state=failure
            description="Emergency disk recovery failed safely"
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"ops/disk-recovery\",\"description\":\"$description\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"