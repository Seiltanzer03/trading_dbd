name: patch-deploy-diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/deploy-nonfatal-feed-diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Make external quote diagnostics non-fatal
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          text = path.read_text()
          swiss = "            /opt/seiltanzer/.venv/bin/python -c 'from seiltanzer.data.feeds import _fetch_swissquote_quote as q; x=q(\"XAU/USD\"); print(\"xau spot:\", round(x[\"value\"], 3))'\n"
          broker = "              /opt/seiltanzer/.venv/bin/python -c 'from seiltanzer.data.feeds import _fetch_tradingview_quote as q; ss=(\"OANDA:NAS100USD\",\"OANDA:SPX500USD\",\"OANDA:US30USD\",\"OANDA:UK100GBP\",\"OANDA:JP225YJPY\",\"FPMARKETS:GER40\"); print(\"broker quotes:\", {s:q(s)[\"value\"] for s in ss})'\n"
          assert swiss in text
          assert broker in text
          text = text.replace(
              swiss,
              swiss.rstrip('\n') + ' || echo "xau spot: diagnostic unavailable (non-fatal)"\n',
          )
          text = text.replace(
              broker,
              broker.rstrip('\n') + ' || echo "broker quotes: diagnostic unavailable (non-fatal)"\n',
          )
          path.write_text(text)
          Path('.github/workflows/patch-deploy-diagnostics.yml').unlink()
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/workflows/deploy.yml .github/workflows/patch-deploy-diagnostics.yml
          git commit -m "fix(deploy): keep external quote diagnostics nonfatal"
          git push origin HEAD:${{ github.head_ref }}
