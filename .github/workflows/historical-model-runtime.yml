name: historical-model-runtime
on:
  push:
    branches: [ops/historical-model-runtime-20261025]
    paths: [.github/workflows/historical-model-runtime.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install paramiko
      - name: Observe exact-SHA installed model loader without fitting or database reads
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python -u - <<'PYCODE'
          import os,paramiko,shlex
          remote="import json,time,subprocess,urllib.request,shutil\nexpected='2f6578f39e2433ace8ea71550023a537508f1a43'\nactual=subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True).strip()\nassert actual==expected,(actual,expected)\nservice=subprocess.check_output(['systemctl','show','seiltanzer','--property=ActiveState,MainPID,NRestarts'],text=True).strip()\nprint('EXACT_MODEL_RUNTIME='+json.dumps(dict(expected_sha=expected,actual_sha=actual,service=service,observed_ts=time.time(),free_bytes=shutil.disk_usage('/opt/seiltanzer').free)))\nfor path,limit in (('/api/state',2000000),('/api/research/runtime/worker-status',500000),('/api/research/mathematical-edge',2000000)):\n    started=time.monotonic()\n    with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=6) as response:\n        raw=response.read(limit+1);assert len(raw)<=limit\n        data=json.loads(raw);summary=dict(path=path,http_status=response.status,elapsed_ms=round((time.monotonic()-started)*1000),bytes=len(raw))\n    if path.endswith('mathematical-edge'):\n        summary.update(state=data.get('state'),published_for_sha=data.get('published_for_sha'),models=data.get('family_market_model_summary'))\n        print('MODEL_RUNTIME_MODEL_SOURCE='+json.dumps(summary),flush=True)\n        assert data.get('published_for_sha')==expected\n        assert data.get('state')=='WORKING_MODELS_LOADED'\n        families={}\n        for code,rows in data.get('family_market_models',{}).items():\n            for family,row in rows.items():\n                group=families.setdefault(family,dict(trained=0,supported=0))\n                group['trained']+=row.get('status')=='TRAINED'\n                group['supported']+=any(head.get('working_supported') for head in (row.get('heads') or {}).values())\n        summary['family_counts']=families\n    elif path.endswith('worker-status'):\n        worker=data.get('worker') or {};summary.update(worker={key:worker.get(key) for key in ('current_phase','last_duration_ms','last_error','disk_pause_active','memory_pressure_state')},sqlite_access=data.get('sqlite_access'))\n    print('MODEL_RUNTIME_READ='+json.dumps(summary),flush=True)\n"
          client=paramiko.SSHClient();client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client.connect('94.241.171.182',username='root',password=os.environ['SSH_PASSWORD'],timeout=15,auth_timeout=15,look_for_keys=False,allow_agent=False)
          try:
              _,stdout,stderr=client.exec_command('python3 -c '+shlex.quote(remote),timeout=40)
              print(stdout.read(32000).decode());error=stderr.read(2000).decode()
              if error:print(error)
              status=stdout.channel.recv_exit_status();print('MODEL_RUNTIME_EXIT='+str(status));assert status==0
          finally:client.close()
          PYCODE
