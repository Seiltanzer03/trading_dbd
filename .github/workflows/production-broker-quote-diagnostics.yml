name: production-broker-quote-diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-broker-quote-diagnostics.yml"
  pull_request:
    paths:
      - ".github/workflows/production-broker-quote-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-quote:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Check whether the public OANDA chart supplies a verifiable live tick
        run: |
          python -m pip install --quiet 'websockets>=12'
          python - <<'PY'
          import json, re, secrets, time, urllib.request
          from websockets.sync.client import connect

          symbol = 'OANDA:NAS100USD'
          session = 'qs_' + secrets.token_hex(6)
          def frame(method, params):
              data = json.dumps({'m': method, 'p': params}, separators=(',', ':'))
              return f'~m~{len(data.encode())}~m~{data}'

          try:
              print('ANONYMOUS_OANDA_STAGE=connecting', flush=True)
              with connect('wss://data.tradingview.com/socket.io/websocket',
                           origin='https://data.tradingview.com',
                           open_timeout=8, close_timeout=1) as ws:
                  print('ANONYMOUS_OANDA_STAGE=connected', flush=True)
                  ws.recv(timeout=8)
                  print('ANONYMOUS_OANDA_STAGE=handshake', flush=True)
                  for method, params in (
                      ('set_auth_token', ['unauthorized_user_token']),
                      ('quote_create_session', [session]),
                      ('quote_set_fields', [session, 'lp', 'bid', 'ask',
                                            'lp_time', 'update_mode']),
                      ('quote_add_symbols', [session, symbol]),
                      ('quote_fast_symbols', [session, symbol]),
                  ):
                      ws.send(frame(method, params))
                  deadline = time.monotonic() + 15
                  observed = set()
                  values = {}
                  bid_ask_updates = []
                  while time.monotonic() < deadline:
                      try:
                          raw = ws.recv(timeout=max(0.1, deadline-time.monotonic()))
                      except TimeoutError:
                          break
                      for part in raw.split('~m~'):
                          if not part.startswith('{'):
                              continue
                          try:
                              msg = json.loads(part)
                          except ValueError:
                              continue
                          observed.add(str(msg.get('m')))
                          if msg.get('m') == 'critical_error':
                              print('ANONYMOUS_OANDA_REJECTION=' +
                                    json.dumps(msg.get('p'))[:250])
                          if msg.get('m') != 'qsd':
                              continue
                          item = (msg.get('p') or [None, {}])[1] or {}
                          if item.get('n') != symbol:
                              continue
                          value = item.get('v') or {}
                          if not isinstance(value, dict):
                              continue
                          values.update(value)
                          if 'bid' in value or 'ask' in value:
                              bid_ask_updates.append([round(time.time(), 2),
                                                      values.get('bid'), values.get('ask')])
                  print('ANONYMOUS_OANDA_FIELDS=' + json.dumps({
                      key: values.get(key) for key in
                      ('lp', 'bid', 'ask', 'lp_time', 'update_mode')}))
                  print('ANONYMOUS_OANDA_UPDATE_COUNT=' + str(len(bid_ask_updates)))
                  print('ANONYMOUS_OANDA_DISTINCT_QUOTES=' + str(len({
                      (row[1], row[2]) for row in bid_ask_updates})))
                  stamp = float(values.get('lp_time') or 0)
                  if stamp > 1e11:
                      stamp /= 1000
                  print('ANONYMOUS_OANDA_PROVIDER_TIME_FRESH=' + str(
                      bool(stamp and 0 <= time.time()-stamp <= 30)).lower())
          except Exception as exc:
              print('ANONYMOUS_OANDA_STATUS=' + type(exc).__name__)
              print('ANONYMOUS_OANDA_MESSAGE_TYPES=' + json.dumps(sorted(locals().get('observed', []))))

          try:
              with urllib.request.urlopen(
                  'https://www.oanda.com/bvi-en/cfds/instruments/', timeout=12) as response:
                  body = response.read(2_000_000).decode('utf-8', 'ignore')
              phrase = re.search(r'US Nas 100.{0,200}', body, re.I)
              print('PUBLIC_OANDA_PAGE=' + json.dumps({
                  'bytes': len(body), 'has_nas100': bool(phrase),
                  'excerpt': re.sub(r'<[^>]+>', ' ', phrase.group(0))[:180]
                      if phrase else None,
              }))
          except Exception as exc:
              print('PUBLIC_OANDA_PAGE_ERROR=' + type(exc).__name__)

          try:
              scanner = urllib.request.Request(
                  'https://scanner.tradingview.com/forex/scan',
                  data=json.dumps({
                      'symbols': {'tickers': [symbol]},
                      'columns': ['close', 'bid', 'ask', 'update_mode', 'lp_time'],
                  }).encode(),
                  headers={'Content-Type': 'application/json',
                           'User-Agent': 'Mozilla/5.0'},
              )
              with urllib.request.urlopen(scanner, timeout=10) as response:
                  data = json.load(response)
              print('ANONYMOUS_SCANNER=' + json.dumps(data)[:600])
          except Exception as exc:
              print('ANONYMOUS_SCANNER_STATUS=' + type(exc).__name__)
          PY
  broker-quote:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Probe direct OANDA price without revealing service credentials
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 3m
          script: |
            set -euo pipefail
            SERVICE_PID="$(systemctl show seiltanzer -p MainPID --value)"
            test "$SERVICE_PID" -gt 1
            export SERVICE_PID
            cd /opt/seiltanzer
            PYTHONPATH=/opt/seiltanzer .venv/bin/python - <<'PY'
            import json, os, time, urllib.request
            from seiltanzer.data.feeds import _fetch_tradingview_quote

            entries = open(f'/proc/{os.environ["SERVICE_PID"]}/environ', 'rb').read().split(b'\0')
            token = next((row.partition(b'=')[2] for row in entries
                          if row.startswith(b'TRADINGVIEW_AUTH_TOKEN=')), b'')
            print('BROKER_TOKEN_CONFIGURED=' + str(bool(token)).lower())
            if not token:
                print('DIRECT_OANDA_STATUS=UNAVAILABLE_MISSING_TOKEN')
                raise SystemExit(0)
            os.environ['TRADINGVIEW_AUTH_TOKEN'] = token.decode()
            try:
                quote = _fetch_tradingview_quote('OANDA:NAS100USD', timeout=8.0)
            except Exception as exc:
                print('DIRECT_OANDA_STATUS=UNAVAILABLE_' + type(exc).__name__)
                raise SystemExit(0)
            print('DIRECT_OANDA_QUOTE=' + json.dumps({
                'value': quote['value'], 'provider_ts': quote['ts'],
                'age_sec': round(time.time() - quote['ts'], 2),
                'provider_timestamp_verified': quote['provider_timestamp_verified'],
                'update_mode': quote.get('update_mode'),
            }))
            try:
                with urllib.request.urlopen('http://127.0.0.1:8790/api/market/bybit', timeout=5) as r:
                    bybit = json.load(r)['quote']
                skew = abs(quote['ts'] - bybit['ts'])
                if (bybit.get('symbol') == 'QQQUSDT' and skew <= 15
                        and quote['provider_timestamp_verified']):
                    print('OANDA_BYBIT_PAIRED=' + json.dumps({
                        'broker': quote['value'], 'bybit_perp': bybit['value'],
                        'ratio': round(quote['value'] / bybit['value'], 8),
                        'timestamp_skew_sec': round(skew, 2),
                    }))
                else:
                    print('OANDA_BYBIT_PAIRED=UNAVAILABLE_NOT_SIMULTANEOUS')
            except Exception:
                print('OANDA_BYBIT_PAIRED=UNAVAILABLE_BYBIT_API')
            PY
  vps-public-quote:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Probe anonymous OANDA chart stream from production network
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 90s
          script: |
            cd /opt/seiltanzer
            .venv/bin/python - <<'PY'
            import json, secrets, time
            from websockets.sync.client import connect

            symbol = 'OANDA:NAS100USD'
            session = 'qs_' + secrets.token_hex(6)
            def frame(method, params):
                body = json.dumps({'m': method, 'p': params}, separators=(',', ':'))
                return f'~m~{len(body.encode())}~m~{body}'
            try:
                with connect('wss://data.tradingview.com/socket.io/websocket',
                             origin='https://data.tradingview.com',
                             open_timeout=8, close_timeout=1) as ws:
                    ws.recv(timeout=8)
                    for method, params in (
                        ('set_auth_token', ['unauthorized_user_token']),
                        ('quote_create_session', [session]),
                        ('quote_set_fields', [session, 'lp', 'bid', 'ask',
                                              'lp_time', 'update_mode']),
                        ('quote_add_symbols', [session, symbol]),
                        ('quote_fast_symbols', [session, symbol]),
                    ):
                        ws.send(frame(method, params))
                    fields = {}
                    deadline = time.monotonic() + 12
                    while time.monotonic() < deadline:
                        raw = ws.recv(timeout=max(.1, deadline-time.monotonic()))
                        for part in raw.split('~m~'):
                            if not part.startswith('{'): continue
                            try: msg = json.loads(part)
                            except ValueError: continue
                            if msg.get('m') != 'qsd': continue
                            item = (msg.get('p') or [None, {}])[1] or {}
                            if item.get('n') != symbol: continue
                            fields.update(item.get('v') or {})
                            if all(k in fields for k in ('lp', 'bid', 'ask', 'lp_time')):
                                ts = float(fields['lp_time'])
                                if ts > 1e11: ts /= 1000
                                print('VPS_OANDA_PUBLIC=' + json.dumps({
                                    'lp': fields['lp'], 'bid': fields['bid'],
                                    'ask': fields['ask'],
                                    'provider_age_sec': round(time.time()-ts, 2),
                                    'update_mode': fields.get('update_mode'),
                                }))
                                raise SystemExit(0)
                    print('VPS_OANDA_PUBLIC=INCOMPLETE')
            except Exception as exc:
                print('VPS_OANDA_PUBLIC_ERROR=' + type(exc).__name__)
            PY
  instrument-matrix:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Probe every configured direct CFD and spot source from production network
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 3m
          script: |
            cd /opt/seiltanzer
            .venv/bin/python - <<'PY'
            import json, time, urllib.request
            from seiltanzer.config import ALL_INSTRUMENTS
            from seiltanzer.data.feeds import _fetch_swissquote_quote, _fetch_tradingview_quote

            references = {
                'NAS100': ('FOREXCOM:NSXUSD', 'different_venue_cfd'),
                'SP500': ('FOREXCOM:SPXUSD', 'different_venue_cfd'),
                'US30': ('FOREXCOM:DJI', 'different_venue_cfd'),
                'GER40': ('FOREXCOM:GER40', 'different_venue_cfd'),
                'UK100': ('FOREXCOM:UKXGBP', 'different_venue_cfd'),
                'JPY100': ('FOREXCOM:JP225', 'different_venue_cfd'),
                'XAU': ('OANDA:XAUUSD', 'different_venue_spot'),
                'XAG': ('OANDA:XAGUSD', 'different_venue_spot'),
                'EURUSD': ('OANDA:EURUSD', 'different_venue_spot'),
                'USDCAD': ('OANDA:USDCAD', 'different_venue_spot'),
            }

            for code, instrument in ALL_INSTRUMENTS.items():
                if instrument.asset_class == 'crypto':
                    symbol = instrument.binance_symbol
                    try:
                        url = 'https://api.binance.com/api/v3/aggTrades?symbol=' + symbol + '&limit=1'
                        with urllib.request.urlopen(url, timeout=7) as response:
                            trade = json.load(response)[-1]
                        age = round(time.time() - float(trade['T']) / 1000, 1)
                        result = {'instrument': code, 'source': 'Binance spot ' + symbol,
                                  'price': float(trade['p']), 'age_sec': age,
                                  'fresh': -5 <= age <= 30,
                                  'provider_timestamp_verified': True}
                        try:
                            reference = _fetch_tradingview_quote('BINANCE:' + symbol, timeout=7)
                            skew = abs(float(trade['T']) / 1000 - float(reference['ts']))
                            result['reference'] = {
                                'source': 'TradingView BINANCE:' + symbol,
                                'price': reference['value'],
                                'timestamp_skew_sec': round(skew, 1),
                                'difference_pct': round(
                                    100 * (float(trade['p']) / reference['value'] - 1), 4),
                                'paired_within_15s': skew <= 15,
                            }
                        except Exception as exc:
                            result['reference_error'] = type(exc).__name__ + ': ' + str(exc)[:80]
                    except Exception as exc:
                        result = {'instrument': code, 'source': 'Binance spot ' + symbol,
                                  'error': type(exc).__name__ + ': ' + str(exc)[:120]}
                    print('DIRECT_SOURCE=' + json.dumps(result), flush=True)
                    continue
                symbol = instrument.tradingview_symbol
                pair = instrument.swissquote_pair
                try:
                    if symbol:
                        quote = _fetch_tradingview_quote(symbol, timeout=7)
                        source = symbol
                    elif pair:
                        quote = _fetch_swissquote_quote(pair, timeout=7)
                        source = 'Swissquote ' + pair
                    else:
                        raise RuntimeError('no direct source configured')
                    age = round(time.time() - float(quote['ts']), 1)
                    result = {'instrument': code, 'source': source,
                              'price': quote['value'], 'age_sec': age,
                              'fresh': -5 <= age <= 30,
                              'provider_timestamp_verified': quote.get('provider_timestamp_verified'),
                              'bid': quote['bid'], 'ask': quote['ask'],
                              'mode': quote.get('update_mode')}
                    reference_symbol, reference_kind = references.get(code, (None, None))
                    if reference_symbol:
                        try:
                            reference = _fetch_tradingview_quote(reference_symbol, timeout=7)
                            skew = abs(float(quote['ts']) - float(reference['ts']))
                            result['reference'] = {
                                'source': reference_symbol, 'kind': reference_kind,
                                'price': reference['value'],
                                'timestamp_skew_sec': round(skew, 1),
                                'difference_pct': round(
                                    100 * (quote['value'] / reference['value'] - 1), 4),
                                'paired_within_15s': skew <= 15,
                                'note': 'different venue CFD or spot; basis is not necessarily a pricing error',
                            }
                        except Exception as exc:
                            result['reference_error'] = type(exc).__name__ + ': ' + str(exc)[:80]
                except Exception as exc:
                    result = {'instrument': code, 'source': symbol or pair,
                              'error': type(exc).__name__ + ': ' + str(exc)[:120]}
                print('DIRECT_SOURCE=' + json.dumps(result), flush=True)
            try:
                from websockets.sync.client import connect
                url = ('wss://stream.binance.com:9443/stream?streams='
                       'btcusdt@trade/ethusdt@trade/solusdt@trade')
                seen = {}
                with connect(url, open_timeout=5, close_timeout=1) as ws:
                    deadline = time.monotonic() + 12
                    while len(seen) < 3 and time.monotonic() < deadline:
                        packet = json.loads(ws.recv(timeout=max(.1, deadline-time.monotonic())))
                        trade = packet.get('data') or {}
                        symbol = trade.get('s')
                        if symbol in {'BTCUSDT', 'ETHUSDT', 'SOLUSDT'}:
                            seen[symbol] = {
                                'price': float(trade['p']),
                                'trade_age_sec': round(time.time() - float(trade['T'])/1000, 2),
                            }
                print('BINANCE_COMBINED_WS=' + json.dumps(seen), flush=True)
            except Exception as exc:
                print('BINANCE_COMBINED_WS_ERROR=' + type(exc).__name__
                      + ': REST trade fallback remains available', flush=True)
            PY
