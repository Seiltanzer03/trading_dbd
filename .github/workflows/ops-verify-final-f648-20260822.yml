name: ops-verify-final-f648-20260822

on:
  push:
    branches:
      - ops/verify-final-f648-20260822
    paths:
      - .github/workflows/ops-verify-final-f648-20260822.yml

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: f6480483deb6495ad4a4f184c57fcc3fb8206556
    steps:
      - name: Measure exact production evidence transport and LLM
        id: probe
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 6m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            test "$(systemctl is-active seiltanzer)" = active

            echo '=== ROUTE TRANSPORT ==='
            for path in \
              '/api/research/g1s/trade-relevance' \
              '/api/research/g1s/ablation' \
              '/api/research/g1s/oos' \
              '/api/research/g1s/final-report'; do
              for attempt in 1 2 3; do
                curl -sS --max-time 12 -o /dev/null \
                  -w "ROUTE path=$path attempt=$attempt http=%{http_code} bytes=%{size_download} start=%{time_starttransfer} total=%{time_total}\n" \
                  "http://127.0.0.1:8790$path" || true
              done
            done

            echo '=== MATERIALIZED PAYLOAD BYTES ==='
            /opt/seiltanzer/.venv/bin/python - <<'PY'
            import sqlite3
            db='/opt/seiltanzer/data/trades.db'
            con=sqlite3.connect(f'file:{db}?mode=ro', uri=True, timeout=5)
            try:
                for row in con.execute("SELECT report_name,length(payload_json),duration_ms,generated_ts FROM g1s_evidence_materializations ORDER BY report_name"):
                    print('MATERIALIZED', row)
            finally:
                con.close()
            PY

            echo '=== LLM PROBE ==='
            PID=$(systemctl show -p MainPID --value seiltanzer)
            python3 - "$PID" <<'PY'
            import sys
            raw=open(f'/proc/{sys.argv[1]}/environ','rb').read().split(b'\0')
            env=dict(item.split(b'=',1) for item in raw if b'=' in item)
            print('OPENROUTER_API_KEY_PRESENT=' + str(bool(env.get(b'OPENROUTER_API_KEY'))).lower())
            print('OPENROUTER_MODEL=' + env.get(b'OPENROUTER_MODEL', b'<default>').decode(errors='ignore'))
            print('AI_PROVIDER_TIMEOUT_SEC=' + env.get(b'AI_PROVIDER_TIMEOUT_SEC', b'<default>').decode(errors='ignore'))
            PY
            /opt/seiltanzer/.venv/bin/python - <<'PY'
            import json,time,urllib.request,urllib.error
            def call():
                req=urllib.request.Request('http://127.0.0.1:8790/api/ai/verdict',method='POST')
                started=time.monotonic()
                try:
                    with urllib.request.urlopen(req,timeout=14) as r:
                        raw=r.read(); code=r.status
                except urllib.error.HTTPError as e:
                    raw=e.read(); code=e.code
                elapsed=(time.monotonic()-started)*1000
                body=json.loads(raw.decode()) if raw else {}
                result=body.get('result') if isinstance(body.get('result'),dict) else body
                verdict=str(body.get('verdict') or result.get('verdict') or '')
                print('LLM=' + json.dumps({
                    'http':code,'elapsed_ms':round(elapsed,1),
                    'model':body.get('model') or result.get('model'),
                    'mode':body.get('mode') or result.get('mode'),
                    'result_mode':body.get('result_mode') or result.get('result_mode'),
                    'has_llm_explanation':'LLM EXPLANATION' in verdict.upper(),
                },sort_keys=True))
                return code,body
            for i in range(3):
                call(); time.sleep(2)
            PY

            echo '=== RECENT AI EVENTS ==='
            journalctl -u seiltanzer --since '-20 minutes' --no-pager | grep 'ai_verdict_event' | tail -n 20 || true

      - name: Publish diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          state=success
          description='Production trade-relevance transport diagnostic completed'
          if [ "$OUTCOME" != success ]; then
            state=failure
            description='Production trade-relevance diagnostic failed'
          fi
          payload=$(python3 - "$state" "$description" <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'diagnostic/trade-relevance','description':sys.argv[2],
                            'target_url':'${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'}))
          PY
          )
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${EXPECTED_SHA}" \
            -d "$payload" >/dev/null
