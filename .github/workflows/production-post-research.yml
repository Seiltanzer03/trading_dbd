name: production-post-research

on:
  workflow_run:
    # This is the first synchronization boundary after green functional smoke.
    # It requests a bounded cooperative worker pause, while still allowing the
    # current service process to complete its required first research cycle.
    workflows: ["production-functional-smoke"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Verify health after research maintenance completed
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SMOKE_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 22m
          envs: EXPECTED_SHA,SMOKE_RUN_ID
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            PY=/opt/seiltanzer/.venv/bin/python
            ORCH=/opt/seiltanzer/scripts/production_research_acceptance.py
            keep_gate=0

            cleanup_gate_on_failure() {
              if [ "$keep_gate" -ne 1 ]; then
                "$PY" "$ORCH" release-gate \
                  --smoke-run-id "$SMOKE_RUN_ID" \
                  --expected-sha "$EXPECTED_SHA" || true
              fi
            }
            trap cleanup_gate_on_failure EXIT

            # Acquire before polling the worker. If this process has not yet
            # completed its required post-grace cycle, the worker gate permits
            # that one cycle and pauses only subsequent heavy cycles. Keep the
            # lease comfortably longer than the independently hard-bounded EDE
            # envelope; final EDE still releases it immediately on exit.
            "$PY" "$ORCH" acquire-gate \
              --smoke-run-id "$SMOKE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA" \
              --ttl-seconds 21600

            "$PY" /opt/seiltanzer/scripts/production_post_research_check.py \
              --expected-sha "$EXPECTED_SHA"

            "$PY" "$ORCH" validate-gate \
              --smoke-run-id "$SMOKE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA"
            "$PY" "$ORCH" write-marker \
              --stage post-research \
              --smoke-run-id "$SMOKE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA"

            # Ownership passes to the downstream exact-run chain. G1M/inventory
            # release on failure; final EDE always releases the same owned lease.
            keep_gate=1
            trap - EXIT