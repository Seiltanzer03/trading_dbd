name: ops-runtime-cpu-weight

on:
  push:
    branches:
      - ops/runtime-cpu-weight-50
    paths:
      - .github/workflows/ops-runtime-cpu-weight.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ops-runtime-cpu-weight.yml

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push' || github.head_ref == 'ops/runtime-cpu-weight-50'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Verify live runtime CPU relief without restart
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            set -euo pipefail
            EXPECTED_SHA=8dcac9e64d7d2605939a7346c534c39ae7c29d93
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            test "$(systemctl is-active seiltanzer)" = "active"

            weight=$(systemctl show seiltanzer -p CPUWeight --value)
            active=$(systemctl show seiltanzer -p ActiveState --value)
            sub=$(systemctl show seiltanzer -p SubState --value)
            pid=$(systemctl show seiltanzer -p MainPID --value)
            echo "CPUWeight=$weight ActiveState=$active SubState=$sub MainPID=$pid"

            test "$weight" = "50"
            test "$active" = "active"
            test "$sub" = "running"
            test "${pid:-0}" -gt 0

            ps -o pid,pcpu,pmem,etime,cmd -p "$pid" || true
