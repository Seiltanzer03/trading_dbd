name: ops-runtime-cpu-weight

on:
  push:
    branches:
      - ops/runtime-cpu-weight-50
    paths:
      - .github/workflows/ops-runtime-cpu-weight.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Apply runtime-only CPU weight without restart
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            set -euo pipefail
            EXPECTED_SHA=8dcac9e64d7d2605939a7346c534c39ae7c29d93
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            test "$(systemctl is-active seiltanzer)" = "active"

            before=$(systemctl show seiltanzer -p CPUWeight --value || true)
            echo "CPUWeight before=${before:-unset}"

            # Runtime-only scheduling preference: no service restart, no code/data change.
            # The terminal may still use idle CPU, but yields CPU more readily under contention.
            systemctl set-property --runtime seiltanzer.service CPUWeight=50

            after=$(systemctl show seiltanzer -p CPUWeight --value)
            echo "CPUWeight after=$after"
            test "$after" = "50"
            test "$(systemctl is-active seiltanzer)" = "active"
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"

            result=$(curl -sS -o /tmp/seiltanzer-cpu-weight-state.json \
              --connect-timeout 2 --max-time 8 \
              -w '%{http_code} %{time_total}' \
              http://127.0.0.1:8790/api/state)
            code=${result%% *}
            elapsed=${result#* }
            echo "api_state http=$code seconds=$elapsed"
            test "$code" = "200"

            systemctl show seiltanzer \
              -p CPUWeight -p ActiveState -p SubState -p MainPID -p MemoryCurrent
