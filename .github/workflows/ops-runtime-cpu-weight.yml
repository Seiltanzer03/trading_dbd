name: ops-runtime-cpu-weight

on:
  push:
    branches:
      - ops/runtime-cpu-weight-50
    paths:
      - .github/workflows/ops-runtime-cpu-weight.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ops-runtime-cpu-weight.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Inspect live AI provider and macro state
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 3m
          script: |
            set -euo pipefail
            echo "SHA=$(git -C /opt/seiltanzer rev-parse HEAD)"
            echo "CPUWeight=$(systemctl show seiltanzer -p CPUWeight --value)"
            echo '=== TARGET AI REQUEST ==='
            journalctl -u seiltanzer --since '-12 hours' --no-pager \
              | grep -F 'ai-e733c0c6bbe9478b8308' | tail -n 12 || true
            echo '=== RECENT AI PROVIDER EVENTS ==='
            journalctl -u seiltanzer --since '-2 hours' --no-pager \
              | grep -F 'ai_verdict_event' | tail -n 20 || true
            echo '=== MACRO STATUS ==='
            curl -fsS --max-time 15 http://127.0.0.1:8790/api/research/macro/status \
              | /opt/seiltanzer/.venv/bin/python -m json.tool
            for family in CPI NFP ISM_MANUFACTURING ISM_SERVICES FOMC_STATEMENT; do
              echo "=== MACRO LATEST ${family} ==="
              curl -fsS --max-time 15 "http://127.0.0.1:8790/api/research/macro/latest?family=${family}" \
                | /opt/seiltanzer/.venv/bin/python -m json.tool || true
            done
