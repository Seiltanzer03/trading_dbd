name: ops-restore-terminal-production
on:
  push:
    branches: [agent/restore-terminal-production]
    paths: [.github/workflows/ops-restore-terminal-production.yml]

jobs:
  temporary-production-headroom:
    runs-on: ubuntu-22.04
    steps:
      - name: Add swap headroom and restore terminal if degraded
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            echo '=== BEFORE ==='
            free -h
            swapon --show || true
            swap_mb=$(free -m | awk '/^Swap:/ {print $2}')
            if [ "${swap_mb:-0}" -lt 2500 ]; then
              echo 'Adding 2 GiB emergency swap headroom'
              if [ ! -f /swapfile-seiltanzer ]; then
                fallocate -l 2G /swapfile-seiltanzer
                chmod 600 /swapfile-seiltanzer
                mkswap /swapfile-seiltanzer
              fi
              swapon /swapfile-seiltanzer || true
              grep -q '^/swapfile-seiltanzer ' /etc/fstab || echo '/swapfile-seiltanzer none swap sw 0 0' >> /etc/fstab
            fi
            pid=$(systemctl show -p MainPID --value seiltanzer)
            rss_kb=0
            if [ -r "/proc/$pid/status" ]; then
              rss_kb=$(awk '/^VmRSS:/ {print $2}' /proc/$pid/status)
            fi
            code=$(curl -sS -o /dev/null --connect-timeout 2 --max-time 8 -w '%{http_code}' http://127.0.0.1:8790/api/state 2>/dev/null || true)
            echo "before pid=$pid rss_kb=${rss_kb:-0} state_http=${code:-000}"
            if [ "$code" != '200' ] || [ "${rss_kb:-0}" -gt 1500000 ]; then
              systemctl restart seiltanzer
              ready=0
              for attempt in $(seq 1 70); do
                code=$(curl -sS -o /dev/null --connect-timeout 1 --max-time 4 -w '%{http_code}' http://127.0.0.1:8790/api/state 2>/dev/null || true)
                echo "attempt=$attempt state_http=${code:-000}"
                if [ "$code" = '200' ]; then ready=1; break; fi
                sleep 2
              done
              test "$ready" = '1'
            fi
            echo '=== AFTER ==='
            free -h
            swapon --show
            systemctl is-active seiltanzer
            curl -sS --resolve seiltanzer.ru:443:127.0.0.1 -o /dev/null --connect-timeout 2 --max-time 12 -w 'sni_https_http=%{http_code}\n' https://seiltanzer.ru/
      - name: Verify public HTTPS
        run: |
          set -euo pipefail
          test "$(curl -sS -o /dev/null --connect-timeout 5 --max-time 20 -w '%{http_code}' https://seiltanzer.ru/)" = '200'
