name: ops-restore-terminal-production
on:
  push:
    branches: [agent/restore-terminal-production]
    paths: [.github/workflows/ops-restore-terminal-production.yml]

jobs:
  diagnose-state-memory:
    runs-on: ubuntu-22.04
    steps:
      - name: Measure one state request memory impact
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 4m
          script: |
            set -euo pipefail
            pid=$(systemctl show -p MainPID --value seiltanzer)
            echo "pid=$pid"
            echo '--- before ---'
            grep -E 'VmRSS|VmHWM|VmSize|RssAnon|RssFile|VmSwap' /proc/$pid/status || true
            cat /proc/$pid/smaps_rollup | grep -E 'Rss:|Pss:|Private_|Anonymous:|Swap:' || true
            /usr/bin/time -v curl -sS --connect-timeout 3 --max-time 40 http://127.0.0.1:8790/api/state -o /tmp/state.json 2>/tmp/state.time
            cat /tmp/state.time
            wc -c /tmp/state.json
            echo '--- immediate after ---'
            grep -E 'VmRSS|VmHWM|VmSize|RssAnon|RssFile|VmSwap' /proc/$pid/status || true
            sleep 5
            echo '--- after 5s ---'
            grep -E 'VmRSS|VmHWM|VmSize|RssAnon|RssFile|VmSwap' /proc/$pid/status || true
            test "$(curl -sS -o /dev/null --connect-timeout 2 --max-time 10 -w '%{http_code}' http://127.0.0.1:8790/)" = '200'
