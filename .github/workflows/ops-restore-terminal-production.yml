name: ops-restore-terminal-production
on:
  push:
    branches: [agent/restore-terminal-production]
    paths: [.github/workflows/ops-restore-terminal-production.yml]

jobs:
  locate-runtime-status-route:
    runs-on: ubuntu-22.04
    steps:
      - name: Locate blocking research runtime status implementation safely
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            set -u
            cd /opt/seiltanzer
            echo '=== GREP LITERALS ==='
            timeout 20s grep -RIn --include='*.py' --include='*.js' \
              -E 'research/runtime/status|runtime/status|runtime_status|research_runtime' \
              seiltanzer scripts tests 2>/dev/null | head -n 200 || true
            echo '=== GREP ROUTE BUILDERS ==='
            timeout 20s grep -RIn --include='*.py' \
              -E 'research.*runtime|runtime.*status|status.*runtime' \
              seiltanzer 2>/dev/null | head -n 300 || true
            echo '=== OPENAPI ==='
            if curl -sS --connect-timeout 2 --max-time 8 http://127.0.0.1:8790/openapi.json -o /tmp/openapi.json; then
              python - <<'PY'
            import json
            p=json.load(open('/tmp/openapi.json'))
            path='/api/research/runtime/status'
            print(json.dumps(p.get('paths',{}).get(path), indent=2, ensure_ascii=False))
            PY
            fi
            echo '=== SERVICE HEALTH ==='
            systemctl is-active seiltanzer || true
            curl -sS -o /dev/null --connect-timeout 2 --max-time 8 -w 'root_http=%{http_code} state_time=%{time_total}\n' http://127.0.0.1:8790/ || true
