name: ops-restore-terminal-production
on:
  push:
    branches: [agent/restore-terminal-production]
    paths: [.github/workflows/ops-restore-terminal-production.yml]

jobs:
  diagnose-ai-provider:
    runs-on: ubuntu-22.04
    steps:
      - name: Inspect OpenRouter configuration and failed request
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 3m
          script: |
            set -euo pipefail
            pid=$(systemctl show -p MainPID --value seiltanzer)
            echo "service_active=$(systemctl is-active seiltanzer) pid=$pid"
            echo '=== PROVIDER ENV PRESENCE (values hidden) ==='
            tr '\0' '\n' < /proc/$pid/environ | awk -F= '/^OPENROUTER_|^AI_/ {v=substr($0,index($0,"=")+1); print $1 " set=" (length(v)>0?"yes":"no") " length=" length(v)}' | sort || true
            echo '=== PROVIDER CODE ENV NAMES ==='
            grep -RhoE 'OPENROUTER_[A-Z0-9_]+' /opt/seiltanzer/seiltanzer/ai_verdict*.py /opt/seiltanzer/seiltanzer/*.py 2>/dev/null | sort -u || true
            echo '=== REQUEST LOG ==='
            journalctl -u seiltanzer --since '-4 hours' --no-pager | grep -F -A12 -B3 'ai-d6a80ac3778b40d5be85' || true
            echo '=== RECENT PROVIDER FALLBACKS ==='
            journalctl -u seiltanzer --since '-2 hours' --no-pager | grep -E 'provider_fallback|openrouter|OpenRouter' | tail -n 120 || true
