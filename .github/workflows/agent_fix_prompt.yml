name: fix-ai-policy-prompt

on:
  push:
    branches:
      - agent/ai-quant-policy-manager

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-quant-policy-manager
      - name: Keep banned phrase contiguous for validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('seiltanzer/ai_verdict.py')
          text = path.read_text()
          old = '«слишком раннее\nдействие»'
          if old not in text:
              raise SystemExit('expected prompt fragment not found')
          path.write_text(text.replace(old, '«слишком раннее действие»'))
          PY
          rm -f .github/workflows/agent_fix_prompt.yml
      - name: Commit fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: keep vague-language guard stable"
          git push origin HEAD:agent/ai-quant-policy-manager
