name: ai-release-startup-status-20261020
# Reviewed candidate, read-only live database benchmark; never installs app code.
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Benchmark candidate with read-only SQLite; no app install or init
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 45s
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = 6cbf58c873bc863d879c530331258eeeeff1a3c7
            cd /opt/seiltanzer
            /opt/seiltanzer/.venv/bin/python -u - <<'PY'
            import hashlib,importlib.util,json,sqlite3,sys,tempfile,threading,time,urllib.request
            from pathlib import Path
            url='https://raw.githubusercontent.com/Seiltanzer03/trading_dbd/25f631561a5173f5fc7dd98405c91042af91724b/seiltanzer/journal.py'
            with urllib.request.urlopen(url,timeout=10) as response:source=response.read(150000)
            assert hashlib.sha256(source).hexdigest()=='7089a324c39a4b13c5e7e59b9cb03567a947b34210bca172f80777013375f286'
            with tempfile.TemporaryDirectory(prefix='seiltanzer-q-read-probe-',dir='/tmp') as directory:
                path=Path(directory)/'candidate.py';path.write_bytes(source)
                spec=importlib.util.spec_from_file_location('seiltanzer._q_read_candidate',path)
                module=importlib.util.module_from_spec(spec);sys.modules[spec.name]=module;spec.loader.exec_module(module)
                connection=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=2)
                try:
                    connection.row_factory=sqlite3.Row
                    connection.execute('PRAGMA query_only=ON')
                    # Bypass constructor: no schema migration, initialization or writes.
                    journal=module.Journal.__new__(module.Journal)
                    journal._conn=connection;journal._lock=threading.RLock()
                    started=time.monotonic();deadline=started+15
                    connection.set_progress_handler(lambda:int(time.monotonic()>deadline),1000)
                    report=journal.q_calibration_report()
                    elapsed=time.monotonic()-started
                    assert connection.total_changes==0
                    assert connection.execute('PRAGMA query_only').fetchone()[0]==1
                    print(json.dumps({'kind':'q_horizon_readonly_benchmark','candidate_sha':'25f631561a5173f5fc7dd98405c91042af91724b','elapsed_ms':round(elapsed*1000,1),'eligible_forecasts':report.get('eligible_forecasts'),'resolved_n':report.get('n'),'censored_n':report.get('censored_n'),'database_writes':connection.total_changes,'read_only':True,'app_installs':0,'restarts':0,'provider_calls':0,'acks':0},sort_keys=True))
                finally:connection.close()
            PY
      - name: Verify public HTTP without AI request
        run: |
          set -euo pipefail
          for path in / /api/state; do
            code=$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output /dev/null --write-out '%{http_code}' "http://94.241.171.182:8790$path")
            echo "public_path=$path http_code=$code"
            test "$code" = 200
          done
