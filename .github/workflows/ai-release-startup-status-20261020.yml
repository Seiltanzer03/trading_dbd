name: ai-release-startup-status-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Observe startup metadata only; no lock, database query, restart or provider call
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 35s
          script: |
            set -euo pipefail
            /usr/bin/python3 -u - <<'PY'
            import json,os,subprocess,time
            from pathlib import Path
            def out(**data):print(json.dumps(data,sort_keys=True))
            def run(args,timeout=5):
                return subprocess.run(args,text=True,capture_output=True,timeout=timeout)
            props=run(['systemctl','show','seiltanzer','-p','MainPID','-p','ControlPID','-p','ActiveState','-p','SubState','-p','ExecMainStatus','-p','NRestarts','-p','MemoryCurrent','-p','ActiveEnterTimestamp'])
            out(kind='startup',observed_ts=time.time(),properties=props.stdout.splitlines())
            fields=dict(line.split('=',1) for line in props.stdout.splitlines() if '=' in line)
            rawpid=fields.get('MainPID','0')
            if rawpid.isdigit() and int(rawpid)>0:
                root=Path('/proc')/rawpid
                for item in ['io','wchan']:
                    try:out(kind='process_'+item,lines=(root/item).read_text().splitlines()[:12])
                    except OSError:pass
            for name in ['cutover.preparation.json','cutover.journal.json','cutover.result.json']:
                p=Path('/opt/seiltanzer/data')/name
                try:
                    d=json.loads(p.read_text())
                    out(kind='owner_state',file=name,fields={k:d.get(k) for k in ['run_id','application_sha','phase','service_started','abort_reason','started_wall_ts']})
                except (OSError,ValueError):out(kind='owner_state',file=name,readable=False)
            owner=run(['systemctl','show','seiltanzer-history-39547191584.service','-p','ActiveState','-p','SubState','-p','Result','-p','MainPID'])
            out(kind='owner_unit',properties=owner.stdout.splitlines())
            journal=run(['journalctl','-u','seiltanzer','--since','2026-10-21 05:00:00','--no-pager','-n','65','-o','cat'])
            for line in journal.stdout.splitlines():
                if any(mark in line.lower() for mark in ['authorization','password','secret','api_key','x-amz','access_key','token=']):continue
                if len(line)>1000:continue
                out(kind='startup_journal',line=line)
            head=run(['git','-C','/opt/seiltanzer','rev-parse','HEAD'])
            out(kind='git',observed_head=head.stdout.strip())
            st=os.statvfs('/');out(kind='capacity',free_bytes=st.f_bavail*st.f_frsize)
            sizes=run(['du','-sk','/var/log/journal','/var/cache/apt','/root/.cache/pip','/opt/seiltanzer/.git','/opt/seiltanzer/data/backups','/tmp'],timeout=8)
            out(kind='disposable_capacity_inventory',rows=sizes.stdout.splitlines())
            import sqlite3
            conn=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=1)
            end=time.monotonic()+2
            conn.set_progress_handler(lambda:time.monotonic()>end,1000)
            try:
                record=conn.execute('SELECT snapshot_json FROM ai_verdicts WHERE length(snapshot_json)<2000000 ORDER BY id DESC LIMIT 1').fetchone()
                saved=json.loads(record[0]) if record else {}
                manager=saved.get('policy_manager') or {}
                workspace=manager.get('option_derivative_state') or {}
                context=saved.get('edge_family_market_context') or {}
                out(kind='saved_snapshot_status',captured_ts=saved.get('captured_ts'),budget=saved.get('snapshot_budget'),option_metric_count=len(workspace.get('metrics') or {}),option_workspace_available=workspace.get('available'),market_context_reason=context.get('reason'),failed_source_checks=context.get('failed_source_checks'),family_model_count=len(context.get('families') or {}),root_presence={k:k in saved for k in ['edge_family_sources','edge_family_market_context','macro_context_v1']})
            finally:conn.close()
            local=Path('/opt/seiltanzer/data/backups/local')
            for p in local.glob('.*.tmp.sqlite3'):
                try:s=p.lstat()
                except OSError:continue
                out(kind='startup_temp_metadata',name=p.name,logical_bytes=s.st_size,allocated_bytes=s.st_blocks*512,modified=s.st_mtime)
            r=run(['curl','-sS','--max-time','3','-o','/dev/null','-w','%{http_code}','http://127.0.0.1:8790/api/state'])
            out(kind='local_http',code=r.stdout[-3:],returncode=r.returncode)
            out(kind='safety',db_queries=1,provider_calls=0,acks=0,restarts=0,mutations=0,observation_may_be_intermediate=True)
            PY
