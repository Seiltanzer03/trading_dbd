name: ai-release-startup-status-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Observe exact release startup without interfering with deployment
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 25s
          script: |
            set -euo pipefail
            /usr/bin/python3 -u - <<'PY'
            import json,os,subprocess,time,urllib.request,urllib.error
            from pathlib import Path
            def out(**row):print(json.dumps(row,sort_keys=True))
            sha=subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True,timeout=3).strip()
            out(kind='installed_release',sha=sha,expected=sha=='d2222a28144e85dbf094c8954c54426ce550f96c')
            props=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','-p','ControlPID','-p','NRestarts','-p','ActiveState','-p','SubState','-p','MemoryCurrent'],text=True,timeout=3)
            out(kind='service',properties=props.splitlines())
            pid=int(dict(line.split('=',1) for line in props.splitlines()).get('MainPID') or 0)
            def io_counts():
                if pid<=0:return {}
                try:return {k:int(v) for k,v in (line.split(':',1) for line in Path('/proc/'+str(pid)+'/io').read_text().splitlines()) if k in ('rchar','read_bytes')}
                except (OSError,ValueError):return {}
            first=io_counts();time.sleep(2);second=io_counts()
            out(kind='startup_io_progress',pid=pid,counts=second,two_second_deltas={k:second[k]-first[k] for k in first.keys()&second.keys()})
            st=os.statvfs('/');out(kind='capacity',free_bytes=st.f_bavail*st.f_frsize)
            for suffix in ('','-wal'):
                p=Path('/opt/seiltanzer/data/trades.db'+suffix)
                out(kind='working_database_size',suffix=suffix,size_bytes=p.stat().st_size if p.exists() else None)
            for name in ('mathematical_edge_latest.json','edge_family_sources_latest.json'):
                p=Path('/opt/seiltanzer/data/research')/name
                if not p.exists():out(kind='publication',name=name,available=False);continue
                size=p.stat().st_size;raw=p.read_bytes() if 0<size<=1000000 else b''
                try:value=json.loads(raw) if raw else {}
                except (ValueError,UnicodeError) as exc:
                    out(kind='invalid_publication',name=name,size_bytes=size,error_class=type(exc).__name__,error_position=getattr(exc,'pos',None),nul_bytes=raw.count(b'\x00'))
                    continue
                matrix=value.get('family_market_models') or {}
                out(kind='publication',name=name,size_bytes=size,exact_release=value.get('published_for_sha')==sha,within_math_loader_size=size<=500000,trained_groups=sum(isinstance(row,dict) and row.get('status')=='TRAINED' for groups in matrix.values() if isinstance(groups,dict) for row in groups.values()))
            for path in ('/api/state','/api/ai/snapshot/status','/api/research/runtime/worker-status'):
                started=time.monotonic()
                try:
                    with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=3) as response:
                        raw=response.read(2*1024**2+1)
                        if len(raw)>2*1024**2:raise ValueError('RESPONSE_BOUND')
                        row=json.loads(raw)
                        out(kind='endpoint',path=path,http=response.code,elapsed_ms=round((time.monotonic()-started)*1000,1),fields={k:row.get(k) for k in ('ready','building','age_sec','build_ms','build_n','last_error') if k in row})
                        if path=='/api/state':
                            tick=row.get('tick') or {};quote=(tick.get('feeds') or {}).get('price') or {}
                            def age(value):
                                try:return round(time.time()-float(value),3)
                                except (TypeError,ValueError):return None
                            out(kind='canonical_quote',instrument=tick.get('instrument'),source=quote.get('source'),status=quote.get('status'),quote_age_sec=age(quote.get('ts')),payload_age_sec=age(tick.get('ts')))
                        if path.endswith('/worker-status'):
                            worker=row.get('worker') or {}
                            out(kind='acceptance_worker',sqlite_access=row.get('sqlite_access'),fields={k:worker.get(k) for k in ('current_phase','core_stage','first_cycle_not_before_ts','core_stage_started_ts','last_started_ts','last_finished_ts','last_duration_ms','last_error','disk_pause_active','acceptance_pause_active','memory_pressure','last_maintenance_started_ts','last_maintenance_finished_ts','last_maintenance_duration_ms','last_maintenance_error')})
                        if path.endswith('/passive/status'):out(kind='passive_collector',fields={k:row.get(k) for k in ('collector_status','latest_error','last_step_ts','last_skip_reason','last_skip_reason_code','latest_observation_ts')})
                except (OSError,ValueError) as exc:out(kind='endpoint',path=path,available=False,exception_class=type(exc).__name__)

            # Historical archive inspection only: never builds a fresh verdict.
            try:
                with urllib.request.urlopen('http://127.0.0.1:8790/api/ai/history?include_management=true',timeout=3) as response:
                    raw=response.read(2000001)
                if len(raw)>2000000:raise ValueError('HISTORY_RESPONSE_EXCEEDS_BOUND')
                items=json.loads(raw).get('items') or []
                items=[x for x in items if isinstance(x,dict) and isinstance(x.get('ts'),(int,float)) and not isinstance(x.get('ts'),bool)]
                last=max(items,key=lambda x:x['ts']) if items else {}
                archive=last.get('management_archive') or {}
                audit=archive.get('unified_edge_ensemble') or {}
                decision=archive.get('decision') or {}
                out(kind='latest_saved_ai_only_not_fresh_provider_proof',ts=last.get('ts'),age_sec=time.time()-last['ts'] if last else None,model=last.get('model'),captured_ts=archive.get('captured_ts'),selected_policy=audit.get('selected_policy'),effective_weights=audit.get('effective_weights'),decision={k:decision.get(k) for k in ('policy','status','execution_status','decision_id','authority','continuity')})
                for family in audit.get('edge_families') or []:
                    if isinstance(family,dict):out(kind='saved_family_only',fields={k:family.get(k) for k in ('family_id','family','available','forecast_available','status','reason','working_assessment_available','working_assessment_reason','model_pool_effective_weight','working_effective_weight')})
                for component in audit.get('components') or []:
                    if isinstance(component,dict):out(kind='saved_component_only',fields={k:component.get(k) for k in ('component_id','effective_weight','available','availability','reason','quality','age_sec')})
            except (OSError,ValueError,TypeError) as exc:out(kind='saved_ai_read',available=False,exception_class=type(exc).__name__)

            for name in ('ede_candidate_registry.jsonl','ede_v13_candidate_registry.jsonl','ede_shadow_v13.jsonl','ede_prospective_confirmation.jsonl','ede_v13_latest_audit.json'):
                p=Path('/opt/seiltanzer/data/research')/name
                out(kind='research_file_metadata_only',name=name,size_bytes=p.lstat().st_size if p.exists() else None,symlink=p.is_symlink())
            for name in ('cutover.active','cutover.journal.json'):
                p=Path('/opt/seiltanzer/data')/name
                info=p.lstat() if os.path.lexists(p) else None
                row=dict(kind='history_fence_metadata',name=name,present=info is not None,symlink=p.is_symlink(),size_bytes=info.st_size if info else None)
                if info and name.endswith('.json') and not p.is_symlink() and 0<info.st_size<=65536:
                    try:
                        journal=json.loads(p.read_bytes());row['state']={k:journal.get(k) for k in ('contract','run_id','phase','service_started')}
                    except (ValueError,OSError):row['state_invalid']=True
                out(**row)
            try:
                guard=subprocess.run(['/usr/bin/python3','/usr/local/lib/seiltanzer-history-start-guard.py','--database','/opt/seiltanzer/data/trades.db','--application-root','/opt/seiltanzer'],capture_output=True,text=True,timeout=8)
                out(kind='existing_start_fence_readonly',returncode=guard.returncode,result=json.loads(guard.stdout) if len(guard.stdout)<=4096 and guard.stdout.strip() else None)
            except (OSError,ValueError,subprocess.TimeoutExpired) as exc:out(kind='existing_start_fence_readonly',available=False,error_class=type(exc).__name__)
            import runpy
            if pid>0:
                status=Path('/proc/'+str(pid)+'/status').read_text().splitlines()
                out(kind='current_process_memory',pid=pid,fields={line.split(':',1)[0]:line.split(':',1)[1].strip() for line in status if line.split(':',1)[0] in ('VmRSS','RssAnon','RssFile','RssShmem','VmData')})
            scope=Path('/tmp/seiltanzer-sqlite-tools-40082288165')
            if scope.is_symlink():raise RuntimeError('UNSAFE_ORIGIN_SCOPE')
            control=scope/'control.py'
            if control.is_symlink():raise RuntimeError('UNSAFE_ORIGIN_CONTROL')
            helper=runpy.run_path(str(control),run_name='readonly_origin_probe') if control.is_file() else None
            targets=helper['targets'](scope/'sqlite3_rsync',scope/'origin.json') if helper else []
            def counts(process):
                try:return {k:int(v) for k,v in (line.split(':',1) for line in Path('/proc/'+str(process)+'/io').read_text().splitlines()) if k in ('rchar','read_bytes')}
                except (OSError,ValueError):return {}
            initial={process:counts(process) for process,birth in targets};time.sleep(2)
            latest={process:counts(process) for process,birth in targets}
            out(kind='active_ede_origin_progress',run_id='40082288165',scope_present=scope.is_dir(),targets=[dict(pid=process,counts=latest[process],two_second_deltas={k:latest[process][k]-initial[process][k] for k in initial[process].keys()&latest[process].keys()}) for process,birth in targets])
            out(kind='safety',provider_calls=0,review_posts=0,acks=0,orders=0,database_writes=0,restarts=0)
            PY
