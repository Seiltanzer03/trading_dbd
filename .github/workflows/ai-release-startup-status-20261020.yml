name: ai-release-startup-status-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read exact startup admission and owner metadata
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 45s
          script: |
            set -euo pipefail
            /usr/bin/python3 -u - <<'PY'
            import json,os,subprocess,time
            from pathlib import Path
            def out(**row):print(json.dumps(row,sort_keys=True))
            def run(args,timeout=6):return subprocess.run(args,text=True,capture_output=True,timeout=timeout)
            out(kind='git',head=run(['git','-C','/opt/seiltanzer','rev-parse','HEAD']).stdout.strip())
            out(kind='service',fields=run(['systemctl','show','seiltanzer','-p','MainPID','-p','ActiveState','-p','SubState','-p','NRestarts']).stdout.splitlines())
            out(kind='active_guard',exists=os.path.lexists('/opt/seiltanzer/data/cutover.active'))
            for name in ('cutover.journal.json','cutover.result.json'):
                p=Path('/opt/seiltanzer/data')/name
                try:
                    assert not p.is_symlink() and 0<p.stat().st_size<65536
                    row=json.loads(p.read_bytes())
                    out(kind='epoch',file=name,fields={k:row.get(k) for k in ('run_id','phase','service_started','abort_reason')})
                except (OSError,ValueError,AssertionError):out(kind='epoch',file=name,readable=False)
            started=time.monotonic()
            result=run(['nice','-n','-5','/usr/bin/python3','/usr/local/lib/seiltanzer-history-start-guard.py','--database','/opt/seiltanzer/data/trades.db','--application-root','/opt/seiltanzer'],timeout=12)
            try:proof=json.loads(result.stdout)
            except ValueError:proof={'parse_error':True}
            out(kind='admission',priority='temporary_check_process_only',permission_error='Permission denied' in result.stderr,returncode=result.returncode,elapsed_ms=round((time.monotonic()-started)*1000,1),proof=proof)
            for args in (['ps','-eo','pid,ppid,pcpu,rss,stat,etime,comm','--sort=-pcpu'],['free','-m']):
                out(kind='resource',command=args[0],lines=run(args).stdout.splitlines()[:10])
            st=os.statvfs('/');out(kind='capacity',free_bytes=st.f_bavail*st.f_frsize)
            out(kind='safety',read_only=True,restarts=0,provider_calls=0,acks=0,db_writes=0,history_mutations=0)
            PY

