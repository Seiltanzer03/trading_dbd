name: ai-release-startup-status-20261020
# One recovery of the failed initial start inside the already-authorized deployment.
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Retry unchanged condition once after previous process has fully exited
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 35s
          script: |
            set -euo pipefail
            /usr/bin/python3 -u - <<'PY'
            import json,os,subprocess
            from pathlib import Path
            def properties():
                text=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','-p','ControlPID','-p','ActiveState','-p','SubState','-p','Result','-p','NRestarts'],text=True,timeout=5)
                return dict(line.split('=',1) for line in text.splitlines())
            assert subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True,timeout=5).strip()=='ffdc513b5acb8746b54cdf852b55218ca21be336'
            assert not os.path.lexists('/opt/seiltanzer/data/cutover.active')
            state=json.loads(Path('/opt/seiltanzer/data/cutover.journal.json').read_bytes())
            assert state.get('phase')=='COMMITTED' and str(state.get('run_id'))=='39582128571'
            before=properties()
            assert before['MainPID']=='0' and before['ControlPID']=='0' and before['ActiveState']=='inactive' and before['SubState']=='dead' and before['Result']=='exec-condition'
            print(json.dumps({'kind':'before_once_start','properties':before}),flush=True)
            # Re-evaluates the installed ExecCondition normally, with its existing
            # 5-second deadline and every byte/identity/membership check unchanged.
            # Does not restart an active process or bypass any service condition.
            subprocess.run(['systemctl','start','--no-block','seiltanzer'],check=True,timeout=5)
            print(json.dumps({'kind':'one_start_submitted','attempts':1,'guard_changed':False,'db_writes':0,'provider_calls':0,'acks':0}),flush=True)
            PY
