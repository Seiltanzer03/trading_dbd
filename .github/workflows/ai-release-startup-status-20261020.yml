name: readonly-release-startup-4d35
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 35s
          script: |
            set -euo pipefail
            cd /opt/seiltanzer
            current=$(git rev-parse HEAD)
            case "$current" in
              7e222a36b7ce6f88abd9136db011cbd431c47298|4d35f82110007d78b41635f5da3f55e422a081d0) ;;
              *) echo 'UNEXPECTED_RUNTIME'; exit 1 ;;
            esac
            echo "RUNTIME_SHA=$current"
            systemctl show seiltanzer --property=ActiveState,SubState,MainPID,ControlPID,NRestarts,MemoryCurrent,FreezerState --no-pager
            journalctl -b -u seiltanzer --grep='^STARTUP_PHASE phase=' -n 4 --no-pager -o cat
            /usr/bin/python3 -B - <<'PY'
            import json,shutil,os
            print('CAPACITY_METADATA',json.dumps(shutil.disk_usage('/opt/seiltanzer')._asdict()))
            print('READ_ONLY_NO_DB_OPEN_NO_API_NO_PROVIDER_NO_RESTART')
            PY
