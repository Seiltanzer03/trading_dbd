name: ai-release-startup-status-20261020
# Read-only handoff observation 2026-10-21T12:38Z
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Observe startup metadata only; no lock, database query, restart or provider call
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 50s
          script: |
            set -euo pipefail
            /usr/bin/python3 -u - <<'PY'
            import json,os,subprocess,time
            from pathlib import Path
            def out(**data):print(json.dumps(data,sort_keys=True))
            def run(args,timeout=5):
                return subprocess.run(args,text=True,capture_output=True,timeout=timeout)
            props=run(['systemctl','show','seiltanzer','-p','MainPID','-p','ControlPID','-p','ActiveState','-p','SubState','-p','ExecMainStatus','-p','NRestarts','-p','MemoryCurrent','-p','ActiveEnterTimestamp'])
            out(kind='startup',observed_ts=time.time(),properties=props.stdout.splitlines())
            fields=dict(line.split('=',1) for line in props.stdout.splitlines() if '=' in line)
            rawpid=fields.get('MainPID','0')
            if rawpid.isdigit() and int(rawpid)>0:
                root=Path('/proc')/rawpid
                for item in ['io','wchan']:
                    try:out(kind='process_'+item,lines=(root/item).read_text().splitlines()[:12])
                    except OSError:pass
            for name in ['cutover.preparation.json','cutover.plan.json','cutover.journal.json','cutover.result.json']:
                p=Path('/opt/seiltanzer/data')/name
                try:
                    d=json.loads(p.read_text())
                    out(kind='owner_state',file=name,fields={k:d.get(k) for k in ['run_id','application_sha','phase','service_started','abort_reason','started_wall_ts']})
                except (OSError,ValueError):out(kind='owner_state',file=name,readable=False)
            detail=run(['journalctl','-u','seiltanzer-history-39582128571.service','--no-pager','-n','35','-o','cat'])
            for line in detail.stdout.splitlines():
                if any(mark in line.lower() for mark in ['authorization','password','secret','api_key','x-amz','access_key','token=']):continue
                if len(line)<1400:out(kind='owner_journal',line=line)
            owner=run(['systemctl','show','seiltanzer-history-39582128571.service','-p','ActiveState','-p','SubState','-p','Result','-p','MainPID'])
            out(kind='owner_unit',properties=owner.stdout.splitlines())
            owner_fields=dict(line.split('=',1) for line in owner.stdout.splitlines() if '=' in line)
            owner_pid=owner_fields.get('MainPID','0')
            if owner_pid.isdigit() and int(owner_pid)>0:
                for field in ['io','wchan']:
                    try:out(kind='owner_process_'+field,lines=(Path('/proc')/owner_pid/field).read_text().splitlines()[:12])
                    except OSError:pass
            journal=run(['journalctl','-u','seiltanzer','--since','2026-10-21 05:00:00','--no-pager','-n','65','-o','cat'])
            for line in journal.stdout.splitlines():
                if any(mark in line.lower() for mark in ['authorization','password','secret','api_key','x-amz','access_key','token=']):continue
                if len(line)>1000:continue
                out(kind='startup_journal',line=line)
            out(kind='cutover_guard_metadata',exists=os.path.lexists('/opt/seiltanzer/data/cutover.active'))
            fence=run(['/usr/bin/python3','/usr/local/lib/seiltanzer-history-start-guard.py','--database','/opt/seiltanzer/data/trades.db','--application-root','/opt/seiltanzer'],timeout=12)
            out(kind='startup_admission',returncode=fence.returncode,result=fence.stdout.strip()[:1200])
            import sqlite3,hashlib
            ns=dict(__name__='_readonly_history_diagnostic',__file__='/opt/seiltanzer/seiltanzer/history_storage_state.py')
            exec(compile(Path(ns['__file__']).read_bytes(),ns['__file__'],'exec'),ns)
            diagnostic_started=time.monotonic()
            conn=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=1)
            conn.execute('PRAGMA trusted_schema=OFF');conn.execute('PRAGMA query_only=ON');conn.execute('PRAGMA cache_size=-2048')
            conn.set_progress_handler(lambda:time.monotonic()-diagnostic_started>=25,1000)
            try:
                part_started=time.monotonic();state=ns['read_history_state'](conn)
                out(kind='history_validation_phase',phase='state',elapsed_sec=round(time.monotonic()-part_started,3))
                for table,proof in state['retained_identity'].items():
                    alias=proof['source_rowid_alias']
                    sql=('SELECT "'+alias+'",typeof(observation_id),length(CAST(observation_id AS BLOB)),CASE WHEN length(CAST(observation_id AS BLOB))>65536 THEN NULL WHEN typeof(observation_id)=\'text\' THEN CAST(observation_id AS BLOB) ELSE observation_id END FROM "'+table+'" WHERE "'+alias+'"<=? ORDER BY "'+alias+'"')
                    plan=conn.execute('EXPLAIN QUERY PLAN '+sql,(proof['max_rowid'],)).fetchall()
                    out(kind='history_identity_query_plan',table=table,plan=plan)
                    indexes=[]
                    for item in conn.execute('PRAGMA index_list("'+table+'")'):
                        if item[4]:continue
                        columns=[row[2] for row in conn.execute('PRAGMA index_info("'+item[1].replace('"','""')+'")')]
                        if columns==['observation_id']:indexes.append(item[1])
                    out(kind='history_identity_indexes',table=table,indexes=indexes)
                    if indexes:
                        index=indexes[0]
                        hinted=sql.replace(' FROM "'+table+'" WHERE',' FROM "'+table+'" INDEXED BY "'+index.replace('"','""')+'" WHERE')
                        out(kind='history_covering_query_plan',table=table,plan=conn.execute('EXPLAIN QUERY PLAN '+hinted,(proof['max_rowid'],)).fetchall())
                        class IndexedConnection:
                            def execute(self,query,*args):
                                if query.startswith('SELECT "'+alias+'",typeof(observation_id)'):
                                    query=query.replace('FROM "'+table+'"','FROM "'+table+'" INDEXED BY "'+index.replace('"','""')+'"')
                                return conn.execute(query,*args)
                        part_started=time.monotonic();actual=ns['identity_proof'](IndexedConnection(),table,proof['max_rowid'])
                        out(kind='history_validation_phase',phase=table,elapsed_sec=round(time.monotonic()-part_started,3),matched=actual==proof,row_count=actual['row_count'],covering_index=True)
                codec=ns['_runtime_projection']()
                queries=[
                    ('source_overlap','SELECT 1 FROM archived_passive_rejections a JOIN passive_market_observations p ON p.rowid=a.source_rowid OR p.observation_id=a.observation_id LIMIT 1',()),
                    ('rejected_membership','SELECT 1 FROM archived_passive_rejections a LEFT JOIN g1_dataset_membership g ON g.observation_id=a.observation_id AND g.dataset_contract_version=? WHERE g.observation_id IS NULL OR g.source_record_sha256 IS NOT a.source_record_sha256 OR g.forecast_eval_eligible IS NOT 0 OR g.q_to_p_eligible IS NOT 0 LIMIT 1',(state['runtime_projection']['rejected_index']['dataset_contract_version'],)),
                    ('admitted_membership','SELECT 1 FROM archived_passive_rejections a JOIN g1_dataset_membership g USING(observation_id) WHERE g.forecast_eval_eligible IS NOT 0 OR g.q_to_p_eligible IS NOT 0 LIMIT 1',())]
                for phase,query,params in queries:
                    out(kind='runtime_query_plan',phase=phase,plan=conn.execute('EXPLAIN QUERY PLAN '+query,params).fetchall())
                    part_started=time.monotonic();found=conn.execute(query,params).fetchone()
                    out(kind='runtime_query_timing',phase=phase,elapsed_sec=round(time.monotonic()-part_started,3),conflict_present=found is not None)
                part_started=time.monotonic()
                codec.validate_runtime_projection(conn,state['runtime_projection'],retired_rowids=state['retired_rowids']['passive_market_observations'])
                out(kind='history_validation_phase',phase='runtime_projection',elapsed_sec=round(time.monotonic()-part_started,3),matched=True)
            except Exception as exc:out(kind='history_diagnostic_error',error_type=type(exc).__name__,sqlite_errorname=getattr(exc,'sqlite_errorname',None))
            finally:conn.close()
            head=run(['git','-C','/opt/seiltanzer','rev-parse','HEAD'])
            out(kind='git',observed_head=head.stdout.strip())
            st=os.statvfs('/');out(kind='capacity',free_bytes=st.f_bavail*st.f_frsize)
            sizes=run(['du','-sk','/var/log/journal','/var/cache/apt','/root/.cache/pip','/opt/seiltanzer/.git','/opt/seiltanzer/data/backups','/tmp'],timeout=8)
            out(kind='disposable_capacity_inventory',rows=sizes.stdout.splitlines())
            local=Path('/opt/seiltanzer/data/backups/local')
            for p in local.glob('.*.tmp.sqlite3'):
                try:s=p.lstat()
                except OSError:continue
                out(kind='startup_temp_metadata',name=p.name,logical_bytes=s.st_size,allocated_bytes=s.st_blocks*512,modified=s.st_mtime)
            r=run(['curl','-sS','--max-time','3','-o','/dev/null','-w','%{http_code}','http://127.0.0.1:8790/api/state'])
            out(kind='local_http',code=r.stdout[-3:],returncode=r.returncode)
            out(kind='safety',db_queries=0,provider_calls=0,acks=0,restarts=0,mutations=0,observation_may_be_intermediate=True)
            PY

      - name: Verify public HTTP from hosted runner; no AI request
        run: |
          set -euo pipefail
          for path in / /api/state; do
            code=$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output /dev/null --write-out '%{http_code}' "http://94.241.171.182:8790$path")
            echo "public_path=$path http_code=$code"
            test "$code" = 200
          done
