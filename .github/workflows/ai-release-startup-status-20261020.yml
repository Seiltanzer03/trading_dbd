name: ai-release-startup-status-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
concurrency:
  group: production-seiltanzer
  queue: max
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Retire unused local runner code after hosted-check migration
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 150s
          script: |
            set -euo pipefail
            exec 9>/opt/seiltanzer/.deployment-git-maintenance.lock
            flock -w 10 9
            /usr/bin/python3 -u - <<'PY'
            import json,os,pwd,shutil,stat,subprocess
            from pathlib import Path
            def out(**row):print(json.dumps(row,sort_keys=True),flush=True)
            def run(args,timeout=10):return subprocess.run(args,text=True,capture_output=True,timeout=timeout,check=True)
            def app():return run(['systemctl','show','seiltanzer','-p','MainPID','-p','NRestarts','-p','ActiveState']).stdout
            before=app();assert 'ActiveState=active' in before
            assert run(['git','-C','/opt/seiltanzer','rev-parse','HEAD']).stdout.strip()=='0ca3bd68251135cbc22586a02f97214551bcafa8'
            root=Path('/opt/actions-runner')
            assert pwd.getpwnam('github-runner').pw_uid==1000
            assert root.resolve()==root and root.stat().st_uid==1000 and root.stat().st_ino==531026
            unit='actions.runner.Seiltanzer03-trading_dbd.seiltanzer-prod-1.service'
            assert (root/'.service').is_file() and not (root/'.service').is_symlink()
            assert (root/'.service').read_text().strip()==unit
            working=run(['systemctl','show',unit,'-p','WorkingDirectory','--value']).stdout.strip()
            assert working==str(root)
            assert run(['systemctl','show',unit,'-p','User','--value']).stdout.strip()=='github-runner'
            installed={'bin':str(root/'bin.2.337.0'),'externals':str(root/'externals.2.337.0')}
            assert {name:os.readlink(root/name) for name in installed}==installed
            candidates=[root/'_work/_update',root/'bin.2.338.0',root/'externals.2.338.0',root/'bin.2.337.0',root/'externals.2.337.0']
            identities={}
            for p in candidates:
                info=p.lstat()
                assert stat.S_ISDIR(info.st_mode) and info.st_uid==1000 and p.resolve()==p and info.st_dev==root.stat().st_dev
                identities[str(p)]=(info.st_dev,info.st_ino)
            def active_workers():
                found=[]
                for p in Path('/proc').iterdir():
                    if not p.name.isdigit():continue
                    try:
                        if (p/'comm').read_text().strip().startswith('Runner.Worker'):found.append(int(p.name))
                    except (FileNotFoundError,ProcessLookupError):pass
                return found
            assert not active_workers(),'RUNNER_JOB_ACTIVE_NO_STOP'
            # Freeze before the decisive idle check: no new assignment can
            # enter between that check and retirement. Suppress automatic
            # restart before killing the idle frozen cgroup; systemctl stop
            # alone would automatically thaw a unit before stopping it.
            group=run(['systemctl','show',unit,'-p','ControlGroup','--value']).stdout.strip()
            cgroot=Path('/sys/fs/cgroup');cgroup=cgroot/group.lstrip('/')
            assert group.startswith('/system.slice/') and cgroup.resolve().is_relative_to(cgroot)
            dropdir=Path('/run/systemd/system')/(unit+'.d')
            drop=dropdir/'90-seiltanzer-capacity-retirement.conf'
            assert not os.path.lexists(drop)
            frozen=False;created=False
            try:
                run(['systemctl','freeze',unit],timeout=8);frozen=True
                assert 'frozen 1' in (cgroup/'cgroup.events').read_text().splitlines()
                assert not active_workers(),'RUNNER_BUSY_FROZEN_NO_STOP'
                dropdir.mkdir(parents=True,exist_ok=True)
                assert dropdir.resolve()==dropdir and not dropdir.is_symlink() and dropdir.stat().st_uid==0
                with drop.open('x') as f:
                    created=True
                    f.write('[Service]\nRestart=no\n')
                run(['systemctl','daemon-reload'])
                assert run(['systemctl','show',unit,'-p','Restart','--value']).stdout.strip()=='no'
                run(['systemctl','disable',unit])
                assert 'frozen 1' in (cgroup/'cgroup.events').read_text().splitlines()
                assert not active_workers(),'RUNNER_BUSY_BEFORE_RETIREMENT'
                # Fatal signals cannot resume the frozen listener to accept a
                # job. The temporary Restart=no prevents manager replacement.
                run(['systemctl','kill','--kill-who=all','--signal=SIGKILL',unit])
                run(['systemctl','stop',unit],timeout=25)
            finally:
                try:
                    if frozen:
                        thaw=subprocess.run(['systemctl','thaw',unit],text=True,capture_output=True,timeout=8)
                        if thaw.returncode:
                            # An already stopped empty cgroup needs no thaw.
                            ended=run(['systemctl','show',unit,'-p','MainPID','-p','ActiveState']).stdout
                            assert 'MainPID=0' in ended and 'ActiveState=inactive' in ended
                            assert not cgroup.exists() or not (cgroup/'cgroup.procs').read_text().strip()
                finally:
                    if created:
                        drop.unlink();run(['systemctl','daemon-reload'])
            state=run(['systemctl','show',unit,'-p','MainPID','-p','ActiveState']).stdout
            assert 'MainPID=0' in state and 'ActiveState=inactive' in state
            assert not active_workers(),'RUNNER_JOB_ACTIVE_NO_DELETE'
            assert run(['systemctl','show',unit,'-p','UnitFileState','--value']).stdout.strip()=='disabled'
            # Kernel descriptors/mappings must no longer refer to any target.
            names=[str(p) for p in candidates]
            for proc in Path('/proc').iterdir():
                if not proc.name.isdigit():continue
                try:
                    links=[proc/'cwd',proc/'exe',*(proc/'fd').iterdir()]
                    for entry in links:
                        try:target=os.readlink(entry)
                        except (FileNotFoundError,ProcessLookupError):continue
                        assert not any(target==name or target.startswith(name+'/') for name in names),'RUNNER_CODE_IN_USE_NO_DELETE'
                    maps=(proc/'maps').read_text()
                    assert not any(name+'/' in maps for name in names),'RUNNER_CODE_MAPPED_NO_DELETE'
                except (FileNotFoundError,ProcessLookupError):pass
            assert shutil.rmtree.avoids_symlink_attacks
            free_before=shutil.disk_usage('/').free
            removed=[]
            for p in candidates:
                info=p.lstat()
                assert not p.is_symlink() and p.resolve()==p and (info.st_dev,info.st_ino)==identities[str(p)]
                shutil.rmtree(p);removed.append(str(p))
            assert app()==before,'APPLICATION_PROCESS_CHANGED'
            assert (root/'.service').is_file()
            free=shutil.disk_usage('/').free
            out(kind='unused_runner_retired',removed_paths=removed,free_before_bytes=free_before,free_bytes=free,runner_unit_disabled=True,configuration_preserved=True,application_unchanged=True)
            assert free>=1024**3+32*1024**2,'RESERVE_NOT_YET_RECOVERED'
            out(kind='safety',app_restarts=0,database_writes=0,provider_calls=0,acks=0,orders=0,trade_data_deletions=0)
            PY
