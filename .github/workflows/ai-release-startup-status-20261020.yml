name: ai-release-startup-status-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Read capacity, existing origin scopes and current runtime without changing them
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 45s
          script: |
            set -euo pipefail
            cd /opt/seiltanzer
            test "$(git rev-parse HEAD)" = cbe12ff6b719ed8c2f25f568c1ab5805c807791b
            /opt/seiltanzer/.venv/bin/python -u - <<'PY'
            import json,os,re,runpy,subprocess,time,urllib.request
            from pathlib import Path
            def out(**row):print(json.dumps(row,sort_keys=True))
            props=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','-p','NRestarts','-p','ActiveState'],text=True,timeout=5)
            st=os.statvfs('/');db=Path('/opt/seiltanzer/data/trades.db');wal=Path(str(db)+'-wal')
            out(kind='production',observed_ts=time.time(),properties=props.splitlines(),free_bytes=st.f_bavail*st.f_frsize,db_bytes=db.stat().st_size,wal_bytes=wal.stat().st_size if wal.exists() else 0)
            for path in ('/api/state','/api/ai/snapshot/status','/api/research/runtime/worker-status'):
                start=time.monotonic()
                with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=5) as response:row=json.loads(response.read(2*1024**2))
                if path=='/api/state':
                    tick=row.get('tick') or {};price=(tick.get('feeds') or {}).get('price') or {}
                    fields={'instrument':tick.get('instrument'),'source':price.get('source'),'status':price.get('status'),'source_ts':price.get('ts'),'tick_ts':tick.get('ts')}
                elif path.endswith('worker-status'):
                    worker=row.get('worker') or {};fields={k:worker.get(k) for k in ('current_phase','core_stage','last_error','disk_pause_active','acceptance_gate_active','acceptance_gate_run_id')}
                else:fields={k:row.get(k) for k in ('ready','building','age_sec','build_n','build_ms','last_error')}
                out(kind='runtime',path=path,elapsed_ms=round((time.monotonic()-start)*1000,1),fields=fields)
            from seiltanzer.research_acceptance_gate import read_acceptance_gate
            gate=read_acceptance_gate();out(kind='acceptance_gate',owner=gate.get('acceptance_run_id') if gate else None,expected_sha=gate.get('expected_sha') if gate else None,expires_at=gate.get('expires_at') if gate else None)
            helper=runpy.run_path('/opt/seiltanzer/scripts/sqlite_replication_origin.py',run_name='readonly_origin_probe')
            scopes=sorted(p for p in Path('/tmp').glob('seiltanzer-sqlite-tools-*') if re.fullmatch(r'seiltanzer-sqlite-tools-[0-9]{1,20}',p.name))
            out(kind='origin_scope_count',count=len(scopes),inspected_limit=8)
            for path in scopes[:8]:
                if path.is_symlink() or not path.is_dir():raise RuntimeError('UNSAFE_ORIGIN_SCOPE')
                binary=path/'sqlite3_rsync';state=path/'origin.json'
                targets=helper['targets'](binary,state)
                out(kind='origin_scope',name=path.name,control_present=(path/'control.py').is_file(),state_present=state.is_file(),stop_present=(path/'origin.stop').exists(),target_pids=[pid for pid,birth in targets])
            out(kind='safety',review_posts=0,provider_calls=0,database_writes=0,signals=0,cleanup_calls=0,restarts=0,acks=0,orders=0)
            PY
