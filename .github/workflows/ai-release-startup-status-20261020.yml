name: ai-release-startup-status-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Verify updater service ownership and actual root reserve
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30s
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = 0ca3bd68251135cbc22586a02f97214551bcafa8
            /opt/seiltanzer/.venv/bin/python -u - <<'PY'
            import json,os,stat,subprocess,time,urllib.request
            from pathlib import Path
            def out(**row):print(json.dumps(row,sort_keys=True))
            st=os.statvfs('/');free=st.f_bavail*st.f_frsize
            out(kind='capacity',free_bytes=free,background_minimum_bytes=1024**3+32*1024**2,background_admitted=free>=1024**3+32*1024**2)
            out(kind='filesystem_reserve',total_bytes=st.f_blocks*st.f_frsize,root_free_bytes=st.f_bfree*st.f_frsize,reserved_bytes=(st.f_bfree-st.f_bavail)*st.f_frsize)
            service=Path('/opt/actions-runner/.service')
            if service.is_file() and not service.is_symlink() and service.stat().st_size<512:
                unit=service.read_text().strip()
                import re
                assert re.fullmatch(r'actions\.runner\.[A-Za-z0-9_.-]+\.service',unit)
                info=subprocess.run(['systemctl','show',unit,'-p','Id','-p','ActiveState','-p','SubState','-p','MainPID','-p','WorkingDirectory','-p','User','-p','UnitFileState','-p','FragmentPath'],capture_output=True,text=True,timeout=5)
                out(kind='local_runner_unit',properties=info.stdout.splitlines(),returncode=info.returncode)
            else:out(kind='local_runner_unit',available=False)
            for name in ('/opt/actions-runner','/opt/actions-runner/.service','/opt/actions-runner/_work/_update','/opt/actions-runner/bin.2.338.0','/opt/actions-runner/externals.2.338.0','/opt/actions-runner/bin.2.337.0','/opt/actions-runner/externals.2.337.0'):
                p=Path(name);info=p.lstat()
                out(kind='runner_identity',name=name,resolved=str(p.resolve()),symlink=p.is_symlink(),uid=info.st_uid,gid=info.st_gid,mode=stat.S_IMODE(info.st_mode),device=info.st_dev,inode=info.st_ino)
            props=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','-p','NRestarts','-p','ActiveState'],text=True,timeout=3)
            out(kind='service',properties=props.splitlines())
            for path in ('/api/state','/api/ai/snapshot/status'):
                started=time.monotonic()
                with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=5) as response:
                    raw=response.read(2*1024**2+1);assert len(raw)<=2*1024**2
                    row=json.loads(raw)
                out(kind='endpoint',path=path,http=response.code,elapsed_ms=round((time.monotonic()-started)*1000,1),fields={k:row.get(k) for k in ('ready','building','age_sec','build_ms','last_error') if k in row})
                quote=(row.get('feeds') or {}).get('price') or {}
                if quote:
                    stamp=quote.get('ts');age=round(time.time()-stamp,3) if type(stamp) in (int,float) else None
                    out(kind='quote_clock',age_sec=age,status=quote.get('status'),source=quote.get('source'),derived=quote.get('derived'))
            out(kind='safety',database_writes=0,provider_calls=0,review_posts=0,restarts=0,orders=0)
            PY
