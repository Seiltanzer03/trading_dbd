name: ai-release-startup-status-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
  actions: write
jobs:
  existing_release_publications:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Verify installed d2222a without restarting or changing the position
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 20s
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = d2222a28144e85dbf094c8954c54426ce550f96c
            test "$(systemctl show -p MainPID --value seiltanzer)" = 3768673
            test "$(systemctl is-active seiltanzer)" = active
            curl -fsS --connect-timeout 1 --max-time 3 -o /dev/null http://127.0.0.1:8790/api/state
            echo EXISTING_INSTALLED_RELEASE_HEALTHY_NO_RESTART
      - name: Start only absent exact-generation publications independently from the unavailable BLS transport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import json,os,urllib.request
          base='https://api.github.com/repos/Seiltanzer03/trading_dbd'
          sha='d2222a28144e85dbf094c8954c54426ce550f96c'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def api(path,body=None):
              data=None if body is None else json.dumps(body).encode()
              request=urllib.request.Request(base+path,data=data,headers=headers)
              with urllib.request.urlopen(request,timeout=15) as response:
                  raw=response.read()
                  return json.loads(raw) if raw else None
          assert api('/git/ref/heads/main')['object']['sha']==sha,'MAIN_CHANGED'
          states=api('/commits/'+sha+'/status')['statuses']
          latest={}
          for row in states:latest.setdefault(row['context'],row['state'])
          assert latest.get('ci/full-webkit')=='success','EXACT_CI_NOT_GREEN'
          for workflow in ('mathematical-edge.yml','fomc-prospective-capture.yml','edge-family-sources.yml'):
              runs=api('/actions/workflows/'+workflow+'/runs?head_sha='+sha+'&per_page=100')['workflow_runs']
              existing=[r for r in runs if r['head_sha']==sha and r['head_branch']=='main' and r['event'] in ('workflow_dispatch','schedule') and (r['status']!='completed' or r['conclusion']=='success')]
              if existing:
                  print(json.dumps({'workflow':workflow,'existing_run_ids':[r['id'] for r in existing],'dispatched':False}),flush=True)
                  continue
              assert api('/git/ref/heads/main')['object']['sha']==sha,'MAIN_CHANGED_BEFORE_DISPATCH'
              api('/actions/workflows/'+workflow+'/dispatches',{'ref':'main','inputs':{'expected_sha':sha}})
              print(json.dumps({'workflow':workflow,'expected_sha':sha,'dispatched':True,'completion_not_claimed':True}),flush=True)
          PY
