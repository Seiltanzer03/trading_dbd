name: bounded-current-review-comparison-20261022
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
concurrency:
  group: production-seiltanzer
  queue: max
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ffdc513b5acb8746b54cdf852b55218ca21be336
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -q -e '.[research]' paramiko
      - name: Export at most 32 real frozen reviews and their new actual paths read-only
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: >-
          python -m scripts.export_unified_edge_reviews --max-reviews 32
          --expected-sha "$EXPECTED_SHA" --output unified_actual_reviews.json
      - name: Replay existing frozen schemes off-host without fitting or paid calls
        run: >-
          python -m scripts.run_unified_edge_comparison --reviews unified_actual_reviews.json
          --expected-sha "$EXPECTED_SHA" --output unified_edge_comparison.json
      - name: Publish aggregate evidence only, keeping raw reviews off public logs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.run_unified_edge_comparison import summarize
          report=json.loads(Path('unified_edge_comparison.json').read_text())
          assert report['paid_llm_calls']==0 and report['production_or_database_writes']==0
          summary={key:report.get(key) for key in ('version','created_ts','expected_sha','source_exported_ts','historical_profit_proven','available','review_n','instrument_coverage','reason','actual_execution_observations')}
          summary['rejected_n']=len(report.get('rejected') or [])
          summary['schemes']={name:report['summary'].get(name) for name in ('balanced','llm20','quant100','legacy_control')}
          partial={}
          for policy in ('CLOSE_10','CLOSE_25','CLOSE_50'):
              rows=[row for row in report.get('reviews',[]) if (((row.get('schemes') or {}).get('balanced') or {}).get('selection') or {}).get('selected_policy')==policy]
              partial[policy]={'review_n':len(rows),'distinct_trade_n':len({row['trade_id'] for row in rows}),
                  'frozen_balanced_selection_only':True,'summary':summarize(rows).get('balanced')}
          summary['partial_close_descriptive_subsets']=partial
          summary['evidence_scope']='RECORDED_PATH_COUNTERFACTUAL_WITH_FROZEN_COST_ESTIMATES_NOT_BROKER_PROFIT_OR_CAUSAL_EFFECT'
          Path('comparison_aggregate.json').write_text(json.dumps(summary,sort_keys=True,allow_nan=False))
          print('BOUNDED_COMPARISON_AGGREGATE '+json.dumps(summary,sort_keys=True,allow_nan=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: comparison-aggregate-${{ env.EXPECTED_SHA }}
          path: comparison_aggregate.json
          if-no-files-found: error
          retention-days: 14
