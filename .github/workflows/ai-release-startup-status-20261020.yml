name: ai-release-startup-status-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read exact post-restart unit condition without another guard invocation
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30s
          script: |
            set -euo pipefail
            git -C /opt/seiltanzer rev-parse HEAD
            systemctl show seiltanzer -p MainPID -p ControlPID -p ActiveState -p SubState -p NRestarts -p Result -p ExecCondition -p ConditionResult -p ExecMainStatus -p ExecMainStartTimestamp -p MemoryCurrent
            journalctl -u seiltanzer --since '-16 minutes' -n 200 -o cat --no-pager | /usr/bin/python3 -c 'import sys; print("\n".join(line.strip() for line in sys.stdin if line.startswith("STARTUP_PHASE phase=") or line.startswith("  File \"/opt/seiltanzer/") or "start_allowed" in line or "Skipped due to" in line or "Failed with result" in line or "Control process exited" in line))'
            df --output=avail -B1 /
            echo 'READ_ONLY_METADATA_NO_DB_OR_RESTART'
