name: ai-release-startup-status-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Inspect staging entry metadata only
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 35s
          script: |
            set -euo pipefail
            /usr/bin/python3 -u - <<'PY'
            import json,os,stat,subprocess
            from pathlib import Path
            root=Path('/opt/actions-runner/_work/_update')
            assert root.resolve()==root and not root.is_symlink()
            for path in root.iterdir():
                info=path.lstat()
                print(json.dumps({'kind':'staging_entry','name':path.name,'type':'directory' if stat.S_ISDIR(info.st_mode) else 'file' if stat.S_ISREG(info.st_mode) else 'other','bytes':info.st_size,'modified':info.st_mtime}))
            unit='actions.runner.Seiltanzer03-trading_dbd.seiltanzer-prod-1.service'
            props=subprocess.check_output(['systemctl','show',unit,'-p','ActiveState','-p','ControlGroup','-p','FreezerState'],text=True,timeout=5)
            print(json.dumps({'kind':'runner','properties':props.splitlines(),'unified_cgroup':Path('/sys/fs/cgroup/cgroup.controllers').is_file()}))
            print(json.dumps({'kind':'safety','db_writes':0,'restarts':0,'cache_deletions':0,'provider_calls':0}))
            PY
