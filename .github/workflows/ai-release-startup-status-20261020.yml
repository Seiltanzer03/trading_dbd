name: ai-release-startup-status-20261020
# Nonblocking post-model 227sec snapshot diagnosis 2026-10-21T17:31Z
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Sample Python stacks without locals, signals, restart or app installation
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 90s
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = cef5170312242e339460da1400441bfecf5f1e5a
            /usr/bin/python3 -u - <<'PY'
            import json,os,shutil,subprocess,tempfile,time
            from pathlib import Path
            pid=int(subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','--value'],text=True,timeout=5))
            assert pid>0
            probe=Path(tempfile.mkdtemp(prefix='seiltanzer-stack-probe-',dir='/tmp'))
            try:
                install=subprocess.run(['/opt/seiltanzer/.venv/bin/python','-m','pip','install','--quiet','--disable-pip-version-check','--no-cache-dir','--no-deps','--only-binary=:all:','--timeout','10','--retries','0','--target',str(probe),'py-spy==0.4.2'],text=True,capture_output=True,timeout=35)
                print(json.dumps({'kind':'temporary_profiler','install_returncode':install.returncode}))
                if install.returncode:raise SystemExit('TEMPORARY_PROFILER_UNAVAILABLE_NO_PERMISSION_OR_NETWORK_WORKAROUND')
                tool=probe/'bin/py-spy'
                assert tool.is_file()
                for sample in range(3):
                    result=subprocess.run([str(tool),'dump','--pid',str(pid),'--nonblocking'],text=True,capture_output=True,timeout=8)
                    print(json.dumps({'kind':'stack_sample','sample':sample,'returncode':result.returncode,'nonblocking':True,'locals':False}))
                    if result.returncode:
                        print(json.dumps({'kind':'stack_error','text':result.stderr[:600]}))
                        raise SystemExit('STACK_OBSERVATION_UNAVAILABLE_NO_PERMISSION_CHANGE')
                    for line in result.stdout.splitlines()[:220]:
                        if any(mark in line.lower() for mark in ['authorization','password','secret','api_key','token=']):continue
                        print(json.dumps({'kind':'stack','sample':sample,'line':line[:600]}))
                    if sample<2:time.sleep(2)
            finally:
                assert probe.parent==Path('/tmp') and probe.name.startswith('seiltanzer-stack-probe-') and not probe.is_symlink()
                shutil.rmtree(probe)
                print(json.dumps({'kind':'stack_safety','temporary_tool_removed':True,'app_files_changed':0,'database_writes':0,'signals_sent':0,'provider_calls':0,'acks':0,'restarts':0}))
            PY
      - name: Observe service and snapshot status; no provider or database call
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 50s
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = cef5170312242e339460da1400441bfecf5f1e5a
            /usr/bin/python3 -u - <<'PY'
            import json,os,subprocess,time,urllib.request
            def out(**data):print(json.dumps(data,sort_keys=True))
            props=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','-p','ActiveState','-p','SubState','-p','NRestarts','-p','MemoryCurrent'],text=True,timeout=5)
            out(kind='service',properties=props.splitlines())
            st=os.statvfs('/');out(kind='capacity',free_bytes=st.f_bavail*st.f_frsize)
            journal=subprocess.run(['journalctl','-u','seiltanzer','--since','2026-10-21 16:32:00','--no-pager','-n','100','-o','cat'],text=True,capture_output=True,timeout=5)
            for line in journal.stdout.splitlines():
                if any(mark in line.lower() for mark in ['authorization','password','secret','api_key','x-amz','access_key','token=','prompt=']):continue
                if len(line)>1200:continue
                if any(mark in line.lower() for mark in ['snapshot','materializ','timeout','research','error','traceback','slow','api/ai']):out(kind='diagnostic_journal',line=line)
            for attempt in range(1,4):
                started=time.monotonic()
                try:
                    with urllib.request.urlopen('http://127.0.0.1:8790/api/ai/snapshot/status',timeout=5) as response:
                        body=json.loads(response.read(100000))
                        out(kind='snapshot_status',attempt=attempt,http=response.code,elapsed_ms=round((time.monotonic()-started)*1000,1),fields={k:body.get(k) for k in ['ready','building','invalidated_reason','build_ms','build_started_at','build_n','age_sec','last_error','snapshot_budget']},has_trade=body.get('current_trade_id') is not None)
                    break
                except (TimeoutError,ConnectionError,OSError,ValueError) as exc:
                    out(kind='snapshot_status',attempt=attempt,error=type(exc).__name__,elapsed_ms=round((time.monotonic()-started)*1000,1))
            out(kind='safety',provider_calls=0,review_posts=0,db_queries=0,acks=0,restarts=0,mutations=0)
            PY
      - name: Verify public HTTP without AI request
        run: |
          set -euo pipefail
          for path in / /api/state; do
            code=$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output /dev/null --write-out '%{http_code}' "http://94.241.171.182:8790$path")
            echo "public_path=$path http_code=$code"
            test "$code" = 200
          done
