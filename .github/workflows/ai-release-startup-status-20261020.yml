name: ai-release-startup-status-20261020
'on':
  push:
    branches:
    - ops/history-cutover-status-20261019
    paths:
    - .github/workflows/ai-release-startup-status-20261020.yml
permissions:
  contents: read
  actions: write
  statuses: write
concurrency:
  group: production-seiltanzer
  queue: max
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      EXPECTED_SHA: d2222a28144e85dbf094c8954c54426ce550f96c
      ACCEPTANCE_RUN_ID: ${{ github.run_id }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: d2222a28144e85dbf094c8954c54426ce550f96c
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Require the current exact already-green main
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash scripts/require_current_main.sh
    - name: Verify current exact-SHA CI is green
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nbody=$(curl -fsS --max-time 8 \\\n  -H \"Accept: application/vnd.github+json\" \\\n  -H \"Authorization: Bearer $GH_TOKEN\" \\\n  -H \"X-GitHub-Api-Version: 2022-11-28\" \\\n  \"https://api.github.com/repos/${{ github.repository }}/commits/${EXPECTED_SHA}/status\")\nverdict=$(BODY=\"$body\" python3 - <<'PY'\nimport json, os\nbody=json.loads(os.environ['BODY'])\nstates={str(x.get('context')):str(x.get('state')) for x in body.get('statuses',[])}\nprint(states.get('ci/full-webkit','missing'))\nPY\n)\necho \"ci/full-webkit state=$verdict\"\nif [ \"$verdict\" != \"success\" ]; then\n  echo \"::error::Manual production delivery requires an already-green exact-SHA ci/full-webkit\"\n  exit 1\nfi\n"
    - name: Verify the already installed release without reinstalling or restarting
      id: delivery
      uses: appleboy/ssh-action@v1
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 30s
        script: 'set -euo pipefail

          cd /opt/seiltanzer

          test "$(git rev-parse HEAD)" = d2222a28144e85dbf094c8954c54426ce550f96c

          test "$(systemctl show -p MainPID --value seiltanzer)" = 3768673

          test "$(systemctl is-active seiltanzer)" = active

          curl -fsS --connect-timeout 1 --max-time 5 -o /dev/null http://127.0.0.1:8790/api/state

          echo EXISTING_EXACT_SHA_DELIVERY_VERIFIED_NO_REINSTALL_NO_RESTART'
    - name: Build exact-SHA official macro transport bundle off-host
      run: "set -euo pipefail\npython -m pip install --disable-pip-version-check --quiet -e '.[research]'\npython scripts/build_offhost_macro_bundle.py \\\n  --expected-sha \"$EXPECTED_SHA\" \\\n  --acceptance-run-id \"$ACCEPTANCE_RUN_ID\" \\\n  --output \"official-macro-${ACCEPTANCE_RUN_ID}.json\"\n"
    - name: Pause research for exact-SHA production acceptance
      id: preacceptance
      uses: appleboy/ssh-action@v1
      env:
        EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        command_timeout: 20m
        envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
        script: "set -euo pipefail\ntest \"$(git -C /opt/seiltanzer rev-parse HEAD)\" = \"$EXPECTED_SHA\"\nPY=/opt/seiltanzer/.venv/bin/python\nORCH=/opt/seiltanzer/scripts/production_research_acceptance.py\ngate_owned=0\n\ncleanup_gate_on_failure() {\n  if [ \"$gate_owned\" -eq 1 ]; then\n    \"$PY\" \"$ORCH\" release-gate \\\n      --acceptance-run-id \"$ACCEPTANCE_RUN_ID\" \\\n      --expected-sha \"$EXPECTED_SHA\" || true\n  fi\n}\ntrap cleanup_gate_on_failure EXIT\n\n# Acquire the existing cooperative lease immediately after the new\n# service first becomes HTTP-ready. The worker may complete its one\n# required core cycle, but cannot start optional maintenance before\n# the readiness transaction begins.\n\"$PY\" \"$ORCH\" acquire-gate \\\n  --acceptance-run-id \"$ACCEPTANCE_RUN_ID\" \\\n  --expected-sha \"$EXPECTED_SHA\" \\\n  --ttl-seconds 7200\ngate_owned=1\n\n\"$PY\" /opt/seiltanzer/scripts/production_post_research_check.py \\\n  --expected-sha \"$EXPECTED_SHA\" \\\n  --acceptance-run-id\
          \ \"$ACCEPTANCE_RUN_ID\"\n\"$PY\" \"$ORCH\" validate-gate \\\n  --acceptance-run-id \"$ACCEPTANCE_RUN_ID\" \\\n  --expected-sha \"$EXPECTED_SHA\"\n\ntrap - EXIT\necho \"PRE_ACCEPTANCE_RESEARCH_PAUSED expected_sha=$EXPECTED_SHA acceptance_run_id=$ACCEPTANCE_RUN_ID\"\n"
    - name: Verify exact production readiness
      id: readiness
      uses: appleboy/ssh-action@v1
      env:
        EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        command_timeout: 10m
        envs: EXPECTED_SHA
        script: "set -euo pipefail\ntest \"$(git -C /opt/seiltanzer rev-parse HEAD)\" = \"$EXPECTED_SHA\"\n/opt/seiltanzer/.venv/bin/python \\\n  /opt/seiltanzer/scripts/production_readiness_check.py \\\n  --expected-sha \"$EXPECTED_SHA\" \\\n  --skip-restore-drill-low-disk\n"
    - name: Transfer verified official macro bundle over deploy channel
      uses: appleboy/scp-action@v1
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        source: official-macro-${{ github.run_id }}.json
        target: /tmp
    - name: Install fresh exact-SHA official macro bundle before smoke
      uses: appleboy/ssh-action@v1
      env:
        EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        command_timeout: 2m
        envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
        script: "set -euo pipefail\ncase \"$ACCEPTANCE_RUN_ID\" in\n  ''|*[!0-9]*) echo \"Invalid acceptance_run_id\"; exit 1 ;;\nesac\nbundle_input=\"/tmp/official-macro-${ACCEPTANCE_RUN_ID}.json\"\ntrap 'rm -f -- \"$bundle_input\"' EXIT\ntest -f \"$bundle_input\"\ntest \"$(git -C /opt/seiltanzer rev-parse HEAD)\" = \"$EXPECTED_SHA\"\n/opt/seiltanzer/.venv/bin/python \\\n  /opt/seiltanzer/scripts/install_offhost_macro_bundle.py \\\n  --input \"$bundle_input\" \\\n  --destination /opt/seiltanzer/data/research/official_macro_offhost_latest.json \\\n  --expected-sha \"$EXPECTED_SHA\" \\\n  --acceptance-run-id \"$ACCEPTANCE_RUN_ID\"\n"
    - name: Exercise exact production routes, AI and official macro data
      id: smoke
      uses: appleboy/ssh-action@v1
      env:
        EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        command_timeout: 8m
        envs: EXPECTED_SHA
        script: "set -euo pipefail\ntest \"$(git -C /opt/seiltanzer rev-parse HEAD)\" = \"$EXPECTED_SHA\"\n/opt/seiltanzer/.venv/bin/python \\\n  /opt/seiltanzer/scripts/production_functional_smoke.py \\\n  --expected-sha \"$EXPECTED_SHA\"\n"
    - name: Verify public terminal from GitHub runner
      id: public
      run: "set -euo pipefail\nurl=\"http://94.241.171.182:8790/api/state\"\nfor attempt in 1 2 3; do\n  if curl -fsS \\\n    --connect-timeout 3 \\\n    --max-time 5 \\\n    --output /tmp/public-state.json \\\n    \"$url\"; then\n    bytes=$(wc -c < /tmp/public-state.json)\n    echo \"public terminal PASS attempt=${attempt} bytes=${bytes}\"\n    exit 0\n  fi\n  echo \"public terminal attempt=${attempt}/3 failed\"\n  sleep 2\ndone\necho \"::error::Public terminal is unreachable at ${url}\"\nexit 1\n"
    - name: Verify existing exact publication mathematical_edge_latest.json
      id: mathrefresh
      uses: appleboy/ssh-action@v1
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 30s
        script: 'set -euo pipefail

          cd /opt/seiltanzer

          test "$(git rev-parse HEAD)" = d2222a28144e85dbf094c8954c54426ce550f96c

          test "$(systemctl show -p MainPID --value seiltanzer)" = 3768673

          /opt/seiltanzer/.venv/bin/python -u - <<''PYREAD''

          import json

          from pathlib import Path

          path=Path(''/opt/seiltanzer/data/research/mathematical_edge_latest.json'')

          with path.open(''rb'') as handle:raw=handle.read(500001)

          if not 0<len(raw)<=500000:raise RuntimeError(''PUBLICATION_BYTE_BOUND'')

          row=json.loads(raw)

          if row.get(''published_for_sha'')!=''d2222a28144e85dbf094c8954c54426ce550f96c'' or row.get(''production_authority'') is not False:raise RuntimeError(''EXACT_PUBLICATION_REFUSED'')

          if row.get(''publication_contract_version'')!=''active-edge-exact-sha-publication-v1'' or not row.get(''publication_run_id''):raise RuntimeError(''PUBLICATION_PROVENANCE_MISSING'')

          print(json.dumps(dict(kind=''existing_exact_publication_verified'',name=''mathematical_edge_latest.json'',size_bytes=len(raw),publication_run_id=row[''publication_run_id''],redispatched=False)))

          PYREAD'
    - name: Verify existing exact publication edge_family_sources_latest.json
      id: sourcerefresh
      uses: appleboy/ssh-action@v1
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 30s
        script: 'set -euo pipefail

          cd /opt/seiltanzer

          test "$(git rev-parse HEAD)" = d2222a28144e85dbf094c8954c54426ce550f96c

          test "$(systemctl show -p MainPID --value seiltanzer)" = 3768673

          /opt/seiltanzer/.venv/bin/python -u - <<''PYREAD''

          import json

          from pathlib import Path

          path=Path(''/opt/seiltanzer/data/research/edge_family_sources_latest.json'')

          with path.open(''rb'') as handle:raw=handle.read(1000001)

          if not 0<len(raw)<=1000000:raise RuntimeError(''PUBLICATION_BYTE_BOUND'')

          row=json.loads(raw)

          if row.get(''published_for_sha'')!=''d2222a28144e85dbf094c8954c54426ce550f96c'' or row.get(''production_authority'') is not False:raise RuntimeError(''EXACT_PUBLICATION_REFUSED'')

          if row.get(''publication_contract_version'')!=''active-edge-exact-sha-publication-v1'' or not row.get(''publication_run_id''):raise RuntimeError(''PUBLICATION_PROVENANCE_MISSING'')

          print(json.dumps(dict(kind=''existing_exact_publication_verified'',name=''edge_family_sources_latest.json'',size_bytes=len(raw),publication_run_id=row[''publication_run_id''],redispatched=False)))

          PYREAD'
    - name: Verify existing exact publication fomc_prospective_latest.json
      id: fomcrefresh
      uses: appleboy/ssh-action@v1
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 30s
        script: 'set -euo pipefail

          cd /opt/seiltanzer

          test "$(git rev-parse HEAD)" = d2222a28144e85dbf094c8954c54426ce550f96c

          test "$(systemctl show -p MainPID --value seiltanzer)" = 3768673

          /opt/seiltanzer/.venv/bin/python -u - <<''PYREAD''

          import json

          from pathlib import Path

          path=Path(''/opt/seiltanzer/data/research/fomc_prospective_latest.json'')

          with path.open(''rb'') as handle:raw=handle.read(950001)

          if not 0<len(raw)<=950000:raise RuntimeError(''PUBLICATION_BYTE_BOUND'')

          row=json.loads(raw)

          if row.get(''published_for_sha'')!=''d2222a28144e85dbf094c8954c54426ce550f96c'' or row.get(''production_authority'') is not False:raise RuntimeError(''EXACT_PUBLICATION_REFUSED'')

          if row.get(''publication_contract_version'')!=''active-edge-exact-sha-publication-v1'' or not row.get(''publication_run_id''):raise RuntimeError(''PUBLICATION_PROVENANCE_MISSING'')

          print(json.dumps(dict(kind=''existing_exact_publication_verified'',name=''fomc_prospective_latest.json'',size_bytes=len(raw),publication_run_id=row[''publication_run_id''],redispatched=False)))

          PYREAD'
    - name: Start exact-SHA post-deploy research acceptance
      id: orchestration
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\ncase \"$EXPECTED_SHA\" in\n  [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;\n  *) echo \"::error::Invalid expected_sha: $EXPECTED_SHA\"; exit 1 ;;\nesac\ncase \"$ACCEPTANCE_RUN_ID\" in\n  ''|*[!0-9]*) echo \"::error::Invalid acceptance_run_id: $ACCEPTANCE_RUN_ID\"; exit 1 ;;\nesac\npayload=$(python3 - <<'PY'\nimport json, os\nprint(json.dumps({\n    \"ref\": \"main\",\n    \"inputs\": {\n        \"expected_sha\": os.environ[\"EXPECTED_SHA\"],\n        \"acceptance_run_id\": os.environ[\"ACCEPTANCE_RUN_ID\"],\n    },\n}))\nPY\n)\ncurl --fail-with-body --silent --show-error \\\n  --retry 5 --retry-delay 2 --retry-max-time 30 --retry-all-errors \\\n  -X POST \\\n  -H \"Accept: application/vnd.github+json\" \\\n  -H \"Authorization: Bearer $GH_TOKEN\" \\\n  -H \"X-GitHub-Api-Version: 2022-11-28\" \\\n  \"https://api.github.com/repos/${{ github.repository }}/actions/workflows/production-post-research.yml/dispatches\" \\\n  -d \"$payload\"\necho \"\
        POST_RESEARCH_DISPATCHED expected_sha=$EXPECTED_SHA acceptance_run_id=$ACCEPTANCE_RUN_ID\"\n"
    - name: Release pre-acceptance gate if deploy chain failed
      if: always() && steps.preacceptance.outcome == 'success' && steps.orchestration.outcome != 'success'
      uses: appleboy/ssh-action@v1
      env:
        EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        command_timeout: 2m
        envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
        script: "/opt/seiltanzer/.venv/bin/python \\\n  /opt/seiltanzer/scripts/production_research_acceptance.py release-gate \\\n  --acceptance-run-id \"$ACCEPTANCE_RUN_ID\" \\\n  --expected-sha \"$EXPECTED_SHA\" || true\n"
    - name: Diagnose production failure
      if: failure()
      uses: appleboy/ssh-action@v1
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        command_timeout: 2m
        script: 'set +e

          echo ''=== DEPLOYED SHA ===''

          git -C /opt/seiltanzer rev-parse HEAD || true

          echo ''=== SERVICE ===''

          systemctl status seiltanzer --no-pager -l || true

          echo ''=== AI SNAPSHOT STATUS ===''

          curl -sS --max-time 5 http://127.0.0.1:8790/api/ai/snapshot/status || true

          echo

          echo ''=== MACRO STATUS ===''

          curl -sS --max-time 8 http://127.0.0.1:8790/api/research/macro/status || true

          echo

          echo ''=== RECENT JOURNAL ===''

          journalctl -u seiltanzer --since ''-15 minutes'' --no-pager -n 220 || true

          '
    - name: Publish exact-SHA production statuses
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        DELIVERY: ${{ steps.delivery.outcome }}
        PREACCEPTANCE: ${{ steps.preacceptance.outcome }}
        READINESS: ${{ steps.readiness.outcome }}
        SMOKE: ${{ steps.smoke.outcome }}
        PUBLIC: ${{ steps.public.outcome }}
        ORCHESTRATION: ${{ steps.orchestration.outcome }}
        MATHREFRESH: ${{ steps.mathrefresh.outcome }}
        SOURCEREFRESH: ${{ steps.sourcerefresh.outcome }}
        FOMCREFRESH: ${{ steps.fomcrefresh.outcome }}
      run: "set -u\nprod_state=failure\nsmoke_state=failure\nreadiness_state=failure\nif [ \"$READINESS\" = \"success\" ]; then readiness_state=success; fi\nif [ \"$SMOKE\" = \"success\" ] && [ \"$PUBLIC\" = \"success\" ]; then smoke_state=success; fi\nif [ \"$DELIVERY\" = \"success\" ] && [ \"$PREACCEPTANCE\" = \"success\" ] \\\n   && [ \"$READINESS\" = \"success\" ] \\\n   && [ \"$SMOKE\" = \"success\" ] && [ \"$PUBLIC\" = \"success\" ] \\\n   && [ \"$MATHREFRESH\" = \"success\" ] && [ \"$SOURCEREFRESH\" = \"success\" ] \\\n   && [ \"$FOMCREFRESH\" = \"success\" ] && [ \"$ORCHESTRATION\" = \"success\" ]; then\n  prod_state=success\nfi\n\npublish() {\n  state=\"$1\"; context=\"$2\"; description=\"$3\"\n  payload=\"{\\\"state\\\":\\\"$state\\\",\\\"context\\\":\\\"$context\\\",\\\"description\\\":\\\"$description\\\",\\\"target_url\\\":\\\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\\\"}\"\n  curl --fail-with-body --silent --show-error \\\n    --retry\
        \ 5 --retry-delay 2 --retry-max-time 30 --retry-all-errors \\\n    -X POST \\\n    -H \"Accept: application/vnd.github+json\" \\\n    -H \"Authorization: Bearer $GH_TOKEN\" \\\n    -H \"X-GitHub-Api-Version: 2022-11-28\" \\\n    \"https://api.github.com/repos/${{ github.repository }}/statuses/${EXPECTED_SHA}\" \\\n    -d \"$payload\"\n}\n\npublish \"$prod_state\" \"production/seiltanzer\" \\\n  \"Existing exact-SHA install; resumed readiness and functional acceptance\"\npublish \"$readiness_state\" \"g1e/storage-intelligence\" \\\n  \"Durability and bounded Intelligence readiness\"\npublish \"$readiness_state\" \"g1m/management-edge\" \\\n  \"Terminal Management Edge readiness\"\npublish \"$readiness_state\" \"g1s/short-horizon\" \\\n  \"Fast short-horizon evidence and Q maturity readiness\"\npublish \"$readiness_state\" \"g1m/local-feedback\" \\\n  \"Local management feedback readiness\"\npublish \"$smoke_state\" \"production/functional-smoke\" \\\n  \"Bounded analytics, AI Verdict,\
        \ official macro and public endpoint smoke\"\n\necho \"EXPECTED_SHA=$EXPECTED_SHA acceptance_run_id=$ACCEPTANCE_RUN_ID delivery=$DELIVERY readiness=$READINESS smoke=$SMOKE public=$PUBLIC orchestration=$ORCHESTRATION\"\ntest \"$prod_state\" = \"success\"\n"
