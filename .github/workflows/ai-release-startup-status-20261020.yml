name: ai-release-startup-status-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read log rotation configuration and allocation only
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30s
          script: |
            set -euo pipefail
            /usr/bin/python3 -u - <<'PY'
            import json,stat,subprocess
            from pathlib import Path
            root=Path('/var/log')
            for path in root.iterdir():
                if path.name.startswith(('syslog','auth.log','kern.log','daemon.log')):
                    info=path.lstat()
                    print(json.dumps({'kind':'log_metadata','name':path.name,'regular':stat.S_ISREG(info.st_mode),'links':info.st_nlink,'logical_bytes':info.st_size,'allocated_bytes':info.st_blocks*512,'uid':info.st_uid,'gid':info.st_gid,'mode':oct(stat.S_IMODE(info.st_mode)),'modified':info.st_mtime}))
            for name in ['/etc/logrotate.d/rsyslog','/usr/lib/rsyslog/rsyslog-rotate']:
                path=Path(name)
                if path.is_file() and path.stat().st_size<20000:
                    print(json.dumps({'kind':'rotation_configuration','path':name,'content':path.read_text()}))
            for args in [['logrotate','--version'],['systemctl','show','rsyslog','-p','MainPID','-p','ActiveState','-p','SubState'],['journalctl','--disk-usage']]:
                result=subprocess.run(args,text=True,capture_output=True,timeout=5)
                print(json.dumps({'kind':'metadata_command','command':args[0],'returncode':result.returncode,'lines':(result.stdout+result.stderr).splitlines()[:12]}))
            print(json.dumps({'kind':'safety','writes':0,'deletions':0,'signals':0,'app_restarts':0,'provider_calls':0,'acks':0}))
            PY
