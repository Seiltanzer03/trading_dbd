name: ai-release-startup-status-20261020
# Read-only capacity inventory after verified committed epoch; no DB operation.
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Inspect existing committed epoch and original startup admission
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 55s
          script: |
            set -euo pipefail
            /usr/bin/python3 -u - <<'PY'
            import json,os,sqlite3,subprocess,time
            from pathlib import Path
            def out(**row):print(json.dumps(row,sort_keys=True))
            props=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','-p','ActiveState','-p','SubState','-p','NRestarts'],text=True,timeout=5)
            out(kind='service',properties=props.splitlines())
            out(kind='git',head=subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True,timeout=5).strip())
            out(kind='active_guard',exists=os.path.lexists('/opt/seiltanzer/data/cutover.active'))
            for name in ('cutover.journal.json','cutover.result.json'):
                path=Path('/opt/seiltanzer/data')/name
                try:
                    assert not path.is_symlink() and path.stat().st_size<65536
                    row=json.loads(path.read_bytes())
                    out(kind='epoch',file=name,fields={key:row.get(key) for key in ('run_id','phase','service_started','abort_reason')})
                except (OSError,ValueError,AssertionError):out(kind='epoch',file=name,readable=False)
            sizes=subprocess.run(['du','-xhd1','/opt','/var','/root'],text=True,capture_output=True,timeout=20)
            out(kind='top_directory_sizes',returncode=sizes.returncode,rows=sizes.stdout.splitlines()[:60])
            directories=[Path('/opt/seiltanzer/data'),Path('/opt/seiltanzer/data/backups/local'),Path('/tmp')]
            for directory in directories:
                files=[]
                for path in directory.iterdir():
                    if path.is_symlink() or not path.is_file():continue
                    if directory.name=='tmp' and not path.name.startswith(('seiltanzer','deploy-')):continue
                    if directory.name!='tmp' and not path.name.endswith(('.db','.sqlite3','-wal','-shm','.gz','.tmp')):continue
                    info=path.stat();files.append({'name':path.name,'bytes':info.st_size,'allocated_bytes':info.st_blocks*512,'modified':info.st_mtime})
                out(kind='file_sizes',directory=str(directory),files=sorted(files,key=lambda row:row['allocated_bytes'],reverse=True)[:24])
            st=os.statvfs('/');out(kind='capacity',free_bytes=st.f_bavail*st.f_frsize)
            out(kind='safety',read_only=True,db_writes=0,provider_calls=0,acks=0,restarts=0,cutover_mutations=0)
            PY
