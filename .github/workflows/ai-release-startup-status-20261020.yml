name: ai-release-startup-status-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Identify active runner version and new updater staging
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 75s
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = 0ca3bd68251135cbc22586a02f97214551bcafa8
            /usr/bin/python3 -u - <<'PY'
            import json,os,stat,subprocess
            from pathlib import Path
            def out(**row):print(json.dumps(row,sort_keys=True))
            root=Path('/opt/actions-runner')
            for name in ('bin','externals','run.sh','runsvc.sh'):
                p=root/name
                try:out(kind='runner_active_path',name=name,symlink=p.is_symlink(),target=str(p.resolve(strict=True)))
                except OSError:out(kind='runner_active_path',name=name,unavailable=True)
            result=subprocess.run(['nice','-n','15','du','-x','-B1','--max-depth=3',str(root)],capture_output=True,text=True,timeout=15)
            rows=[]
            for line in result.stdout.splitlines():
                size,_,path=line.partition('\t')
                if size.isdigit():rows.append((int(size),path))
            out(kind='runner_usage',largest=sorted(rows,reverse=True)[:28],returncode=result.returncode)
            workers=[]
            for process in Path('/proc').iterdir():
                if not process.name.isdigit():continue
                try:
                    name=(process/'comm').read_text().strip()
                    if not name.startswith(('Runner.','Runner_','run-helper')):continue
                    workers.append({'pid':int(process.name),'name':name,'exe':os.readlink(process/'exe'),'cwd':os.readlink(process/'cwd'),'uid':process.stat().st_uid})
                except OSError:pass
            out(kind='runner_processes',processes=workers)
            for directory in (root/'_work',root/'_work'/'_update'):
                if not directory.is_dir():continue
                rows=[]
                for p in list(directory.iterdir())[:200]:
                    info=p.lstat();rows.append({'name':p.name,'regular':stat.S_ISREG(info.st_mode),'directory':stat.S_ISDIR(info.st_mode),'size':info.st_size,'allocated':info.st_blocks*512,'mtime_ns':info.st_mtime_ns})
                out(kind='runner_staging_metadata',directory=str(directory),files=rows)
            st=os.statvfs('/');out(kind='capacity',free_bytes=st.f_bavail*st.f_frsize)
            out(kind='safety',database_writes=0,provider_calls=0,deletions=0,restarts=0,orders=0)
            PY
