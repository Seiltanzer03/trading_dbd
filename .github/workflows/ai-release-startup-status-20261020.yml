      - name: Verify public HTTP from hosted runner; no AI request
        run: |
          set -euo pipefail
          for path in / /api/state; do
            code=$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output /dev/null --write-out '%{http_code}' "http://94.241.171.182:8790$path")
            echo "public_path=$path http_code=$code"
            test "$code" = 200
          done
