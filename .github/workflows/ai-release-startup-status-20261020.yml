name: ai-release-startup-status-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Bounded capacity metadata and recent sanitized provider diagnostics
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 60s
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = feecd3825fb0072bacfe2fdd1f0cc68bb0d24dd2
            /opt/seiltanzer/.venv/bin/python -u - <<'PY'
            import collections,json,os,re,stat,subprocess
            from pathlib import Path
            def out(**row):print(json.dumps(row,sort_keys=True))
            st=os.statvfs('/');out(kind='capacity',free_bytes=st.f_bavail*st.f_frsize)
            for name in ('/var/log/syslog','/var/log/syslog.1','/var/log/kern.log','/var/log/daemon.log','/opt/seiltanzer/data/trades.db','/opt/seiltanzer/data/trades.db-wal'):
                p=Path(name)
                try:
                    info=p.lstat();out(kind='file_metadata',path=name,regular=stat.S_ISREG(info.st_mode),size=info.st_size,allocated=info.st_blocks*512,inode=info.st_ino,uid=info.st_uid,gid=info.st_gid,mode=stat.S_IMODE(info.st_mode))
                except OSError:pass
            for directory in ('/tmp','/var/log','/opt/seiltanzer/data/research'):
                rows=[]
                for p in list(Path(directory).iterdir())[:500]:
                    try:
                        info=p.lstat()
                        if stat.S_ISREG(info.st_mode) and info.st_size>1024**2:rows.append((info.st_size,p.name,info.st_blocks*512))
                    except OSError:pass
                out(kind='bounded_top_files',directory=directory,files=sorted(rows,reverse=True)[:15])
            result=subprocess.run(['journalctl','-u','seiltanzer','--since','-20 minutes','-n','2000','--no-pager','-o','cat'],capture_output=True,text=True,timeout=10)
            traces=[];codes=[];counts=collections.Counter()
            allowed=('request_id','stage','event','elapsed_ms','duration_ms','exception_class','status_code','finish_reason','prompt_tokens','completion_tokens','response_bytes')
            for line in result.stdout.splitlines():
                codes+=re.findall(r'RuntimeError: ((?:combined_provider_|shadow_)[a-z_]{1,100}|OpenRouter HTTP [0-9]{3})',line)
                if 'ai_request_trace' in line or '"request_id"' in line:
                    try:row=json.loads(line[line.index('{'):])
                    except (ValueError,TypeError):continue
                    if row.get('stage') in ('provider','provider_http','provider_decode','provider_validate','provider_extended_validation','provider_transport','provider_fallback'):
                        traces.append({k:row[k] for k in allowed if k in row})
                for token in ('disk headroom','memory pressure','Traceback','snapshot','provider_unavailable'):
                    if token in line:counts[token]+=1
            out(kind='recent_provider_trace',rows=traces[-60:],normalized_codes=codes[-20:],journal_returncode=result.returncode,event_counts=dict(counts))
            out(kind='safety',provider_calls=0,review_posts=0,db_writes=0,acks=0,orders=0,restarts=0)
            PY
