name: ai-release-startup-status-20261020
# Read-only exact-ffdc post-publication quote readiness; no provider/model calls.
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read installed service and snapshot metadata without provider calls
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 60s
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = ffdc513b5acb8746b54cdf852b55218ca21be336
            /opt/seiltanzer/.venv/bin/python -u - <<'PY'
            import asyncio,json,os,sqlite3,subprocess,time,urllib.request
            props=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','-p','ActiveState','-p','SubState','-p','NRestarts','-p','MemoryCurrent'],text=True,timeout=5)
            print(json.dumps({'kind':'service','properties':props.splitlines()}))
            st=os.statvfs('/');print(json.dumps({'kind':'capacity','free_bytes':st.f_bavail*st.f_frsize}))
            started=time.monotonic()
            try:
                with urllib.request.urlopen('http://127.0.0.1:8790/api/ai/snapshot/status',timeout=15) as response:
                    body=json.loads(response.read(100000))
                    print(json.dumps({'kind':'snapshot_status','http':response.code,'elapsed_ms':round((time.monotonic()-started)*1000,1),'fields':{k:body.get(k) for k in ['ready','building','invalidated_reason','build_ms','build_started_at','build_n','age_sec','last_error','snapshot_budget']},'has_trade':body.get('current_trade_id') is not None},sort_keys=True))
            except (TimeoutError,ConnectionError,OSError,ValueError) as exc:
                print(json.dumps({'kind':'snapshot_status','error':type(exc).__name__,'elapsed_ms':round((time.monotonic()-started)*1000,1)}))
            with urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=15) as response:
                state=json.loads(response.read(2*1024**2+1))
            tick=state.get('tick') or {}; quote=(tick.get('feeds') or {}).get('price') or {}
            def age(value):
                try:return round(time.time()-float(value),3)
                except (ValueError,TypeError):return None
            print(json.dumps({'kind':'quote_readiness','has_trade':bool(tick.get('trade')),'instrument':tick.get('instrument'),'tick_age_sec':age(tick.get('ts')),'quote_age_sec':age(quote.get('ts') or quote.get('timestamp')),'quote_status':quote.get('status'),'production_authority':quote.get('production_authority'),'derived':quote.get('derived'),'is_proxy':quote.get('is_proxy')},sort_keys=True))
            async def read_canonical_tick():
                import websockets
                async with websockets.connect('ws://127.0.0.1:8790/ws',open_timeout=5,close_timeout=2,max_size=2*1024**2) as ws:
                    tick=json.loads(await asyncio.wait_for(ws.recv(),5))
                    quote=(tick.get('feeds') or {}).get('price') or {}
                    print(json.dumps({'kind':'canonical_ws_quote','has_trade':bool(tick.get('trade')),'instrument':tick.get('instrument'),'tick_age_sec':age(tick.get('ts')),'quote_age_sec':age(quote.get('ts') or quote.get('timestamp')),'quote_status':quote.get('status'),'production_authority':quote.get('production_authority'),'derived':quote.get('derived'),'is_proxy':quote.get('is_proxy')},sort_keys=True))
            asyncio.run(read_canonical_tick())
            reads=0
            connection=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=1)
            try:
                connection.execute('PRAGMA query_only=ON')
                deadline=time.monotonic()+2
                connection.set_progress_handler(lambda:int(time.monotonic()>deadline),1000)
                connection.execute('BEGIN')
                ids=('decision-dea1d12fc830d4389fb36ea8761c','decision-fd66e91498e4402dc13b81ba7b7d')
                rows=connection.execute('SELECT decision_id,status,trade_id FROM management_decisions WHERE decision_id IN (?,?)',ids).fetchall();reads+=1
                trade_ids={row[2] for row in rows}
                counts={}
                if len(trade_ids)==1:
                    trade_id=next(iter(trade_ids))
                    for table in ('management_decisions','llm_shadow_manual_actions'):
                        counts[table]=connection.execute("SELECT COUNT(*) FROM "+table+" WHERE trade_id=? AND status='pending_execution'",(trade_id,)).fetchone()[0];reads+=1
                print(json.dumps({'kind':'report_pending_continuity','previous_status':next((row[1] for row in rows if row[0]==ids[0]),None),'reported_current_status':next((row[1] for row in rows if row[0]==ids[1]),None),'same_trade':len(trade_ids)==1,'pending_counts':counts,'single_pending_command':sum(counts.values())<=1 if counts else None},sort_keys=True))
            finally:connection.close()
            print(json.dumps({'kind':'safety','provider_calls':0,'review_posts':0,'db_read_queries':reads,'db_writes':0,'acks':0,'restarts':0,'app_writes':0}))
            PY
      - name: Verify public HTTP without AI request
        run: |
          set -euo pipefail
          for path in / /api/state; do
            code=$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output /dev/null --write-out '%{http_code}' "http://94.241.171.182:8790$path")
            echo "public_path=$path http_code=$code"
            test "$code" = 200
          done
