name: ai-release-startup-status-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Read startup phase without touching the database
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30s
          script: |
            /usr/bin/python3 -u - <<'PY'
            import json,os,re,subprocess
            def run(args):return subprocess.run(args,capture_output=True,text=True,timeout=5)
            head=run(['git','-C','/opt/seiltanzer','rev-parse','HEAD']).stdout.strip()
            props=run(['systemctl','show','seiltanzer','-p','MainPID','-p','ActiveState','-p','SubState','-p','NRestarts','-p','MemoryCurrent']).stdout.splitlines()
            trace=run(['journalctl','-u','seiltanzer','--since','-12 minutes','--grep','STARTUP_PHASE','--no-pager','-n','20','-o','cat']).stdout
            phases=re.findall(r'STARTUP_PHASE phase=([a-z_.]+) elapsed_sec=([0-9.]+)',trace)
            st=os.statvfs('/')
            print(json.dumps({'head':head,'service':props,'phases':phases,'free_bytes':st.f_bavail*st.f_frsize,'database_reads':0,'database_writes':0,'restarts':0,'provider_calls':0,'orders':0}))
            PY
