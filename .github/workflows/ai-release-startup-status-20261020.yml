            fence=run(['/usr/bin/python3','/usr/local/lib/seiltanzer-history-start-guard.py','--database','/opt/seiltanzer/data/trades.db','--application-root','/opt/seiltanzer'],timeout=12)
            out(kind='startup_admission',returncode=fence.returncode,result=fence.stdout.strip()[:1200])
            import tempfile,shutil
