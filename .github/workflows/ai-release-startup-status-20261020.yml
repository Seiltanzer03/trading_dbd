name: ai-release-startup-status-20261020
# Read-only diagnosis of the existing history fence; no cutover or recovery.
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Inspect existing committed epoch and original startup admission
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 55s
          script: |
            set -euo pipefail
            /usr/bin/python3 -u - <<'PY'
            import json,os,sqlite3,subprocess,time
            from pathlib import Path
            def out(**row):print(json.dumps(row,sort_keys=True))
            props=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','-p','ActiveState','-p','SubState','-p','NRestarts'],text=True,timeout=5)
            out(kind='service',properties=props.splitlines())
            out(kind='git',head=subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True,timeout=5).strip())
            out(kind='active_guard',exists=os.path.lexists('/opt/seiltanzer/data/cutover.active'))
            for name in ('cutover.journal.json','cutover.result.json'):
                path=Path('/opt/seiltanzer/data')/name
                try:
                    assert not path.is_symlink() and path.stat().st_size<65536
                    row=json.loads(path.read_bytes())
                    out(kind='epoch',file=name,fields={key:row.get(key) for key in ('run_id','phase','service_started','abort_reason')})
                except (OSError,ValueError,AssertionError):out(kind='epoch',file=name,readable=False)
            started=time.monotonic()
            fence=subprocess.run(['/usr/bin/python3','/usr/local/lib/seiltanzer-history-start-guard.py','--database','/opt/seiltanzer/data/trades.db','--application-root','/opt/seiltanzer'],text=True,capture_output=True,timeout=12)
            try:result=json.loads(fence.stdout)
            except ValueError:result={'parse_error':True}
            out(kind='original_fence',returncode=fence.returncode,elapsed_ms=round((time.monotonic()-started)*1000,1),result=result)
            module='/opt/seiltanzer/seiltanzer/history_storage_state.py'
            ns={'__name__':'_readonly_fence_diagnostic','__file__':module}
            exec(compile(Path(module).read_bytes(),module,'exec'),ns)
            conn=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=1)
            conn.execute('PRAGMA trusted_schema=OFF');conn.execute('PRAGMA query_only=ON');conn.execute('PRAGMA cache_size=-2048')
            end=time.monotonic()+20
            conn.set_progress_handler(lambda:int(time.monotonic()>=end),1000)
            phase='state'
            try:
                started=time.monotonic();state=ns['read_history_state'](conn)
                out(kind='validation',phase=phase,elapsed_ms=round((time.monotonic()-started)*1000,1))
                for table,expected in state['retained_identity'].items():
                    phase=table;started=time.monotonic()
                    actual=ns['identity_proof'](conn,table,expected['max_rowid'])
                    out(kind='validation',phase=phase,elapsed_ms=round((time.monotonic()-started)*1000,1),matches=actual==expected,expected_rows=expected['row_count'],actual_rows=actual['row_count'],schema_matches=actual['schema_sha256']==expected['schema_sha256'],logical_matches=actual['logical_sha256']==expected['logical_sha256'])
                phase='runtime_projection';started=time.monotonic()
                ns['_runtime_projection']().validate_runtime_projection(conn,state['runtime_projection'],retired_rowids=state['retired_rowids']['passive_market_observations'])
                out(kind='validation',phase=phase,elapsed_ms=round((time.monotonic()-started)*1000,1),matches=True)
            except Exception as exc:
                out(kind='validation_failure',phase=phase,error_type=type(exc).__name__,sqlite_errorname=getattr(exc,'sqlite_errorname',None))
            finally:conn.close()
            st=os.statvfs('/');out(kind='capacity',free_bytes=st.f_bavail*st.f_frsize)
            out(kind='safety',read_only=True,db_writes=0,provider_calls=0,acks=0,restarts=0,cutover_mutations=0)
            PY
