name: ai-release-startup-status-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: production-seiltanzer
  queue: max
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: cbe12ff6b719ed8c2f25f568c1ab5805c807791b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cbe12ff6b719ed8c2f25f568c1ab5805c807791b
      - name: Verify installed healthy release and inspect bounded native Q queue
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30s
          script: |
            set -euo pipefail
            cd /opt/seiltanzer
            test "$(git rev-parse HEAD)" = cbe12ff6b719ed8c2f25f568c1ab5805c807791b
            test "$(systemctl show -p MainPID --value seiltanzer)" = 3683844
            test "$(systemctl is-active seiltanzer)" = active
            /opt/seiltanzer/.venv/bin/python -u - <<'PY'
            import json,os,sqlite3,time,urllib.request
            def out(**row):print(json.dumps(row,sort_keys=True))
            disk=os.statvfs('/');free=disk.f_bavail*disk.f_frsize
            out(kind='publication_repair_headroom',free_bytes=free)
            if free<1024**3+32*1024**2:raise RuntimeError('BACKGROUND_HEADROOM_UNAVAILABLE')
            with urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=5) as response:
                if response.code!=200:raise RuntimeError('LIVE_API_NOT_HEALTHY')
            from seiltanzer.g1_q_audit_scalability import _candidate_requests,_terminal_candidate_batch_snapshot
            db=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=.1)
            db.row_factory=sqlite3.Row
            try:
                deadline=time.monotonic()+2;db.execute('PRAGMA query_only=ON');db.set_progress_handler(lambda:time.monotonic()>deadline,1000);db.execute('BEGIN')
                rows=db.execute('SELECT q.attempt_id,q.attempt_ts,q.target_instrument,q.observation_created,q.created_observation_id,q.blocker_code,q.requested_expiry_ts,p.target_ts,p.resolution_status,p.instrument FROM g1_q_capture_attempts q LEFT JOIN passive_market_observations p ON p.observation_id=q.created_observation_id ORDER BY q.attempt_ts DESC LIMIT 5000').fetchall()
                now=time.time();requests=_candidate_requests(rows,now=now,include_diagnostics=False);candidates=_terminal_candidate_batch_snapshot(db,requests)
                due=[dict(rows[key]) for key,instrument,target in requests if candidates.get(key,(None,None))[0] is not None and candidates[key][0]>=target-1e-6]
                unique={row['created_observation_id']:row for row in due}
                head=db.execute("SELECT observation_id,instrument,captured_ts,target_ts FROM passive_market_observations WHERE resolution_status='pending' AND target_ts<=? ORDER BY target_ts LIMIT 101",(now,)).fetchall()
                first20={row['observation_id'] for row in head[:20]}
                out(kind='native_q_pending_queue',audit_attempts=len(rows),overdue_attempts=len(due),distinct_due_observations=len(unique),pending_prefix_capped_101=len(head),oldest_pending_age_sec=round(now-head[0]['target_ts'],1) if head else None,due=[dict(observation_id=key,instrument=row['instrument'],target_ts=row['target_ts'],overdue_age_sec=round(now-row['target_ts'],1),inside_native_first20=key in first20) for key,row in unique.items()])
                out(kind='native_pending_prefix',items=[dict(instrument=row['instrument'],target_ts=row['target_ts']) for row in head[:20]])
            except sqlite3.OperationalError as exc:out(kind='native_q_pending_queue',available=False,error_class=type(exc).__name__,deadline_sec=2)
            finally:db.close()
            out(kind='safety',database_writes=0,provider_calls=0,review_posts=0,restarts=0,acks=0,orders=0,source_timestamps_modified=False,readiness_override=False)
            PY
      - name: Start exact-SHA mathematical edge refresh off-host
        id: mathrefresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: "set -euo pipefail\npayload=$(python3 - <<'PY'\nimport json, os\nprint(json.dumps({'ref': 'main', 'inputs': {'expected_sha': os.environ['EXPECTED_SHA']}}))\nPY\n)\ncurl --fail-with-body --silent --show-error \\\n  --retry 3 --retry-delay 2 --retry-max-time 15 --retry-all-errors \\\n  -X POST -H \"Authorization: Bearer $GH_TOKEN\" \\\n  -H \"Accept: application/vnd.github+json\" \\\n  \"https://api.github.com/repos/${{ github.repository }}/actions/workflows/mathematical-edge.yml/dispatches\" \\\n  -d \"$payload\"\necho \"MATHEMATICAL_EDGE_REFRESH_DISPATCHED expected_sha=$EXPECTED_SHA\"\n"
      - name: Start exact-SHA source family collection off-host
        id: sourcerefresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: "set -euo pipefail\npayload=$(python3 - <<'PY'\nimport json, os\nprint(json.dumps({'ref': 'main', 'inputs': {'expected_sha': os.environ['EXPECTED_SHA']}}))\nPY\n)\ncurl --fail-with-body --silent --show-error \\\n  --retry 3 --retry-delay 2 --retry-max-time 15 --retry-all-errors \\\n  -X POST -H \"Authorization: Bearer $GH_TOKEN\" \\\n  -H \"Accept: application/vnd.github+json\" \\\n  \"https://api.github.com/repos/${{ github.repository }}/actions/workflows/edge-family-sources.yml/dispatches\" \\\n  -d \"$payload\"\necho \"EDGE_FAMILY_SOURCE_REFRESH_DISPATCHED expected_sha=$EXPECTED_SHA\"\n"
      - name: Start exact-SHA prospective FOMC capture off-host
        id: fomcrefresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: "set -euo pipefail\npayload=$(python3 - <<'PY'\nimport json, os\nprint(json.dumps({'ref': 'main', 'inputs': {'expected_sha': os.environ['EXPECTED_SHA']}}))\nPY\n)\ncurl --fail-with-body --silent --show-error \\\n  --retry 3 --retry-delay 2 --retry-max-time 15 --retry-all-errors \\\n  -X POST -H \"Authorization: Bearer $GH_TOKEN\" \\\n  -H \"Accept: application/vnd.github+json\" \\\n  \"https://api.github.com/repos/${{ github.repository }}/actions/workflows/fomc-prospective-capture.yml/dispatches\" \\\n  -d \"$payload\"\necho \"FOMC_PROSPECTIVE_REFRESH_DISPATCHED expected_sha=$EXPECTED_SHA\"\n"

