name: ai-release-startup-status-20261020
# Read-only post-publication timeout diagnosis 2026-10-21T16:37Z
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Observe service and snapshot status; no provider or database call
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 50s
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = 6cbf58c873bc863d879c530331258eeeeff1a3c7
            /usr/bin/python3 -u - <<'PY'
            import json,os,subprocess,time,urllib.request
            def out(**data):print(json.dumps(data,sort_keys=True))
            props=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','-p','ActiveState','-p','SubState','-p','NRestarts','-p','MemoryCurrent'],text=True,timeout=5)
            out(kind='service',properties=props.splitlines())
            st=os.statvfs('/');out(kind='capacity',free_bytes=st.f_bavail*st.f_frsize)
            journal=subprocess.run(['journalctl','-u','seiltanzer','--since','2026-10-21 16:32:00','--no-pager','-n','100','-o','cat'],text=True,capture_output=True,timeout=5)
            for line in journal.stdout.splitlines():
                if any(mark in line.lower() for mark in ['authorization','password','secret','api_key','x-amz','access_key','token=','prompt=']):continue
                if len(line)>1200:continue
                if any(mark in line.lower() for mark in ['snapshot','materializ','timeout','research','error','traceback','slow','api/ai']):out(kind='diagnostic_journal',line=line)
            for attempt in range(1,4):
                started=time.monotonic()
                try:
                    with urllib.request.urlopen('http://127.0.0.1:8790/api/ai/snapshot/status',timeout=5) as response:
                        body=json.loads(response.read(100000))
                        out(kind='snapshot_status',attempt=attempt,http=response.code,elapsed_ms=round((time.monotonic()-started)*1000,1),fields={k:body.get(k) for k in ['ready','building','reason','status','last_error','snapshot_age_sec']},has_trade=body.get('current_trade_id') is not None)
                    break
                except (TimeoutError,ConnectionError,OSError,ValueError) as exc:
                    out(kind='snapshot_status',attempt=attempt,error=type(exc).__name__,elapsed_ms=round((time.monotonic()-started)*1000,1))
            out(kind='safety',provider_calls=0,review_posts=0,db_queries=0,acks=0,restarts=0,mutations=0)
            PY
      - name: Verify public HTTP without AI request
        run: |
          set -euo pipefail
          for path in / /api/state; do
            code=$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output /dev/null --write-out '%{http_code}' "http://94.241.171.182:8790$path")
            echo "public_path=$path http_code=$code"
            test "$code" = 200
          done
