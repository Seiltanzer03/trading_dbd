name: ai-release-startup-status-20261020
# Read-only exact-11325 stale-decision diagnosis; no provider or model calls.
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-release-startup-status-20261020.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read installed service and snapshot metadata without provider calls
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 35s
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = 11325c9e2698199ed9da45403fb26fde1b8aa2a0
            /usr/bin/python3 -u - <<'PY'
            import json,os,subprocess,time,urllib.request
            props=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','-p','ActiveState','-p','SubState','-p','NRestarts','-p','MemoryCurrent'],text=True,timeout=5)
            print(json.dumps({'kind':'service','properties':props.splitlines()}))
            st=os.statvfs('/');print(json.dumps({'kind':'capacity','free_bytes':st.f_bavail*st.f_frsize}))
            started=time.monotonic()
            try:
                with urllib.request.urlopen('http://127.0.0.1:8790/api/ai/snapshot/status',timeout=15) as response:
                    body=json.loads(response.read(100000))
                    print(json.dumps({'kind':'snapshot_status','http':response.code,'elapsed_ms':round((time.monotonic()-started)*1000,1),'fields':{k:body.get(k) for k in ['ready','building','invalidated_reason','build_ms','build_started_at','build_n','age_sec','last_error','snapshot_budget']},'has_trade':body.get('current_trade_id') is not None},sort_keys=True))
            except (TimeoutError,ConnectionError,OSError,ValueError) as exc:
                print(json.dumps({'kind':'snapshot_status','error':type(exc).__name__,'elapsed_ms':round((time.monotonic()-started)*1000,1)}))
            with urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=15) as response:
                state=json.loads(response.read(2*1024**2+1))
            tick=state.get('tick') or {}; quote=(tick.get('feeds') or {}).get('price') or {}
            def age(value):
                try:return round(time.time()-float(value),3)
                except (ValueError,TypeError):return None
            print(json.dumps({'kind':'quote_readiness','has_trade':bool(tick.get('trade')),'instrument':tick.get('instrument'),'tick_age_sec':age(tick.get('ts')),'quote_age_sec':age(quote.get('ts') or quote.get('timestamp')),'quote_status':quote.get('status'),'production_authority':quote.get('production_authority'),'derived':quote.get('derived'),'is_proxy':quote.get('is_proxy')},sort_keys=True))
            trace=subprocess.check_output(['journalctl','-u','seiltanzer','--since','2026-10-21 22:27:00 UTC','--no-pager','-n','300'],text=True,timeout=5)
            for line in trace.splitlines():
                if 'ai-1578688fc55b42ee8f50' not in line or '{' not in line:continue
                try:row=json.loads(line[line.index('{'):])
                except ValueError:continue
                print(json.dumps({'kind':'failed_request_trace',**{k:row.get(k) for k in ['request_id','stage','event','elapsed_ms','duration_ms','exception_class','status_code']}},sort_keys=True))
            print(json.dumps({'kind':'safety','provider_calls':0,'review_posts':0,'db_queries':0,'acks':0,'restarts':0,'app_writes':0}))
            PY
      - name: Verify public HTTP without AI request
        run: |
          set -euo pipefail
          for path in / /api/state; do
            code=$(curl --silent --show-error --connect-timeout 5 --max-time 15 --output /dev/null --write-out '%{http_code}' "http://94.241.171.182:8790$path")
            echo "public_path=$path http_code=$code"
            test "$code" = 200
          done
