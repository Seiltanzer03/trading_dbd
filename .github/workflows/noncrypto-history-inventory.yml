name: json-delivery-state-readonly
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30s
          script: |
            /usr/bin/python3 -B -u - <<'PY'
            import pathlib,subprocess,json,hashlib,shutil,urllib.request
            root=pathlib.Path('/opt/seiltanzer');data=root/'data'
            print('PRODUCTION_HEAD',subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip(),flush=True)
            print('SERVICE',subprocess.check_output(['systemctl','show','seiltanzer','-p','ActiveState','-p','SubState','-p','MainPID','-p','NRestarts','-p','ExecMainStatus','-p','Result'],text=True).strip(),flush=True)
            actual=pathlib.Path('/usr/local/lib/seiltanzer-history-start-guard.py').read_bytes()
            source=(root/'scripts/history_service_fence.py').read_bytes()
            print('GUARD_CODE_MATCH',actual==source,flush=True)
            print('CAPACITY',json.dumps({'free_bytes':shutil.disk_usage(data).free,'database_size_bytes':(data/'trades.db').stat().st_size}),flush=True)
            try:
              with urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=3) as r:print('LIVE_STATE_HTTP',r.status,flush=True)
            except Exception as e:print('LIVE_STATE_HTTP_ERROR',type(e).__name__,flush=True)
            PY
