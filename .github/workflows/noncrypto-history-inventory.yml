name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 69c5aee377837934dad630889152ac9486e26e77
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -q -e '.[dev]'
      - name: Verify real hourly noncrypto history without production access or fitting
        run: |
          python -u - <<'PY'
          import hashlib,json,time
          from concurrent.futures import ThreadPoolExecutor
          import yfinance as yf
          from seiltanzer.config import ALL_INSTRUMENTS,CRYPTO_INSTRUMENTS
          def check(code):
              ticker=ALL_INSTRUMENTS[code].yahoo
              try:
                  provider=yf.Ticker(ticker)
                  frame=provider.history(period='2y',interval='1h',auto_adjust=False,repair=False,timeout=8,raise_errors=True)
                  received=time.time()
                  assert 0<len(frame)<=20000
                  stamps=[int(value.timestamp()) for value in frame.index]
                  proof=dict(instrument=code,ticker=ticker,provider='Yahoo Finance via yfinance',
                      requested_interval='1h',actual_granularity=provider.get_history_metadata().get('dataGranularity'),
                      rows=len(frame),first_ts=min(stamps),last_ts=max(stamps),received_ts=received,
                      consecutive_hour_open_pairs=sum(b-a==3600 for a,b in zip(stamps,stamps[1:])),
                      dataset_sha256=hashlib.sha256(frame.to_json(date_unit='s').encode()).hexdigest(),
                      production_access=False,training_performed=False)
                  print('HOURLY_NONCRYPTO_HISTORY='+json.dumps(proof),flush=True)
              except Exception as exc:
                  print('HOURLY_NONCRYPTO_HISTORY='+json.dumps(dict(instrument=code,ticker=ticker,
                      error=type(exc).__name__+':'+str(exc)[:200],production_access=False)),flush=True)
          with ThreadPoolExecutor(max_workers=3) as pool:
              list(pool.map(check,[code for code in ALL_INSTRUMENTS if code not in CRYPTO_INSTRUMENTS]))
          PY
