name: diagnose-live-ai-review
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Read live AI review traces and materializer timings
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            set -euo pipefail
            cd /opt/seiltanzer
            git rev-parse HEAD
            .venv/bin/python -B -u - <<'PY'
            import collections
            import json
            import re
            import subprocess
            import time
            import urllib.request
            from concurrent.futures import ThreadPoolExecutor
            base = "http://127.0.0.1:8790"
            def read(path):
                started = time.monotonic()
                try:
                    with urllib.request.urlopen(base + path, timeout=7) as r:
                        d = json.load(r)
                    if path == "/api/ai/snapshot/status":
                        return path, round(time.monotonic()-started, 3), d
                    if path.startswith("/api/ai/history"):
                        return path, round(time.monotonic()-started, 3), {"trade_id": d.get("trade_id"),
                          "reviews": [{k:item.get(k) for k in ("ts","model","provider_error")} for item in (d.get("items") or [])[-4:]]}
                    if path == "/api/position":
                        return path, round(time.monotonic()-started, 3), {"active": bool(d.get("trade_id")),
                          "reconciliation_required": bool((d.get("execution_reconciliation") or {}).get("required"))}
                    return path, round(time.monotonic()-started, 3), {"worker_running": (d.get("worker") or {}).get("running")}
                except Exception as exc:
                    return path, type(exc).__name__
            paths = ("/api/ai/snapshot/status", "/api/position", "/api/ai/history?include_management=false",
                     "/api/research/runtime/status")
            with ThreadPoolExecutor(max_workers=3) as pool:
                for item in pool.map(read, paths): print("LIVE", json.dumps(item, ensure_ascii=True))
            recent = subprocess.run(["journalctl","-u","seiltanzer","--since","35 minutes ago","-o","json",
                "--no-pager","-n","4500"],text=True,timeout=10,capture_output=True,check=True).stdout
            http_counts = collections.Counter()
            trace = []
            for line in recent.splitlines():
                record = json.loads(line)
                message = record.get("MESSAGE") or ""
                if not isinstance(message,str): continue
                if '"request_id":"ai-' in message:
                    start = message.find('{"request_id":"ai-')
                    try: event = json.JSONDecoder().raw_decode(message[start:])[0]
                    except (TypeError,ValueError): continue
                    selected = {k:event.get(k) for k in ("request_id","stage","event","elapsed_ms","duration_ms",
                        "exception_class","provider_reason","status_code","completion_tokens") if k in event}
                    trace.append((record.get("__REALTIME_TIMESTAMP"),selected))
                match = re.search(r'\b(POST|GET) (/api/ai/(?:verdict|reviews/[0-9a-f]{32}|snapshot/status)) HTTP/[0-9.]+" ([0-9]{3})',message)
                if match:
                    kind = match.group(2).split("/")[3]
                    http_counts[match.group(1)+" "+kind+" "+match.group(3)] += 1
            for row in trace[-110:]: print("AI_TRACE", json.dumps(row))
            print("HTTP_COUNTS",json.dumps(http_counts))
            print("SERVER", subprocess.check_output(["systemctl","show","seiltanzer","-p","MainPID","-p","MemoryCurrent",
                "-p","CPUUsageNSec","-p","NRestarts"],text=True,timeout=4).strip().replace("\n"," "))
            PY
