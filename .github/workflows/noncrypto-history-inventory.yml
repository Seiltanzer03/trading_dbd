name: diagnose-live-ai-review
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Read startup phase, SQLite I/O and review provider traces
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            set -euo pipefail
            cd /opt/seiltanzer
            git rev-parse HEAD
            systemctl show seiltanzer -p ActiveState -p SubState -p MainPID -p Result -p NRestarts
            pid=$(systemctl show seiltanzer -p MainPID --value)
            if [ "$pid" -gt 0 ] && [ -r "/proc/$pid/io" ]; then
                awk '/^(rchar|read_bytes|write_bytes):/' "/proc/$pid/io"
                sleep 5
                awk '/^(rchar|read_bytes|write_bytes):/' "/proc/$pid/io"
            fi
            journalctl -u seiltanzer --since '23 minutes ago' --no-pager -o cat |
                awk '/STARTUP_PHASE|Timeout \(0:03:15\)|File ".*\/(storage[^/]*|__main__|app|engine)\.py"|sqlite.*quick_check|AI_TRACE|Uvicorn running/ {print substr($0,1,320)}' |
                tail -36
            .venv/bin/python -B -u - <<'PY'
            import json
            import urllib.request
            for path in ('/api/ai/snapshot/status', '/api/ai/history?include_management=false'):
                try:
                    with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=6) as response:
                        d=json.load(response)
                    if 'snapshot/status' in path:
                        keys=('ready','building','current_trade_id','current_instrument','build_ms','build_phase','build_phase_ms',
                              'invalidated_reason','changed_expert_sources','last_error')
                        print('SNAPSHOT', {key:d.get(key) for key in keys})
                    else:
                        print('REVIEWS',d.get('trade_id'),[{key:row.get(key) for key in ('ts','model')} for row in d.get('items',[])[-3:]])
                except (OSError,ValueError) as exc:
                    print('API_ERROR',path,type(exc).__name__)
            PY
