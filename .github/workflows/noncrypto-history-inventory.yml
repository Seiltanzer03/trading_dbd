name: startup-owner-readonly
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 60s
          script: |
            /usr/bin/python3 -B -u - <<'PY'
            import subprocess
            pid=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','--value'],text=True).strip()
            text=subprocess.check_output(['journalctl','--no-pager','-o','cat','_PID='+pid,'--since','2026-11-06 13:35:20 UTC','-n','250'],text=True)
            print('STARTUP_OBSERVED_PID',pid)
            for line in text.splitlines():
              if line.startswith(('STARTUP_PHASE','Timeout','Thread','Current thread','  File ')):print(line,flush=True)
            PY
