name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read frozen runtime forecast receipt and published model metadata
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 100s
          script: |
            set -eu
            cd /opt/seiltanzer
            .venv/bin/python -u - <<'PY'
            import json,urllib.request,time
            for path in ('/api/ai/snapshot/status','/api/research/mathematical-edge'):
             with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=10) as response:r=json.load(response)
             if path.endswith('mathematical-edge'):r={k:r.get(k) for k in ('state','published_for_sha','family_market_model_summary','family_reference_source_errors','family_reference_sources')}
             print('BOUNDED_ACTUAL_HTTP',path,json.dumps(r))
            PY
