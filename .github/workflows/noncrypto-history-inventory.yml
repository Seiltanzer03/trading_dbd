name: release-capacity-transport-diagnostic-4d35
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 100s
          script: |
            /usr/bin/python3 -B -u - <<'PY'
            import json,pathlib,subprocess,shutil
            items=[]
            for p in pathlib.Path('/').iterdir():
             s=p.lstat()
             if p.is_file() and not p.is_symlink():items.append({'name':p.name,'bytes':s.st_size,'allocated_bytes':s.st_blocks*512,'mtime':s.st_mtime})
            print('ROOT_FILES_METADATA',json.dumps(items),flush=True)
            print('CURRENT_SWAP_METADATA',pathlib.Path('/proc/swaps').read_text(),flush=True)
            print('CURRENT_MEMORY_METADATA',json.dumps([s for s in pathlib.Path('/proc/meminfo').read_text().splitlines() if s.startswith(('MemTotal:','MemAvailable:','SwapTotal:','SwapFree:'))]),flush=True)
            print('SPACE_BYTES',shutil.disk_usage('/').free,flush=True)
            PY
