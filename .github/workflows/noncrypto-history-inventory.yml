name: historical-provider-diagnostic-no-publication
'on':
  push:
    branches:
    - ops/noncrypto-history-inventory-20261026
    paths:
    - .github/workflows/noncrypto-history-inventory.yml
permissions:
  contents: read
concurrency:
  group: production-provider-maintenance
  queue: max
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: 32e1058b786fae902ff55e89b1bb6fd1d301adaf
      NATIVE_RUN_ID: '41808108303'
    steps:
    - name: Validate nonpublishing historical replay
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/repair-tor.py\" <<'PY'\nimport\
        \ os,json,subprocess,time,urllib.request\nfrom pathlib import Path\nfrom urllib.parse\
        \ import urlsplit\nROOT=Path('/opt/seiltanzer');DATA=ROOT/'data'\ndef command(args,timeout=30,env=None):\n\
        \    p=subprocess.run(args,capture_output=True,text=True,timeout=timeout,env=env)\n\
        \    if p.returncode:\n        print('COMMAND_FAILURE',json.dumps({'program':args[0],'exit_code':p.returncode}),flush=True)\n\
        \        raise RuntimeError('BOUNDED_MAINTENANCE_COMMAND_FAILED')\n    return\
        \ p.stdout\nexpected=os.environ['EXPECTED_SHA'];epoch=os.environ['NATIVE_RUN_ID']\n\
        assert command(['git','-C',str(ROOT),'rev-parse','HEAD']).strip()==expected\n\
        journal=json.loads((DATA/('json-rebuild-'+epoch)/'cutover.journal.json').read_text())\n\
        assert journal['run_id']==epoch and journal['phase']=='COMMITTED' and journal['service_started']\
        \ is True\nassert not os.path.lexists(DATA/'cutover.active')\nassert __import__('shutil').disk_usage(DATA).free>2*1024**3\n\
        proof=json.loads(command(['/usr/bin/python3','/usr/local/lib/seiltanzer-history-start-guard.py','--database',str(DATA/'trades.db'),'--application-root',str(ROOT)],20))\n\
        assert proof['start_allowed'] is True\nwith urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=5)\
        \ as r:assert r.status==200\npid=command(['systemctl','show','seiltanzer','-p','MainPID','--value']).strip()\n\
        assert pid.isdigit() and int(pid)>0\nconfig=dict(x.split('=',1) for x in Path('/proc',pid,'environ').read_text().split('\\\
        0') if '=' in x)\nproxy=config.get('OPENROUTER_PROXY','');key=config.get('OPENROUTER_API_KEY','')\n\
        assert key and urlsplit(proxy).scheme in ('socks5','socks5h')\nassert urlsplit(proxy).hostname\
        \ in ('127.0.0.1','localhost','::1')\n\nimport sqlite3,hashlib,sys\nsys.dont_write_bytecode=True\n\
        sys.path.insert(0,str(ROOT))\nfor name in ('OPENROUTER_API_KEY','OPENROUTER_MODEL','OPENROUTER_PROXY','AI_PROVIDER_TIMEOUT_SEC'):\n\
        \    if name in config:os.environ[name]=config[name]\nfrom seiltanzer.ai_report_semantics_guard\
        \ import authoritative_current_price_available\nconnection=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=.5)\n\
        try:\n    connection.execute('PRAGMA query_only=ON')\n    connection.execute('PRAGMA\
        \ trusted_schema=OFF')\n    deadline=time.monotonic()+5\n    connection.set_progress_handler(lambda:time.monotonic()>=deadline,1000)\n\
        \    rows=connection.execute('SELECT id,ts,snapshot_json FROM ai_verdicts\
        \ WHERE length(snapshot_json)<=2000000 ORDER BY id DESC LIMIT 5').fetchall()\n\
        finally:connection.close()\nsnapshot=None\nfor review_id,review_ts,raw in\
        \ rows:\n    candidate=json.loads(raw)\n    if authoritative_current_price_available(candidate):\n\
        \        snapshot=candidate\n        break\nassert isinstance(snapshot,dict),'NO_SAVED_AUTHORITATIVE_SNAPSHOT_FOR_HISTORICAL_DIAGNOSTIC'\n\
        from seiltanzer.ai_snapshot_budget_guard import install_ai_snapshot_budget_guard\n\
        from seiltanzer.ai_report_semantics_guard import install_ai_report_semantics_guard\n\
        from seiltanzer.ai_provider_guard import install_ai_provider_guard\nfrom seiltanzer.ai_provider_explanation\
        \ import install_ai_provider_explanation\nfrom seiltanzer.ai_runtime_report_v20\
        \ import install_ai_runtime_report_v20,request_explanation_with_shadow\nfor\
        \ install in (install_ai_snapshot_budget_guard,install_ai_report_semantics_guard,install_ai_provider_guard,install_ai_provider_explanation,install_ai_runtime_report_v20):install()\n\
        from seiltanzer.ai_review_jobs import detached_review_scope\nfrom seiltanzer.ai_request_trace\
        \ import AIRequestTrace\nfrom seiltanzer.ai_api import provider_failure_reason\n\
        print('HISTORICAL_PROVIDER_DIAGNOSTIC_START',json.dumps({'diagnostic_only':True,'snapshot_captured_ts':snapshot.get('captured_ts'),'snapshot_runtime_sha':snapshot.get('runtime_code_sha'),'invocation_runtime_sha':expected,'source_snapshot_sha256':hashlib.sha256(raw.encode()).hexdigest(),'snapshot_age_sec':round(time.time()-float(snapshot['captured_ts'])),'db_writes':0,'orders':0,'acks':0,'decision_publications':0}),flush=True)\n\
        trace=AIRequestTrace()\nstarted=time.monotonic()\ntry:\n    with trace.activate(),detached_review_scope():result=request_explanation_with_shadow(snapshot)\n\
        except Exception as error:\n    print('HISTORICAL_PROVIDER_DIAGNOSTIC_FAILURE',json.dumps({'exception_class':type(error).__name__,'reason_code':provider_failure_reason(error),'elapsed_sec':round(time.monotonic()-started,3),'automatic_retry':False}),flush=True)\n\
        \    raise SystemExit(1) from None\nshadow=result.get('llm_shadow_decision')\
        \ or {}\ncontract=shadow.get('input_contract') or {}\nassert result.get('provider_mode')=='llm_explanation_plus_decision_shadow'\n\
        assert contract.get('version')=='independent-llm-transport-v2'\nassert shadow.get('production_authority')\
        \ is False and shadow.get('automatic_execution_allowed') is False\nassert\
        \ hashlib.sha256(contract['frozen_input_json'].encode()).hexdigest()==contract['frozen_input_sha256']\n\
        assert hashlib.sha256(contract['full_input_json'].encode()).hexdigest()==contract['full_input_sha256']\n\
        assert command(['systemctl','show','seiltanzer','-p','MainPID','--value']).strip()==pid\n\
        with urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=5) as\
        \ response:assert response.status==200\nprint('HISTORICAL_PROVIDER_DIAGNOSTIC_PASS',json.dumps({'diagnostic_only':True,'provider_mode':result['provider_mode'],'report_version':result.get('report_version'),'provider_contract':contract['version'],'shadow_status':shadow.get('status'),'structured_response_verified':True,'input_bytes':len(contract['frozen_input_json'].encode()),'elapsed_sec':round(time.monotonic()-started,3),'db_writes':0,'decision_publications':0,'orders':0,'acks':0,'app_restarts':0,'live_trade_review_proven':False}),flush=True)\n\
        \nPY\npython3 - \"$RUNNER_TEMP/repair-tor.py\" <<'PY'\nimport sys,os,base64\n\
        from pathlib import Path\nraw=Path(sys.argv[1]).read_bytes()\ncompile(raw,sys.argv[1],'exec')\n\
        with open(os.environ['GITHUB_ENV'],'a') as f:\n    f.write('REPAIR_SCRIPT_B64='+base64.b64encode(raw).decode()+'\\\
        n')\nprint('Maintenance syntax verified; production prerequisites remain enforced\
        \ remotely.')\nPY\n"
    - uses: appleboy/ssh-action@v1
      env:
        REPAIR_SCRIPT_B64: ${{ env.REPAIR_SCRIPT_B64 }}
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 3m
        envs: EXPECTED_SHA,NATIVE_RUN_ID,REPAIR_SCRIPT_B64
        script: 'set -euo pipefail

          exec 9>/opt/seiltanzer/.deployment-git-maintenance.lock

          flock -w 15 9

          umask 077

          repair_dir=$(mktemp -d /run/seiltanzer-provider-repair.XXXXXX)

          trap ''rm -rf -- "$repair_dir"'' EXIT

          printf ''%s'' "$REPAIR_SCRIPT_B64" | base64 -d > "$repair_dir/repair.py"

          /opt/seiltanzer/.venv/bin/python -B -u "$repair_dir/repair.py"

          '
