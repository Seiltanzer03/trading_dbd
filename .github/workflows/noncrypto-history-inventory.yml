name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read existing Treasury runtime and saved snapshot source headers
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 40s
          script: |
            /usr/bin/python3 -u - <<'PY'
            import json,sqlite3,time,urllib.request
            with urllib.request.urlopen('http://127.0.0.1:8790/api/research/macro/status',timeout=8) as response:r=json.load(response)
            print('EXISTING_TREASURY_RUNTIME',json.dumps(r.get('treasury_live_t0')),flush=True)
            c=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=.5)
            try:
             c.execute('PRAGMA query_only=ON');c.execute('PRAGMA trusted_schema=OFF')
             deadline=time.monotonic()+3;c.set_progress_handler(lambda:time.monotonic()>=deadline,1000)
             row=c.execute('SELECT id,ts,snapshot_json FROM ai_verdicts WHERE trade_id=141 AND length(snapshot_json)<=2000000 ORDER BY ts DESC,id DESC LIMIT 1').fetchone()
             if row:
              s=json.loads(row[2]);treasury=s.get('treasury_context_v1')
              sources=s.get('edge_family_sources') or {}
              related=[{k:r.get(k) for k in ('source_id','observed_ts','available_at','market_return_origin_ts','market_return_contract')} for r in (sources.get('intermarket') or []) if isinstance(r,dict)]
              print('SAVED_INPUT_HEADERS',json.dumps(dict(id=row[0],ts=row[1],captured_ts=s.get('captured_ts'),treasury_root_present=isinstance(treasury,dict),treasury_headers={k:(treasury or {}).get(k) for k in ('available','reason','captured_ts','fetched_at','published_at')} if isinstance(treasury,dict) else None,related=related)),flush=True)
            finally:c.close()
            print('READ_ONLY_EXISTING_DATA_NO_PROVIDER_CALL_NO_FIT_NO_ORDER')
            PY
