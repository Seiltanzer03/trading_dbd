name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Measure complete immutable fence with CPU scheduling isolated
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 30s
          script: |
            /usr/bin/python3 -B -u - <<'PY'
            import json,os,pathlib,runpy,time
            root=pathlib.Path('/opt/seiltanzer')
            ns=runpy.run_path('/usr/local/lib/seiltanzer-history-start-guard.py',run_name='readonly_scheduling_measurement')
            print('SCHEDULING_BEFORE',os.cpu_count(),os.getloadavg(),os.getpriority(os.PRIO_PROCESS,0),flush=True)
            os.setpriority(os.PRIO_PROCESS,0,-10)
            started=time.monotonic();cpu=time.process_time()
            measured=ns['check_start'](root/'data/trades.db',root)
            print('IDENTICAL_FULL_FENCE_CPU_PRIORITY',json.dumps(measured),'wall',round(time.monotonic()-started,3),'cpu',round(time.process_time()-cpu,3),'nice',os.getpriority(os.PRIO_PROCESS,0),flush=True)
            PY
