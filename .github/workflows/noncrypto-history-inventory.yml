name: verify-public-terminal-data
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  public-data:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Measure the public page and independent data routes once
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import json
          import time
          import urllib.request

          base = 'http://94.241.171.182:8790'
          paths = ('/', '/api/state', '/api/journal', '/api/position')

          def fetch(path):
              started = time.monotonic()
              with urllib.request.urlopen(base + path, timeout=5) as response:
                  raw = response.read(2_500_001)
                  if response.status != 200 or not 0 < len(raw) <= 2_500_000:
                      raise RuntimeError('PUBLIC_RESPONSE_INVALID:' + path)
              return raw if path == '/' else json.loads(raw), round(time.monotonic() - started, 3)

          with ThreadPoolExecutor(max_workers=4) as pool:
              results = dict(zip(paths, pool.map(fetch, paths)))
          page, state, journal, position = (results[path][0] for path in paths)
          assert b'id="terminal-loading"' in page
          assert isinstance(state.get('journal'), list) and isinstance(state.get('tick'), dict)
          assert isinstance(journal, list) and journal and 'trade_id' in position
          trade_id = position['trade_id']
          print('PUBLIC_TERMINAL_DATA=' + json.dumps(dict(journal_rows=len(journal),
              position_present=trade_id is not None, state_rows=len(state['journal']),
              open_row_in_journal=trade_id is not None and any(row.get('id') == trade_id and row.get('status') == 'open' for row in journal),
              seconds={path: result[1] for path, result in results.items()})))
          PY
