name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read release readiness and frozen forecasts after verified headroom recovery
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 70s
          script: |
            set -eu
            /usr/bin/python3 -u - <<'PY'
            import json,subprocess,urllib.request,shutil
            def out(**r):print(json.dumps(r),flush=True)
            out(kind='capacity',free_bytes=shutil.disk_usage('/').free)
            for kind,args in (
             ('git',['git','-C','/opt/seiltanzer','rev-parse','HEAD']),
             ('service',['systemctl','show','seiltanzer','-p','MainPID','-p','ActiveState','-p','SubState','-p','NRestarts','-p','ExecMainStartTimestamp']),
             ('startup',['journalctl','-u','seiltanzer','--since','-14 minutes','--no-pager','-n','150'])):
             r=subprocess.run(args,capture_output=True,text=True,timeout=10);lines=r.stdout.splitlines()
             if kind=='startup':lines=[l for l in lines if 'STARTUP_PHASE' in l][-18:]
             out(kind=kind,returncode=r.returncode,lines=lines,stderr=r.stderr[:500])
            for path in ('/api/research/runtime/worker-status','/api/ai/snapshot/status','/api/research/mathematical-edge'):
             try:
              with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=6) as r:row=json.load(r)
              if path.endswith('mathematical-edge'):row={k:row.get(k) for k in ('state','published_for_sha','family_market_model_summary','family_reference_source_errors')}
              out(kind='http',path=path,value=row)
             except OSError as e:out(kind='http',path=path,error=type(e).__name__)
            out(kind='safety',read_only=True,database_open=False,restarts=0,provider_calls=0)
            PY
