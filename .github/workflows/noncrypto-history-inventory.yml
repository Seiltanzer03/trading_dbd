name: bounded-memory-report-size-observer
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30s
          script: |
            /usr/bin/python3 -B -u - <<'PY'
            import json,sqlite3,time,pathlib,subprocess
            pid=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','--value'],text=True).strip()
            status=dict(line.split(':',1) for line in pathlib.Path('/proc',pid,'status').read_text().splitlines() if ':' in line)
            print('MEMORY_NOW',json.dumps({k:status.get(k,'').strip() for k in ('VmRSS','RssAnon','RssFile','VmSwap')}),flush=True)
            connection=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=.5)
            try:
              connection.execute('PRAGMA query_only=ON')
              connection.execute('PRAGMA trusted_schema=OFF')
              connection.execute('PRAGMA cache_size=-2048')
              connection.setlimit(sqlite3.SQLITE_LIMIT_LENGTH,32*1024**2)
              deadline=time.monotonic()+2
              connection.set_progress_handler(lambda:time.monotonic()>deadline,1000)
              rows=connection.execute('SELECT rowid,report_name,duration_ms FROM g1s_evidence_materializations ORDER BY report_name LIMIT 10').fetchall()
              sizes=[]
              for row_id,name,duration in rows:
                with connection.blobopen('g1s_evidence_materializations','payload_json',row_id,readonly=True) as blob:
                  sizes.append({'report':name,'serialized_bytes':len(blob),'last_build_ms':duration})
              print('MATERIALIZED_REPORT_SIZES',json.dumps(sizes),flush=True)
            except Exception as error:print('REPORT_SIZE_UNAVAILABLE',type(error).__name__,flush=True)
            finally:connection.close()
            print('READ_ONLY_NO_DB_WRITES_NO_RESTART',flush=True)
            PY
