name: all-setup-model-inventory-20261028
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 60s
          script: |
            /opt/seiltanzer/.venv/bin/python -B -u - <<'PY'
            import sys,json,time,urllib.request,subprocess,shutil
            sys.dont_write_bytecode=True;sys.path.insert(0,'/opt/seiltanzer')
            from seiltanzer.config import INSTRUMENTS,SETUPS
            expected='7e222a36b7ce6f88abd9136db011cbd431c47298'
            actual=subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True).strip();assert actual==expected
            def get(path,limit=2100000):
             with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=8) as response:
              raw=response.read(limit+1);assert len(raw)<=limit;return json.loads(raw)
            report=get('/api/research/mathematical-edge')
            setups=get('/api/setups');status=get('/api/ai/snapshot/status',100000)
            print('GLOBAL_RUNTIME',json.dumps({'sha':actual,'free_bytes':shutil.disk_usage('/opt/seiltanzer').free,'configured_noncrypto':len(INSTRUMENTS),'setups':len(SETUPS),'served_setups_type':type(setups).__name__,'model_summary':report.get('family_market_model_summary')}),flush=True)
            matrix=report.get('family_market_models') or {}
            for instrument in INSTRUMENTS:
             rows=matrix.get(instrument) or {}
             out={'instrument':instrument,'setups':[s.num for s in SETUPS.values() if s.instrument==instrument],'models':{}}
             for family,row in rows.items():
              heads=row.get('heads') or {}
              out['models'][family]={k:row.get(k) for k in ('status','reason','sample_count','observations','validation_status')}
              out['models'][family].update(source={k:(row.get('source') or {}).get(k) for k in ('provider','ticker','interval')},heads={name:{k:head.get(k) for k in ('status','horizon_minutes','working_supported','reason','train_n','validation_n','test_n','selected_validation_score','test_score')} for name,head in heads.items()})
             print('INSTRUMENT_MODEL_READINESS',json.dumps(out),flush=True)
            print('CURRENT_ONLY_RUNTIME',json.dumps({k:status.get(k) for k in ('current_instrument','ready','building','last_error')}),flush=True)
            print('READ_ONLY_NO_SWITCH_NO_PROVIDER_NO_FIT_NO_ORDER_NO_DB_WRITE')
            PY
