name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Repack only the existing Git cache without pruning objects or reflogs
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /opt/seiltanzer
            exec 9>/opt/seiltanzer/.deployment-git-maintenance.lock
            flock -w 15 9
            test "$(git rev-parse HEAD)" = 0f9525e66ca17c716c71dadc4b37496cf705d6da
            test "$(systemctl show seiltanzer -p MainPID --value)" = 4095659
            test "$(systemctl is-active seiltanzer)" = active
            test ! -e /opt/seiltanzer/data/cutover.active
            before_refs="$(git show-ref --head | sha256sum | cut -d' ' -f1)"
            git fsck --connectivity-only --no-dangling
            git count-objects -vH
            /opt/seiltanzer/.venv/bin/python -c 'import os;v=os.statvfs("/opt/seiltanzer/data");print("FREE_BEFORE",v.f_bavail*v.f_frsize);assert v.f_bavail*v.f_frsize>700000000'
            git -c gc.reflogExpire=never -c gc.reflogExpireUnreachable=never -c pack.threads=1 -c pack.windowMemory=32m -c pack.deltaCacheSize=16m gc --prune=never
            test "$(git show-ref --head | sha256sum | cut -d' ' -f1)" = "$before_refs"
            git fsck --connectivity-only --no-dangling
            git count-objects -vH
            /opt/seiltanzer/.venv/bin/python -c 'import os;v=os.statvfs("/opt/seiltanzer/data");print("FREE_AFTER",v.f_bavail*v.f_frsize)'
            test "$(git rev-parse HEAD)" = 0f9525e66ca17c716c71dadc4b37496cf705d6da
            test "$(systemctl show seiltanzer -p MainPID --value)" = 4095659
            echo GIT_REPACK_VERIFIED_NO_PRUNE_NO_DB_TOUCH_NO_RESTART
