name: json-release-guard-readonly
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 50s
          script: |
            /usr/bin/python3 -B -u - <<'PY'
            import json,os,pathlib,subprocess,time,urllib.request,shutil,stat
            root=pathlib.Path('/opt/seiltanzer');data=root/'data'
            print('PRODUCTION_HEAD',subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip(),flush=True)
            print('SERVICE',subprocess.check_output(['systemctl','show','seiltanzer','-p','ActiveState','-p','MainPID','-p','NRestarts'],text=True).strip(),flush=True)
            for name in ['cutover.active','cutover.journal.json','cutover.preparation.json','json-history.epoch.json']:
              p=data/name
              if not os.path.lexists(p):print('STATE_META',name,'ABSENT',flush=True);continue
              info=p.lstat();row={'regular':stat.S_ISREG(info.st_mode),'size':info.st_size,'mode':oct(stat.S_IMODE(info.st_mode))}
              if stat.S_ISREG(info.st_mode) and 0<info.st_size<=65536:
                obj=json.loads(p.read_bytes());row.update({k:obj.get(k) for k in ['contract','run_id','application_sha','phase','service_started']})
              print('STATE_META',name,json.dumps(row),flush=True)
            import runpy,sqlite3,sys
            print('GUARD_PYTHON',sys.version.split()[0],flush=True)
            ns=runpy.run_path('/usr/local/lib/seiltanzer-history-start-guard.py',run_name='_readonly_guard_trace')
            check=ns['check_start'];g=check.__globals__;factory=sqlite3.connect
            class TracedConnection:
              def __init__(self,*a,**kw):self.inner=factory(*a,**kw)
              def __getattr__(self,name):return getattr(self.inner,name)
              def execute(self,sql,*args):
                if 'g1_dataset_membership' in sql and sql.lstrip().upper().startswith('SELECT'):
                  label='left_membership' if 'LEFT JOIN' in sql else 'cross_membership' if 'CROSS JOIN' in sql else 'other_membership'
                  plan=self.inner.execute('EXPLAIN QUERY PLAN '+sql,*args).fetchall()
                  print('GUARD_G1_QUERY_PLAN',json.dumps({'case':label,'plan':[r[3] for r in plan[:20]]}),flush=True)
                try:return self.inner.execute(sql,*args)
                except sqlite3.Error as e:
                  family=next((t for t in ['g1_dataset_membership','archived_passive_rejections','passive_market_observations','g1s_observations','history_runtime_rollups'] if t in sql),'metadata')
                  print('GUARD_SQL_REFUSAL',json.dumps({'family':family,'exception_type':type(e).__name__,'sqlite_errorname':getattr(e,'sqlite_errorname',None)}),flush=True)
                  raise
            sqlite3.connect=TracedConnection
            literal=g['_literal_reader_contract']
            def traced_literal(app,module,name):
              began=time.monotonic()
              try:return literal(app,module,name)
              finally:print('GUARD_LITERAL',module,round(time.monotonic()-began,3),flush=True)
            g['_literal_reader_contract']=traced_literal
            started=time.monotonic();v=check(data/'trades.db',root)
            print('ACTUAL_START_GUARD',json.dumps({'elapsed_sec':round(time.monotonic()-started,3),**{k:v.get(k) for k in ['contract','start_allowed','reason','hot_history_present']}}),flush=True)
            print('CAPACITY',json.dumps({'free_bytes':shutil.disk_usage(data).free,'database_size_bytes':(data/'trades.db').stat().st_size}),flush=True)
            try:
              with urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=3) as r:print('LIVE_STATE_HTTP',r.status,flush=True)
            except Exception as e:print('LIVE_STATE_HTTP_ERROR',type(e).__name__,flush=True)
            with urllib.request.urlopen('http://127.0.0.1:8790/api/research/runtime/worker-status',timeout=5) as r:
              worker=json.load(r).get('worker') or {};print('WORKER_PHASE',json.dumps({k:worker.get(k) for k in ['current_phase','disk_pause_active','disk_pressure']}),flush=True)
            path=root/'seiltanzer/history_storage_state.py'
            ns={'__name__':'_readonly_storage_guard_probe','__file__':str(path)}
            exec(compile(path.read_bytes(),str(path),'exec'),ns)
            import sqlite3
            c=sqlite3.connect((data/'trades.db').as_uri()+'?mode=ro',uri=True,timeout=1)
            c.execute('PRAGMA query_only=ON');c.execute('PRAGMA trusted_schema=OFF');c.execute('PRAGMA cache_size=-2048')
            began=time.monotonic();deadline=began+5;c.set_progress_handler(lambda:time.monotonic()>=deadline,1000)
            phase=['read_state']
            identity=ns['identity_proof'];projection=ns['_runtime_projection']
            def traced_identity(conn,table,boundary):
              phase[0]='identity:'+table;start=time.monotonic()
              result=identity(conn,table,boundary)
              print('IDENTITY_PROOF',table,json.dumps({'elapsed_sec':round(time.monotonic()-start,3),'row_count':result.get('row_count'),'max_rowid':result.get('max_rowid')}),flush=True)
              return result
            def traced_projection():
              phase[0]='runtime_projection';return projection()
            ns['identity_proof']=traced_identity;ns['_runtime_projection']=traced_projection
            try:
              state=ns['read_history_state'](c)
              print('EMBEDDED_STATE',json.dumps({'contract':state.get('contract'),'retired_rows':len(state.get('retired_rowids',{}).get('passive_market_observations',[])),'retained_counts':{k:v.get('row_count') for k,v in state.get('retained_identity',{}).items()}}),flush=True)
              ns['history_manifest_fields'](c)
              print('EXACT_STATE_PROOF','PASS',flush=True)
            except Exception as e:
              print('EXACT_STATE_PROOF_FAILURE',json.dumps({'phase':phase[0],'exception_type':type(e).__name__,'sqlite_errorname':getattr(e,'sqlite_errorname',None),'elapsed_sec':round(time.monotonic()-began,3)}),flush=True)
            finally:c.close()
            print('TRACKED_SOURCE_CLEAN',subprocess.run(['git','-C',str(root),'diff','--quiet','HEAD','--','scripts','seiltanzer']).returncode==0,flush=True)
            r=subprocess.run(['/usr/bin/python3','-B','/usr/local/lib/seiltanzer-history-start-guard.py','--database',str(data/'trades.db'),'--application-root',str(root)],capture_output=True,text=True,timeout=12)
            print('WARM_UNCHANGED_GUARD',json.dumps({'rc':r.returncode,'result':json.loads(r.stdout)}),flush=True)
            PY
