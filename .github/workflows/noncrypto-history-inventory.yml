name: terminal-network-path-readonly
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Check only the requested service and SSH port
        run: |
          python3 -u - <<'PY'
          import concurrent.futures,json,socket,time,urllib.request
          def ssh():
              started=time.monotonic()
              try:
                  with socket.create_connection(('94.241.171.182',22),timeout=8):pass
                  return {'route':'SSH22','tcp_connected':True,'elapsed_ms':round((time.monotonic()-started)*1000,1)}
              except Exception as error:
                  return {'route':'SSH22','tcp_connected':False,'error_type':type(error).__name__,'elapsed_ms':round((time.monotonic()-started)*1000,1)}
          def http():
              started=time.monotonic()
              try:
                  with urllib.request.urlopen('http://94.241.171.182:8790/api/state',timeout=8) as response:
                      raw=response.read(4000001);assert len(raw)<=4000000
                      body=json.loads(raw);status=response.status
                  quote=((body.get('tick') or {}).get('feeds') or {}).get('price') or {}
                  return {'route':'HTTP8790/api/state','http_status':status,'elapsed_ms':round((time.monotonic()-started)*1000,1),'quote_age_sec':time.time()-quote['ts'],'quote_fresh':quote.get('fresh')}
              except Exception as error:
                  return {'route':'HTTP8790/api/state','error_type':type(error).__name__,'http_status':getattr(error,'code',None),'elapsed_ms':round((time.monotonic()-started)*1000,1)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              for result in pool.map(lambda fn:fn(),(ssh,http)):print('NETWORK_PATH',json.dumps(result),flush=True)
          PY
