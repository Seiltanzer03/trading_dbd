name: bounded-terminal-input-audit
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 3m
          script: |
            /usr/bin/python3 -B -u - <<'PY'
            import datetime,json,pathlib,sqlite3,subprocess,time,urllib.error,urllib.request
            now=time.time()
            root=pathlib.Path('/opt/seiltanzer')
            pid=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','--value'],text=True).strip()
            sha=subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()
            status=dict(line.split(':',1) for line in pathlib.Path('/proc',pid,'status').read_text().splitlines() if ':' in line)
            print('AUDIT_RUNTIME',json.dumps({'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sha':sha,'pid':pid,'memory':{k:status.get(k,'').strip() for k in ('VmRSS','RssAnon','RssFile','VmSwap')}}),flush=True)
            def small(value,keys):
              return {k:value.get(k) for k in keys if isinstance(value,dict) and (value.get(k) is None or isinstance(value.get(k),(str,int,float,bool)))}
            def quote(value):
              out=small(value,('value','status','source','symbol','ticker','ts','updated_ts','provider_ts','received_ts','age_sec','fresh','derived','fallback','timestamp_kind'))
              out['error_present']=bool((value or {}).get('error'))
              return out
            def get(path,bound=5000000):
              start=time.monotonic()
              try:
                with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=8) as response:
                  raw=response.read(bound+1); code=response.status
                if len(raw)>bound:raise ValueError('BOUNDED_RESPONSE_EXCEEDED')
                body=json.loads(raw)
                print('AUDIT_ROUTE',json.dumps({'path':path,'http':code,'ms':round((time.monotonic()-start)*1000)}),flush=True)
                return body
              except Exception as error:
                print('AUDIT_ROUTE',json.dumps({'path':path,'error_type':type(error).__name__,'http':getattr(error,'code',None)}),flush=True)
                return {}
            state=get('/api/state')
            tick=state.get('tick') or {}
            feeds=tick.get('feeds') or {}
            print('AUDIT_CURRENT_FEEDS',json.dumps({'instrument':tick.get('instrument'),'tick_ts':tick.get('ts'),'active_trade_present':bool(tick.get('trade')),'configured_instruments':sorted(state.get('instruments') or {}),'price':quote(feeds.get('price') or {}),'proxy':quote(feeds.get('proxy_price') or {}),'chain':quote(feeds.get('chain') or {}),'vols':{k:quote(v) for k,v in (feeds.get('vols') or {}).items() if isinstance(v,dict)},'analytics_options':small((tick.get('analytics') or {}).get('options') or {},('status','source','expiry','density_ready','barriers_supported','snapshot_age_sec','live_mapping_ready'))}),flush=True)
            worker=get('/api/research/runtime/worker-status').get('worker') or {}
            print('AUDIT_WORKER',json.dumps({**small(worker,('current_phase','maintenance_phase','last_started_ts','last_finished_ts','last_maintenance_started_ts','last_maintenance_finished_ts','memory_pause_active','disk_pause_active','acceptance_pause_active','acceptance_gate_run_id','acceptance_gate_expected_sha','acceptance_gate_expires_at')),'core_error_present':bool(worker.get('last_error')),'maintenance_error_present':bool(worker.get('last_maintenance_error'))}),flush=True)
            snapshot=get('/api/ai/snapshot/status')
            family=snapshot.get('family_market_forecasts') or {}
            print('AUDIT_AI_SNAPSHOT',json.dumps({**small(snapshot,('ready','building','current_instrument','age_sec','canonical_quote_available','invalidated_reason','build_ms','build_n','last_error')),'active_trade_present':snapshot.get('current_trade_id') is not None,'family_state':small(family,('state','instrument','reason'))}),flush=True)
            report=get('/api/research/g1s/evidence-materialization')
            print('AUDIT_MATERIALIZATIONS',json.dumps({'cached':report.get('cached_snapshot'),'version':report.get('nonblocking_evidence_version'),'reports':[{**small(r,('report_name','generated_ts','duration_ms','age_sec'))} for r in report.get('reports') or [] if isinstance(r,dict)]}),flush=True)
            models=get('/api/research/mathematical-edge',2100000)
            print('AUDIT_MODELS',json.dumps({**small(models,('state','published_for_sha','captured_ts','generated_ts')),'summary':models.get('family_market_model_summary'),'instruments':{c:{f:{'status':r.get('status'),'reason':r.get('reason'),'historically_supported':any(h.get('working_supported') is True for h in (r.get('heads') or {}).values() if isinstance(h,dict))} for f,r in rows.items() if isinstance(r,dict)} for c,rows in (models.get('family_market_models') or {}).items() if isinstance(rows,dict)}}),flush=True)
            codes=('NAS100','SP500','US30','GER40','UK100','JPY100','XAU','XAG','EURUSD','USDCAD')
            connection=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=.5)
            connection.row_factory=sqlite3.Row
            try:
              connection.execute('PRAGMA query_only=ON')
              connection.execute('PRAGMA trusted_schema=OFF')
              connection.execute('PRAGMA cache_size=-2048')
              connection.setlimit(sqlite3.SQLITE_LIMIT_LENGTH,32*1024**2)
              deadline=time.monotonic()+8
              connection.set_progress_handler(lambda:time.monotonic()>deadline,1000)
              rows=[]
              for code in codes:
                record={'instrument':code}
                for name,query in (('observation','SELECT captured_ts,price_source,price_kind,price_age_sec,option_source,option_kind,option_age_sec FROM passive_market_observations WHERE instrument=? ORDER BY captured_ts DESC LIMIT 1'),('path','SELECT ts,source,kind FROM passive_market_path WHERE instrument=? ORDER BY ts DESC LIMIT 1')):
                  row=connection.execute(query,(code,)).fetchone()
                  record[name]=dict(row) if row else None
                rows.append(record)
              print('AUDIT_ALL_INSTRUMENT_HISTORY',json.dumps(rows),flush=True)
            except Exception as error:print('AUDIT_HISTORY_ERROR',type(error).__name__,flush=True)
            finally:connection.close()
            for name in ('mathematical_edge_latest.json','edge_family_sources_latest.json','active_edge_latest.json','llm_edge_latest.json'):
              path=root/'data/research'/name
              if not path.is_file():
                print('AUDIT_ARTIFACT',json.dumps({'name':name,'exists':False}),flush=True);continue
              meta=path.stat(); row={'name':name,'exists':True,'bytes':meta.st_size,'mtime':meta.st_mtime}
              if name=='edge_family_sources_latest.json' and meta.st_size<4000000:
                body=json.loads(path.read_bytes())
                row.update(small(body,('contract_version','captured_ts','published_for_sha','generated_ts')))
                row['keys']=sorted(body.keys())
                records=body.get('instruments') or body.get('items') or {}
                row['instrument_count']=len(records) if isinstance(records,(dict,list)) else None
              print('AUDIT_ARTIFACT',json.dumps(row),flush=True)
            print('READ_ONLY_NO_WRITES_NO_RESTART_NO_PROVIDER_CALL_NO_TRADE',flush=True)
            PY
