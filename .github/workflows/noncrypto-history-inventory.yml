name: tor-package-policy-readonly
'on':
  push:
    branches:
    - ops/noncrypto-history-inventory-20261026
    paths:
    - .github/workflows/noncrypto-history-inventory.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
    - uses: appleboy/ssh-action@v1
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 35s
        script: '/usr/bin/python3 -B -u - <<''PY''

          import subprocess,json,re

          from pathlib import Path

          osinfo={line.split(''='',1)[0]:line.split(''='',1)[1].strip(''"'') for line
          in Path(''/etc/os-release'').read_text().splitlines() if ''='' in line}

          print(''TOR_OS'',json.dumps({k:osinfo.get(k) for k in (''ID'',''VERSION_ID'',''VERSION_CODENAME'')}))

          print(''TOR_PACKAGE_POLICY'',subprocess.check_output([''apt-cache'',''policy'',''tor''],text=True,timeout=5)[:1200])

          version=subprocess.check_output([''/usr/bin/tor'',''--version''],text=True,timeout=3).splitlines()[0]

          print(''TOR_INSTALLED_VERSION'',version)


          PY

          '
