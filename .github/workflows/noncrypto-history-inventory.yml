name: guarded-existing-provider-repair
'on':
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: production-provider-maintenance
  queue: max
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      EXPECTED_SHA: 32e1058b786fae902ff55e89b1bb6fd1d301adaf
      NATIVE_RUN_ID: '41808108303'
    steps:
      - name: Cancel only unstarted serialized provider maintenance before independent postcommit execution
        uses: actions/github-script@v7
        with:
          script: |
            const params={owner:context.repo.owner,repo:context.repo.repo,run_id:41817855746};
            let {data:run}=await github.rest.actions.getWorkflowRun(params);
            if(run.head_sha!=='a6e85eefe49f525ddad8526cd575437b3d0de852' || run.path!=='.github/workflows/noncrypto-history-inventory.yml') throw new Error('provider maintenance identity mismatch');
            if(run.status!=='pending') throw new Error('serialized provider maintenance is no longer unstarted pending');
            const {data:jobs}=await github.rest.actions.listJobsForWorkflowRun({...params,filter:'latest',per_page:100});
            if(jobs.jobs.length!==0) throw new Error('provider maintenance already has jobs; independent execution refused');
            await github.rest.actions.cancelWorkflowRun(params);
            for(let attempt=0;attempt<20;attempt++){
              ({data:run}=await github.rest.actions.getWorkflowRun(params));
              if(run.status==='completed' && run.conclusion==='cancelled'){core.info('UNSTARTED_PROVIDER_MAINTENANCE_CANCELLED '+params.run_id);return;}
              if(run.status==='completed') throw new Error('original provider maintenance completed with another conclusion');
              await new Promise(resolve=>setTimeout(resolve,1000));
            }
            throw new Error('prior provider maintenance cancellation not verified; no host operation permitted');
      - name: Validate bounded maintenance before transfer
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/repair-tor.py" <<'PY'
          import os,json,subprocess,time,urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit
          ROOT=Path('/opt/seiltanzer');DATA=ROOT/'data'
          def command(args,timeout=30,env=None):
              p=subprocess.run(args,capture_output=True,text=True,timeout=timeout,env=env)
              if p.returncode:
                  print('COMMAND_FAILURE',json.dumps({'program':args[0],'exit_code':p.returncode}),flush=True)
                  raise RuntimeError('BOUNDED_MAINTENANCE_COMMAND_FAILED')
              return p.stdout
          expected=os.environ['EXPECTED_SHA'];epoch=os.environ['NATIVE_RUN_ID']
          assert command(['git','-C',str(ROOT),'rev-parse','HEAD']).strip()==expected
          journal=json.loads((DATA/('json-rebuild-'+epoch)/'cutover.journal.json').read_text())
          assert journal['run_id']==epoch and journal['phase']=='COMMITTED' and journal['service_started'] is True
          assert not os.path.lexists(DATA/'cutover.active')
          assert __import__('shutil').disk_usage(DATA).free>2*1024**3
          proof=json.loads(command(['/usr/bin/python3','/usr/local/lib/seiltanzer-history-start-guard.py','--database',str(DATA/'trades.db'),'--application-root',str(ROOT)],20))
          assert proof['start_allowed'] is True
          with urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=5) as r:assert r.status==200
          pid=command(['systemctl','show','seiltanzer','-p','MainPID','--value']).strip()
          assert pid.isdigit() and int(pid)>0
          config=dict(x.split('=',1) for x in Path('/proc',pid,'environ').read_text().split('\0') if '=' in x)
          proxy=config.get('OPENROUTER_PROXY','');key=config.get('OPENROUTER_API_KEY','')
          assert key and urlsplit(proxy).scheme in ('socks5','socks5h')
          assert urlsplit(proxy).hostname in ('127.0.0.1','localhost','::1')
          before=command(['dpkg-query','-W','-f=${Version}','tor']).strip()
          minimum='0.4.9~'
          def supported(version):
              return subprocess.run(['dpkg','--compare-versions',version,'ge',minimum]).returncode==0
          print('TOR_VERSION_BEFORE',before,flush=True)
          if not supported(before):
              command(['apt-get','-o','Acquire::Retries=2','-o','Acquire::http::Timeout=10','-o','Acquire::https::Timeout=10','update'],150)
              policy=command(['apt-cache','policy','tor'])
              candidate=next(line.split(':',1)[1].strip() for line in policy.splitlines() if 'Candidate:' in line)
              assert supported(candidate),'SUPPORTED_TOR_NOT_AVAILABLE_FROM_CONFIGURED_REPOSITORIES'
              simulation=command(['apt-get','-s','--only-upgrade','--no-install-recommends','install','tor='+candidate,'tor-geoipdb'])
              packages=[line.split()[1].split(':')[0] for line in simulation.splitlines() if line.startswith('Inst ')]
              assert packages and set(packages)<={'tor','tor-geoipdb'},'UNRELATED_PACKAGE_CHANGE_REFUSED'
              assert not any(line.startswith('Remv ') for line in simulation.splitlines())
              print('TOR_UPGRADE_PLAN',json.dumps({'candidate':candidate,'packages':packages}),flush=True)
              maintenance_env={**os.environ,'DEBIAN_FRONTEND':'noninteractive','NEEDRESTART_MODE':'l'}
              command(['apt-get','-y','--only-upgrade','--no-install-recommends','-o','DPkg::Lock::Timeout=20','-o','Dpkg::Options::=--force-confold','install','tor='+candidate,'tor-geoipdb'],180,maintenance_env)
          after=command(['dpkg-query','-W','-f=${Version}','tor']).strip()
          assert supported(after)
          command(['systemctl','restart','tor@default.service'],30)
          print('TOR_VERSION_AFTER',after,flush=True)
          from curl_cffi import requests,CurlOpt
          import certifi
          deadline=time.monotonic()+100;status=None;error=None
          while time.monotonic()<deadline:
              try:
                  with requests.Session(trust_env=False,verify=certifi.where(),curl_options={CurlOpt.NOPROXY:''}) as c:
                      response=c.get('https://openrouter.ai/api/v1/auth/key',headers={'Authorization':'Bearer '+key},proxy=proxy,timeout=8,allow_redirects=False)
                      status=response.status_code
                  if status==200:break
                  if status in (401,403):break
              except Exception as exc:error=type(exc).__name__
              time.sleep(3)
          print('PROVIDER_AUTH_RESULT',json.dumps({'http':status,'exception_class':error,'provider_calls_with_inference':0}),flush=True)
          assert status==200,'CONFIGURED_PROVIDER_AUTH_NOT_READY'
          assert command(['systemctl','show','seiltanzer','-p','MainPID','--value']).strip()==pid
          with urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=5) as r:assert r.status==200
          print('PROVIDER_REPAIR_RESULT',json.dumps({'installed_sha':expected,'app_pid':pid,'app_restarts':0,'db_writes':0,'acks':0,'orders':0,'provider_auth_http':status}),flush=True)
          
          PY
          python3 - "$RUNNER_TEMP/repair-tor.py" <<'PY'
          import sys,os,base64
          from pathlib import Path
          raw=Path(sys.argv[1]).read_bytes()
          compile(raw,sys.argv[1],'exec')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('REPAIR_SCRIPT_B64='+base64.b64encode(raw).decode()+'\n')
          print('Maintenance syntax verified; production prerequisites remain enforced remotely.')
          PY
      - uses: appleboy/ssh-action@v1
        env:
          REPAIR_SCRIPT_B64: ${{ env.REPAIR_SCRIPT_B64 }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 10m
          envs: EXPECTED_SHA,NATIVE_RUN_ID,REPAIR_SCRIPT_B64
          script: |
            set -euo pipefail
            exec 9>/opt/seiltanzer/.deployment-git-maintenance.lock
            flock -w 15 9
            umask 077
            repair_dir=$(mktemp -d /run/seiltanzer-provider-repair.XXXXXX)
            trap 'rm -rf -- "$repair_dir"' EXIT
            printf '%s' "$REPAIR_SCRIPT_B64" | base64 -d > "$repair_dir/repair.py"
            /opt/seiltanzer/.venv/bin/python -B -u "$repair_dir/repair.py"
