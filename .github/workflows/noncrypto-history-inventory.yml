name: finish-second-verified-syslog-archive
permissions:
  contents: read
concurrency:
  group: production-seiltanzer
  queue: max
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 407999e24b66fab4755776fd76a6d3d67a97efbb
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install existing off-host archive transports
      run: python -m pip install --quiet 'boto3>=1.36,<2' 'paramiko>=3.3,<6'
    - name: Rotate only syslog and preserve every byte in the existing private bucket
      env:
        SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ru-central1
        AWS_EC2_METADATA_DISABLED: 'true'
      run: "python -u - <<'PY'\nimport os,json,tempfile,sys\nfrom pathlib import Path\n\
        sys.path.insert(0,'scripts')\nfrom production_ede_offload import _connect,_verify_sha\n\
        from ops_yandex_archive_recovery import remote,copy_to_cloud\nexpected='407999e24b66fab4755776fd76a6d3d67a97efbb'\n\
        client=_connect(os.environ.pop('SSH_PASSWORD'))\ntry:\n    _verify_sha(client,expected)\n\
        \    for source in ('/var/log/syslog.1',):\n        with tempfile.TemporaryDirectory(prefix='verified-closed-syslog-')\
        \ as tmp:\n            _,manifest=copy_to_cloud(client,source,expected,Path(tmp))\n\
        \        code=\"SOURCE=\"+repr(source)+\"\\nmanifest=\"+repr(manifest)+\"\\\
        n\"\n        code+='import subprocess\\nvalidate(manifest)\\n'\n        code+='def\
        \ closed(path):\\n    r=subprocess.run([\"lsof\",\"--\",str(path)],capture_output=True,timeout=10)\\\
        n    if r.returncode not in (0,1):raise ValueError(\"CLOSED_FILE_PROOF_UNAVAILABLE\"\
        )\\n    return r.returncode==1\\n'\n        code+='p=Path(SOURCE)\\nreceipt=p.with_name(p.name+\"\
        .\"+manifest[\"source_sha256\"]+\".cloud-archive.json\")\\n'\n        code+='assert\
        \ not receipt.is_symlink()\\nif receipt.exists():\\n    assert json.loads(receipt.read_text())==manifest\\\
        nelse:\\n    receipt.write_text(json.dumps(manifest,sort_keys=True)+\"\\\\\
        n\")\\n    receipt.chmod(0o600)\\n'\n        code+='proof=retire_closed_archive(p,manifest,is_closed=closed)\\\
        nprint(json.dumps(dict(kind=\"verified_cloud_archive\",verified_full_get=manifest[\"\
        verified_full_get\"],**proof)))\\n'\n        compile(code,'retire-verified-closed-log','exec')\n\
        \        print(json.dumps(remote(client,code)),flush=True)\n    _verify_sha(client,expected)\n\
        \    code='import shutil,subprocess,urllib.request\\npid=subprocess.check_output([\"\
        systemctl\",\"show\",\"seiltanzer\",\"-p\",\"MainPID\",\"--value\"],text=True).strip()\\\
        nassert pid==\"113273\"\\nfree=shutil.disk_usage(\"/\").free\\nwith urllib.request.urlopen(\"\
        http://127.0.0.1:8790/api/state\",timeout=5) as r:status=r.status\\nprint(json.dumps(dict(kind=\"\
        result\",free_after=free,http=status,pid=pid,app_restarts=0,db_writes=0)))\\\
        n'\n    result=remote(client,code);print(json.dumps(result),flush=True)\n\
        \    assert result['free_after']>=512*1024**2 and result['http']==200\nfinally:client.close()\n\
        \nPY\n"
'on':
  push:
    branches:
    - ops/noncrypto-history-inventory-20261026
    paths:
    - .github/workflows/noncrypto-history-inventory.yml
