name: production-exact-sha-cold-cache-retry
concurrency:
  group: production-seiltanzer
  queue: max
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
  statuses: write
jobs:
  deploy:
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      EXPECTED_SHA: f3298efb4df2be1abfe7e6d2d7680367be9938e7
      ACCEPTANCE_RUN_ID: ${{ github.run_id }}
    steps:
    - name: Verify automatic deploy trigger
      if: github.event_name == 'workflow_run'
      run: 'set -euo pipefail

        test "${{ github.event.workflow_run.conclusion }}" = "success"

        test "${{ github.event.workflow_run.head_branch }}" = "main"

        test -n "$EXPECTED_SHA"

        echo "Atomic production acceptance for successful main CI SHA: $EXPECTED_SHA"

        '
    - name: Verify manual dispatch already has green exact-SHA CI
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nbody=$(curl -fsS --max-time 8 \\\n  -H \"Accept: application/vnd.github+json\" \\\
        \n  -H \"Authorization: Bearer $GH_TOKEN\" \\\n  -H \"X-GitHub-Api-Version: 2022-11-28\" \\\n  \"https://api.github.com/repos/${{\
        \ github.repository }}/commits/${EXPECTED_SHA}/status\")\nverdict=$(BODY=\"$body\" python3 - <<'PY'\nimport\
        \ json, os\nbody=json.loads(os.environ['BODY'])\nstates={str(x.get('context')):str(x.get('state')) for x\
        \ in body.get('statuses',[])}\nprint(states.get('ci/full-webkit','missing'))\nPY\n)\necho \"ci/full-webkit\
        \ state=$verdict\"\nif [ \"$verdict\" != \"success\" ]; then\n  echo \"::error::Manual production delivery\
        \ requires an already-green exact-SHA ci/full-webkit\"\n  exit 1\nfi\n"
    - uses: actions/checkout@v4
      with:
        ref: ${{ env.EXPECTED_SHA }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Reject superseded main before production mutation
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash scripts/require_current_main.sh
    - name: Deliver exact SHA over SSH
      id: delivery
      uses: appleboy/ssh-action@v1
      env:
        EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        command_timeout: 20m
        envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
        script: "set -euo pipefail\ncd /opt/seiltanzer\n# Also serialize surviving SSH processes after an interrupted\
          \ run.\nexec 9>/opt/seiltanzer/.deployment-git-maintenance.lock\nflock -w 30 9\n# One read-only run warms\
          \ the same verified metadata before the\n# original independent five-second admission check below. This\n\
          # cannot grant admission, clear a guard, or change any database.\necho '=== READ-ONLY HISTORY CHECK BEFORE\
          \ UNCHANGED ADMISSION ==='\n/usr/bin/python3 /usr/local/lib/seiltanzer-history-start-guard.py \\\n  --database\
          \ /opt/seiltanzer/data/trades.db \\\n  --application-root /opt/seiltanzer || true\nif [ -e /opt/seiltanzer/data/cutover.active\
          \ ] || [ -L /opt/seiltanzer/data/cutover.active ] || {\n  { [ -e /opt/seiltanzer/data/cutover.journal.json\
          \ ] || [ -L /opt/seiltanzer/data/cutover.journal.json ]; } &&\n  ! /usr/bin/python3 /usr/local/lib/seiltanzer-history-start-guard.py\
          \ --database /opt/seiltanzer/data/trades.db --application-root /opt/seiltanzer >/dev/null;\n}; then\n\
          \  echo \"::error::HISTORY_CUTOVER_ACTIVE_MUTATION_REFUSED\"\n  exit 1\nfi\n\necho '=== PRE-DEPLOY SERVICE\
          \ DIAGNOSTICS ==='\nsystemctl status seiltanzer --no-pager -l || true\necho '=== RECENT SEILTANZER JOURNAL\
          \ ==='\njournalctl -u seiltanzer --since '-45 minutes' --no-pager -n 220 || true\necho '=== RECENT KERNEL\
          \ OOM / KILL EVENTS ==='\njournalctl -k --since '-45 minutes' --no-pager 2>/dev/null \\\n  | grep -Ei\
          \ 'out of memory|oom|killed process|memory cgroup' || true\necho '=== HOST CAPACITY BEFORE BOUNDED CLEANUP\
          \ ==='\nfree -h || true\ndf -h / /opt/seiltanzer || true\n\n# A full root filesystem prevents even git\
          \ from creating its lock and\n# temporary object files. Recover space only from bounded disposable\n#\
          \ locations before touching repository state. Never delete data/, DB,\n# ledgers, evidence, model outputs\
          \ or arbitrary application files.\necho '=== BOUNDED PRE-FETCH DISK CLEANUP ==='\nrm -f /root/.gitconfig.lock\
          \ >/dev/null 2>&1 || true\nif [ -d /root/.cache ]; then\n  find /root/.cache -mindepth 1 -maxdepth 1 -exec\
          \ rm -rf -- {} + \\\n    >/dev/null 2>&1 || true\nfi\nrm -rf /root/.npm/_cacache >/dev/null 2>&1 || true\n\
          # /root/wheels is a reproducible package cache, not application data.\n# Remove only wheel artifacts and\
          \ refuse symlinked/unexpected scope.\nwheel_cache_before=0\nwheel_cache_after=0\nif [ -d /root/wheels\
          \ ] && [ ! -L /root/wheels ] && [ \"$(readlink -f /root/wheels)\" = /root/wheels ]; then\n  wheel_cache_before=$(du\
          \ -sb /root/wheels 2>/dev/null | awk '{print $1}')\n  find /root/wheels -xdev -type f -name '*.whl' -delete\
          \ || true\n  wheel_cache_after=$(du -sb /root/wheels 2>/dev/null | awk '{print $1}')\nfi\necho \"DEPLOY_WHEEL_CACHE_BYTES_REMOVED=$((\
          \ wheel_cache_before - wheel_cache_after ))\"\napt-get clean >/dev/null 2>&1 || true\njournalctl --vacuum-size=128M\
          \ >/dev/null 2>&1 || true\nfind /tmp -xdev -mindepth 1 -maxdepth 1 \\\n  \\( -name 'pip-*' -o -name 'pip-build-*'\
          \ -o -name 'pip-install-*' \\) \\\n  -mtime +1 -exec rm -rf -- {} + >/dev/null 2>&1 || true\nfind /opt/seiltanzer\
          \ -xdev \\\n  -path /opt/seiltanzer/data -prune -o \\\n  -type d \\( -name '__pycache__' -o -name '.pytest_cache'\
          \ \\\n    -o -name '.mypy_cache' -o -name '.ruff_cache' \\) \\\n  -prune -exec rm -rf -- {} + >/dev/null\
          \ 2>&1 || true\n\n# Reuse the already-deployed narrow malformed-editable cleanup before\n# git fetch as\
          \ well. It is explicitly confined to malformed ~seiltanzer\n# entries under site-packages and is safe\
          \ to repeat.\nif [ -x /opt/seiltanzer/.venv/bin/python ] \\\n   && [ -f /opt/seiltanzer/scripts/g1e1_cleanup_venv.py\
          \ ]; then\n  SITE=$(/opt/seiltanzer/.venv/bin/python - <<'PY'\nimport site\nprint(site.getsitepackages()[0])\n\
          PY\n  )\n  PYTHONPATH=/opt/seiltanzer /opt/seiltanzer/.venv/bin/python \\\n    /opt/seiltanzer/scripts/g1e1_cleanup_venv.py\
          \ \\\n    --site-packages \"$SITE\" --apply || true\nfi\nsync || true\necho '=== HOST CAPACITY AFTER BOUNDED\
          \ CLEANUP ==='\ndf -h / /opt/seiltanzer || true\n\nfree_kb=$(df --output=avail -k / | tail -n 1 | tr -d\
          \ ' ')\nrequired_kb=$((512 * 1024))\nif [ \"${free_kb:-0}\" -lt \"$required_kb\" ] \\\n   && find /opt/seiltanzer/data/backups/local\
          \ \\\n     -maxdepth 1 -type f -name '.*.tmp.sqlite3' -print -quit \\\n     2>/dev/null | grep -q .; then\n\
          \  # A failed/restarting prestart may own the only disposable multi-GiB\n  # file. Stop the writer first,\
          \ then remove only its exact hidden temp\n  # path so git can fetch the fixed revision. Verified backups\
          \ and the\n  # authoritative DB remain outside this contract.\n  systemctl stop seiltanzer\n  if systemctl\
          \ is-active --quiet seiltanzer; then\n    echo \"::error::seiltanzer still active during pre-fetch recovery\"\
          \n    exit 1\n  fi\n  prefetch_orphan_n=0\n  prefetch_orphan_bytes=0\n  while IFS= read -r -d '' orphan;\
          \ do\n    case \"$orphan\" in\n      /opt/seiltanzer/data/backups/local/.*.tmp.sqlite3) ;;\n      *)\n\
          \        echo \"::error::Refusing unexpected pre-fetch cleanup path: $orphan\"\n        exit 1\n     \
          \   ;;\n    esac\n    size=$(stat -c '%s' \"$orphan\" 2>/dev/null || echo 0)\n    rm -f -- \"$orphan\"\
          \n    prefetch_orphan_n=$((prefetch_orphan_n + 1))\n    prefetch_orphan_bytes=$((prefetch_orphan_bytes\
          \ + size))\n  done < <(\n    find /opt/seiltanzer/data/backups/local \\\n      -maxdepth 1 -type f -name\
          \ '.*.tmp.sqlite3' -print0 2>/dev/null\n  )\n  sync || true\n  echo \"DEPLOY_PREFETCH_ORPHAN_PRESTART_TEMPS_REMOVED=$prefetch_orphan_n\"\
          \n  echo \"DEPLOY_PREFETCH_ORPHAN_PRESTART_TEMP_BYTES_REMOVED=$prefetch_orphan_bytes\"\n  free_kb=$(df\
          \ --output=avail -k / | tail -n 1 | tr -d ' ')\nfi\nif [ \"${free_kb:-0}\" -lt \"$required_kb\" ]; then\n\
          \  echo \"::error::Insufficient safe pre-fetch headroom: ${free_kb:-0} KiB < ${required_kb} KiB\"\n  echo\
          \ '=== BOUNDED DISK DIAGNOSTICS ==='\n  du -xhd1 /opt 2>/dev/null | sort -h | tail -n 30 || true\n  du\
          \ -xhd1 /var 2>/dev/null | sort -h | tail -n 30 || true\n  du -xhd1 /root 2>/dev/null | sort -h | tail\
          \ -n 30 || true\n  exit 1\nfi\n\nrm -f /root/.gitconfig.lock >/dev/null 2>&1 || true\ngit config --global\
          \ --add safe.directory /opt/seiltanzer || true\n\nwhile read -r unit _; do\n  [ -n \"$unit\" ] || continue\n\
          \  case \"$unit\" in\n    seiltanzer-ede-*.service)\n      echo \"Stopping legacy production EDE unit:\
          \ $unit\"\n      timeout 8s systemctl stop \"$unit\" >/dev/null 2>&1 || true\n      systemctl kill --kill-who=all\
          \ --signal=KILL \"$unit\" >/dev/null 2>&1 || true\n      systemctl reset-failed \"$unit\" >/dev/null 2>&1\
          \ || true\n      ;;\n  esac\ndone < <(systemctl list-units --all --type=service --no-legend 'seiltanzer-ede-*'\
          \ || true)\n\npkill -f '/opt/seiltanzer/scripts/[p]roduction_ede_v13_audit.py' >/dev/null 2>&1 || true\n\
          pkill -f '/opt/seiltanzer/scripts/[p]roduction_ede_transition_audit.py' >/dev/null 2>&1 || true\npkill\
          \ -f '/opt/seiltanzer/scripts/[p]roduction_ede_inventory.py' >/dev/null 2>&1 || true\npkill -f '/opt/seiltanzer/scripts/[p]roduction_ede_offload.py'\
          \ >/dev/null 2>&1 || true\n\n# Recovery and retry deploys may already have the exact commit locally.\n\
          # Avoid the VPS's credential-dependent `origin` in that case. For a\n# newly merged SHA, fetch through\
          \ the public repository URL instead so\n# production delivery remains independent of server-side Git auth.\n\
          if git cat-file -e \"${EXPECTED_SHA}^{commit}\" 2>/dev/null; then\n  echo \"DEPLOY_EXACT_SHA_ALREADY_LOCAL=$EXPECTED_SHA\"\
          \nelse\n  git fetch --depth=1 --no-tags https://github.com/Seiltanzer03/trading_dbd.git main\n  git cat-file\
          \ -e \"${EXPECTED_SHA}^{commit}\"\nfi\ngit reset --hard \"$EXPECTED_SHA\"\ntest \"$(git rev-parse HEAD)\"\
          \ = \"$EXPECTED_SHA\"\n\nSITE=$(/opt/seiltanzer/.venv/bin/python - <<'PY'\nimport site\nprint(site.getsitepackages()[0])\n\
          PY\n)\nPYTHONPATH=/opt/seiltanzer /opt/seiltanzer/.venv/bin/python \\\n  /opt/seiltanzer/scripts/g1e1_cleanup_venv.py\
          \ --site-packages \"$SITE\" --apply || true\n/opt/seiltanzer/.venv/bin/pip install --quiet -e /opt/seiltanzer\n\
          \necho '=== POST-INSTALL DISK ==='\ndf -h / /opt/seiltanzer || true\n\nmkdir -p /etc/systemd/system/seiltanzer.service.d\n\
          install -m 0644 scripts/history_service_fence.py /usr/local/lib/seiltanzer-history-start-guard.py\ninstall\
          \ -m 0644 deploy/history-start-fence.conf /etc/systemd/system/seiltanzer.service.d/30-history-cutover.conf\n\
          cat >/etc/systemd/system/seiltanzer.service.d/20-memory-budget.conf <<'EOF'\n[Service]\nEnvironment=MALLOC_ARENA_MAX=2\n\
          Environment=MALLOC_TRIM_THRESHOLD_=131072\nEnvironment=OMP_NUM_THREADS=1\nEnvironment=OPENBLAS_NUM_THREADS=1\n\
          Environment=MKL_NUM_THREADS=1\nEnvironment=NUMEXPR_NUM_THREADS=1\nEOF\nsystemctl daemon-reload\nsystemctl\
          \ reset-failed seiltanzer >/dev/null 2>&1 || true\n\n# A slow shutdown can be SIGKILLed by systemd while\
          \ the old process\n# owns a young hidden SQLite backup temp or a disposable restore-drill\n# copy. `systemctl\
          \ stop` returning gives us the safe boundary: no live\n# seiltanzer writer remains, so only those exact\
          \ temp names are orphaned\n# and may be removed. Verified recovery points, manifests and the\n# authoritative\
          \ DB are deliberately outside these path/name contracts.\nsystemctl stop seiltanzer\nif systemctl is-active\
          \ --quiet seiltanzer; then\n  echo \"::error::seiltanzer still active after explicit stop\"\n  exit 1\n\
          fi\norphan_tmp_n=0\norphan_tmp_bytes=0\nwhile IFS= read -r -d '' orphan; do\n  case \"$orphan\" in\n \
          \   /opt/seiltanzer/data/backups/local/.*.tmp.sqlite3) ;;\n    *)\n      echo \"::error::Refusing unexpected\
          \ prestart temp cleanup path: $orphan\"\n      exit 1\n      ;;\n  esac\n  size=$(stat -c '%s' \"$orphan\"\
          \ 2>/dev/null || echo 0)\n  rm -f -- \"$orphan\"\n  orphan_tmp_n=$((orphan_tmp_n + 1))\n  orphan_tmp_bytes=$((orphan_tmp_bytes\
          \ + size))\ndone < <(\n  find /opt/seiltanzer/data/backups/local \\\n    -maxdepth 1 -type f -name '.*.tmp.sqlite3'\
          \ -print0 2>/dev/null\n)\necho \"DEPLOY_ORPHAN_PRESTART_TEMPS_REMOVED=$orphan_tmp_n\"\necho \"DEPLOY_ORPHAN_PRESTART_TEMP_BYTES_REMOVED=$orphan_tmp_bytes\"\
          \n\ncommand -v lsof >/dev/null 2>&1 || {\n  echo \"::error::lsof is required for bounded restore-temp\
          \ cleanup\"\n  exit 1\n}\nrestore_tmp_n=0\nrestore_tmp_bytes=0\nwhile IFS= read -r -d '' orphan; do\n\
          \  case \"$orphan\" in\n    /tmp/seiltanzer-service-restore-drill-*.sqlite3) ;;\n    *)\n      echo \"\
          ::error::Refusing unexpected restore temp cleanup path: $orphan\"\n      exit 1\n      ;;\n  esac\n  if\
          \ lsof -- \"$orphan\" >/dev/null 2>&1; then\n    echo \"::error::Refusing open restore temp after service\
          \ stop: $orphan\"\n    exit 1\n  fi\n  size=$(stat -c '%s' \"$orphan\" 2>/dev/null || echo 0)\n  rm -f\
          \ -- \"$orphan\"\n  restore_tmp_n=$((restore_tmp_n + 1))\n  restore_tmp_bytes=$((restore_tmp_bytes + size))\n\
          done < <(\n  find /tmp -xdev -maxdepth 1 -type f \\\n    -name 'seiltanzer-service-restore-drill-*.sqlite3'\
          \ \\\n    -print0 2>/dev/null\n)\nsync || true\necho \"DEPLOY_ORPHAN_RESTORE_TEMPS_REMOVED=$restore_tmp_n\"\
          \necho \"DEPLOY_ORPHAN_RESTORE_TEMP_BYTES_REMOVED=$restore_tmp_bytes\"\ndf -h / || true\nsystemctl start\
          \ seiltanzer\n\ntest \"$(git -C /opt/seiltanzer rev-parse HEAD)\" = \"$EXPECTED_SHA\"\n\n# The current\
          \ 19GB database completed schema verification at755s\n# on2026-10-20, beyond the old720s orchestration\
          \ allowance. Retain\n# a finite16min startup window so recovery does not interrupt an\n# integrity check\
          \ that is still progressing. This changes only\n# orchestration; integrity and actual HTTP gates remain\
          \ mandatory.\n# This does not relax the live route latency/readiness gates below.\ncold_start_attempts=480\n\
          ready=0\nfor attempt in $(seq 1 \"$cold_start_attempts\"); do\n  active=$(systemctl is-active seiltanzer\
          \ 2>/dev/null || true)\n  prestart_backup_bytes=$(find /opt/seiltanzer/data/backups/local \\\n    -maxdepth\
          \ 1 -type f -name '.*.tmp.sqlite3' -printf '%s\\n' \\\n    2>/dev/null | sort -nr | head -n 1 || true)\n\
          \  result=$(curl -sS -o /tmp/seiltanzer-deploy-state.json \\\n    --connect-timeout 1 --max-time 3 \\\n\
          \    -w '%{http_code} %{time_total}' \\\n    http://127.0.0.1:8790/api/state 2>/dev/null || true)\n  code=${result%%\
          \ *}\n  elapsed=${result#* }\n  echo \"post-restart attempt=$attempt/$cold_start_attempts active=${active:-unknown}\
          \ http=${code:-000} seconds=${elapsed:-na} prestart_backup_bytes=${prestart_backup_bytes:-0}\"\n  if [\
          \ \"$active\" = \"active\" ] && [ \"$code\" = \"200\" ]; then\n    ready=1\n    break\n  fi\n  sleep 2\n\
          done\n# The service can bind during the final delay; observe that state\n# before declaring failure, retaining\
          \ both real service/HTTP gates.\nif [ \"$ready\" != \"1\" ]; then\n  active=$(systemctl is-active seiltanzer\
          \ 2>/dev/null || true)\n  result=$(curl -sS -o /tmp/seiltanzer-deploy-state.json \\\n    --connect-timeout\
          \ 1 --max-time 3 -w '%{http_code} %{time_total}' \\\n    http://127.0.0.1:8790/api/state 2>/dev/null ||\
          \ true)\n  code=${result%% *}\n  echo \"post-restart final-probe active=${active:-unknown} http=${code:-000}\"\
          \n  if [ \"$active\" = \"active\" ] && [ \"$code\" = \"200\" ]; then\n    ready=1\n  fi\nfi\nif [ \"$ready\"\
          \ != \"1\" ]; then\n  echo '::error::seiltanzer failed real HTTP readiness after restart'\n  systemctl\
          \ status seiltanzer --no-pager -l || true\n  journalctl -u seiltanzer --since '-10 minutes' --no-pager\
          \ -n 180 || true\n  exit 1\nfi\n\necho '=== POST-RESTART MEMORY ==='\nsystemctl show seiltanzer \\\n \
          \ -p MemoryCurrent -p MemoryPeak -p NRestarts -p ActiveState -p SubState || true\nps -o pid,rss,vsz,etime,cmd\
          \ -p \"$(systemctl show -p MainPID --value seiltanzer)\" || true\n\nif systemctl list-units --all --type=service\
          \ --no-legend 'seiltanzer-ede-*' | grep -q 'running'; then\n  echo \"::error::Legacy production EDE unit\
          \ survived deployment\"\n  exit 1\nfi\necho \"Delivered exact production SHA: $EXPECTED_SHA\"\n"
    - name: Pause research for exact-SHA production acceptance
      id: preacceptance
      uses: appleboy/ssh-action@v1
      env:
        EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        command_timeout: 20m
        envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
        script: "set -euo pipefail\ntest \"$(git -C /opt/seiltanzer rev-parse HEAD)\" = \"$EXPECTED_SHA\"\nPY=/opt/seiltanzer/.venv/bin/python\n\
          ORCH=/opt/seiltanzer/scripts/production_research_acceptance.py\ngate_owned=0\n\ncleanup_gate_on_failure()\
          \ {\n  if [ \"$gate_owned\" -eq 1 ]; then\n    \"$PY\" \"$ORCH\" release-gate \\\n      --acceptance-run-id\
          \ \"$ACCEPTANCE_RUN_ID\" \\\n      --expected-sha \"$EXPECTED_SHA\" || true\n  fi\n}\ntrap cleanup_gate_on_failure\
          \ EXIT\n\n# Acquire the existing cooperative lease immediately after the new\n# service first becomes\
          \ HTTP-ready. The worker may complete its one\n# required core cycle, but cannot start optional maintenance\
          \ before\n# the readiness transaction begins.\n\"$PY\" \"$ORCH\" acquire-gate \\\n  --acceptance-run-id\
          \ \"$ACCEPTANCE_RUN_ID\" \\\n  --expected-sha \"$EXPECTED_SHA\" \\\n  --ttl-seconds 7200\ngate_owned=1\n\
          \n\"$PY\" /opt/seiltanzer/scripts/production_post_research_check.py \\\n  --expected-sha \"$EXPECTED_SHA\"\
          \ \\\n  --acceptance-run-id \"$ACCEPTANCE_RUN_ID\"\n\"$PY\" \"$ORCH\" validate-gate \\\n  --acceptance-run-id\
          \ \"$ACCEPTANCE_RUN_ID\" \\\n  --expected-sha \"$EXPECTED_SHA\"\n\ntrap - EXIT\necho \"PRE_ACCEPTANCE_RESEARCH_PAUSED\
          \ expected_sha=$EXPECTED_SHA acceptance_run_id=$ACCEPTANCE_RUN_ID\"\n"
    - name: Verify exact production readiness
      id: readiness
      uses: appleboy/ssh-action@v1
      env:
        EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        command_timeout: 10m
        envs: EXPECTED_SHA
        script: "set -euo pipefail\ntest \"$(git -C /opt/seiltanzer rev-parse HEAD)\" = \"$EXPECTED_SHA\"\n/opt/seiltanzer/.venv/bin/python\
          \ \\\n  /opt/seiltanzer/scripts/production_readiness_check.py \\\n  --expected-sha \"$EXPECTED_SHA\" \\\
          \n  --skip-restore-drill-low-disk\n"
    - name: Start exact-SHA mathematical edge refresh off-host
      id: mathrefresh
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\npayload=$(python3 - <<'PY'\nimport json, os\nprint(json.dumps({'ref': 'main', 'inputs':\
        \ {'expected_sha': os.environ['EXPECTED_SHA']}}))\nPY\n)\ncurl --fail-with-body --silent --show-error \\\
        \n  --retry 3 --retry-delay 2 --retry-max-time 15 --retry-all-errors \\\n  -X POST -H \"Authorization: Bearer\
        \ $GH_TOKEN\" \\\n  -H \"Accept: application/vnd.github+json\" \\\n  \"https://api.github.com/repos/${{\
        \ github.repository }}/actions/workflows/mathematical-edge.yml/dispatches\" \\\n  -d \"$payload\"\necho\
        \ \"MATHEMATICAL_EDGE_REFRESH_DISPATCHED expected_sha=$EXPECTED_SHA\"\n"
    - name: Start exact-SHA source family collection off-host
      id: sourcerefresh
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\npayload=$(python3 - <<'PY'\nimport json, os\nprint(json.dumps({'ref': 'main', 'inputs':\
        \ {'expected_sha': os.environ['EXPECTED_SHA']}}))\nPY\n)\ncurl --fail-with-body --silent --show-error \\\
        \n  --retry 3 --retry-delay 2 --retry-max-time 15 --retry-all-errors \\\n  -X POST -H \"Authorization: Bearer\
        \ $GH_TOKEN\" \\\n  -H \"Accept: application/vnd.github+json\" \\\n  \"https://api.github.com/repos/${{\
        \ github.repository }}/actions/workflows/edge-family-sources.yml/dispatches\" \\\n  -d \"$payload\"\necho\
        \ \"EDGE_FAMILY_SOURCE_REFRESH_DISPATCHED expected_sha=$EXPECTED_SHA\"\n"
    - name: Start exact-SHA prospective FOMC capture off-host
      id: fomcrefresh
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\npayload=$(python3 - <<'PY'\nimport json, os\nprint(json.dumps({'ref': 'main', 'inputs':\
        \ {'expected_sha': os.environ['EXPECTED_SHA']}}))\nPY\n)\ncurl --fail-with-body --silent --show-error \\\
        \n  --retry 3 --retry-delay 2 --retry-max-time 15 --retry-all-errors \\\n  -X POST -H \"Authorization: Bearer\
        \ $GH_TOKEN\" \\\n  -H \"Accept: application/vnd.github+json\" \\\n  \"https://api.github.com/repos/${{\
        \ github.repository }}/actions/workflows/fomc-prospective-capture.yml/dispatches\" \\\n  -d \"$payload\"\
        \necho \"FOMC_PROSPECTIVE_REFRESH_DISPATCHED expected_sha=$EXPECTED_SHA\"\n"
    - name: Build exact-SHA official macro transport bundle off-host
      run: "set -euo pipefail\npython -m pip install --disable-pip-version-check --quiet -e '.[research]'\npython\
        \ scripts/build_offhost_macro_bundle.py \\\n  --expected-sha \"$EXPECTED_SHA\" \\\n  --acceptance-run-id\
        \ \"$ACCEPTANCE_RUN_ID\" \\\n  --output \"official-macro-${ACCEPTANCE_RUN_ID}.json\"\n"
    - name: Transfer verified official macro bundle over deploy channel
      uses: appleboy/scp-action@v1
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        source: official-macro-${{ github.run_id }}.json
        target: /tmp
    - name: Install fresh exact-SHA official macro bundle before smoke
      uses: appleboy/ssh-action@v1
      env:
        EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        command_timeout: 2m
        envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
        script: "set -euo pipefail\ncase \"$ACCEPTANCE_RUN_ID\" in\n  ''|*[!0-9]*) echo \"Invalid acceptance_run_id\"\
          ; exit 1 ;;\nesac\nbundle_input=\"/tmp/official-macro-${ACCEPTANCE_RUN_ID}.json\"\ntrap 'rm -f -- \"$bundle_input\"\
          ' EXIT\ntest -f \"$bundle_input\"\ntest \"$(git -C /opt/seiltanzer rev-parse HEAD)\" = \"$EXPECTED_SHA\"\
          \n/opt/seiltanzer/.venv/bin/python \\\n  /opt/seiltanzer/scripts/install_offhost_macro_bundle.py \\\n\
          \  --input \"$bundle_input\" \\\n  --destination /opt/seiltanzer/data/research/official_macro_offhost_latest.json\
          \ \\\n  --expected-sha \"$EXPECTED_SHA\" \\\n  --acceptance-run-id \"$ACCEPTANCE_RUN_ID\"\n"
    - name: Exercise exact production routes, AI and official macro data
      id: smoke
      uses: appleboy/ssh-action@v1
      env:
        EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        command_timeout: 8m
        envs: EXPECTED_SHA
        script: "set -euo pipefail\ntest \"$(git -C /opt/seiltanzer rev-parse HEAD)\" = \"$EXPECTED_SHA\"\n/opt/seiltanzer/.venv/bin/python\
          \ \\\n  /opt/seiltanzer/scripts/production_functional_smoke.py \\\n  --expected-sha \"$EXPECTED_SHA\"\n"
    - name: Verify public terminal from GitHub runner
      id: public
      run: "set -euo pipefail\nurl=\"http://94.241.171.182:8790/api/state\"\nfor attempt in 1 2 3; do\n  if curl\
        \ -fsS \\\n    --connect-timeout 3 \\\n    --max-time 5 \\\n    --output /tmp/public-state.json \\\n   \
        \ \"$url\"; then\n    bytes=$(wc -c < /tmp/public-state.json)\n    echo \"public terminal PASS attempt=${attempt}\
        \ bytes=${bytes}\"\n    exit 0\n  fi\n  echo \"public terminal attempt=${attempt}/3 failed\"\n  sleep 2\n\
        done\necho \"::error::Public terminal is unreachable at ${url}\"\nexit 1\n"
    - name: Start exact-SHA post-deploy research acceptance
      id: orchestration
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\ncase \"$EXPECTED_SHA\" in\n  [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*)\
        \ ;;\n  *) echo \"::error::Invalid expected_sha: $EXPECTED_SHA\"; exit 1 ;;\nesac\ncase \"$ACCEPTANCE_RUN_ID\"\
        \ in\n  ''|*[!0-9]*) echo \"::error::Invalid acceptance_run_id: $ACCEPTANCE_RUN_ID\"; exit 1 ;;\nesac\n\
        payload=$(python3 - <<'PY'\nimport json, os\nprint(json.dumps({\n    \"ref\": \"main\",\n    \"inputs\"\
        : {\n        \"expected_sha\": os.environ[\"EXPECTED_SHA\"],\n        \"acceptance_run_id\": os.environ[\"\
        ACCEPTANCE_RUN_ID\"],\n    },\n}))\nPY\n)\ncurl --fail-with-body --silent --show-error \\\n  --retry 5 --retry-delay\
        \ 2 --retry-max-time 30 --retry-all-errors \\\n  -X POST \\\n  -H \"Accept: application/vnd.github+json\"\
        \ \\\n  -H \"Authorization: Bearer $GH_TOKEN\" \\\n  -H \"X-GitHub-Api-Version: 2022-11-28\" \\\n  \"https://api.github.com/repos/${{\
        \ github.repository }}/actions/workflows/production-post-research.yml/dispatches\" \\\n  -d \"$payload\"\
        \necho \"POST_RESEARCH_DISPATCHED expected_sha=$EXPECTED_SHA acceptance_run_id=$ACCEPTANCE_RUN_ID\"\n"
    - name: Release pre-acceptance gate if deploy chain failed
      if: always() && steps.preacceptance.outcome == 'success' && steps.orchestration.outcome != 'success'
      uses: appleboy/ssh-action@v1
      env:
        EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        command_timeout: 2m
        envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
        script: "/opt/seiltanzer/.venv/bin/python \\\n  /opt/seiltanzer/scripts/production_research_acceptance.py\
          \ release-gate \\\n  --acceptance-run-id \"$ACCEPTANCE_RUN_ID\" \\\n  --expected-sha \"$EXPECTED_SHA\"\
          \ || true\n"
    - name: Diagnose production failure
      if: failure()
      uses: appleboy/ssh-action@v1
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        port: 22
        command_timeout: 2m
        script: 'set +e

          echo ''=== DEPLOYED SHA ===''

          git -C /opt/seiltanzer rev-parse HEAD || true

          echo ''=== SERVICE ===''

          systemctl status seiltanzer --no-pager -l || true

          echo ''=== AI SNAPSHOT STATUS ===''

          curl -sS --max-time 5 http://127.0.0.1:8790/api/ai/snapshot/status || true

          echo

          echo ''=== MACRO STATUS ===''

          curl -sS --max-time 8 http://127.0.0.1:8790/api/research/macro/status || true

          echo

          echo ''=== RECENT JOURNAL ===''

          journalctl -u seiltanzer --since ''-15 minutes'' --no-pager -n 220 || true

          '
    - name: Publish exact-SHA production statuses
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        DELIVERY: ${{ steps.delivery.outcome }}
        PREACCEPTANCE: ${{ steps.preacceptance.outcome }}
        READINESS: ${{ steps.readiness.outcome }}
        SMOKE: ${{ steps.smoke.outcome }}
        PUBLIC: ${{ steps.public.outcome }}
        ORCHESTRATION: ${{ steps.orchestration.outcome }}
        MATHREFRESH: ${{ steps.mathrefresh.outcome }}
        SOURCEREFRESH: ${{ steps.sourcerefresh.outcome }}
        FOMCREFRESH: ${{ steps.fomcrefresh.outcome }}
      run: "set -u\nprod_state=failure\nsmoke_state=failure\nreadiness_state=failure\nif [ \"$READINESS\" = \"success\"\
        \ ]; then readiness_state=success; fi\nif [ \"$SMOKE\" = \"success\" ] && [ \"$PUBLIC\" = \"success\" ];\
        \ then smoke_state=success; fi\nif [ \"$DELIVERY\" = \"success\" ] && [ \"$PREACCEPTANCE\" = \"success\"\
        \ ] \\\n   && [ \"$READINESS\" = \"success\" ] \\\n   && [ \"$SMOKE\" = \"success\" ] && [ \"$PUBLIC\" =\
        \ \"success\" ] \\\n   && [ \"$MATHREFRESH\" = \"success\" ] && [ \"$SOURCEREFRESH\" = \"success\" ] \\\n\
        \   && [ \"$FOMCREFRESH\" = \"success\" ] && [ \"$ORCHESTRATION\" = \"success\" ]; then\n  prod_state=success\n\
        fi\n\npublish() {\n  state=\"$1\"; context=\"$2\"; description=\"$3\"\n  payload=\"{\\\"state\\\":\\\"$state\\\
        \",\\\"context\\\":\\\"$context\\\",\\\"description\\\":\\\"$description\\\",\\\"target_url\\\":\\\"${{\
        \ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\\\"}\"\n  curl --fail-with-body\
        \ --silent --show-error \\\n    --retry 5 --retry-delay 2 --retry-max-time 30 --retry-all-errors \\\n  \
        \  -X POST \\\n    -H \"Accept: application/vnd.github+json\" \\\n    -H \"Authorization: Bearer $GH_TOKEN\"\
        \ \\\n    -H \"X-GitHub-Api-Version: 2022-11-28\" \\\n    \"https://api.github.com/repos/${{ github.repository\
        \ }}/statuses/${EXPECTED_SHA}\" \\\n    -d \"$payload\"\n}\n\npublish \"$prod_state\" \"production/seiltanzer\"\
        \ \\\n  \"Atomic exact-SHA delivery, readiness and functional acceptance\"\npublish \"$readiness_state\"\
        \ \"g1e/storage-intelligence\" \\\n  \"Durability and bounded Intelligence readiness\"\npublish \"$readiness_state\"\
        \ \"g1m/management-edge\" \\\n  \"Terminal Management Edge readiness\"\npublish \"$readiness_state\" \"\
        g1s/short-horizon\" \\\n  \"Fast short-horizon evidence and Q maturity readiness\"\npublish \"$readiness_state\"\
        \ \"g1m/local-feedback\" \\\n  \"Local management feedback readiness\"\npublish \"$smoke_state\" \"production/functional-smoke\"\
        \ \\\n  \"Bounded analytics, AI Verdict, official macro and public endpoint smoke\"\n\necho \"EXPECTED_SHA=$EXPECTED_SHA\
        \ acceptance_run_id=$ACCEPTANCE_RUN_ID delivery=$DELIVERY readiness=$READINESS smoke=$SMOKE public=$PUBLIC\
        \ orchestration=$ORCHESTRATION\"\ntest \"$prod_state\" = \"success\"\n"
'on':
  push:
    branches:
    - ops/noncrypto-history-inventory-20261026
    paths:
    - .github/workflows/noncrypto-history-inventory.yml
