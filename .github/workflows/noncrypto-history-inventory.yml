name: release-delivery-status-readonly
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 60s
          script: |
            cd /opt/seiltanzer
            date -u '+DELIVERY_STATUS %Y-%m-%dT%H:%M:%SZ'
            git rev-parse HEAD
            systemctl show seiltanzer -p MainPID -p NRestarts -p ExecMainStartTimestamp -p ActiveState -p SubState
            ps -C git,python,python3,rsync,pip,tar,gzip,bash,uvicorn -o pid,ppid,etime,stat,wchan:28,comm
            df -m / /opt/seiltanzer
            free -m
