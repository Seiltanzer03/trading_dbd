name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify primary Nikkei option volatility historical source without production access
        run: |
          python -u - <<'PY'
          import csv,hashlib,io,json,time,urllib.request
          url='https://indexes.nikkei.co.jp/nkave/historical/nikkei_stock_average_vi_daily_en.csv'
          request=urllib.request.Request(url,headers={'User-Agent':'trading-dbd historical-source-verification/1.0'})
          with urllib.request.urlopen(request,timeout=15) as response:
              raw=response.read(2000001)
              assert len(raw)<=2000000
              status=response.status;headers=dict(response.headers)
          rows=list(csv.reader(io.StringIO(raw.decode('cp932'))))
          dated=[row for row in rows if row and len(row[0])==10 and row[0][0:4].isdigit()]
          print('PRIMARY_NIKKEI_VI_HISTORY='+json.dumps(dict(
              url=url,http_status=status,received_ts=time.time(),bytes=len(raw),
              payload_sha256=hashlib.sha256(raw).hexdigest(),headers=rows[:1],
              dated_rows=len(dated),date_examples=[row[0] for row in dated[:2]+dated[-2:]],
              first_rows=dated[:2],last_rows=dated[-2:],content_type=headers.get('Content-Type'),
              last_modified=headers.get('Last-Modified'),production_access=False,
              training_performed=False)),flush=True)
          PY
