name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b411ed1a67457e033b0f910dad36563b7fe35698
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -q -e '.[dev]' paramiko
      - name: Inspect cached runtime clocks and one actual XAU minute source without writes
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python -u - <<'PY'
          import json,os,shlex,time
          from scripts.production_ede_offload import _connect
          program="import json,time,urllib.request\nwith urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=15) as response: raw=response.read(2100001)\nassert len(raw)<=2100000\ns=json.loads(raw);now=time.time()\nv=(s.get('levels') or {}).get('volume_profile') or {}\nprice=(s.get('feeds') or {}).get('price') or {}\nout=dict(read_only=True,sqlite_access=False,paid_calls=False,instrument=s.get('instrument'),\n sampled_ts=now,state_ts=s.get('ts'),intraday_window_end=v.get('window_end'),\n intraday_end_age_sec=now-v['window_end'] if isinstance(v.get('window_end'),(int,float)) else None,\n price_source=price.get('source'),price_status=price.get('status'))\nwith urllib.request.urlopen('http://127.0.0.1:8790/api/ai/snapshot/status',timeout=10) as response: raw=response.read(100001)\nassert len(raw)<=100000\nstatus=json.loads(raw)\nout['materializer']={k:status.get(k) for k in ('ready','building','built_at','age_sec','build_ms','last_error','build_n','invalidated_reason')}\nprint('RUNTIME_MARKET_CLOCKS='+json.dumps(out))"
          client=_connect(os.environ['SSH_PASSWORD'],attempts=1)
          try:
              _,stdout,stderr=client.exec_command('python3 -c '+shlex.quote(program),timeout=40)
              output=stdout.read(50001).decode();error=stderr.read(1000).decode();status=stdout.channel.recv_exit_status()
              assert len(output)<=50000
              print(output,flush=True)
              if status: print('RUNTIME_CLOCK_PROBE_UNAVAILABLE='+str(status),flush=True)
          finally:client.close()
          import yfinance as yf
          from seiltanzer.config import ALL_INSTRUMENTS
          from seiltanzer.mathematical_edge import completed_live_bars
          symbol=ALL_INSTRUMENTS['XAU'].yahoo
          hist=yf.Ticker(symbol).history(period='1d',interval='1m',timeout=10)
          received=time.time();rows=[(ts.timestamp(),float(r['Open']),float(r['High']),float(r['Low']),float(r['Close'])) for ts,r in hist.iterrows()]
          completed=completed_live_bars(rows,received)
          print('ACTUAL_XAU_SOURCE_CLOCKS='+json.dumps(dict(symbol=symbol,received_ts=received,rows=len(rows),
           latest_source_minute_start=rows[-1][0] if rows else None,
           latest_completed_5m_end=completed[-1]['bar_end_ts'] if completed else None,
           expected_current_5m_origin=int(received//300)*300,
           latest_minute_age_sec=received-rows[-1][0] if rows else None,
           latest_completed_bar_age_sec=received-completed[-1]['bar_end_ts'] if completed else None,
           source_timestamp_rewritten=False,training=False)),flush=True)
          PY
