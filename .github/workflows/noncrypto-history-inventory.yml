name: diagnose-live-ai-review
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Recover a skipped systemd startup through the installed history fence
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /opt/seiltanzer
            test "$(git rev-parse HEAD)" = '9c3694f264372b9ad8c693fbea6c3a0c9c6f6d44'
            state=$(systemctl show seiltanzer -p ActiveState --value)
            result=$(systemctl show seiltanzer -p Result --value)
            printf 'STARTUP_CHECK active=%s result=%s\n' "$state" "$result"
            if [ "$state" = active ] || [ "$state" = activating ]; then
                exit 0
            fi
            test "$state" = inactive
            test "$result" = exec-condition
            verified=false
            for attempt in 1 2 3; do
                if fence=$(/usr/bin/timeout 9s /usr/bin/python3 /usr/local/lib/seiltanzer-history-start-guard.py --database /opt/seiltanzer/data/trades.db --application-root /opt/seiltanzer); then
                    printf 'STARTUP_FENCE attempt=%s %s\n' "$attempt" "$fence"
                    if printf '%s' "$fence" | grep -q '"start_allowed": true'; then
                        verified=true
                        break
                    fi
                    exit 1
                fi
                printf 'STARTUP_FENCE_RETRY attempt=%s %s\n' "$attempt" "$fence"
                case "$fence" in
                    *'"reason": "HOT_HISTORY_STATE_INVALID"'*|*'"reason": "HOT_HISTORY_STATE_CHECK_TIMEOUT"'*|*'"reason": "JSON_PAYLOAD_STORAGE_CHECK_TIMEOUT"'*) sleep 3 ;;
                    *) exit 1 ;;
                esac
            done
            test "$verified" = true
            test "$(git rev-parse HEAD)" = '9c3694f264372b9ad8c693fbea6c3a0c9c6f6d44'
            state=$(systemctl show seiltanzer -p ActiveState --value)
            if [ "$state" = inactive ]; then
                systemctl start --no-block seiltanzer
            fi
            systemctl show seiltanzer -p ActiveState -p SubState -p Result -p MainPID
