name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Count metadata-index scope read-only before a bounded audit fix
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 30s
          script: |
            /usr/bin/python3 -u - <<'PY'
            import json,sqlite3,time
            c=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=1)
            c.execute('PRAGMA query_only=ON');c.execute('PRAGMA trusted_schema=OFF')
            deadline=time.monotonic()+8;c.set_progress_handler(lambda:time.monotonic()>=deadline,1000)
            try:
             for table in ('passive_market_observations','g1_q_capture_attempts'):
              print(json.dumps(dict(kind='index_scope',table=table,rows=c.execute('SELECT COUNT(*) FROM '+table).fetchone()[0],indexes=c.execute('PRAGMA index_list('+table+')').fetchall())),flush=True)
            finally:c.close()
            print('READ_ONLY_INDEX_SCOPE_NO_WRITES')
            PY
