name: focused-current-input-diagnostic
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 5m
          script: |
            cd /opt/seiltanzer
            PYTHONPATH=/opt/seiltanzer .venv/bin/python -B -u - <<'PY'
            import concurrent.futures,json,pathlib,sqlite3,subprocess,time,urllib.request
            from collections import Counter
            from seiltanzer.edge_discovery.ai_context import canonical_current_feature_map
            expected='2f2681ed2685ddfd0bbca6fe1c58c5272306d0af'
            assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==expected
            root=pathlib.Path('/opt/seiltanzer/data')
            def read(route):
             started=time.monotonic()
             try:
              with urllib.request.urlopen('http://127.0.0.1:8790'+route,timeout=6) as response:
               raw=response.read(4000001);assert len(raw)<=4000000;value=json.loads(raw)
              if route.endswith('worker-status'):value={'inputs':value.get('decision_model_inputs'),'worker':value.get('worker')}
              elif route.endswith('/api/state'):
               tick=value.get('tick') or {};value={'instrument':tick.get('instrument'),'tick_ts':tick.get('ts'),'chain':(tick.get('feeds') or {}).get('chain')}
              elif 'macro/latest' in route:
               value={'status':value.get('status'),'period':value.get('period'),'official_source_verified':value.get('official_source_verified'),'unavailable_fields':(value.get('payload') or {}).get('unavailable_fields')}
              return {'route':route,'ms':round(1000*(time.monotonic()-started),1),'result':value}
             except Exception as error:return {'route':route,'ms':round(1000*(time.monotonic()-started),1),'error':type(error).__name__+': '+str(error)}
            with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
             for result in pool.map(read,['/api/state','/api/research/runtime/worker-status','/api/research/macro/latest?family=CPI']):print('INPUT_DIAG_HTTP',json.dumps(result),flush=True)
            connection=sqlite3.connect((root/'trades.db').resolve().as_uri()+'?mode=ro',uri=True,timeout=.05)
            connection.execute('PRAGMA query_only=ON');connection.execute('PRAGMA cache_size=-1024')
            deadline=time.monotonic()+1
            connection.set_progress_handler(lambda:time.monotonic()>deadline,1000)
            try:
             started=time.monotonic()
             row=connection.execute("SELECT captured_ts,length(frozen_features_json),substr(frozen_features_json,1,2000001) FROM g1s_observations WHERE instrument='SP500' AND captured_ts<=? ORDER BY captured_ts DESC LIMIT 1",(time.time(),)).fetchone()
             if row:
              stamp,size,raw=row;assert size<=2000000
              frozen=json.loads(raw);context=dict(frozen.get('g1s_evidence_v3') or {})
              context.update(observation_t0=stamp,v2_option_context=(frozen.get('g1s_evidence_v2') or {}).get('option_context') or {},_raw_frozen=frozen)
              values=canonical_current_feature_map(context,'SP500')
              print('INPUT_DIAG_FROZEN',json.dumps({'captured_ts':stamp,'age_sec':time.time()-stamp,'read_ms':round(1000*(time.monotonic()-started),1),'metric_n':len(values),'available_n':sum(x.get('available') is True for x in values.values()),'families':{k:{'available':v.get('available'),'reason':v.get('reason'),'quality':v.get('quality')} for k,v in context.items() if isinstance(v,dict) and k not in ('_raw_frozen','v2_option_context')},'unavailable':{k:{q:v.get(q) for q in ('reason','availability','stale','asof','family','training_eligible')} for k,v in values.items() if v.get('available') is not True}}),flush=True)
             started=time.monotonic()
             row=connection.execute("SELECT family,period,available_at,length(payload_json) FROM macro_numeric_releases WHERE family='CPI' AND available_at<=? ORDER BY available_at DESC,created_ts DESC LIMIT 1",(time.time(),)).fetchone()
             print('INPUT_DIAG_CPI_SQL',json.dumps({'read_ms':round(1000*(time.monotonic()-started),1),'row':row}),flush=True)
            except Exception as error:print('INPUT_DIAG_SQL_ERROR',type(error).__name__,str(error),flush=True)
            finally:connection.close()
            print('INPUT_DIAG_DONE',json.dumps({'orders_or_ack_sent':False,'database_writes':False,'provider_calls':False}),flush=True)
            PY
