name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read bounded disk allocation and running release
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 45s
          script: |
            /opt/seiltanzer/.venv/bin/python -u - <<'PY'
            import os,json,subprocess,urllib.request
            expected='0f9525e66ca17c716c71dadc4b37496cf705d6da'
            actual=subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True).strip()
            assert actual==expected
            print('EXACT_SHA',actual)
            print(subprocess.check_output(['systemctl','show','seiltanzer','--property=MainPID,ActiveState,SubState,NRestarts','--no-pager'],text=True))
            s=os.statvfs('/opt/seiltanzer/data');print('DISK_FREE_BYTES',s.f_bavail*s.f_frsize)
            with urllib.request.urlopen('http://127.0.0.1:8790/api/research/runtime/worker-status',timeout=8) as r:data=json.load(r)
            worker=data.get('worker') or {};print('WORKER_DISK',json.dumps({k:v for k,v in worker.items() if any(x in k.lower() for x in ('disk','free','resource','admission','guard','paused','pause','status','state','error'))},default=str))
            for path in ('/opt','/opt/seiltanzer','/var/cache','/root','/usr/local/lib'):
             try:
              r=subprocess.run(['du','-x','-d','1','-B','1',path],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=8)
              print('BOUNDED_DISK_ALLOCATION',r.stdout)
             except subprocess.TimeoutExpired:print('ALLOCATION_TIMEOUT',path)
            for folder in ('/opt/seiltanzer','/opt','/root'):
             rows=[]
             try:
              with os.scandir(folder) as entries:
               for e in entries:
                if e.is_file(follow_symlinks=False):
                 s=e.stat(follow_symlinks=False)
                 if s.st_size>=10000000:rows.append(dict(name=e.name,size=s.st_size,mtime=s.st_mtime,nlink=s.st_nlink))
              print('LARGE_DIRECT_FILES',folder,json.dumps(sorted(rows,key=lambda x:-x['size'])[:15]))
             except OSError:pass
            print('READONLY_NO_DB_OPEN_NO_MUTATION')
            PY
