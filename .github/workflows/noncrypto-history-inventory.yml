name: json-native-failure-readonly
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 55s
          script: |
            /usr/bin/python3 -B -u - <<'PY'
            import pathlib,subprocess,json,hashlib,shutil,urllib.request
            print('SERVICE_CLOCKS',subprocess.check_output(['systemctl','show','seiltanzer','-p','ExecMainStartTimestamp','-p','ActiveEnterTimestamp'],text=True).strip(),flush=True)
            history=subprocess.run(['journalctl','-u','seiltanzer','--since','2026-10-29 20:30:00 UTC','--until','2026-10-29 21:01:00 UTC','-n','1000','--no-pager','-o','cat'],capture_output=True,text=True,timeout=10)
            for line in history.stdout.splitlines():
              if line.startswith('STARTUP_PHASE '):print('RECOVERY_STARTUP',line[:350],flush=True)
            probe_code="import json,time,re\nfrom pathlib import Path\nfrom scripts import sqlite_history_transaction as core\nfrom scripts import history_image_transport as images\n\ntry:\n    private=core._read(Path('/opt/seiltanzer/data/json-rebuild-40937497010/cutover.transport.json'))\n    transport=images.SignedImageTransport(private,deadline=time.monotonic()+15)\n    for kind in ('original','hot'):\n        started=time.monotonic()\n        try:\n            with transport.open_image(kind) as stream:first=stream.read(1)\n            result=dict(kind=kind,first_decoded_byte_received=len(first)==1,full_get_verified=False,elapsed_sec=round(time.monotonic()-started,3))\n        except Exception as exc:\n            reason=str(exc) if isinstance(exc,images.ImageTransportError) and re.fullmatch('[A-Z_]+',str(exc)) else type(exc).__name__\n            result=dict(kind=kind,stable_error=reason,full_get_verified=False,elapsed_sec=round(time.monotonic()-started,3))\n        print('NATIVE_IMAGE_FIRST_BYTE',json.dumps(result),flush=True)\nexcept Exception as exc:\n    print('NATIVE_IMAGE_PROBE_ERROR',type(exc).__name__,flush=True)\n"
            try:
              result=subprocess.run(['/usr/bin/systemd-run','--quiet','--wait','--pipe','--collect','--unit=seiltanzer-json-image-probe-40937497010','--property=Type=exec','--property=RuntimeMaxSec=25','--property=TimeoutStopSec=5','--property=KillMode=control-group','--property=Restart=no','--property=UMask=0077','--working-directory=/opt/seiltanzer','/usr/bin/python3','-B','-c',probe_code],capture_output=True,text=True,timeout=30)
              for line in result.stdout.splitlines():
                if line.startswith(('NATIVE_IMAGE_FIRST_BYTE ','NATIVE_IMAGE_PROBE_ERROR ')):print(line,flush=True)
              print('NATIVE_IMAGE_PROBE_UNIT_EXIT',result.returncode,flush=True)
            except Exception as exc:print('NATIVE_IMAGE_PROBE_UNIT_ERROR',type(exc).__name__,flush=True)
            root=pathlib.Path('/opt/seiltanzer');data=root/'data'
            print('PRODUCTION_HEAD',subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip(),flush=True)
            print('SERVICE',subprocess.check_output(['systemctl','show','seiltanzer','-p','ActiveState','-p','SubState','-p','MainPID','-p','NRestarts','-p','ExecMainStatus','-p','Result'],text=True).strip(),flush=True)
            actual=pathlib.Path('/usr/local/lib/seiltanzer-history-start-guard.py').read_bytes()
            source=(root/'scripts/history_service_fence.py').read_bytes()
            print('GUARD_CODE_MATCH',actual==source,flush=True)
            print('CAPACITY',json.dumps({'free_bytes':shutil.disk_usage(data).free,'database_size_bytes':(data/'trades.db').stat().st_size}),flush=True)
            for name in ('cutover.active','cutover.journal.json','json-history.epoch.json'):
              p=data/name
              if not p.exists():print('EPOCH_METADATA',name,'ABSENT',flush=True);continue
              v=json.loads(p.read_text())
              print('EPOCH_METADATA',name,json.dumps({k:v.get(k) for k in ('contract','run_id','phase','service_started')}),flush=True)
            run_id='40937497010';metadata=data/('json-rebuild-'+run_id)
            for name in ('cutover.preparation.json','cutover.journal.json','cutover.result.json','cutover.capacity.json','cutover.request.json','cutover.plan.json'):
              p=metadata/name
              if not p.exists():print('JSON_METADATA',name,'ABSENT',flush=True);continue
              v=json.loads(p.read_text())
              print('JSON_METADATA',name,json.dumps({k:v.get(k) for k in ('run_id','phase','service_started','abort_reason','admitted','free_bytes','required_free_bytes','started_wall_ts')}),flush=True)
              if name in ('cutover.request.json','cutover.plan.json'):print('PLANNED_IMAGE_BYTES',json.dumps({k:(v.get(k) or {}).get('database_size_bytes') for k in ('original','hot')}),flush=True)
            print('JSON_OWNER',subprocess.check_output(['systemctl','show','seiltanzer-json-history-'+run_id+'.service','-p','LoadState','-p','ActiveState','-p','SubState','-p','MainPID','-p','Result','-p','ExecMainStatus'],text=True).strip(),flush=True)
            print('COLD_JOURNAL_DIGEST',hashlib.sha256((data/'cutover.journal.json').read_bytes()).hexdigest(),flush=True)
            owner_pid=int(subprocess.check_output(['systemctl','show','seiltanzer-json-history-'+run_id+'.service','-p','MainPID','--value'],text=True).strip())
            if owner_pid:
              proc=pathlib.Path('/proc')/str(owner_pid)
              try:
                io=dict(line.split(':',1) for line in (proc/'io').read_text().splitlines())
                status=dict(line.split(':',1) for line in (proc/'status').read_text().splitlines() if ':' in line)
                print('OWNER_PROCESS',json.dumps({'pid':owner_pid,'state':status.get('State','').strip(),'rss':status.get('VmRSS','').strip(),'rchar':int(io['rchar']),'read_bytes':int(io['read_bytes']),'write_bytes':int(io['write_bytes'])}),flush=True)
              except FileNotFoundError:print('OWNER_PROCESS','FINISHED',flush=True)
            try:
              with urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=3) as r:print('LIVE_STATE_HTTP',r.status,flush=True)
            except Exception as e:print('LIVE_STATE_HTTP_ERROR',type(e).__name__,flush=True)
            import sys
            sys.path.insert(0,str(root))
            from scripts.history_production_control import database_handles
            readers=[]
            for handle in database_handles(data/'trades.db',exclude_pid=owner_pid):
              try:
                io=dict(line.split(':',1) for line in (pathlib.Path('/proc')/str(handle['pid'])/'io').read_text().splitlines())
                readers.append({'pid':handle['pid'],'writable':handle['writable'],'rchar':int(io['rchar']),'read_bytes':int(io['read_bytes'])})
              except FileNotFoundError:pass
            print('EXTERNAL_DATABASE_HANDLES',json.dumps(readers),flush=True)
            PY
# Read-only epoch observation 3
# Read-only epoch observation 5

