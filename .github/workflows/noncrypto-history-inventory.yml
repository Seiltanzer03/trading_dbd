name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read existing Treasury runtime and saved snapshot source headers
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 40s
          script: |
            /usr/bin/python3 -u - <<'PY'
            import json,subprocess
            r=subprocess.run(['journalctl','-u','seiltanzer','--since','2026-10-27 12:35:00 UTC','-n','500','--no-pager','-o','cat'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=8)
            allowed=('request_id','stage','event','elapsed_ms','duration_ms','code','error_code','error_type','exception_type','input_bytes','request_bytes','output_bytes','response_bytes','max_output_tokens','completion_tokens','prompt_tokens','finish_reason','timeout_sec','deadline_remaining_ms')
            for line in r.stdout.splitlines():
             try:v=json.loads(line[line.index('{'):])
             except (ValueError,TypeError):continue
             if isinstance(v,dict) and str(v.get('request_id','')).startswith('ai-'):
              print('EXISTING_AI_TIMING',json.dumps({k:v[k] for k in allowed if k in v}),flush=True)
            print('READ_ONLY_EXISTING_TRACE_NO_NEW_LLM_CALL')
            PY
