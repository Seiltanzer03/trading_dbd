name: storage-headroom-readonly-receipt
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30s
          script: |
            set -e
            git -C /opt/seiltanzer rev-parse HEAD
            df -B1 /
            systemctl show seiltanzer -p MainPID -p ActiveState -p SubState -p NRestarts
