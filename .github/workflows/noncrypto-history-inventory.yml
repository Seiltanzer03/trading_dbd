name: current-terminal-provider-readonly
'on':
  push:
    branches:
    - ops/noncrypto-history-inventory-20261026
    paths:
    - .github/workflows/noncrypto-history-inventory.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
    - uses: appleboy/ssh-action@v1
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 55s
        script: "/usr/bin/python3 -B -u - <<'PY'\nimport subprocess,json,shutil,pathlib,urllib.request\n\
          root=pathlib.Path('/opt/seiltanzer');data=root/'data'\npid=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','--value'],text=True).strip()\n\
          if pid!='0':\n try:\n  io=dict(l.split(':',1) for l in pathlib.Path('/proc',pid,'io').read_text().splitlines())\n\
          \  st=dict(l.split(':',1) for l in pathlib.Path('/proc',pid,'status').read_text().splitlines()\
          \ if ':' in l)\n  print('STARTUP_PROCESS',json.dumps(dict(pid=pid,rchar=int(io['rchar']),read_bytes=int(io['read_bytes']),write_bytes=int(io['write_bytes']),state=st.get('State','').strip(),rss=st.get('VmRSS','').strip())))\n\
          \ except FileNotFoundError:pass\nprint('STARTUP_CLOCK',subprocess.check_output(['systemctl','show','seiltanzer','-p','ExecMainStartTimestamp'],text=True).strip())\n\
          r=subprocess.run(['journalctl','-u','seiltanzer','--since','-20 minutes','-n','500','--no-pager','-o','cat'],capture_output=True,text=True,timeout=6)\n\
          for line in r.stdout.splitlines():\n if line.startswith('STARTUP_PHASE '):print('STARTUP_PROGRESS',line[:250])\n\
          r=subprocess.run(['/usr/bin/python3','/usr/local/lib/seiltanzer-history-start-guard.py','--database',str(data/'trades.db'),'--application-root',str(root)],capture_output=True,text=True,timeout=15)\n\
          try: print('START_GUARD',json.dumps(json.loads(r.stdout)))\nexcept ValueError:\
          \ print('START_GUARD_EXIT',r.returncode)\nfor n in ('cutover.active','json-history.epoch.json'):\n\
          \ p=data/n;print('GUARD_METADATA',n,p.exists())\nprint('GUARD_BYTES_EQUAL',(root/'scripts/history_service_fence.py').read_bytes()==pathlib.Path('/usr/local/lib/seiltanzer-history-start-guard.py').read_bytes())\n\
          print('TRACKED_SOURCE_CLEAN',subprocess.run(['git','-C',str(root),'diff','--quiet','HEAD','--','seiltanzer','scripts']).returncode==0)\n\
          print('PRODUCTION_HEAD',subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip())\n\
          print('SERVICE',json.dumps(subprocess.check_output(['systemctl','show','seiltanzer','-p','ActiveState','-p','MainPID','-p','NRestarts'],text=True).splitlines()))\n\
          print('CAPACITY',json.dumps(dict(free_bytes=shutil.disk_usage(data).free,database_bytes=(data/'trades.db').stat().st_size)))\n\
          print('TOR_VERSION',subprocess.check_output(['/usr/bin/tor','--version'],text=True).splitlines()[0])\n\
          print('TOR_POLICY',subprocess.check_output(['apt-cache','policy','tor'],text=True)[:900])\n\
          print('TOR_STATE',json.dumps(subprocess.check_output(['systemctl','show','tor@default.service','-p','ActiveState','-p','SubState','-p','NRestarts'],text=True).splitlines()))\n\
          p=data/'research/mathematical_edge_latest.json'\nif p.exists():\n r=json.loads(p.read_text());print('MODELS',json.dumps(dict(published_for_sha=r.get('published_for_sha'),created_ts=r.get('created_ts'))))\n\
          try:\n with urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=4)\
          \ as r:print('LIVE_HTTP',r.status)\nexcept Exception as e:print('LIVE_HTTP_ERROR',type(e).__name__)\n\
          \nPY\n"
