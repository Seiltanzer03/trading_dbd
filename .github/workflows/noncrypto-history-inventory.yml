name: release-capacity-readonly-post-maintenance-7e222
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 35s
          script: |
            /opt/seiltanzer/.venv/bin/python -u - <<'PY'
            import os,sys,json,time,subprocess,pathlib,urllib.request
            sys.dont_write_bytecode=True
            actual=subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True).strip()
            print('ACTUAL_RUNTIME',actual,flush=True)
            assert actual=='7e222a36b7ce6f88abd9136db011cbd431c47298'
            print('SERVICE',subprocess.check_output(['systemctl','show','seiltanzer','--property=ActiveState,SubState,MainPID,NRestarts,FreezerState','--no-pager'],text=True).strip(),flush=True)
            import shutil
            print('DISK',json.dumps(shutil.disk_usage('/opt/seiltanzer')._asdict()),flush=True)
            for root in ('/opt/seiltanzer/.venv/lib/python3.12/site-packages','/opt/seiltanzer/.venv/lib/python3.11/site-packages'):
             p=pathlib.Path(root)
             if not p.is_dir():continue
             count=size=0
             for f in p.rglob('*.pyc'):
              if f.is_symlink() or not f.is_file():continue
              source=f.parent.parent/(f.name.split('.')[0]+'.py') if f.parent.name=='__pycache__' else f.with_suffix('.py')
              if source.is_file():count+=1;size+=f.stat().st_size
             print('SOURCE_BACKED_BYTECODE',json.dumps({'root':root,'files':count,'bytes':size}),flush=True)
            for root in ('/root/.cache/pip','/opt/seiltanzer/.cache/pip','/var/cache/apt/archives'):
             p=pathlib.Path(root)
             size=sum(f.stat().st_size for f in p.rglob('*') if f.is_file() and not f.is_symlink()) if p.is_dir() else 0
             print('REPRODUCIBLE_CACHE',root,size,flush=True)
            print('GIT_OBJECTS',subprocess.check_output(['git','-C','/opt/seiltanzer','count-objects','-v'],text=True),flush=True)
            with urllib.request.urlopen('http://127.0.0.1:8790/api/research/runtime/worker-status',timeout=8) as r:research=json.load(r)
            print('RESEARCH_STATUS_KEYS',json.dumps(list(research)),flush=True)
            for key in ('budget','admission','disk','resource_budget','research_budget','cycle','worker'):
             if key in research:print('RESEARCH_RESOURCE',key,json.dumps(research[key])[:10000],flush=True)
            with urllib.request.urlopen('http://127.0.0.1:8790/api/ai/snapshot/status',timeout=5) as r:s=json.load(r)
            print('SNAPSHOT',json.dumps({k:s.get(k) for k in ('ready','building','last_error')}),flush=True)
            print('READ_ONLY_CAPACITY_NO_RESTART_NO_FIT_NO_PROVIDER_CALL')
            PY
