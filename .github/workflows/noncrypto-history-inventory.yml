name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read existing Treasury runtime and saved snapshot source headers
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 40s
          script: |
            /opt/seiltanzer/.venv/bin/python -u - <<'PY'
            import sys
            sys.dont_write_bytecode=True
            import json,sqlite3,time,hashlib
            sys.path.insert(0,'/opt/seiltanzer')
            import seiltanzer.ai_runtime_report_v20 as report
            from seiltanzer.ai_runtime_report_v20 import _independent_provider_input
            from seiltanzer.ai_provider_guard import compact_provider_snapshot
            c=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=.5)
            try:
             c.execute('PRAGMA query_only=ON');c.execute('PRAGMA trusted_schema=OFF')
             end=time.monotonic()+4;c.set_progress_handler(lambda:time.monotonic()>end,1000)
             row=c.execute('SELECT id,snapshot_json FROM ai_verdicts WHERE trade_id=141 AND length(snapshot_json)<=2000000 ORDER BY ts DESC,id DESC LIMIT 1').fetchone()
            finally:c.close()
            s=json.loads(row[1])
            for key in ('llm_shadow_decision','effective_management_decision','ai_provider_status'):s.pop(key,None)
            x=_independent_provider_input(compact_provider_snapshot(s),s)
            encode=lambda v:json.dumps(v,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()
            print('EXISTING_WIRE_SIZE_PROFILE',json.dumps(dict(id=row[0],root={k:len(encode(v)) for k,v in x.items()},manager={k:len(encode(v)) for k,v in (x.get('policy_manager') or {}).items()})),flush=True)
            old=x
            ns={}
            exec("\"\"\"Lossless sharing of repeated source metadata in the independent LLM wire.\"\"\"\nfrom copy import deepcopy\nimport json\n\n\ndef _json(value):\n    return json.dumps(value, sort_keys=True, separators=(',', ':'),\n                      ensure_ascii=False, allow_nan=False)\n\n\ndef share_provenance(projected: dict) -> dict:\n    \"\"\"Resolve refs recursively, then merge family defaults with feature overrides.\n\n    Only metadata is encoded. Every numerical fact and all original source clocks\n    remain in traversable JSON; the authoritative snapshot is never mutated.\n    \"\"\"\n    if 'feature_provenance_table' in projected or 'feature_provenance_defaults' in projected:\n        return projected\n    facts = projected.get('edge_family_facts') or {}\n    if not isinstance(facts, dict):\n        return projected\n    result = deepcopy(projected)\n    defaults = {}\n    roots = []\n\n    for family, row in facts.items():\n        provenance = row.get('feature_provenance') if isinstance(row, dict) else None\n        if not isinstance(provenance, dict):\n            continue\n        rows = [meta for meta in provenance.values() if isinstance(meta, dict)]\n        common = {}\n        if len(rows) > 1:\n            for key, value in rows[0].items():\n                encoded = _json(value)\n                if all(key in meta and _json(meta[key]) == encoded for meta in rows[1:]):\n                    common[key] = value\n        target = result['edge_family_facts'][family]['feature_provenance']\n        if common:\n            defaults[family] = deepcopy(common)\n            for feature, meta in provenance.items():\n                if isinstance(meta, dict):\n                    target[feature] = {key: deepcopy(value) for key, value in meta.items()\n                                       if key not in common}\n        roots.append(target)\n    if defaults:\n        result['feature_provenance_defaults'] = defaults\n        roots.append(defaults)\n\n    counts = {}\n    reserved_ref = False\n\n    def count(value):\n        nonlocal reserved_ref\n        if isinstance(value, dict):\n            if set(value) == {'provenance_ref'}:\n                reserved_ref = True\n            for child in value.values():\n                count(child)\n        elif isinstance(value, list):\n            for child in value:\n                count(child)\n        else:\n            return\n        key = _json(value)\n        if len(key) >= 128:\n            counts[key] = counts.get(key, 0) + 1\n\n    for root in roots:\n        count(root)\n    # Preserve a pre-existing literal reserved object rather than misdecode it.\n    if reserved_ref:\n        return projected\n\n    table = {}\n    identities = {}\n\n    def encode(value, permit_ref=True):\n        if not isinstance(value, (dict, list)):\n            return value\n        key = _json(value)\n        if permit_ref and counts.get(key, 0) > 1:\n            if key not in identities:\n                identity = 'p' + str(len(identities))\n                identities[key] = identity\n                table[identity] = encode(value, False)\n            return {'provenance_ref': identities[key]}\n        if isinstance(value, dict):\n            return {name: encode(child) for name, child in value.items()}\n        return [encode(child) for child in value]\n\n    # Keep the family/feature maps explicit; references encode metadata values.\n    for family, row in result['edge_family_facts'].items():\n        provenance = row.get('feature_provenance') if isinstance(row, dict) else None\n        if isinstance(provenance, dict):\n            row['feature_provenance'] = {name: encode(meta) for name, meta in provenance.items()}\n    if defaults:\n        result['feature_provenance_defaults'] = {family: encode(meta) for family, meta in defaults.items()}\n    if table:\n        result['feature_provenance_table'] = table\n    return result if len(_json(result).encode()) < len(_json(projected).encode()) else projected\n",ns)
            import seiltanzer.ai_provider_provenance_wire as wire_module
            wire_module.share_provenance=ns['share_provenance']
            new=report._independent_provider_input(compact_provider_snapshot(s),s)
            def restore(wire):
             table=wire.get('feature_provenance_table',{})
             def resolve(v):
              if isinstance(v,dict):
               if set(v)=={'provenance_ref'}:return resolve(table[v['provenance_ref']])
               return {k:resolve(w) for k,w in v.items()}
              if isinstance(v,list):return [resolve(w) for w in v]
              return v
             out={}
             for family,f in wire['edge_family_facts'].items():
              defaults=resolve(wire.get('feature_provenance_defaults',{}).get(family,{}))
              out[family]={name:{**defaults,**resolve(meta)} for name,meta in (f.get('feature_provenance') or {}).items()}
             return out
            assert restore(old)==restore(new),'source metadata roundtrip differs'
            assert {k:v.get('features') for k,v in old['edge_family_facts'].items()}=={k:v.get('features') for k,v in new['edge_family_facts'].items()}
            from seiltanzer.decision_research import validate_no_future_timestamps
            validate_no_future_timestamps(new,s['captured_ts'])
            print('CANDIDATE_LOSSLESS_WIRE_BYTES',json.dumps(dict(candidate='9edb876358449be4251ea3fa67e5b65f04f0ee71',review_id=row[0],before=len(encode(old)),after=len(encode(new)),source_metadata_equal=True,numerical_features_equal=True,future_clock_check='PASS')),flush=True)
            print('READ_ONLY_NO_PAYLOAD_PRINT_NO_LLM_PROVIDER_NO_FIT_NO_DB_WRITE')
            PY
