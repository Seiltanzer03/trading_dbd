name: tor-provider-health-readonly
'on':
  push:
    branches:
    - ops/noncrypto-history-inventory-20261026
    paths:
    - .github/workflows/noncrypto-history-inventory.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
    - uses: appleboy/ssh-action@v1
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 35s
        script: "/usr/bin/python3 -B -u - <<'PY'\nimport subprocess,json,re\nr=subprocess.run(['journalctl','-u','tor@default.service','--since','-30\
          \ minutes','-n','120','--no-pager','-o','cat'],capture_output=True,text=True,timeout=5)\n\
          counts={};bootstrap=[]\nfor line in r.stdout.splitlines():\n    m=re.search(r'Bootstrapped\
          \ ([0-9]+)%',line)\n    if m:bootstrap.append(int(m.group(1)))\n    for\
          \ token in ('No space left on device','Permission denied','Address already\
          \ in use','Configuration was invalid','Control process exited','Failed to\
          \ start','start operation timed out','Bootstrapped','Out of memory','Failed\
          \ to parse','Could not bind','Failed to create','Read-only file system'):\n\
          \        if token.lower() in line.lower():counts[token]=counts.get(token,0)+1\n\
          \    m=re.search(r'(status=[0-9]+/[A-Z]+|result .[a-z-]+.)',line)\n    if\
          \ m:counts[m.group(1)]=counts.get(m.group(1),0)+1\nprint('TOR_BOUNDED_DIAGNOSTIC',json.dumps(dict(tokens=counts,bootstrap_percent=bootstrap[-8:])))\n\
          print('TOR_UNIT_STATUS',json.dumps(subprocess.check_output(['systemctl','show','tor@default.service','-p','ActiveState','-p','SubState','-p','Result','-p','MainPID','-p','NRestarts','-p','ExecMainCode','-p','ExecMainStatus','-p','RestartUSec','-p','TimeoutStartUSec','-p','MemoryCurrent'],text=True).splitlines()))\n\
          \nPY\n"
