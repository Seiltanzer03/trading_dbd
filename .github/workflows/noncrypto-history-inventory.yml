name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc3a5f7e39633a526d79ce1448432b0a586d5226
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -q -e '.[dev]' paramiko
      - name: Count original Nikkei Treasury clock candidates without writes or raw publication
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python -u - <<'PY'
          import base64,gzip,io,json,os,shlex
          from collections import Counter
          from scripts.export_native_family_history import REMOTE_EXPORT
          from scripts.production_ede_offload import _connect
          from seiltanzer.config import ALL_INSTRUMENTS
          from seiltanzer.native_family_capture_projection import verified_capture
          program=REMOTE_EXPORT.replace(repr(tuple(ALL_INSTRUMENTS)),repr(('JPY100',)))
          client=_connect(os.environ['SSH_PASSWORD'],attempts=1)
          try:
              _,stdout,stderr=client.exec_command('python3 -c '+shlex.quote(program),timeout=45)
              payload=stdout.read(40000001);error=stderr.read(2000).decode();status=stdout.channel.recv_exit_status()
              if status:
                  print('TREASURY_CLOCK_INVENTORY_UNAVAILABLE='+json.dumps(dict(status=status,error=error)),flush=True)
                  raise SystemExit(status)
              assert len(payload)<=40000000
              compressed=base64.b64decode(payload.strip(),validate=True)
              with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as reader:raw=reader.read(8000001)
              assert len(raw)<=8000000
              batch=json.loads(raw);assert batch.get('read_only') is True
              counts=Counter();pairs=set();offsets=[]
              for row in batch['rows']:
                  frozen=verified_capture(row)
                  block=frozen.get('treasury_context_v1') if isinstance(frozen,dict) else None
                  if not isinstance(block,dict):continue
                  counts['original_treasury_contexts']+=1
                  if block.get('available') is not True:continue
                  counts['parent_available']+=1
                  if block.get('publication_timestamp_kind')!='CONSERVATIVE_NEXT_UTC_DAY':continue
                  counts['explicit_conservative_boundary']+=1
                  fetched=block.get('fetched_at');bound=block.get('published_at');captured=block.get('captured_ts')
                  if all(isinstance(value,(int,float)) and not isinstance(value,bool) for value in (fetched,bound,captured)):
                      if 0<fetched<bound<=captured<=row['original_created_ts']:
                          counts['prefetched_before_boundary_candidates']+=1
                          pairs.add((bound,fetched));offsets.append((bound-fetched)/60)
              print('ORIGINAL_TREASURY_CLOCK_INVENTORY='+json.dumps(dict(instrument='JPY100',
                  rows=len(batch['rows']),counts=dict(counts),distinct_boundary_receipt_pairs=len(pairs),
                  prefetch_minutes_min=min(offsets) if offsets else None,prefetch_minutes_max=max(offsets) if offsets else None,
                  export_reason=batch['reason'],history_complete=batch['history_complete'],
                  read_only=True,raw_payload_published=False,training_performed=False)),flush=True)
          finally:client.close()
          PY
