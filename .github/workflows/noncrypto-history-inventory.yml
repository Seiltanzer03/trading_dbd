name: json-release-guard-readonly
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 50s
          script: |
            /usr/bin/python3 -B -u - <<'PY'
            import json,os,pathlib,subprocess,time,urllib.request,shutil,stat
            root=pathlib.Path('/opt/seiltanzer');data=root/'data'
            print('PRODUCTION_HEAD',subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip(),flush=True)
            print('SERVICE',subprocess.check_output(['systemctl','show','seiltanzer','-p','ActiveState','-p','MainPID','-p','NRestarts'],text=True).strip(),flush=True)
            for name in ['cutover.active','cutover.journal.json','cutover.preparation.json','json-history.epoch.json']:
              p=data/name
              if not os.path.lexists(p):print('STATE_META',name,'ABSENT',flush=True);continue
              info=p.lstat();row={'regular':stat.S_ISREG(info.st_mode),'size':info.st_size,'mode':oct(stat.S_IMODE(info.st_mode))}
              if stat.S_ISREG(info.st_mode) and 0<info.st_size<=65536:
                obj=json.loads(p.read_bytes());row.update({k:obj.get(k) for k in ['contract','run_id','application_sha','phase','service_started']})
              print('STATE_META',name,json.dumps(row),flush=True)
            started=time.monotonic()
            try:
              r=subprocess.run(['/usr/bin/python3','-B','/usr/local/lib/seiltanzer-history-start-guard.py','--database',str(data/'trades.db'),'--application-root',str(root)],capture_output=True,text=True,timeout=12)
              v=json.loads(r.stdout);print('ACTUAL_START_GUARD',json.dumps({'rc':r.returncode,'elapsed_sec':round(time.monotonic()-started,3),**{k:v.get(k) for k in ['contract','start_allowed','reason','hot_history_present']}}),flush=True)
            except Exception as e:print('ACTUAL_START_GUARD_FAILURE',type(e).__name__,flush=True)
            print('CAPACITY',json.dumps({'free_bytes':shutil.disk_usage(data).free,'database_size_bytes':(data/'trades.db').stat().st_size}),flush=True)
            try:
              with urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=3) as r:print('LIVE_STATE_HTTP',r.status,flush=True)
            except Exception as e:print('LIVE_STATE_HTTP_ERROR',type(e).__name__,flush=True)
            PY
