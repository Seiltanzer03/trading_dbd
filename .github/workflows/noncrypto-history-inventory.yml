name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read exact release startup progress without opening the database
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 45s
          script: |
            set -eu
            /usr/bin/python3 -u - <<'PY'
            import json,subprocess
            for kind,args in (
             ('git',['git','-C','/opt/seiltanzer','rev-parse','HEAD']),
             ('service',['systemctl','show','seiltanzer','-p','MainPID','-p','ActiveState','-p','SubState','-p','NRestarts','-p','ExecMainStartTimestamp']),
             ('startup',['journalctl','-u','seiltanzer','--since','-12 minutes','--no-pager','-n','130'])):
             r=subprocess.run(args,capture_output=True,text=True,timeout=10)
             lines=r.stdout.splitlines()
             if kind=='startup':lines=[l for l in lines if any(w in l.lower() for w in ('startup','schema','integrity','check','progress','failed','error','storage','started','starting'))][-45:]
             print(json.dumps(dict(kind=kind,returncode=r.returncode,lines=lines,stderr=r.stderr[:500])),flush=True)
            print('READ_ONLY_STARTUP_NO_DATABASE_OPEN_NO_MUTATION')
            PY
