name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Acquire auto-expiring CPU lease for unchanged canonical release guard
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 40s
          script: |
            set -euo pipefail
            cd /opt/seiltanzer
            exec 9>/opt/seiltanzer/.deployment-git-maintenance.lock
            flock -w 10 9
            test "$(git rev-parse HEAD)" = 0f9525e66ca17c716c71dadc4b37496cf705d6da
            test ! -e data/cutover.active
            test ! -L data/cutover.active
            old_pid=$(systemctl show seiltanzer -p MainPID --value)
            test "$old_pid" = 4095659
            test "$(systemctl show seiltanzer -p CPUWeight --value)" = 100
            restore_weight() { systemctl set-property --runtime seiltanzer.service CPUWeight=100; }
            trap restore_weight EXIT
            systemd-run --quiet --unit=seiltanzer-release-cpu-restore-20261028 --on-active=300s /usr/bin/systemctl set-property --runtime seiltanzer.service CPUWeight=100
            systemctl set-property --runtime seiltanzer.service CPUWeight=1
            /usr/bin/python3 -B /usr/local/lib/seiltanzer-history-start-guard.py --database /opt/seiltanzer/data/trades.db --application-root /opt/seiltanzer
            test "$(systemctl show seiltanzer -p MainPID --value)" = "$old_pid"
            trap - EXIT
            echo "BOUNDED_CPU_LEASE_ACTIVE_SECONDS=300"
            systemctl show seiltanzer -p CPUWeight -p ActiveState
