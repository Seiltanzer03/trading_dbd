name: locate-terminal-gateway-timeouts
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 2m
          script: |
            cd /opt/seiltanzer
            /usr/bin/python3 -B -u - <<'PY'
            import collections,json,pathlib,re,subprocess
            def read(*args):
                return subprocess.run(args,capture_output=True,text=True,timeout=8).stdout
            print('TERMINAL_LISTENERS',read('ss','-ltnp','( sport = :8790 or sport = :80 or sport = :443 )'))
            for unit in ('caddy','nginx','seiltanzer'):
                print('TERMINAL_UNIT',unit,read('systemctl','show',unit,'-p','ActiveState','-p','MainPID','-p','NRestarts').replace('\n',' '))
                raw=read('journalctl','-u',unit,'--since','-12 hours','--grep=504|i/o timeout|deadline exceeded|STARTUP_PHASE|ASGI application|lock timeout','-n','180','-o','cat','--no-pager')
                counts=collections.Counter()
                for line in raw.splitlines():
                    if line.startswith('STARTUP_PHASE phase='):
                        print('TERMINAL_START',line[:140])
                        continue
                    try: rec=json.loads(line)
                    except ValueError:
                        signature=re.search(r'\b(504|i/o timeout|deadline exceeded|ASGI application|lock timeout)\b',line)
                        if signature:counts[signature.group(0)]+=1
                        continue
                    if not isinstance(rec,dict):continue
                    request=rec.get('request') or {}
                    uri=request.get('uri','').split('?',1)[0]
                    if not re.fullmatch(r'/[A-Za-z0-9/_-]{0,120}',uri):uri='unknown'
                    result=dict(route=uri,status=rec.get('status'),duration=rec.get('duration'),ts=rec.get('ts'),timed_out='timeout' in str(rec.get('msg','')).lower())
                    print('TERMINAL_PROXY_EVENT',unit,json.dumps(result))
                print('TERMINAL_LOG_COUNTS',unit,json.dumps(counts))
            print('TERMINAL_FREE',read('df','--output=avail','-h','/').splitlines()[-1])
            print('TERMINAL_CPU',read('ps','-eo','pid,comm,pcpu,rss','--sort=-pcpu').splitlines()[:10])
            PY
