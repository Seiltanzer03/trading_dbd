name: inspect-current-service-start
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 5m
          script: |
            cd /opt/seiltanzer
            /usr/bin/python3 -B -u - <<'PY'
            import json,pathlib,subprocess,time
            print('START_DIAG_SHA',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),flush=True)
            print('START_DIAG_SERVICE',subprocess.run(['systemctl','show','seiltanzer','-p','MainPID','-p','ActiveState','-p','SubState','-p','NRestarts','-p','Result','-p','MemoryCurrent'],capture_output=True,text=True,timeout=5).stdout,flush=True)
            pid=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','--value'],text=True).strip()
            for i in range(2):
             try:
              io=dict(line.split(':',1) for line in pathlib.Path('/proc',pid,'io').read_text().splitlines())
              ticks=pathlib.Path('/proc',pid,'stat').read_text().rsplit(')',1)[1].split()
              print('START_DIAG_PROGRESS',json.dumps({'pid':pid,'state':ticks[0],'utime':ticks[11],'stime':ticks[12],'read_bytes':io.get('read_bytes'),'rchar':io.get('rchar')}),flush=True)
             except OSError as error:print('START_DIAG_PROGRESS_ERROR',type(error).__name__,flush=True)
             if i==0:time.sleep(5)
            lines=subprocess.run(['journalctl','-u','seiltanzer','--since','-18 minutes','-n','150','-o','cat','--no-pager'],capture_output=True,text=True,timeout=5).stdout.splitlines()
            for line in lines:
             if any(key in line for key in ('STARTUP_PHASE','ExecCondition','seiltanzer.service:','Timeout (','File "/opt/seiltanzer/seiltanzer/storage_','File "/opt/seiltanzer/seiltanzer/__main__','start_allowed','reason":')):print('START_DIAG_JOURNAL',line[:650],flush=True)
            PY
