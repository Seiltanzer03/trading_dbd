name: release-capacity-transport-diagnostic-4d35
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 100s
          script: |
            /usr/bin/python3 -B -u - <<'PY'
            import pathlib,subprocess,json
            r=subprocess.run(['du','-x','-B1','--max-depth=2','/root'],capture_output=True,text=True,timeout=15)
            print('ROOT_DIRECTORY_CAPACITY',json.dumps({'code':r.returncode,'rows':r.stdout.splitlines()}),flush=True)
            items=[]
            for p in pathlib.Path('/root').iterdir():
             try:
              s=p.lstat()
              if p.is_file() and not p.is_symlink() and s.st_size>5*1024**2:items.append({'name':p.name,'bytes':s.st_size,'allocated_bytes':s.st_blocks*512,'mtime':s.st_mtime})
             except OSError:pass
            print('ROOT_LARGE_TOP_FILES',json.dumps(items),flush=True)
            PY
