name: current-terminal-startup-readonly
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 45s
          script: |
            /usr/bin/python3 -B -u - <<'PY'
            import json,pathlib,subprocess,urllib.request
            root=pathlib.Path('/opt/seiltanzer')
            print('STARTUP_SHA',subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip(),flush=True)
            state=subprocess.check_output(['systemctl','show','seiltanzer','-p','ActiveState','-p','SubState','-p','MainPID','-p','NRestarts','-p','ExecMainStartTimestamp'],text=True).strip()
            print('STARTUP_SERVICE',state,flush=True)
            pid=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','--value'],text=True).strip()
            try:
              io=dict(line.split(':',1) for line in pathlib.Path('/proc',pid,'io').read_text().splitlines())
              status=dict(line.split(':',1) for line in pathlib.Path('/proc',pid,'status').read_text().splitlines() if ':' in line)
              print('STARTUP_IO',json.dumps({'pid':pid,'read_bytes':int(io['read_bytes']),'rchar':int(io['rchar']),'rss':status.get('VmRSS','').strip(),'swap':status.get('VmSwap','').strip()}),flush=True)
            except FileNotFoundError:pass
            result=subprocess.run(['journalctl','-u','seiltanzer','--since','-20 minutes','-n','300','--no-pager','-o','cat'],capture_output=True,text=True,timeout=5)
            for line in result.stdout.splitlines():
              if line.startswith('STARTUP_PHASE '):print('STARTUP_PROGRESS',line[:300],flush=True)
            for route in ('/api/state','/api/research/runtime/worker-status'):
              try:
                with urllib.request.urlopen('http://127.0.0.1:8790'+route,timeout=4) as response:
                  body=json.load(response) if route.endswith('worker-status') else None
                  print('STARTUP_HTTP',route,response.status,flush=True)
                  if body is not None:print('STARTUP_RUNTIME',json.dumps({'inputs':body.get('decision_model_inputs'),'sources':body.get('decision_family_sources')}),flush=True)
              except Exception as error:print('STARTUP_HTTP_PENDING',route,type(error).__name__,flush=True)
            PY
