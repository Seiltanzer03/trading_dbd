name: diagnose-ai-review-errors
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 5m
          script: |
            cd /opt/seiltanzer
            PYTHONPATH=/opt/seiltanzer .venv/bin/python -B -u - <<'PY'
            import collections,json,subprocess,time,urllib.request
            print('AI_ERROR_DEPLOY',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),flush=True)
            raw=subprocess.run(['journalctl','-u','seiltanzer','--since','-8 hours','-n','6000','-o','cat','--no-pager'],capture_output=True,text=True,timeout=10).stdout
            traces=[];errors=[];response_counts=collections.Counter()
            for line in raw.splitlines():
             try:value=json.loads(line)
             except (ValueError,TypeError):continue
             if not isinstance(value,dict) or not str(value.get('request_id','')).startswith('ai-') or 'stage' not in value:continue
             allowed={'request_id','stage','event','elapsed_ms','duration_ms','exception_class','status_code','provider_reason','input_bytes','request_bytes','response_bytes','output_bytes','finish_reason'}
             value={k:v for k,v in value.items() if k in allowed}
             traces.append(value)
             if value.get('stage')=='response':response_counts[value.get('status_code')]+=1
             if 'exception_class' in value:errors.append(value)
            print('AI_ERROR_RESPONSES',json.dumps(dict(response_counts)),flush=True)
            for value in traces[-100:]:print('AI_ERROR_TRACE',json.dumps(value),flush=True)
            for value in errors[-20:]:print('AI_ERROR_EXCEPTION',json.dumps(value),flush=True)
            for i in range(3):
             result={}
             for route in ['/api/ai/snapshot/status','/api/position']:
              started=time.monotonic()
              try:
               with urllib.request.urlopen('http://127.0.0.1:8790'+route,timeout=6) as response:value=json.load(response)
               if 'position' in route:result['position']={'trade_id':value.get('trade_id'),'reconciliation':value.get('execution_reconciliation')}
               else:result['snapshot']={k:value.get(k) for k in ('ready','building','age_sec','invalidated_reason','build_ms','build_started_at','build_n','last_error')}
               result[route+'_ms']=round(1000*(time.monotonic()-started),1)
              except Exception as error:result[route+'_error']=type(error).__name__
             print('AI_ERROR_STATUS',json.dumps(result),flush=True)
             if i<2:time.sleep(5)
            print('AI_ERROR_DONE',json.dumps({'database_writes':False,'orders_or_ack_sent':False,'provider_calls':False}),flush=True)
            PY
