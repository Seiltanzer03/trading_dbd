name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read frozen runtime forecast receipt and published model metadata
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 100s
          script: |
            set -eu
            cd /opt/seiltanzer
            .venv/bin/python -u - <<'PY'
            import json,urllib.request,time
            for path in ('/api/ai/snapshot/status','/api/research/mathematical-edge'):
             with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=10) as response:r=json.load(response)
             if path.endswith('mathematical-edge'):r={k:r.get(k) for k in ('state','published_for_sha','family_market_model_summary','family_reference_source_errors','family_reference_sources')}
             print('BOUNDED_ACTUAL_HTTP',path,json.dumps(r))
            import sqlite3
            def size(x):return len(json.dumps(x,ensure_ascii=False,separators=(',',':')).encode())
            db=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=2)
            db.execute('PRAGMA query_only=ON')
            row=db.execute('SELECT snapshot_json FROM ai_verdicts WHERE trade_id=? ORDER BY ts DESC LIMIT 1',(141,)).fetchone()
            db.close()
            if row and row[0] and len(row[0])<500000:
             saved=json.loads(row[0])
             print('SAVED_SNAPSHOT_ROOT_SIZES',json.dumps(sorted(((k,size(v)) for k,v in saved.items()),key=lambda x:-x[1])))
             print('SAVED_MANAGER_SIZES',json.dumps(sorted(((k,size(v)) for k,v in (saved.get('policy_manager') or {}).items()),key=lambda x:-x[1])))
                        PY
