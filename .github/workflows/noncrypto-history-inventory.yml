name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read history cutover fence and journal ownership
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 45s
          script: |
            /usr/bin/python3 -u - <<'PY'
            import json,os,pathlib,subprocess
            root=pathlib.Path('/opt/seiltanzer/data')
            for name in ('cutover.active','cutover.journal.json'):
             p=root/name
             try:
              st=p.lstat();print('CUTOVER_FILE',name,json.dumps(dict(size=st.st_size,mtime=st.st_mtime,symlink=p.is_symlink())))
              if p.is_file() and st.st_size<=32768:print('CUTOVER_CONTENT',name,p.read_text())
             except FileNotFoundError:print('CUTOVER_ABSENT',name)
            r=subprocess.run(['/usr/bin/python3','/usr/local/lib/seiltanzer-history-start-guard.py','--database',str(root/'trades.db'),'--application-root','/opt/seiltanzer'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=15)
            print('CUTOVER_GUARD',r.returncode,r.stdout[-8000:])
            r=subprocess.run(['systemctl','list-units','--all','--no-legend','--plain','seiltanzer-history*'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=8)
            print('CUTOVER_UNITS',r.stdout[-4000:])
            r=subprocess.run(['ps','-eo','pid,etimes,args'],stdout=subprocess.PIPE,text=True,timeout=8)
            print('CUTOVER_PROCESSES','\n'.join(l for l in r.stdout.splitlines() if any(k in l for k in ('history_production','history_cutover','history_stage','history_driver','history_owner','offhost_sqlite','history_cold')))[-6000:])
            print('READ_ONLY_FENCE_DIAGNOSTIC_NO_MUTATION_NO_DB_COPY')
            PY
