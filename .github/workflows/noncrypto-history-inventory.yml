name: verify-installed-management-pr571
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 11
    env:
      EXPECTED_SHA: d2ef33701cbdc0333d27064059eee58a3864ed38
    steps:
      - name: Check live routes and isolated management on the installed revision
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 8m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            cd /opt/seiltanzer
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
            systemctl is-active seiltanzer
            .venv/bin/python -B -u - <<'PY'
            import json
            import os
            from pathlib import Path
            import subprocess
            import time
            import urllib.request

            from scripts.production_functional_smoke import (
                verify_isolated_unified_management_contract,
                verify_management_ack_guard_contract,
                verify_trade_settlement_contract,
            )

            def cmd(*args):
                return subprocess.check_output(args, text=True, timeout=5).strip()

            expected = os.environ["EXPECTED_SHA"]
            starting_pid = cmd("systemctl", "show", "seiltanzer", "-p", "MainPID", "--value")
            assert int(starting_pid) > 1
            deployed_ref = Path(cmd("git", "rev-parse", "--git-path", cmd("git", "symbolic-ref", "HEAD")))
            boot_ts = int(next(line.split()[1] for line in Path("/proc/stat").read_text().splitlines() if line.startswith("btime ")))
            ticks = int(Path("/proc", starting_pid, "stat").read_text().rsplit(")", 1)[1].split()[19])
            assert boot_ts + ticks / os.sysconf("SC_CLK_TCK") >= deployed_ref.stat().st_mtime
            print("EXACT_INSTALLED_PROCESS", expected, "pid=" + starting_pid)

            def get(path, budget_ms=3000.0):
                started = time.monotonic()
                with urllib.request.urlopen("http://127.0.0.1:8790" + path, timeout=4.0) as response:
                    raw = response.read(8_000_001)
                    code = response.status
                ms = (time.monotonic() - started) * 1000.0
                print("LOCAL_HTTP", path, code, f"{ms:.1f}ms")
                assert code == 200 and ms < budget_ms and len(raw) <= 8_000_000
                return raw

            assert b'id="terminal-loading"' in get("/")
            asset_path = "seiltanzer/web/js/management_ui.js"
            asset_url = "/static/js/management_ui.js"
            assert get(asset_url) == Path(asset_path).read_bytes()
            for i in range(3):
                state = json.loads(get("/api/state"))
                position = json.loads(get("/api/position"))
                assert isinstance(state["tick"], dict) and "trade_id" in position
                if i == 2:
                    print("POSITION_PRESENT", bool(position["trade_id"]))
            fields = {
                "/api/ai/snapshot/status": ("ready", "invalidated_reason", "building"),
                "/api/system/storage/status": ("health", "offhost_configured", "last_local_backup_age_sec", "last_offhost_backup_age_sec"),
                "/api/system/storage/integrity?full=false": ("ok", "check_kind"),
                "/api/research/g1/management/local-status": ("resolved", "eligible_resolved", "status_snapshot_cached"),
            }
            for route, names in fields.items():
                body = json.loads(get(route))
                print("STATUS", route, json.dumps({name: body.get(name) for name in names}))
                if route.endswith("integrity?full=false"):
                    assert body["ok"] is True and body["check_kind"] == "quick_check"
            verify_management_ack_guard_contract()
            verify_trade_settlement_contract()
            verify_isolated_unified_management_contract()
            assert starting_pid == cmd("systemctl", "show", "seiltanzer", "-p", "MainPID", "--value")
            assert expected == cmd("git", "rev-parse", "HEAD")
            PY
            .venv/bin/python -B scripts/production_readiness_check.py \
              --expected-sha "$EXPECTED_SHA" --skip-restore-drill-low-disk
      - name: Check public terminal independently
        if: always()
        run: |
          set -euo pipefail
          for route in / /api/state /api/position; do
            curl -fsS --connect-timeout 3 --max-time 5 -o /dev/null -w "PUBLIC $route http=%{http_code} seconds=%{time_total}\n" "http://94.241.171.182:8790$route"
          done
