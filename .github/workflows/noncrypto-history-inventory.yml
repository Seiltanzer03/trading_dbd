name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read accepted live family receipt and current model admission metadata
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 50s
          script: |
            set -eu
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = 69328c1e32937f6dc0d238dfb714dc29c0ecefd7
            /usr/bin/python3 -u - <<'PY'
            import json,urllib.request,shutil
            for path in ('/api/ai/snapshot/status','/api/research/mathematical-edge'):
             with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=8) as response:r=json.load(response)
             if path.endswith('mathematical-edge'):
              matrix=r.get('family_market_models') or {}
              rows={}
              for family,m in (matrix.get('XAU') or {}).items():
               rows[family]={k:v for k,v in m.items() if not isinstance(v,(dict,list))}
               rows[family]['source']={k:(m.get('source') or {}).get(k) for k in ('provider','ticker')}
               rows[family]['heads']={name:{k:v for k,v in head.items() if not isinstance(v,(dict,list)) and k not in ('intercept','threshold')} for name,head in (m.get('heads') or {}).items()}
              r={k:r.get(k) for k in ('state','published_for_sha','family_market_model_summary','family_reference_source_errors')}
              r['XAU_model_admission']=rows
              r['noncrypto_trained']=sum(m.get('status')=='TRAINED' for code,rows in matrix.items() if code not in ('BTCUSD','ETHUSD','SOLUSD') for m in rows.values())
             print('ACCEPTED_LIVE_READONLY',path,json.dumps(r),flush=True)
            print('FREE_BYTES',shutil.disk_usage('/').free)
            print('READ_ONLY_NO_PROVIDER_CALL_NO_MODEL_FIT_NO_ORDER')
            PY
