name: bounded-release-startup-progress
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 1m
          script: |
            /usr/bin/python3 -B -u - <<'PY'
            import datetime,json,pathlib,subprocess,time,urllib.request
            for sample in range(2):
              if sample:time.sleep(20)
              fields=('MainPID','ActiveState','SubState','NRestarts','ExecMainStartTimestamp','ControlPID')
              command=['systemctl','show','seiltanzer']
              for field in fields:command+=['-p',field]
              state=dict(line.split('=',1) for line in subprocess.check_output(command,text=True).splitlines() if '=' in line)
              pid=state.get('MainPID','0')
              body={'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'sample':sample,'service':state}
              if pid!='0':
                try:
                  io=dict(line.split(':',1) for line in pathlib.Path('/proc',pid,'io').read_text().splitlines() if ':' in line)
                  status=dict(line.split(':',1) for line in pathlib.Path('/proc',pid,'status').read_text().splitlines() if ':' in line)
                  body['io']={k:io.get(k,'').strip() for k in ('rchar','read_bytes','wchar','write_bytes')}
                  body['memory']={k:status.get(k,'').strip() for k in ('VmRSS','RssAnon','RssFile','VmSwap')}
                except Exception as error:body['proc_error']=type(error).__name__
              try:
                with urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=3) as response:body['http_status']=response.status
              except Exception as error:body['http_error']=type(error).__name__
              print('STARTUP_PROGRESS',json.dumps(body),flush=True)
            print('READ_ONLY_NO_WRITES_NO_RESTART',flush=True)
            PY
