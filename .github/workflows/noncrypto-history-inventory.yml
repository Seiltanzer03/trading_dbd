name: option-history-admission-readonly
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 65s
          script: |
            cd /opt/seiltanzer
            PYTHONPATH=/opt/seiltanzer .venv/bin/python -B -u - <<'PY'
            import json,pathlib,sqlite3,time
            from types import SimpleNamespace
            from seiltanzer.decision_metric_inputs import _option_history
            root=pathlib.Path('/opt/seiltanzer/data');engine=SimpleNamespace(settings=SimpleNamespace(data_dir=root,cache_db=root/'cache.db'))
            for index in range(4):
              cutoff=time.time();started=time.monotonic();rows=_option_history(engine,'EWG',cutoff)
              print('OPTION_HISTORY_READ',json.dumps({'sample':index+1,'cutoff':cutoff,'elapsed_ms':round((time.monotonic()-started)*1000,2),'rows':len(rows),'oldest_ts':rows[0]['ts'] if rows else None,'newest_ts':rows[-1]['ts'] if rows else None,'json_bytes':len(json.dumps(rows).encode())}),flush=True)
              if index<3:time.sleep(10)
            conn=sqlite3.connect((root/'cache.db').resolve().as_uri()+'?mode=ro',uri=True,timeout=.05)
            try:
              conn.execute('PRAGMA query_only=ON');deadline=time.monotonic()+1.;conn.set_progress_handler(lambda:time.monotonic()>deadline,1000)
              rows=conn.execute('SELECT COUNT(*),SUM(n),MAX(n),MIN(ts),MAX(ts) FROM (SELECT ts,length(data) n FROM chain_snapshots WHERE ticker=? AND ts<=? ORDER BY ts DESC LIMIT 120)',('EWG',time.time())).fetchone()
              print('OPTION_HISTORY_METADATA',json.dumps({'rows':rows[0],'total_bytes':rows[1],'max_row_bytes':rows[2],'oldest_ts':rows[3],'newest_ts':rows[4]}),flush=True)
            finally:conn.close()
            PY
