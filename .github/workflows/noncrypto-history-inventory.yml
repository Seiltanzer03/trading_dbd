name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Identify bounded fence interruption and disposable capacity
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 45s
          script: |
            /usr/bin/python3 -u - <<'PY'
            import json,pathlib,runpy,sqlite3,subprocess,time
            root=pathlib.Path('/opt/seiltanzer')
            ns=runpy.run_path('/usr/local/lib/seiltanzer-history-start-guard.py',run_name='readonly_diagnostic')
            metrics={'progress_deadline_fired':False}
            class Connection(sqlite3.Connection):
             def set_progress_handler(self,callback,n):
              if callback is None:return super().set_progress_handler(callback,n)
              def measured():
               value=callback()
               if value:metrics['progress_deadline_fired']=True
               return value
              return super().set_progress_handler(measured,n)
            connect=sqlite3.connect
            def traced(*args,**kwargs):
             kwargs['factory']=Connection
             return connect(*args,**kwargs)
            sqlite3.connect=traced
            t=time.monotonic();result=ns['check_start'](root/'data/trades.db',root)
            print('EXACT_UNCHANGED_FENCE',json.dumps(result),json.dumps(metrics),'seconds',round(time.monotonic()-t,3),flush=True)
            print('GIT_OBJECTS',subprocess.check_output(['git','-C',str(root),'count-objects','-v'],text=True).strip(),flush=True)
            for p in ('/root/.cache','/root/.npm/_cacache','/root/wheels'):
             r=subprocess.run(['du','-sb',p],capture_output=True,text=True,timeout=5)
             print('DISPOSABLE_CACHE_BYTES',p,r.stdout.split()[0] if r.returncode==0 else 'absent',flush=True)
            print('LOADAVG',pathlib.Path('/proc/loadavg').read_text().strip(),flush=True)
            PY
