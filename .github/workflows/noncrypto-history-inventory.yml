name: release-capacity-transport-diagnostic-4d35
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 100s
          script: |
            /usr/bin/python3 -B -u - <<'PY'
            import json,subprocess,os,shutil,pathlib
            def out(kind,**row):print(kind,json.dumps(row),flush=True)
            root=subprocess.check_output(['findmnt','-n','-o','SOURCE,FSTYPE','/'],text=True).strip()
            out('ROOT_FILESYSTEM',description=root)
            parts=root.split()
            if len(parts)==2 and parts[1]=='ext4':
             r=subprocess.run(['tune2fs','-l',parts[0]],text=True,capture_output=True,timeout=6,check=True)
             keep=('Block count:','Reserved block count:','Free blocks:','Block size:','Filesystem state:','Reserved blocks uid:','Reserved blocks gid:')
             out('EXT4_CAPACITY',fields=[s for s in r.stdout.splitlines() if s.startswith(keep)])
            st=os.statvfs('/');out('AVAILABLE_CAPACITY',block_size=st.f_frsize,total_blocks=st.f_blocks,free_blocks=st.f_bfree,available_blocks=st.f_bavail,free_bytes=shutil.disk_usage('/').free)
            p=pathlib.Path('/opt/seiltanzer/data/research/official_macro_offhost_latest.json')
            if p.exists():
             b=json.loads(p.read_bytes());out('MACRO_OFFHOST_RECEIPT',fields={k:b.get(k) for k in ('expected_sha','acceptance_run_id','created_ts','fetched_at','valid_until_ts')})
            out('READ_ONLY_FILESYSTEM_METADATA',mutations=0)
            PY
