name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read exact release research, structured LLM and trace receipts
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 40s
          script: |
            /usr/bin/python3 -u - <<'PY'
            import subprocess,json,time,pathlib,os
            root=pathlib.Path('/opt/seiltanzer/data')
            print('DEPLOY_FENCE_GUARD_EXISTS',os.path.lexists(root/'cutover.active'),flush=True)
            journal=root/'cutover.journal.json'
            if journal.exists():
             j=json.loads(journal.read_text())
             print('DEPLOY_FENCE_JOURNAL',json.dumps({k:j.get(k) for k in ('phase','service_started','run_id')}),flush=True)
            start=time.monotonic()
            r=subprocess.run(['/usr/bin/python3','/usr/local/lib/seiltanzer-history-start-guard.py','--database','/opt/seiltanzer/data/trades.db','--application-root','/opt/seiltanzer'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=12)
            try:result=json.loads(r.stdout)
            except ValueError:result={'reason':'NON_JSON_GUARD_RESULT'}
            print('DEPLOY_FENCE_RESULT',json.dumps(dict(exit_code=r.returncode,elapsed_ms=round((time.monotonic()-start)*1000),result=result)),flush=True)
            print('DEPLOY_FENCE_INSTALLED_SHA',subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True).strip(),flush=True)
            print('READ_ONLY_GUARD_NO_RESTART_NO_PROVIDER_CALL')
            PY
