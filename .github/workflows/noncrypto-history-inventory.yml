name: diagnose-live-ai-review
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Measure server contention and read-only calibration timings
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            set -euo pipefail
            cd /opt/seiltanzer
            pid=$(systemctl show seiltanzer --property=MainPID --value)
            uptime
            free -m
            df -h /opt/seiltanzer
            ps -eo pid,ppid,pcpu,rss,stat,wchan:30,comm --sort=-pcpu | head -15 || true
            ps -L -p "$pid" -o lwp,pcpu,stat,wchan:30,comm --sort=-pcpu | head -20 || true
            command -v py-spy || true
            SEILTANZER_DIAG_PID="$pid" OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 timeout 30s nice -n 12 .venv/bin/python -B -u - <<'PY'
            import os
            import pathlib
            import statistics
            import time
            import urllib.request
            import json
            from concurrent.futures import ThreadPoolExecutor
            from seiltanzer.journal import Journal
            pid = int(os.environ["SEILTANZER_DIAG_PID"])
            db = set()
            for descriptor in pathlib.Path(f"/proc/{pid}/fd").iterdir():
                try:
                    target = descriptor.readlink()
                except OSError:
                    continue
                if target.is_absolute() and target.name in {"trades.db", "cache.db"}:
                    db.add(target)
            print("DB_FILES", [(p.name, p.stat().st_size) for p in sorted(db)])
            def measure():
                for path in sorted(db):
                    if path.name != "trades.db":
                        continue
                    journal = Journal.__new__(Journal)
                    journal._q_database_path = str(path)
                    t = time.monotonic()
                    cpu = time.process_time()
                    result = journal.q_calibration_report()
                    print("Q_CALIBRATION", round(time.monotonic()-t,3), round(time.process_time()-cpu,3), result.get("n"))
            def status():
                for attempt in range(2):
                    t = time.monotonic()
                    try:
                        with urllib.request.urlopen("http://127.0.0.1:8790/api/ai/snapshot/status", timeout=6) as response:
                            d=json.load(response)
                        print("STATUS", round(time.monotonic()-t,3),
                            {k:d.get(k) for k in ("ready","building","invalidated_reason","build_ms","build_started_at","build_n","last_error")})
                    except Exception as exc:
                        print("STATUS_ERROR", type(exc).__name__)
                    if attempt == 0:
                        time.sleep(5)
            with ThreadPoolExecutor(max_workers=2) as pool:
                handles=[pool.submit(fn) for fn in (measure,status)]
                for handle in handles:
                    handle.result()
            PY
