name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read actual cutover fence reason without mutation
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 40s
          script: |
            /usr/bin/python3 -u - <<'PY'
            import json,os,pathlib,shutil,subprocess,time
            root=pathlib.Path('/opt/seiltanzer')
            print('RUNTIME_SHA',subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip(),flush=True)
            print('ACTIVE_GUARD_PRESENT',os.path.lexists(root/'data/cutover.active'),flush=True)
            p=root/'data/cutover.journal.json'
            if p.exists():
             j=json.loads(p.read_text());print('CUTOVER_JOURNAL',json.dumps({k:j.get(k) for k in ('phase','service_started','run_id')}),flush=True)
            started=time.monotonic()
            r=subprocess.run(['/usr/bin/python3','/usr/local/lib/seiltanzer-history-start-guard.py','--database',str(root/'data/trades.db'),'--application-root',str(root)],capture_output=True,text=True,timeout=12)
            print('FENCE_CHECK',r.returncode,round(time.monotonic()-started,3),r.stdout.strip(),flush=True)
            print('DISK_FREE_BYTES',shutil.disk_usage(root).free,flush=True)
            print('SERVICE',subprocess.check_output(['systemctl','show','seiltanzer','--property=ActiveState,SubState,MainPID,NRestarts','--no-pager'],text=True).strip(),flush=True)
            PY
