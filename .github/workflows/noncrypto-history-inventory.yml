name: inspect-ede-worker-capacity
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Measure the disposable research worker filesystem
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          locations = [Path(os.environ['RUNNER_TEMP']), Path('/mnt')]
          disks = []
          for location in locations:
              if location.is_dir():
                  status = shutil.disk_usage(location)
                  disks.append(dict(location=location.name or '/', device=location.stat().st_dev,
                                    total=status.total, free=status.free, writable=os.access(location,os.W_OK)))
          bundled = {}
          for name in ('/usr/local/lib/android','/usr/share/dotnet','/opt/ghc'):
              run = subprocess.run(['du','-sxB1', name], capture_output=True, text=True, timeout=15)
              if run.returncode==0:
                  bundled[name] = int(run.stdout.split(maxsplit=1)[0])
          print('EDE_WORKER_CAPACITY=' + json.dumps(dict(disks=disks, existing_reproducible_sdk_bytes=bundled)))
          PY
