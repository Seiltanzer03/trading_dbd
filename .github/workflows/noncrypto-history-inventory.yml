name: request-fresh-offhost-restore-drill
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Start the existing read-only restore drill for current main
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          PROJECT_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 15 \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --data '{"ref":"main","inputs":{"capacity_report":false}}' \
            "$API_URL/repos/$PROJECT_REPO/actions/workflows/production-offhost-restore-drill.yml/dispatches"
