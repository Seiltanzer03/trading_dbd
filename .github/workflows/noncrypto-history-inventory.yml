name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Observe bounded deployment startup progress without mutations
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 35s
          script: |
            /usr/bin/python3 -u - <<'PY'
            import subprocess,json,pathlib,time
            def run(args):
             r=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=10)
             return r.stdout[-12000:]
            print('DEPLOY_CURRENT_SHA',run(['git','-C','/opt/seiltanzer','rev-parse','HEAD']).strip())
            print('DEPLOY_SERVICE_PROGRESS',run(['systemctl','show','seiltanzer','-p','ActiveState','-p','SubState','-p','MainPID','-p','ControlPID','-p','ExecMainStartTimestamp','-p','NRestarts','-p','Result']))
            p=pathlib.Path('/opt/seiltanzer/data/backups/local')
            print('DEPLOY_PRESTART_TEMPS',json.dumps([dict(name=f.name,size=f.stat().st_size,age=time.time()-f.stat().st_mtime) for f in p.glob('.*.tmp.sqlite3')][:4]))
            lines=run(['journalctl','-u','seiltanzer','--since','-15 minutes','-n','50','--no-pager','-o','cat']).splitlines()
            selected=[l for l in lines if any(k in l.lower() for k in ('start','backup','integrity','condition','preflight','recover','error','fail','ready','uvicorn'))]
            print('DEPLOY_STARTUP_EVENTS','\n'.join(selected)[-7000:])
            print('READ_ONLY_PROGRESS_NO_LLM_NO_MUTATION')
            PY
