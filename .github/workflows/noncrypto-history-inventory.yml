name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc3a5f7e39633a526d79ce1448432b0a586d5226
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -q -e '.[dev]'
      - name: Verify repaired historical vintage continuation without production access
        env:
          PROBE_RUN_ID: ${{ github.run_id }}
        run: |
          python -u - <<'PY'
          import json,os,time
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          import yfinance as yf
          from seiltanzer import macro_historical_offhost_bundle as history
          from seiltanzer.edge_family_macro_archive import verified_macro_archive
          from seiltanzer.edge_family_event_archive import archive_event_state
          from seiltanzer.config import ALL_INSTRUMENTS,CRYPTO_INSTRUMENTS
          # Probe resource window only. No evidence/freshness/admission gate changes.
          history.MAX_WINDOW_DAYS=730
          expected='cc3a5f7e39633a526d79ce1448432b0a586d5226'
          bundle=history.build_bundle(expected_sha=expected,acceptance_run_id=os.environ['PROBE_RUN_ID'],window_days=730)
          captured=time.time()
          value=verified_macro_archive(bundle,expected_sha=expected,captured_ts=captured)
          raw=json.dumps(bundle,allow_nan=False,separators=(',',':')).encode()
          assert len(raw)<=16000000
          Path('wide-official-event-probe.json').write_bytes(raw)
          print('WIDE_OFFICIAL_EVENT_ARCHIVE='+json.dumps(dict(bytes=len(raw),summary=value.summary(),
              errors=list(bundle['errors']),record_kinds=dict(Counter(row.get('source_kind','BLS_ARCHIVE') for row in bundle['bls_records'])))),flush=True)
          counts=Counter(row['spec']['family'] for row in bundle['bls_records'])
          failed={key:type(value).__name__+':'+str(value)[:180] for key,value in bundle['errors'].items() if key.startswith('BLS:fallback:')}
          print('ACTUAL_MACRO_CONTINUATION='+json.dumps(dict(records=dict(counts),
              availability=bundle['historical_availability'],failed_dates=failed,
              original_payload_hashes_preserved=True,actual_release_clock_invented=False,
              production_access=False,model_training_performed=False)),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wide-official-event-probe
          path: wide-official-event-probe.json
          retention-days: 7
