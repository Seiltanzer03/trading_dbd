name: existing-provider-routes-readonly
'on':
  push:
    branches:
    - ops/noncrypto-history-inventory-20261026
    paths:
    - .github/workflows/noncrypto-history-inventory.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
    - uses: appleboy/ssh-action@v1
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 35s
        script: "/opt/seiltanzer/.venv/bin/python -B -u - <<'PY'\nimport os,json,subprocess,re,time\n\
          from pathlib import Path\nfrom urllib.parse import urlsplit\nfrom dotenv\
          \ import dotenv_values\nimport httpx\npid=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','--value'],text=True).strip()\n\
          cfg=dict(item.split('=',1) for item in Path('/proc/'+pid+'/environ').read_text().split('\\\
          0') if '=' in item);proxy=(cfg.get('OPENROUTER_PROXY') or '').strip() or\
          \ None;key=cfg.get('OPENROUTER_API_KEY') or ''\nprint('PROVIDER_CONFIGURATION',json.dumps(dict(key_configured=bool(key),proxy_configured=bool(proxy),proxy_scheme=urlsplit(proxy).scheme\
          \ if proxy else None)))\nassert key,'Provider configuration absent from\
          \ actual process environment'\nfrom ipaddress import ip_address\nroutes=[]\n\
          for name,value in sorted(cfg.items()):\n    if 'PROXY' not in name or not\
          \ value:continue\n    parsed=urlsplit(value)\n    if parsed.scheme not in\
          \ ('http','https','socks5','socks5h'):continue\n    host=parsed.hostname\
          \ or ''\n    try:local=ip_address(host).is_loopback\n    except ValueError:local=host.lower()=='localhost'\n\
          \    print('EXISTING_PROXY_ROUTE',json.dumps(dict(name=name,scheme=parsed.scheme,loopback=local,same_as_provider=value==proxy)))\n\
          \    if value!=proxy and value not in [p for _,p in routes]:routes.append((name,value))\n\
          for name,p in routes[:2]:\n    started=time.monotonic()\n    try:\n    \
          \    if urlsplit(p).scheme in ('socks5','socks5h'):\n            from curl_cffi\
          \ import requests,CurlOpt\n            import certifi\n            with\
          \ requests.Session(trust_env=False,verify=certifi.where(),curl_options={CurlOpt.NOPROXY:''})\
          \ as c:\n                r=c.get('https://openrouter.ai/api/v1/auth/key',headers={'Authorization':'Bearer\
          \ '+key},proxy=p,timeout=5,allow_redirects=False)\n        else:\n     \
          \       with httpx.Client(proxy=p,trust_env=False,timeout=5) as c:r=c.get('https://openrouter.ai/api/v1/auth/key',headers={'Authorization':'Bearer\
          \ '+key},follow_redirects=False)\n        print('EXISTING_PROXY_AUTH_PROBE',json.dumps(dict(route=name,http_status=r.status_code,elapsed_sec=round(time.monotonic()-started,3))))\n\
          \    except Exception as e:print('EXISTING_PROXY_AUTH_PROBE',json.dumps(dict(route=name,exception_class=type(e).__name__,elapsed_sec=round(time.monotonic()-started,3))))\n\
          units=subprocess.run(['systemctl','list-units','--all','--plain','--no-legend','xray*','sing-box*','v2ray*','*proxy*'],capture_output=True,text=True,timeout=3)\n\
          print('PROXY_SERVICE_STATES',json.dumps([line.split()[:4] for line in units.stdout.splitlines()]))\n\
          \nPY\n"
