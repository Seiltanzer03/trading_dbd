name: inspect-nas100-capture-path-anchor
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 2m
          script: |
            set -eu
            cd /opt/seiltanzer
            test "$(git rev-parse HEAD)" = '64e026904861266f713402dee1b2f05310f1365f'
            .venv/bin/python -B -u - <<'PY'
            from contextlib import closing
            import hashlib
            import json
            import sqlite3

            from seiltanzer.decision_research import canonical_snapshot
            from seiltanzer.unified_edge_ensemble import _manual_candidate_preflight

            origin = 1795116363.2902696
            with closing(sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=2)) as db:
                db.row_factory=sqlite3.Row
                db.execute('PRAGMA query_only=ON')
                rows=[]
                for trade in db.execute("SELECT id FROM trades WHERE instrument='NAS100' ORDER BY id DESC LIMIT 12").fetchall():
                    rows += db.execute('SELECT review_id,captured_ts,snapshot_json,snapshot_sha256 FROM decision_snapshots '
                        'WHERE trade_id=? AND captured_ts BETWEEN ? AND ? AND length(snapshot_json)<=2000000 '
                        'ORDER BY captured_ts LIMIT 8',(trade['id'],origin-2,origin+180)).fetchall()
                found=[]
                for row in rows:
                    snap=json.loads(row['snapshot_json'])
                    actual=(snap.get('market_refresh') or {}).get('original_snapshot_ts') or row['captured_ts']
                    if abs(actual-origin)<.1:
                        assert hashlib.sha256(row['snapshot_json'].encode()).hexdigest()==row['snapshot_sha256']
                        found.append((row,snap))
                assert len(found)==1
                row,snap=found[0]
                first=db.execute('SELECT ts,r FROM decision_path_points WHERE review_id=? ORDER BY ts LIMIT 1',(row['review_id'],)).fetchone()
                canonical=canonical_snapshot(snap)
                ref=snap.get('market_refresh') or {}
                manager=snap.get('policy_manager') or {}
                quote=(((manager.get('input_audit') or {}).get('rows') or {}).get('instrument_price') or {})
                geometry=snap.get('trade_geometry') or {}
                inputs=manager.get('inputs') or {}
                print('NAS_CAPTURE_PATH_ANCHOR=' + json.dumps(dict(
                    observation_r_present=canonical['initial_r'] is not None,
                    first_point_at_capture=first is not None and first['ts']==row['captured_ts'],
                    first_point_lag_sec=round(first['ts']-row['captured_ts'],3) if first is not None else None,
                    first_point_matches_frozen_r=first is not None and abs(first['r']-inputs['r0'])<=1e-4,
                    repriced=ref.get('available') is True, quote_matches_geometry=quote.get('value')==geometry.get('current'),
                    same_authoritative_price_clock=quote.get('timestamp')==ref.get('actual_provider_timestamp'),
                    economics_r_matches_geometry=inputs.get('r0')==geometry.get('current_r'),
                    real_quote_passed_preflight=_manual_candidate_preflight(snap),
                    original_compaction=(snap.get('snapshot_budget') or {}).get('degrade_level'))),flush=True)
            PY
