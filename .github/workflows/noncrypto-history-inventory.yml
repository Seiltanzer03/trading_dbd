name: current-release-guard-query-readonly
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 55s
          script: |
            /usr/bin/python3 -B -u - <<'PY'
            import importlib.util,json,pathlib,runpy,sqlite3,time
            root=pathlib.Path('/opt/seiltanzer');data=root/'data'
            original_connect=sqlite3.connect
            class MeasuredConnection(sqlite3.Connection):
              def execute(self,sql,*args,**kwargs):
                self.current_sql=sql;self.sql_started=time.monotonic()
                return super().execute(sql,*args,**kwargs)
              def set_progress_handler(self,callback,count):
                if callback is None:return super().set_progress_handler(None,count)
                def progress():
                  result=callback()
                  if result:print('GUARD_INTERRUPTED_QUERY',json.dumps({'sql':getattr(self,'current_sql','')[:700],'query_sec':round(time.monotonic()-getattr(self,'sql_started',time.monotonic()),3)}),flush=True)
                  return result
                return super().set_progress_handler(progress,count)
            def measured_connect(*args,**kwargs):
              kwargs['factory']=MeasuredConnection
              return original_connect(*args,**kwargs)
            sqlite3.connect=measured_connect
            guard=runpy.run_path('/usr/local/lib/seiltanzer-history-start-guard.py')
            started=time.monotonic();result=guard['check_start'](data/'trades.db',root)
            print('UNCHANGED_GUARD_RESULT',json.dumps({'result':result,'elapsed_sec':round(time.monotonic()-started,3)}),flush=True)
            sqlite3.connect=original_connect
            spec=importlib.util.spec_from_file_location('_readonly_storage_timing',root/'seiltanzer/history_storage_state.py')
            storage=importlib.util.module_from_spec(spec);spec.loader.exec_module(storage)
            conn=sqlite3.connect((data/'trades.db').as_uri()+'?mode=ro',uri=True,timeout=1)
            conn.execute('PRAGMA query_only=ON');conn.execute('PRAGMA trusted_schema=OFF');conn.execute('PRAGMA cache_size=-2048')
            deadline=time.monotonic()+25;conn.set_progress_handler(lambda:time.monotonic()>=deadline,1000)
            try:
              started=time.monotonic();state=storage.read_history_state(conn)
              print('GUARD_COMPONENT',json.dumps({'component':'marker','elapsed_sec':round(time.monotonic()-started,3)}),flush=True)
              for table,proof in state['retained_identity'].items():
                started=time.monotonic();actual=storage.identity_proof(conn,table,proof['max_rowid'])
                print('GUARD_COMPONENT',json.dumps({'component':table,'row_count':actual['row_count'],'matches':actual==proof,'elapsed_sec':round(time.monotonic()-started,3)}),flush=True)
              projection=storage._runtime_projection();last=[None,time.monotonic()]
              def trace(sql):
                now=time.monotonic()
                if last[0] is not None:print('PROJECTION_SQL',json.dumps({'sql':last[0][:700],'elapsed_sec':round(now-last[1],3)}),flush=True)
                last[:]=[sql,now]
              conn.set_trace_callback(trace);started=time.monotonic()
              projection.validate_runtime_projection(conn,state['runtime_projection'],retired_rowids=state['retired_rowids']['passive_market_observations'])
              trace('END')
              print('GUARD_COMPONENT',json.dumps({'component':'complete_projection','elapsed_sec':round(time.monotonic()-started,3),'matches':True}),flush=True)
            except Exception as error:print('GUARD_TIMING_ERROR',type(error).__name__,str(error)[:180],flush=True)
            finally:conn.close()
            print('READ_ONLY_RECEIPT',json.dumps({'db_writes':0,'service_restarts':0,'guard_changes':0,'orders':0,'acks':0}),flush=True)
            PY
