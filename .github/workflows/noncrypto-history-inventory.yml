name: release-capacity-transport-diagnostic-4d35
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 100s
          script: |
            /usr/bin/python3 -B -u - <<'PY'
            import json,subprocess,shutil
            for args in (['du','-x','-B1','--max-depth=1','/'],['lsof','+L1','-nP']):
             try:
              r=subprocess.run(args,capture_output=True,text=True,timeout=20)
              print('CAPACITY_FINAL_INVENTORY',json.dumps({'command':args[0],'code':r.returncode,'output':r.stdout[-20000:]}),flush=True)
             except subprocess.TimeoutExpired:print('CAPACITY_FINAL_INVENTORY_TIMEOUT',args[0],flush=True)
            print('CAPACITY_FREE_BYTES',shutil.disk_usage('/').free,flush=True)
            PY
