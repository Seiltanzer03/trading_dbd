name: restore-current-approved-source-bundle
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Refresh the existing exact-SHA collector once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          root='https://api.github.com/repos/Seiltanzer03/trading_dbd'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(root+'/git/ref/heads/main',headers=headers),timeout=15) as response:
              current=json.load(response)['object']['sha']
          expected='e1f4944253127dddc638bdec93b7a8fbbc6080c5'
          assert current==expected,'SUPERSEDED_MAIN_NO_DISPATCH'
          payload=json.dumps({'ref':'main','inputs':{'expected_sha':expected}}).encode()
          request=urllib.request.Request(root+'/actions/workflows/edge-family-sources.yml/dispatches',data=payload,headers={**headers,'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request,timeout=15) as response:
              assert response.status==204
          print('EXISTING_SOURCE_REFRESH_DISPATCHED expected_sha='+expected)
          PY
