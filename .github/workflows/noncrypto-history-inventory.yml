name: diagnose-live-ai-review
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Read native CPU samples and snapshot state without provider calls
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            set -euo pipefail
            cd /opt/seiltanzer
            pid=$(systemctl show seiltanzer --property=MainPID --value)
            printf 'APP_MAIN_PID %s\n' "$pid"
            vmstat 1 3
            if command -v perf >/dev/null 2>&1; then
                timeout 9s perf record -e cpu-clock -F 37 --pid "$pid" -o - -- sleep 4 |
                    perf report -i - --stdio --no-children --percent-limit 3 --sort dso,symbol 2>&1 || true
            fi
            .venv/bin/python -B -u - <<'PY'
            import json
            import time
            import urllib.request
            for i in range(3):
                with urllib.request.urlopen("http://127.0.0.1:8790/api/ai/snapshot/status",timeout=6) as response:
                    d=json.load(response)
                fields=("ready","building","build_n","build_ms","build_started_at","invalidated_reason","last_error")
                print("LIVE_SNAPSHOT", {k:d.get(k) for k in fields})
                if i < 2:
                    time.sleep(3)
            PY
