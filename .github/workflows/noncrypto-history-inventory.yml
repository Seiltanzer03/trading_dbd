name: locate-live-terminal-startup-stage
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 90s
          script: |
            cd /opt/seiltanzer
            /usr/bin/python3 -B -u - <<'PY'
            import json,pathlib,re,subprocess,time,urllib.request
            def read(*args):
                return subprocess.run(args,capture_output=True,text=True,timeout=5).stdout.strip()
            def emit(label,value):
                print(label,json.dumps(value),flush=True)
            emit('STARTUP_INSTALL',read('git','rev-parse','HEAD'))
            props=dict(line.split('=',1) for line in read('systemctl','show','seiltanzer','-p','MainPID','-p','ActiveState','-p','SubState','-p','NRestarts','-p','Result').splitlines() if '=' in line)
            emit('STARTUP_SERVICE',props)
            pid=props.get('MainPID','0')
            if pid.isdigit() and int(pid)>0:
                markers=read('journalctl','-u','seiltanzer','_PID='+pid,'--grep=^STARTUP_PHASE phase=','-o','cat','--no-pager','-n','12')
                emit('STARTUP_MARKERS',[line for line in markers.splitlines() if re.fullmatch(r'STARTUP_PHASE phase=[a-z.]+ elapsed_sec=[0-9.]+',line)])
                def sample():
                    try:
                        row=pathlib.Path('/proc',pid,'stat').read_text().rsplit(')',1)[1].split()
                        values=dict(line.split(': ',1) for line in pathlib.Path('/proc',pid,'io').read_text().splitlines())
                        return dict(cpu_ticks=int(row[11])+int(row[12]),read_bytes=int(values['read_bytes']),rchar=int(values['rchar']))
                    except (OSError,ValueError,IndexError,KeyError):
                        return None
                before=sample()
                time.sleep(4)
                after=sample()
                emit('STARTUP_ACTIVITY',dict(before=before,after=after))
            try:
                with urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=2) as response:
                    emit('STARTUP_HTTP',response.status)
            except Exception as error:
                emit('STARTUP_HTTP',dict(kind=type(error).__name__,status=getattr(error,'code',None)))
            PY
