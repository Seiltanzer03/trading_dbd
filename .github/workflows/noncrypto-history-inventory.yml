name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  focused-provider-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9edb876358449be4251ea3fa67e5b65f04f0ee71
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: pip install -e ".[dev]"
      - name: Reproduce independent provenance inflation
        run: pytest -q tests/test_ai_provider_provenance_wire.py tests/test_ai_provider_explanation.py tests/test_ai_provider_explanation_projection.py tests/test_ai_provider_projection_regression.py tests/test_ai_provider_guard.py tests/test_ai_provider_failure_codes.py tests/test_ai_provider_telemetry.py tests/test_ai_structured_provider_contract.py tests/test_llm_decision_shadow.py tests/test_llm_decision_shadow_safety.py
