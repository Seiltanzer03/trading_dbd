name: history-fence-readonly-7e222
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 35s
          script: |
            /opt/seiltanzer/.venv/bin/python -u - <<'PY'
            import os,sys,json,time,subprocess,pathlib,urllib.request
            sys.dont_write_bytecode=True
            actual=subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True).strip()
            print('ACTUAL_RUNTIME',actual,flush=True)
            assert actual=='12b0518db8f32b847ed2aa46a03cbea80f0c70f7'
            print('SERVICE',subprocess.check_output(['systemctl','show','seiltanzer','--property=ActiveState,SubState,MainPID,NRestarts,FreezerState','--no-pager'],text=True).strip(),flush=True)
            for name in ('cutover.active','cutover.journal.json'):
             p=pathlib.Path('/opt/seiltanzer/data')/name
             print('FENCE_PATH',name,'exists',p.exists(),'symlink',p.is_symlink(),flush=True)
             if name.endswith('.json') and p.is_file() and not p.is_symlink() and p.stat().st_size<16384:
              j=json.loads(p.read_text())
              print('JOURNAL_STATE',json.dumps({k:j.get(k) for k in ('phase','status','service_started','run_id','completed_at')}),flush=True)
            started=time.monotonic()
            result=subprocess.run(['/usr/bin/python3','/usr/local/lib/seiltanzer-history-start-guard.py','--database','/opt/seiltanzer/data/trades.db','--application-root','/opt/seiltanzer'],capture_output=True,text=True,timeout=9,env={**os.environ,'PYTHONDONTWRITEBYTECODE':'1'})
            print('ORIGINAL_GUARD_READONLY',json.dumps({'returncode':result.returncode,'elapsed':time.monotonic()-started,'stdout':result.stdout[:5000],'stderr':result.stderr[:1500]}),flush=True)
            with urllib.request.urlopen('http://127.0.0.1:8790/api/ai/snapshot/status',timeout=5) as r:s=json.load(r)
            print('SNAPSHOT',json.dumps({k:s.get(k) for k in ('ready','building','last_error')}),flush=True)
            print('READ_ONLY_NO_RESTART_NO_FIT_NO_PROVIDER_CALL')
            PY
