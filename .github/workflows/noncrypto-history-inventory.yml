    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Measure decision packet on saved review without provider inference
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
