name: readonly-generated-artifact-types-4d35
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 60s
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = 4d35f82110007d78b41635f5da3f55e422a081d0
            /usr/bin/python3 -B -u - <<'PY'
            import pathlib,stat,json,subprocess,shutil
            roots=sorted(pathlib.Path('/tmp').glob('seiltanzer-sqlite-tools-*'))
            roots+= [pathlib.Path('/var/cache/fwupd'),pathlib.Path('/var/cache/swcatalog/cache')]
            for root in roots[:16]:
             if root.is_symlink() or not root.is_dir():continue
             rows=[]
             for p in list(root.rglob('*'))[:64]:
              st=p.lstat()
              if stat.S_ISREG(st.st_mode):
               kind=subprocess.run(['file','-b',str(p)],capture_output=True,text=True,timeout=2).stdout.strip()[:160]
               rows.append({'name':str(p.relative_to(root)),'size':st.st_size,'allocated':st.st_blocks*512,'uid':st.st_uid,'type':kind})
             print('REPRODUCIBLE_CANDIDATE_METADATA',json.dumps({'root':str(root),'files':rows}),flush=True)
            print('FREE_BYTES',shutil.disk_usage('/opt/seiltanzer').free,flush=True)
            PY
