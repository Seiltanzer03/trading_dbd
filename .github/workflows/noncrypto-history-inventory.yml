name: yandex-storage-metadata-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install 'boto3>=1.36,<2'
      - name: Inspect only existing private archive metadata
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          python -u - <<'PY'
          import boto3,json
          from botocore.config import Config
          c=boto3.client('s3',endpoint_url='https://storage.yandexcloud.net',region_name='ru-central1',config=Config(connect_timeout=10,read_timeout=30,retries={'total_max_attempts':1}))
          bucket='trading-dbd-backups-2026'
          rows=c.list_objects_v2(Bucket=bucket,Prefix='backups/v1/daily-slot-',MaxKeys=100)
          print('BOUNDED_LIST',json.dumps({'truncated':rows.get('IsTruncated'), 'count':rows.get('KeyCount')}))
          manifests=[r for r in rows.get('Contents',[]) if r['Key'].endswith('.manifest.json')]
          for r in manifests:
              with c.get_object(Bucket=bucket,Key=r['Key'])['Body'] as s:
                  raw=s.read(1048577)
              if len(raw)>1048576:raise ValueError('Oversized manifest')
              j=json.loads(raw)
              safe={k:j[k] for k in ['backup_contract','source','git_commit','created_ts','completed_ts','database_size_bytes','database_sha256','compressed_size_bytes','object_key','verified_head','verified_boundary_get','cold_history_catalog_sha256','cold_history_catalog_object_key','sqlite_history_state_sha256'] if k in j}
              print('PRIVATE_ARCHIVE_METADATA',json.dumps({'manifest_key':r['Key'],'modified':r['LastModified'].isoformat(),'storage_class':r.get('StorageClass'),**safe}),flush=True)
          PY
