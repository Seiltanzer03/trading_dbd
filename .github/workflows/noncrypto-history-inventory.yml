name: local-provider-listener-readonly
'on':
  push:
    branches:
    - ops/noncrypto-history-inventory-20261026
    paths:
    - .github/workflows/noncrypto-history-inventory.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
    - uses: appleboy/ssh-action@v1
      with:
        host: 94.241.171.182
        username: root
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 35s
        script: "/opt/seiltanzer/.venv/bin/python -B -u - <<'PY'\nimport os,json,subprocess,re,time\n\
          from pathlib import Path\nfrom urllib.parse import urlsplit\nfrom dotenv\
          \ import dotenv_values\nimport httpx\npid=subprocess.check_output(['systemctl','show','seiltanzer','-p','MainPID','--value'],text=True).strip()\n\
          cfg=dict(item.split('=',1) for item in Path('/proc/'+pid+'/environ').read_text().split('\\\
          0') if '=' in item);proxy=(cfg.get('OPENROUTER_PROXY') or '').strip() or\
          \ None;key=cfg.get('OPENROUTER_API_KEY') or ''\nprint('PROVIDER_CONFIGURATION',json.dumps(dict(key_configured=bool(key),proxy_configured=bool(proxy),proxy_scheme=urlsplit(proxy).scheme\
          \ if proxy else None)))\nassert key,'Provider configuration absent from\
          \ actual process environment'\nimport socket\nparsed=urlsplit(proxy);port=parsed.port\n\
          try:\n    with socket.create_connection((parsed.hostname,port),timeout=2):print('LOCAL_SOCKS_LISTENER','CONNECTED')\n\
          except Exception as e:print('LOCAL_SOCKS_LISTENER',type(e).__name__)\nresult=subprocess.run(['ss','-ltnp','sport','=',':'+str(port)],capture_output=True,text=True,timeout=3)\n\
          pids=set(re.findall(r'pid=([0-9]+)',result.stdout))\nfor pid in pids:\n\
          \    proc=Path('/proc')/pid\n    try:\n        units=re.findall(r'([A-Za-z0-9_.@-]+\\\
          .service)',(proc/'cgroup').read_text())\n        print('LOCAL_SOCKS_OWNER',json.dumps(dict(pid=int(pid),process=(proc/'comm').read_text().strip(),units=units)))\n\
          \        for unit in units:\n            state=subprocess.check_output(['systemctl','show',unit,'-p','ActiveState','-p','SubState','-p','MainPID','-p','NRestarts','-p','ExecMainStatus'],text=True,timeout=3)\n\
          \            print('LOCAL_SOCKS_UNIT',unit,json.dumps(state.splitlines()))\n\
          \    except FileNotFoundError:pass\n\nPY\n"
