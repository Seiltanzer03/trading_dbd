name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read exact release research, structured LLM and trace receipts
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 40s
          script: |
            /usr/bin/python3 -u - <<'PY'
            import subprocess,json
            print('CURRENT_INSTALL',subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True).strip(),flush=True)
            print('CURRENT_SERVICE',subprocess.check_output(['systemctl','show','seiltanzer','--property=ActiveState,SubState,NRestarts','--no-pager'],text=True).strip(),flush=True)
            r=subprocess.run(['journalctl','-u','seiltanzer','--since','-90 minutes','-n','1800','--no-pager','-o','cat'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=8)
            keys=('request_id','stage','event','elapsed_ms','duration_ms','exception_class','provider_reason')
            for line in r.stdout.splitlines():
             if line.startswith('STARTUP_PHASE '):print('CURRENT_STARTUP_PHASE',line,flush=True)
             try:v=json.loads(line[line.index('{'):])
             except (ValueError,TypeError):continue
             if isinstance(v,dict) and v.get('request_id')=='ai-925000aec9194b429b4b':
              print('LATE_RESPONSE_VALIDATION',json.dumps({k:v[k] for k in keys if k in v}),flush=True)
            print('READ_ONLY_NO_PROVIDER_NO_DATABASE_QUERY_NO_RESTART')
            PY
