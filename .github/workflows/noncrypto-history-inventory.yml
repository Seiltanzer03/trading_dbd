name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read existing Treasury runtime and saved snapshot source headers
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 40s
          script: |
            /usr/bin/python3 -u - <<'PY'
            import subprocess,json,os
            for name,args in [('ACTUAL_SHA',['git','-C','/opt/seiltanzer','rev-parse','HEAD']),('SERVICE',['systemctl','show','seiltanzer','-p','ActiveState','-p','SubState','-p','MainPID','-p','NRestarts'])]:
             r=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=5)
             print(name,r.stdout.strip(),flush=True)
            v=os.statvfs('/opt/seiltanzer')
            print('FREE_BYTES',v.f_bavail*v.f_frsize,flush=True)
            r=subprocess.run(['journalctl','-u','seiltanzer','-n','150','--no-pager','-o','cat'],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,timeout=5)
            for line in r.stdout.splitlines():
             if 'startup_phase' in line or 'STARTUP_PHASE' in line:print('STARTUP_PHASE',line[:600],flush=True)
            print('READ_ONLY_PROCESS_METADATA_NO_DATABASE_NO_PROVIDER_NO_RESTART')
            PY
