name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Repack repository cache while preserving all objects and references
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 220s
          script: |
            set -eu
            cd /opt/seiltanzer
            exec 9>/opt/seiltanzer/.deployment-git-maintenance.lock
            flock -w 15 9
            test "$(git rev-parse HEAD)" = 69328c1e32937f6dc0d238dfb714dc29c0ecefd7
            test -d .git
            test ! -L .git
            /usr/bin/python3 -u - <<'PY'
            import hashlib,json,shutil,subprocess
            def run(args,timeout=30):return subprocess.check_output(args,text=True,stderr=subprocess.STDOUT,timeout=timeout)
            refs=run(['git','for-each-ref','--format=%(refname) %(objectname)'])
            head=run(['git','rev-parse','HEAD'])
            before=shutil.disk_usage('/').free
            print('REPACK_BEFORE',json.dumps(dict(free_bytes=before,objects=run(['git','count-objects','-vH']))),flush=True)
            run(['git','fsck','--connectivity-only'],timeout=40)
            result=run(['git','-c','pack.threads=1','-c','pack.windowMemory=32m','-c','pack.deltaCacheSize=16m','-c','gc.reflogExpire=never','-c','gc.reflogExpireUnreachable=never','-c','gc.autoDetach=false','gc','--prune=never'],timeout=140)
            assert run(['git','rev-parse','HEAD'])==head
            assert run(['git','for-each-ref','--format=%(refname) %(objectname)'])==refs
            run(['git','fsck','--connectivity-only'],timeout=40)
            after=shutil.disk_usage('/').free
            print('REPACK_AFTER',json.dumps(dict(free_bytes=after,recovered=after-before,objects=run(['git','count-objects','-vH']),refs_sha256=hashlib.sha256(refs.encode()).hexdigest(),head=head.strip(),all_references_unchanged=True,objects_pruned=False,integrity_verified=True)),flush=True)
            print('GIT_CACHE_ONLY_NO_DATABASE_TOUCH_NO_RESTART')
            PY
