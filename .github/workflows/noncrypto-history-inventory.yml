name: readonly-release-capacity-4d35
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 40s
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = 4d35f82110007d78b41635f5da3f55e422a081d0
            systemctl show seiltanzer --property=ActiveState,MainPID,NRestarts --no-pager
            /opt/seiltanzer/.venv/bin/python -B -u - <<'PY'
            import json,shutil,sqlite3,time,os
            root='/opt/seiltanzer/data'
            print('CURRENT_DISK',json.dumps(shutil.disk_usage(root)._asdict()),flush=True)
            c=sqlite3.connect('file:'+root+'/trades.db?mode=ro',uri=True,timeout=.5)
            try:
             c.execute('PRAGMA query_only=ON');c.execute('PRAGMA trusted_schema=OFF')
             deadline=time.monotonic()+4;c.set_progress_handler(lambda:time.monotonic()>deadline,1000)
             page=c.execute('PRAGMA page_size').fetchone()[0];count=c.execute('PRAGMA page_count').fetchone()[0];free=c.execute('PRAGMA freelist_count').fetchone()[0]
             print('SQLITE_CAPACITY_HEADER',json.dumps({'page_size':page,'page_count':count,'freelist_count':free,'logical_bytes':page*count,'used_page_bytes':page*(count-free),'reclaimable_bytes':page*free}),flush=True)
            finally:c.close()
            print('READ_ONLY_CONSTANT_HEADER_NO_SCAN_NO_PROVIDER_NO_RESTART')
            PY
