name: noncrypto-history-inventory
on:
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Read log and cache metadata before bounded headroom recovery
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 60s
          script: |
            set -eu
            /usr/bin/python3 -u - <<'PY'
            import json,os,stat,subprocess
            from pathlib import Path
            for root in ('/var/log','/opt/seiltanzer/data'):
             rows=[]
             for p in Path(root).iterdir():
              s=p.lstat()
              if stat.S_ISREG(s.st_mode):rows.append(dict(name=p.name,bytes=s.st_size,allocated=s.st_blocks*512,links=s.st_nlink))
             print(json.dumps(dict(kind='file_metadata',root=root,rows=sorted(rows,key=lambda r:r['allocated'],reverse=True)[:22])),flush=True)
            for kind,args in (('journal',['journalctl','--disk-usage']),('cache',['du','-xhd2','/var/cache','/var/log/journal']),('git_objects',['git','-C','/opt/seiltanzer','count-objects','-vH'])):
             r=subprocess.run(args,capture_output=True,text=True,timeout=15);print(json.dumps(dict(kind=kind,stdout=r.stdout[:8000],stderr=r.stderr[:500])),flush=True)
            print('READ_ONLY_METADATA_NO_DATABASE_OPEN')
            PY
