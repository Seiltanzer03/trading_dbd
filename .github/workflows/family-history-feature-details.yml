name: existing-family-feature-details
on:
  push:
    branches: [ops/family-history-inventory-20261025]
    paths: [.github/workflows/family-history-feature-details.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install paramiko boto3
      - name: Inspect bounded existing capture schemas and public archive checksum only
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          python -u - <<'PY'
          import os,paramiko,shlex,json,urllib.request
          remote="import sqlite3,json,time\nfrom pathlib import Path\nfrom collections import Counter\ncodes=('NAS100','XAU','EURUSD')\nstarted=time.monotonic();now=time.time()\n\n\"\"\"Stdlib direct-reader exclusion under the existing maintenance flock.\"\"\"\nfrom contextlib import contextmanager\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport stat\n\n# Canonical identity is independent of a caller's requested source path.\nPRODUCTION_ROOT = Path('/opt')/'seiltanzer'\nPRODUCTION_DATABASE = PRODUCTION_ROOT/'data'/'trades.db'\n\n\ndef _live_read_unique(items):\n    result = {}\n    for key,value in items:\n        if key in result:raise ValueError('AMBIGUOUS_HISTORY_JOURNAL')\n        result[key] = value\n    return result\n\n\ndef _live_read_terminal_journal(path):\n    if not os.path.lexists(path):return\n    info = path.lstat()\n    if (not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_mode & 0o077\n            or not 0 < info.st_size <= 65536):\n        raise ValueError('UNSAFE_HISTORY_JOURNAL')\n    raw = path.read_bytes()\n    state = json.loads(raw,object_pairs_hook=_live_read_unique)\n    if (type(state) is not dict or set(state) != {'contract','run_id','plan_sha256','phase','service_started'}\n            or state['contract'] != 'sqlite-history-transaction-v1'\n            or type(state['run_id']) is not str\n            or not re.fullmatch('[A-Za-z0-9][A-Za-z0-9_-]{0,63}',state['run_id'])\n            or type(state['plan_sha256']) is not str or not re.fullmatch('[0-9a-f]{64}',state['plan_sha256'])\n            or state['phase'] not in ('COMMITTED','ORIGINAL_RESTORED')\n            or type(state['service_started']) is not bool\n            or json.dumps(state,sort_keys=True,separators=(',',':'),ensure_ascii=True).encode() != raw):\n        raise ValueError('HISTORY_SOURCE_READ_FENCED')\n\n\n@contextmanager\ndef guarded_live_read(database):\n    \"\"\"Hold SHARED exclusion for a direct live DB reader's entire lifetime.\"\"\"\n    database = Path(database).absolute()\n    if database.resolve() != PRODUCTION_DATABASE:\n        yield\n        return\n    import fcntl\n    if database != database.resolve():\n        raise ValueError('LIVE_SOURCE_ALIAS_REFUSED')\n    lock_path = PRODUCTION_ROOT/'.deployment-git-maintenance.lock'\n    fd = os.open(lock_path,os.O_RDONLY|os.O_NOFOLLOW)\n    try:\n        info = os.fstat(fd)\n        if (not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_mode & 0o022\n                or info.st_uid != PRODUCTION_ROOT.stat().st_uid):\n            raise ValueError('UNSAFE_HISTORY_MAINTENANCE_LOCK')\n        try:\n            fcntl.flock(fd,fcntl.LOCK_SH|fcntl.LOCK_NB)\n        except BlockingIOError:\n            raise ValueError('HISTORY_SOURCE_READ_FENCED') from None\n        current = lock_path.lstat()\n        if current.st_ino != info.st_ino or current.st_dev != info.st_dev:\n            raise ValueError('HISTORY_MAINTENANCE_LOCK_CHANGED')\n        if os.path.lexists(PRODUCTION_ROOT/'data'/'cutover.active'):\n            raise ValueError('HISTORY_SOURCE_READ_FENCED')\n        _live_read_terminal_journal(PRODUCTION_ROOT/'data'/'cutover.journal.json')\n        source = database.lstat()\n        if not stat.S_ISREG(source.st_mode) or source.st_nlink != 1:\n            raise ValueError('INVALID_DIRECT_HISTORY_SOURCE')\n        yield fd\n    finally:\n        os.close(fd)\n\nwith guarded_live_read(Path('/opt/seiltanzer/data/trades.db')):\n    c=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=2)\n    try:\n        c.row_factory=sqlite3.Row;c.execute('PRAGMA query_only=ON')\n        c.set_progress_handler(lambda:int(time.monotonic()-started>20),10000)\n        tables=[r[0] for r in c.execute(\"SELECT name FROM sqlite_schema WHERE type='table' ORDER BY name\")]\n        print('HISTORY_TABLES='+json.dumps([n for n in tables if any(k in n.lower() for k in ('fomc','macro','cftc','flow','fund','history','source','archive','quote'))]))\n        for code in codes:\n         try:\n          keys=Counter();roots=Counter();nested={};sampled=0\n          for order in ('ASC','DESC'):\n           rows=c.execute(\"SELECT captured_ts,CASE WHEN length(features_json)<=256000 THEN features_json END AS payload FROM passive_market_observations WHERE instrument=? AND captured_ts>=? AND horizon_minutes=15 AND evidence_eligible=1 ORDER BY captured_ts \"+order+\" LIMIT 3\",(code,now-120*86400))\n           for row in rows:\n            if not row['payload']:continue\n            snap=json.loads(row['payload']);sampled+=1;keys.update(snap.keys())\n            if sampled==1:\n             t=snap.get('treasury_context_v1') or {};o=snap.get('option_distribution') or {};g=(snap.get('g1s_evidence_v3') or {}).get('option_static') or {}\n             print('FEATURE_DETAIL='+json.dumps({'instrument':code,'treasury':t,'option_scalar_fields':{k:v for k,v in o.items() if isinstance(v,(int,float,bool)) or v is None},'option_static_keys':sorted(g),'option_static':{k:v for k,v in g.items() if isinstance(v,(int,float,bool,str)) or v is None}}),flush=True)\n            for key in ('treasury_context_v1','option_distribution','option_derivatives','edge_family_source_bundle_audit','g1s_evidence_v3'):\n             val=snap.get(key)\n             if val:\n              roots[key]+=1\n              if isinstance(val,dict):nested.setdefault(key,set()).update(val.keys())\n          print('CAPTURE_SCHEMA='+json.dumps({'instrument':code,'sampled':sampled,'root_presence':dict(roots),'top_keys':sorted(keys),'nested_keys':{k:sorted(v)[:70] for k,v in nested.items()},'hot_sample_only':True,'history_complete':False}),flush=True)\n         except sqlite3.Error as exc:\n          print('CAPTURE_SCHEMA_ERROR='+json.dumps({'instrument':code,'error':type(exc).__name__}),flush=True)\n          if time.monotonic()-started>20:break\n    finally:\n        c.close()\n"
          c=paramiko.SSHClient();c.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          c.connect('94.241.171.182',username='root',password=os.environ['SSH_PASSWORD'],timeout=15,auth_timeout=15,look_for_keys=False,allow_agent=False)
          try:
              _,stdout,stderr=c.exec_command('python3 -c '+shlex.quote(remote),timeout=40)
              print(stdout.read(100000).decode());error=stderr.read(2000).decode()
              if error:print(error)
              print('INVENTORY_EXIT='+str(stdout.channel.recv_exit_status()))
          finally:c.close()
          import boto3
          from botocore.config import Config
          s=boto3.client('s3',endpoint_url='https://storage.yandexcloud.net',region_name='ru-central1',config=Config(connect_timeout=10,read_timeout=15,retries={'total_max_attempts':1}))
          for prefix in ('edge-family/v1/','research/ede-ledger-archives/v1/cftc-public-row-versions-088691.json/','research/ede-ledger-archives/v1/cftc-public-row-versions-084691.json/','research/ede-ledger-archives/v1/cftc-public-row-versions-099741.json/'):
              r=s.list_objects_v2(Bucket='trading-dbd-backups-2026',Prefix=prefix,MaxKeys=4)
              print('HISTORY_OBJECTS='+json.dumps({'prefix':prefix,'truncated':r.get('IsTruncated'),'objects':[{'key':v['Key'],'bytes':v['Size'],'modified':str(v['LastModified'])} for v in r.get('Contents',[])]}))
          url='https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/1m/BTCUSDT-1m-2026-09.zip.CHECKSUM'
          try:
              with urllib.request.urlopen(url,timeout=15) as response:
                  raw=response.read(256)
                  print('PUBLIC_ARCHIVE_CHECKSUM='+json.dumps({'http_status':response.status,'bytes':len(raw),'checksum_format_valid':len(raw.split())==2 and len(raw.split()[0])==64}))
          except Exception as e:print('PUBLIC_ARCHIVE_ACCESS='+type(e).__name__+':'+str(e)[:160])
          PY
