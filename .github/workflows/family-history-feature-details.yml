name: existing-crypto-history-probe
on:
  push:
    branches: [ops/family-history-inventory-20261025]
    paths: [.github/workflows/family-history-feature-details.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install paramiko
      - name: Read bounded existing crypto metadata and primary public archive availability
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python -u - <<'PYCODE'
          import os,paramiko,shlex,json,urllib.request,urllib.parse,time
          remote='import sqlite3,json,time\nfrom collections import Counter\nnow=time.time();started=time.monotonic()\n\n"""Stdlib direct-reader exclusion under the existing maintenance flock."""\nfrom contextlib import contextmanager\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport stat\n\n# Canonical identity is independent of a caller\'s requested source path.\nPRODUCTION_ROOT = Path(\'/opt\')/\'seiltanzer\'\nPRODUCTION_DATABASE = PRODUCTION_ROOT/\'data\'/\'trades.db\'\n\n\ndef _live_read_unique(items):\n    result = {}\n    for key,value in items:\n        if key in result:raise ValueError(\'AMBIGUOUS_HISTORY_JOURNAL\')\n        result[key] = value\n    return result\n\n\ndef _live_read_terminal_journal(path):\n    if not os.path.lexists(path):return\n    info = path.lstat()\n    if (not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_mode & 0o077\n            or not 0 < info.st_size <= 65536):\n        raise ValueError(\'UNSAFE_HISTORY_JOURNAL\')\n    raw = path.read_bytes()\n    state = json.loads(raw,object_pairs_hook=_live_read_unique)\n    if (type(state) is not dict or set(state) != {\'contract\',\'run_id\',\'plan_sha256\',\'phase\',\'service_started\'}\n            or state[\'contract\'] != \'sqlite-history-transaction-v1\'\n            or type(state[\'run_id\']) is not str\n            or not re.fullmatch(\'[A-Za-z0-9][A-Za-z0-9_-]{0,63}\',state[\'run_id\'])\n            or type(state[\'plan_sha256\']) is not str or not re.fullmatch(\'[0-9a-f]{64}\',state[\'plan_sha256\'])\n            or state[\'phase\'] not in (\'COMMITTED\',\'ORIGINAL_RESTORED\')\n            or type(state[\'service_started\']) is not bool\n            or json.dumps(state,sort_keys=True,separators=(\',\',\':\'),ensure_ascii=True).encode() != raw):\n        raise ValueError(\'HISTORY_SOURCE_READ_FENCED\')\n\n\n@contextmanager\ndef guarded_live_read(database):\n    """Hold SHARED exclusion for a direct live DB reader\'s entire lifetime."""\n    database = Path(database).absolute()\n    if database.resolve() != PRODUCTION_DATABASE:\n        yield\n        return\n    import fcntl\n    if database != database.resolve():\n        raise ValueError(\'LIVE_SOURCE_ALIAS_REFUSED\')\n    lock_path = PRODUCTION_ROOT/\'.deployment-git-maintenance.lock\'\n    fd = os.open(lock_path,os.O_RDONLY|os.O_NOFOLLOW)\n    try:\n        info = os.fstat(fd)\n        if (not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_mode & 0o022\n                or info.st_uid != PRODUCTION_ROOT.stat().st_uid):\n            raise ValueError(\'UNSAFE_HISTORY_MAINTENANCE_LOCK\')\n        try:\n            fcntl.flock(fd,fcntl.LOCK_SH|fcntl.LOCK_NB)\n        except BlockingIOError:\n            raise ValueError(\'HISTORY_SOURCE_READ_FENCED\') from None\n        current = lock_path.lstat()\n        if current.st_ino != info.st_ino or current.st_dev != info.st_dev:\n            raise ValueError(\'HISTORY_MAINTENANCE_LOCK_CHANGED\')\n        if os.path.lexists(PRODUCTION_ROOT/\'data\'/\'cutover.active\'):\n            raise ValueError(\'HISTORY_SOURCE_READ_FENCED\')\n        _live_read_terminal_journal(PRODUCTION_ROOT/\'data\'/\'cutover.journal.json\')\n        source = database.lstat()\n        if not stat.S_ISREG(source.st_mode) or source.st_nlink != 1:\n            raise ValueError(\'INVALID_DIRECT_HISTORY_SOURCE\')\n        yield fd\n    finally:\n        os.close(fd)\n\nwith guarded_live_read(Path(\'/opt/seiltanzer/data/trades.db\')):\n    c=sqlite3.connect(\'file:/opt/seiltanzer/data/trades.db?mode=ro\',uri=True,timeout=2)\n    try:\n        c.row_factory=sqlite3.Row\n        c.execute(\'PRAGMA query_only=ON\')\n        c.set_progress_handler(lambda:int(time.monotonic()-started>12),10000)\n        try:\n         for code in (\'BTCUSD\',\'ETHUSD\',\'SOLUSD\'):\n          for table,cols in ((\'g1s_observations\',\'training_eligible,exclusion_reason\'),(\'passive_market_observations\',\'evidence_eligible,option_kind,option_source\')):\n           where=\' AND horizon_minutes=15\' if table==\'g1s_observations\' else \'\'\n           try:\n            rows=c.execute(\'SELECT \'+cols+\' FROM \'+table+\' WHERE instrument=? AND captured_ts>=?\'+where+\' ORDER BY captured_ts DESC LIMIT 512\',(code,now-90*86400)).fetchall()\n            counts=Counter(tuple(row) for row in rows)\n            print(\'CRYPTO_CAPTURE_COUNTS=\'+json.dumps(dict(instrument=code,table=table,sampled=len(rows),counts=[dict(fields=list(key),n=value) for key,value in counts.items()],bounded_sample_only=True)),flush=True)\n           except sqlite3.Error as error:print(\'CAPTURE_QUERY_ERROR=\'+type(error).__name__,flush=True)\n         for code in (\'NAS100\',\'BTCUSD\',\'ETHUSD\',\'SOLUSD\'):\n          try:\n           rows=c.execute(\'SELECT captured_ts,option_source,option_age_sec,option_quality,features_json FROM passive_market_observations WHERE instrument=? ORDER BY captured_ts DESC LIMIT 2\',(code,)).fetchall()\n           for row in rows:\n            if len(row[\'features_json\'].encode())>256000:continue\n            frozen=json.loads(row[\'features_json\']);metrics=frozen.get(\'option_distribution\') or {}\n            roots={}\n            for key in (\'indices\',\'reference_indices\',\'volatility_indices\',\'index_context\',\'vol_indices\'):\n             if key in frozen:roots[key]=frozen[key]\n            print(\'CRYPTO_SOURCE_SCHEMA=\'+json.dumps(dict(instrument=code,captured_ts=row[\'captured_ts\'],top_keys=sorted(frozen),option_source=row[\'option_source\'],option_age_sec=row[\'option_age_sec\'],option_quality=row[\'option_quality\'],metrics_keys=sorted(metrics) if isinstance(metrics,dict) else None,option_identity={k:metrics[k] for k in (\'proxy\',\'demo\',\'expiry\',\'implied_move\') if isinstance(metrics,dict) and k in metrics},index_context_excerpt=json.dumps(roots)[:4000])),flush=True)\n          except (sqlite3.Error,ValueError,TypeError) as error:print(\'CAPTURE_SCHEMA_ERROR=\'+type(error).__name__,flush=True)\n        finally:finally:\n        c.close()\n'
          client=paramiko.SSHClient();client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client.connect('94.241.171.182',username='root',password=os.environ['SSH_PASSWORD'],timeout=15,auth_timeout=15,look_for_keys=False,allow_agent=False)
          try:
              _,stdout,stderr=client.exec_command('python3 -c '+shlex.quote(remote),timeout=30)
              print(stdout.read(65000).decode());error=stderr.read(2000).decode()
              if error:print(error)
              print('CAPTURE_PROBE_EXIT='+str(stdout.channel.recv_exit_status()))
          finally:client.close()
          urls=[
          'https://data.binance.vision/data/spot/monthly/klines/BTCUSDT/5m/BTCUSDT-5m-2025-10.zip.CHECKSUM',
          'https://data.binance.vision/data/futures/um/monthly/fundingRate/BTCUSDT/BTCUSDT-fundingRate-2026-09.zip.CHECKSUM',
          'https://data.binance.vision/data/futures/um/daily/metrics/BTCUSDT/BTCUSDT-metrics-2026-10-23.zip.CHECKSUM']
          for url in urls:
              try:
                  with urllib.request.urlopen(url,timeout=12) as response:
                      raw=response.read(513)
                      print('ADDITIONAL_ARCHIVE_ACCESS='+json.dumps(dict(url=url,http_status=response.status,bytes=len(raw),checksum_format_valid=len(raw.split())==2 and len(raw.split()[0])==64)))
              except Exception as error:print('ADDITIONAL_ARCHIVE_ERROR='+json.dumps(dict(url=url,error=type(error).__name__,detail=str(error)[:100])))
          for currency in ('BTC','ETH'):
              end=int((time.time()-30*86400)//3600)*3600*1000
              params=dict(currency=currency,start_timestamp=end-3600*1000,end_timestamp=end,resolution='60')
              url='https://www.deribit.com/api/v2/public/get_volatility_index_data?'+urllib.parse.urlencode(params)
              try:
                  with urllib.request.urlopen(url,timeout=12) as response:
                      raw=response.read(256001);assert len(raw)<=256000
                      payload=json.loads(raw);data=(payload.get('result') or {}).get('data') or []
                      print('HISTORICAL_DVOL_ACCESS='+json.dumps(dict(currency=currency,http_status=response.status,params=params,rows=len(data),first=data[0] if data else None,last=data[-1] if data else None,error=payload.get('error'),actual_receipt_ts=time.time())))
              except Exception as error:print('HISTORICAL_DVOL_ERROR='+json.dumps(dict(currency=currency,error=type(error).__name__,detail=str(error)[:100])))
          PYCODE
