name: existing-crypto-history-probe
on:
  push:
    branches: [ops/family-history-inventory-20261025]
    paths: [.github/workflows/family-history-feature-details.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Observe bounded ten-day official DVOL history pagination without VPS access
        run: |
          python3 -u - <<'PYCODE'
          import time,json,urllib.request,urllib.parse
          for currency in ('BTC','ETH'):
              end=int(time.time()//60)*60*1000;start=end-10*86400*1000
              for page in range(2):
                  params=dict(currency=currency,start_timestamp=start,end_timestamp=end,resolution='60')
                  url='https://www.deribit.com/api/v2/public/get_volatility_index_data?'+urllib.parse.urlencode(params)
                  with urllib.request.urlopen(url,timeout=12) as response:
                      raw=response.read(2000001);assert len(raw)<=2000000
                      payload=json.loads(raw);result=payload.get('result') or {};data=result.get('data') or []
                      continuation=result.get('continuation')
                      print('DVOL_HISTORY_PAGE='+json.dumps(dict(currency=currency,page=page,bytes=len(raw),rows=len(data),first=data[0] if data else None,last=data[-1] if data else None,continuation=continuation,error=payload.get('error'),actual_receipt_ts=time.time())))
                  if continuation is None:break
                  assert isinstance(continuation,int) and start<=continuation<end
                  end=continuation
          PYCODE
