name: production-storage-access-check

on:
  workflow_dispatch:
  push:
    branches:
      - agent/storage-probe-diagnostics

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install S3 client
        run: pip install boto3
      - name: Verify private backup bucket access with a disposable object
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: 'true'
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import uuid
          import boto3
          from botocore.config import Config

          for name in ('AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY'):
              if not os.environ.get(name):
                  raise SystemExit('Required YC_STORAGE_* GitHub Actions secrets are missing')
          client = boto3.client('s3', endpoint_url='https://storage.yandexcloud.net',
                                config=Config(connect_timeout=10, read_timeout=20,
                                              retries={'max_attempts': 2}))
          bucket = 'trading-dbd-backups-2026'
          key = ('access-check/' + os.environ['RUN_ID'] + '-' +
                 os.environ['RUN_ATTEMPT'] + '-' + uuid.uuid4().hex + '.txt')
          body = b'trading_dbd disposable storage access check\n'
          digest = hashlib.sha256(body).hexdigest()
          created = False
          try:
              expected_metadata = {'backup-digest': digest, 'probe': 'ok'}
              client.put_object(Bucket=bucket, Key=key, Body=body,
                                Metadata=expected_metadata)
              created = True
              head = client.head_object(Bucket=bucket, Key=key)
              response = client.get_object(Bucket=bucket, Key=key)
              with response['Body'] as stream:
                  actual = stream.read()
              actual_digest = hashlib.sha256(actual).hexdigest()
              get_metadata = {
                  str(name).lower(): str(value)
                  for name, value in response.get('Metadata', {}).items()
              }
              head_metadata = {
                  str(name).lower(): str(value)
                  for name, value in head.get('Metadata', {}).items()
              }
              print('Storage probe diagnostics: '
                    f'expected_bytes={len(body)} actual_bytes={len(actual)} '
                    f'body_sha_match={actual_digest == digest} '
                    f'get_metadata_keys={sorted(get_metadata)} '
                    f'head_metadata_keys={sorted(head_metadata)} '
                    f'get_metadata_match={get_metadata == expected_metadata} '
                    f'head_metadata_match={head_metadata == expected_metadata}')
              if actual != body or (get_metadata and get_metadata != expected_metadata) or (
                      head_metadata and head_metadata != expected_metadata):
                  raise SystemExit('Storage round-trip verification failed')
              client.list_objects_v2(Bucket=bucket, Prefix=key, MaxKeys=1)
          finally:
              if created:
                  # Only this run's UUID-scoped disposable probe may be deleted.
                  client.delete_object(Bucket=bucket, Key=key)
          print('Storage upload/read/list/delete check passed; no database transferred')
          PY
