name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-ladder-fix:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/agent/ai-quant-policy-manager' && !contains(github.event.head_commit.message, '[ladder-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-quant-policy-manager
          fetch-depth: 0
      - name: Normalize future ladder fractions to current remainder
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('seiltanzer/ai_policy.py')
          text = path.read_text()
          old = '''    future = np.asarray([x for x in inputs.rungs if x > inputs.max_r + 1e-8], dtype=float)
    if future.size:
        crossed = sim.max_r[:, None] >= future[None, :] - 1e-12
        realized = inputs.rung_fraction * (crossed * future[None, :]).sum(axis=1)
        closed = np.minimum(1.0, inputs.rung_fraction * crossed.sum(axis=1))
    else:
        realized = np.zeros_like(sim.terminal)
        closed = np.zeros_like(sim.terminal)
'''
          new = '''    past_count = sum(inputs.max_r >= rung - 1e-12 for rung in inputs.rungs)
    original_remaining = max(1.0 - inputs.rung_fraction * past_count, 1e-9)
    # The playbook closes 10% of the original position at each rung. Policies are
    # evaluated per unit of the position that remains now, so future rung size
    # must be normalized by the already reduced original remainder.
    future_fraction = min(inputs.rung_fraction / original_remaining, 1.0)
    future = np.asarray([x for x in inputs.rungs if x > inputs.max_r + 1e-8], dtype=float)
    if future.size:
        crossed = sim.max_r[:, None] >= future[None, :] - 1e-12
        realized = future_fraction * (crossed * future[None, :]).sum(axis=1)
        closed = np.minimum(1.0, future_fraction * crossed.sum(axis=1))
    else:
        realized = np.zeros_like(sim.terminal)
        closed = np.zeros_like(sim.terminal)
'''
          if old not in text:
              raise SystemExit('baseline ladder block not found')
          text = text.replace(old, new)
          text = text.replace(
              'fraction of the *current remainder*. Break-even is treated identically to the',
              'original-position fraction, normalized to the *current remainder*. Break-even is treated identically to the',
          )
          text = text.replace(
              '"future ladder rungs close the configured fraction; already crossed rungs are not paid twice",',
              '"future ladder rungs close the configured original-position fraction, normalized to the current remainder; already crossed rungs are not paid twice",',
          )
          path.write_text(text)
          PY
          rm -f .github/workflows/agent_fix_ladder.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
      - name: Commit generated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: normalize policy ladder to current remainder [ladder-fixed]"
          git push origin HEAD:agent/ai-quant-policy-manager

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run Python tests
        run: pytest -q
      - name: Check frontend modules
        run: |
          node --check seiltanzer/web/js/lattice.js
          node --check seiltanzer/web/js/gex.js
          node --check seiltanzer/web/js/fan.js
          node --check seiltanzer/web/js/iv_surface.js
          node tests/web/lattice_scale_smoke.mjs
          node tests/web/gex_svg_smoke.mjs
          node tests/web/fan_center_path_smoke.mjs
          node tests/web/iv_surface_live_smoke.mjs
