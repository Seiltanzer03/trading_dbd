name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run Python tests
        run: pytest -q
      - name: Check frontend modules
        run: |
          node --check seiltanzer/web/js/lattice.js
          node --check seiltanzer/web/js/gex.js
          node tests/web/lattice_scale_smoke.mjs
