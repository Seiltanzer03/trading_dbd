name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run Python tests
        run: pytest -q
      - name: Verify real pinned SQLite seeded refresh
        run: |
          python -c 'import sys; from pathlib import Path; sys.path.insert(0,"scripts"); from offhost_sqlite_snapshot import install_rsync; install_rsync(Path("${{ runner.temp }}/sqlite3_rsync"))'
          SQLITE_RSYNC_TEST_BINARY="${{ runner.temp }}/sqlite3_rsync" \
            pytest -q tests/test_offhost_sqlite_snapshot.py -k real_pinned_sqlite

  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend modules
        run: |
          node --check seiltanzer/web/js/plotly_camera_guard.js
          node --check seiltanzer/web/js/plotly_terminal_toolbar.js
          node --check seiltanzer/web/js/wavelet.js
          node --check seiltanzer/web/js/regime_phase.js
          node --check seiltanzer/web/js/touch_clock.js
          node --check seiltanzer/web/js/safe_fetch.js
          node --check seiltanzer/web/js/management_ui.js
          node --check seiltanzer/web/js/journal_management.js
          node --check seiltanzer/web/js/trade_delete_ui_guard.js
          node --check seiltanzer/web/js/g1s_evidence.js
          node --check seiltanzer/web/js/cone.js
          node --check seiltanzer/web/js/cone_core.js
          node --check seiltanzer/web/js/lattice.js
          node --check seiltanzer/web/js/gex.js
          node --check seiltanzer/web/js/fan.js
          node --check seiltanzer/web/js/iv_surface.js
          node --check seiltanzer/web/js/bybit_context.js
          node --check seiltanzer/web/js/iv_surface_core.js
          node --check seiltanzer/web/js/correlation.js
          node --check seiltanzer/web/js/market_bus.js
          node --check seiltanzer/web/js/universe_scenes.js
          node --check seiltanzer/web/js/universe_precision.js
          node --check seiltanzer/web/js/llm_edge_researcher_ui.js
          node tests/web/touch_clock_smoke.mjs
          node tests/web/ai_verdict_error_smoke.mjs
          node tests/web/ai_weekend_archive_smoke.mjs
          node tests/web/ai_management_decision_smoke.mjs
          node tests/web/unified_edge_audit_smoke.mjs
          node tests/web/bybit_context_smoke.mjs
          node tests/web/trade_delete_ui_guard_smoke.mjs
          node tests/web/g1s_evidence_smoke.mjs
          node tests/web/fan_cone_touch_consistency_smoke.mjs
          node tests/web/cone_interaction_smoke.mjs
          node tests/web/lattice_scale_smoke.mjs
          node tests/web/gex_svg_smoke.mjs
          node tests/web/fan_center_path_smoke.mjs
          node tests/web/correlation_modes_smoke.mjs
          node tests/web/plotly_toolbar_smoke.mjs
          node tests/web/real_market_motion_smoke.mjs
          node tests/web/plotly_camera_guard_mobile_smoke.mjs
          node tests/web/iv_surface_live_smoke.mjs
          node tests/web/render_budget_smoke.mjs
          node tests/web/llm_edge_researcher_ui_smoke.mjs
      - name: Install Playwright package
        run: npm install --no-save playwright
      - name: Cache Playwright WebKit
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - name: Install WebKit system dependencies
        # Some runner routes stream signed packages at ~100 KB/s. The observed
        # 87 MB install needs about 15 minutes; retain a finite 20-minute bound.
        timeout-minutes: 20
        run: bash scripts/install_webkit_dependencies.sh
      - name: Install Playwright WebKit browser
        timeout-minutes: 5
        run: npx playwright install webkit
      - name: Real WebKit iPhone camera test
        run: |
          node tests/web/plotly_camera_webkit_e2e.mjs
          node tests/web/analytics_3d_controls_webkit_e2e.mjs
          node tests/web/correlation_controls_webkit_e2e.mjs
          node tests/web/ai_management_decision_webkit_e2e.mjs
          node tests/web/universe_render_webkit_e2e.mjs

  acceptance:
    runs-on: ubuntu-22.04
    needs: [test, browser]
    if: always()
    steps:
      - name: Publish full CI status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ needs.test.result == 'success' && needs.browser.result == 'success' && 'success' || 'failure' }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            description="Python, frontend smoke and real WebKit iPhone checks passed"
          else
            state="failure"
            description="Python, frontend smoke or real WebKit iPhone check failed"
          fi
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 2 --retry-max-time 30 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"context\":\"ci/full-webkit\",\"description\":\"$description\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
