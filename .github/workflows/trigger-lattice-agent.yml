name: Trigger lattice agent patch
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lattice-adaptive-window-v21
      - name: Extract staged sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/apply-lattice-agent.yml').read_text()
          def extract(marker):
              start = text.index(marker)
              start = text.index("EOF'", start) + 5
              end = text.index('\nEOF', start)
              return text[start:end].strip()
          Path('/tmp/lattice.b64').write_text(extract('cat > /tmp/lattice.b64'))
          Path('/tmp/lattice_test.b64').write_text(extract('cat > /tmp/lattice_test.b64'))
          PY
          base64 -d /tmp/lattice.b64 | gzip -d > seiltanzer/web/js/lattice.js
          base64 -d /tmp/lattice_test.b64 | gzip -d > tests/web/lattice_scale_smoke.mjs
      - name: Fix trade-close persistence semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('seiltanzer/web/js/lattice.js')
          s = p.read_text()
          start = s.index('  function setData(d) {')
          end = s.index('    s.T = finite(d.T, 2.5);', start)
          replacement = '''  function setData(d) {
              const nextTradeId = d.tradeId ?? null;
              const previousTradeId = s.tradeId;
              const wasActive = s.active;
              const nextActive = !!d.active;

              // A closed or replaced trade must never inherit the previous board.
              if (previousTradeId != null && (!nextActive || nextTradeId !== previousTradeId)) {
                clearPersistedLattice(previousTradeId, storage);
              }
              if (nextTradeId !== previousTradeId) {
                s.tradeId = nextTradeId;
                s.cur.probs = null;
                s.edges = null;
                s.rawDomain = null;
                reset({ clearStorage: false });
                restore(nextTradeId);
              }
              s.active = nextActive;
              s.regime = d.regime;
              if (!s.active) {
                if (wasActive) reset({ clearStorage: false });
                return;
              }
          '''
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - name: Validate
        run: |
          node --check seiltanzer/web/js/lattice.js
          node tests/web/lattice_scale_smoke.mjs
          pytest -q
      - name: Commit validated patch
        shell: bash
        run: |
          rm .github/workflows/apply-lattice-agent.yml .github/workflows/trigger-lattice-agent.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add seiltanzer/web/js/lattice.js tests/web/lattice_scale_smoke.mjs .github/workflows
          git commit -m "fix(lattice): persist adaptive trade window"
          git push origin HEAD:agent/lattice-adaptive-window-v21
