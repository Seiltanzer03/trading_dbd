name: production-readiness

on:
  workflow_run:
    workflows: ["deploy"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Verify production from localhost over SSH
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 10m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/production_readiness_check.py \
              --expected-sha "$EXPECTED_SHA"

            # The readiness script has a 5s transport timeout, but Q maturity is
            # a production API and must satisfy the same 3000ms latency contract
            # as the other bounded research endpoints. Keep this explicit and
            # fail closed instead of accepting a merely non-timeout response.
            /opt/seiltanzer/.venv/bin/python - <<'PY'
            import time
            import urllib.request

            url = "http://127.0.0.1:8790/api/research/g1/q/audit?limit=5000"
            started = time.monotonic()
            with urllib.request.urlopen(url, timeout=5.0) as response:
                response.read()
                code = int(response.status)
            elapsed_ms = (time.monotonic() - started) * 1000.0
            print(f"Q_AUDIT_3000MS_GATE http={code} elapsed={elapsed_ms:.0f}ms")
            assert code == 200, (code, url)
            assert elapsed_ms < 3000.0, (elapsed_ms, 3000.0)
            PY

      - name: Publish authoritative readiness statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            prod="Production ready after bounded two-speed research acceptance"
            g1e="Durability and bounded Intelligence runtime passed"
            g1m="Terminal Management Edge boundary passed"
            g1s="Fast short-horizon evidence and Q maturity audit passed"
            g1ml="Local management feedback boundary passed"
          else
            state="failure"
            prod="Production failed two-speed research readiness"
            g1e="G.1E.2 scalability or durability verification failed"
            g1m="G.1-M terminal management verification failed"
            g1s="G.1S fast learning or Q audit failed"
            g1ml="G.1-M.1 local feedback verification failed"
          fi
          for item in \
            "production/seiltanzer|$prod" \
            "g1e/storage-intelligence|$g1e" \
            "g1m/management-edge|$g1m" \
            "g1s/short-horizon|$g1s" \
            "g1m/local-feedback|$g1ml"; do
            context=${item%%|*}; description=${item#*|}
            curl -fsS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/statuses/${EXPECTED_SHA}" \
              -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          done
