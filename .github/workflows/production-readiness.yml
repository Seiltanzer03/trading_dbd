name: production-readiness

on:
  workflow_run:
    workflows: ["deploy"]
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, seiltanzer-prod]
    timeout-minutes: 10
    steps:
      - name: Wait for exact durable application startup
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory /opt/seiltanzer || true
          ready=0
          for attempt in $(seq 1 30); do
            SERVER_SHA=$(git -C /opt/seiltanzer rev-parse HEAD 2>/dev/null || true)
            ACTIVE=$(systemctl is-active seiltanzer 2>/dev/null || true)
            HTTP_CODE=$(curl --max-time 2 -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:8790/api/state || true)
            echo "attempt=$attempt sha=${SERVER_SHA:-missing} active=${ACTIVE:-unknown} http=${HTTP_CODE:-000}"
            if [ "$SERVER_SHA" = "$EXPECTED_SHA" ] && [ "$ACTIVE" = "active" ] && [ "$HTTP_CODE" = "200" ]; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo "::error::Production did not become healthy within 90 seconds"
            sudo journalctl -u seiltanzer -n 160 --no-pager || true
            exit 1
          fi

      - name: Verify bounded Intelligence and Management Edge APIs
        run: |
          set -euo pipefail
          for endpoint in \
            /api/research/g1/intelligence/status \
            /api/research/g1/intelligence/pipeline \
            /api/research/g1/intelligence/forecast-quality \
            /api/research/g1/intelligence/calibration \
            /api/research/g1/intelligence/pending \
            /api/research/g1/intelligence/resolved \
            /api/research/g1/intelligence/history \
            /intelligence \
            /api/research/g1/management/status \
            /api/research/g1/management/observations \
            /api/research/g1/management/pending \
            /api/research/g1/management/resolved \
            /api/research/g1/management/policies \
            /api/research/g1/management/cohorts \
            /api/research/g1/management/edge \
            /api/research/g1/management/cuts \
            /management-edge; do
            code=$(curl --max-time 5 -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:8790${endpoint}" || true)
            echo "$endpoint: $code"
            test "$code" = "200"
          done

          for endpoint in \
            /api/state \
            /api/validation \
            /api/system/storage/status \
            /api/system/storage/backups \
            /api/system/storage/integrity; do
            code=$(curl --max-time 20 -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:8790${endpoint}" || true)
            echo "$endpoint: $code"
            test "$code" = "200"
          done

          STORAGE=$(curl -fsS --max-time 30 http://127.0.0.1:8790/api/system/storage/status)
          BACKUPS=$(curl -fsS --max-time 30 http://127.0.0.1:8790/api/system/storage/backups)
          INTEL=$(curl -fsS --max-time 5 http://127.0.0.1:8790/api/research/g1/intelligence/status)
          G1M=$(curl -fsS --max-time 5 http://127.0.0.1:8790/api/research/g1/management/status)
          STORAGE="$STORAGE" BACKUPS="$BACKUPS" INTEL="$INTEL" G1M="$G1M" /opt/seiltanzer/.venv/bin/python - <<'PY'
          import json, os
          storage = json.loads(os.environ["STORAGE"])
          backups = json.loads(os.environ["BACKUPS"])
          intel = json.loads(os.environ["INTEL"])
          g1m = json.loads(os.environ["G1M"])

          assert storage.get("storage_contract_version") == "seiltanzer-storage-v1"
          assert (storage.get("sqlite_integrity") or {}).get("ok") is True
          assert storage.get("health") in {
              "HEALTHY", "LOCAL_BACKUP_ONLY", "DISASTER_RECOVERY_DEGRADED"
          }, storage.get("health")
          local = backups.get("local") or []
          assert local, "no verified local backup exists"
          assert local[0].get("verified") is True
          assert float(storage.get("last_local_backup_age_sec") or 1e99) <= 1800.0
          counts = local[0].get("critical_table_counts") or {}
          for table in (
              "trades", "passive_market_observations", "g1_q_capture_attempts",
              "g1m_runtime_activation", "g1m_management_observations",
              "g1m_observation_context", "g1m_counterfactual_policies",
              "g1m_t0_policy_metrics", "g1m_resolutions", "g1m_policy_outcomes",
              "g1m_execution_attribution", "g1m_contract_errors", "g1m_research_cuts",
          ):
              assert table in counts, table
              assert counts[table] is not None, (table, counts[table])

          assert intel.get("g1_stage") == "G.1E"
          assert intel.get("presentation_state") in {"WARMING", "LIVE_CACHE"}
          ia = intel.get("authority") or {}
          assert ia.get("research_only") is True
          assert ia.get("production_authority") is False
          assert ia.get("production_replacement_allowed") is False
          assert ia.get("promotion_allowed") is False
          assert ia.get("shadow_p_used_for_trading") is False

          assert g1m.get("g1_stage") == "G.1-M"
          assert g1m.get("g1m_contract_version") == "g1m-management-edge-v1"
          assert g1m.get("ready_for_oos") in {True, False}
          ga = g1m.get("authority") or {}
          assert ga.get("research_only") is True
          assert ga.get("production_authority") is False
          assert ga.get("auto_execution_allowed") is False
          assert ga.get("policy_promotion_allowed") is False
          assert ga.get("oos_validated") is False
          assert ga.get("edge_claim_allowed") is False

          exp = intel.get("experience") or {}
          print(
              "G1E: "
              f"presentation={intel.get('presentation_state')} "
              f"state={intel.get('maturity_state')} "
              f"q_attempts={exp.get('q_attempts', 0)} "
              f"q_captured={exp.get('q_captured', 0)} "
              f"q_resolved={exp.get('q_resolved', 0)} "
              f"storage={storage.get('health')}"
          )
          print(
              "G1M: "
              f"observations={g1m.get('observations', 0)} "
              f"pending={g1m.get('pending', 0)} "
              f"resolved={g1m.get('resolved', 0)} "
              f"eligible={g1m.get('policy_edge_eligible', 0)} "
              f"prospective_resolved={g1m.get('prospective_resolved', 0)} "
              f"unique_trades={g1m.get('unique_trades', 0)} "
              f"effective_n={g1m.get('effective_n', 0)} "
              f"critical_errors={g1m.get('critical_errors', 0)} "
              f"ready_for_oos={g1m.get('ready_for_oos', False)} "
              "production_authority=false"
          )
          PY

      - name: Restore-drill newest verified snapshot
        run: |
          set -euo pipefail
          DRILL=$(curl -fsS --max-time 90 -X POST http://127.0.0.1:8790/api/system/storage/restore-drill)
          DRILL="$DRILL" /opt/seiltanzer/.venv/bin/python - <<'PY'
          import json, os
          body = json.loads(os.environ["DRILL"])
          assert body.get("ok") is True, body
          assert body.get("restore_drill_contract_version") == "seiltanzer-restore-drill-v1"
          assert body.get("live_database_replaced") is False
          assert not (body.get("critical_table_mismatches") or {})
          assert int(body.get("critical_tables_verified_n") or 0) > 0
          print(f"Restore drill PASS: {body.get('backup_id')}")
          PY

          RESTORE_STATUS=$(curl -fsS --max-time 5 http://127.0.0.1:8790/api/system/storage/restore-drill/status)
          DRILL="$DRILL" RESTORE_STATUS="$RESTORE_STATUS" /opt/seiltanzer/.venv/bin/python - <<'PY'
          import json, os
          drill = json.loads(os.environ["DRILL"])
          status = json.loads(os.environ["RESTORE_STATUS"])
          persisted = status.get("last_restore_drill") or {}
          assert status.get("status") == "PASS"
          assert persisted.get("ok") is True
          assert persisted.get("backup_id") == drill.get("backup_id")
          assert persisted.get("live_database_replaced") is False
          PY

      - name: Publish authoritative readiness statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state="success"
            prod_description="Production ready after bounded durability acceptance"
            g1e_description="Durability, restore drill and Intelligence Lab passed"
            g1m_description="Management Edge research boundary and durability passed"
          else
            state="failure"
            prod_description="Production failed bounded readiness verification"
            g1e_description="G.1E storage or Intelligence verification failed"
            g1m_description="G.1-M research or durability verification failed"
          fi
          for item in \
            "production/seiltanzer|$prod_description" \
            "g1e/storage-intelligence|$g1e_description" \
            "g1m/management-edge|$g1m_description"; do
            context=${item%%|*}
            description=${item#*|}
            curl -fsS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/statuses/${EXPECTED_SHA}" \
              -d "{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          done
