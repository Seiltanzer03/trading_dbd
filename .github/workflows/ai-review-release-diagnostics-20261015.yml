    branches: [ops/ai-review-release-diagnostics-20261015]
    paths: [.github/workflows/ai-review-release-diagnostics-20261015.yml]
permissions:
  contents: read
jobs:
  read-only-acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            cd /opt/seiltanzer
            git rev-parse HEAD
            systemctl show seiltanzer -p ActiveState -p SubState -p MainPID -p NRestarts -p ExecMainStartTimestamp -p MemoryCurrent
            test "$(git rev-parse HEAD)" = 2319da521ea2341c6a1991dd8f6f9ea66d81e59b
            PYTHONDONTWRITEBYTECODE=1 .venv/bin/python - <<'PY'
            import json, pathlib, re, sqlite3, time, urllib.request, subprocess
            from types import SimpleNamespace
            from seiltanzer.edge_family_source_runtime import load_family_source_context
            from seiltanzer.mathematical_edge import load_artifact
            from seiltanzer.runtime_git_identity import runtime_git_sha
            root = pathlib.Path('/opt/seiltanzer')
            now = time.time()
            sha = runtime_git_sha(root)
            print('EXACT_RELEASE='+str(sha))
            trace_log=subprocess.run(['journalctl','-u','seiltanzer','--since','2026-10-15 16:14:00 UTC','--until','2026-10-15 16:15:10 UTC','-n','120','-o','cat','--no-pager'],capture_output=True,text=True,timeout=5)
            for line in trace_log.stdout.splitlines():
                start=line.find('{')
                if start<0:continue
                try:item=json.loads(line[start:])
                except ValueError:continue
                if str(item.get('request_id','')).startswith('ai-'):
                    print('SMOKE_TRACE='+json.dumps({k:item[k] for k in ('request_id','stage','event','elapsed_ms','duration_ms','exception_class','status_code') if k in item},sort_keys=True))
            journal=subprocess.run(['journalctl','-u','seiltanzer','--since','2026-10-15 15:57:00 UTC','-n','180','-o','cat','--no-pager'],capture_output=True,text=True,timeout=5)
            for line in journal.stdout.splitlines():
                if re.match(r'^(STARTUP_PHASE |Timeout \(|Thread |Current thread|  File ")',line):
                    print('STARTUP_OWNER='+line[:300])
            for route in ('/api/state','/api/research/runtime/worker-status'):
                started=time.monotonic()
                try:
                    with urllib.request.urlopen('http://127.0.0.1:8790'+route,timeout=3) as response:
                        raw=response.read(1_000_001)
                        body=json.loads(raw) if len(raw)<=1_000_000 else {}
                        worker=body.get('worker') or {}
                        print('HTTP_PROGRESS='+json.dumps({'route':route,'http':response.status,'elapsed_ms':round((time.monotonic()-started)*1000,1),'bytes':len(raw),
                            'worker':{k:worker.get(k) for k in ('current_phase','core_stage','last_started_ts','last_finished_ts','acceptance_pause_active')}},sort_keys=True))
                except Exception as exc:
                    print('HTTP_PROGRESS='+json.dumps({'route':route,'error_class':type(exc).__name__,'elapsed_ms':round((time.monotonic()-started)*1000,1)},sort_keys=True))
            engine = SimpleNamespace(settings=SimpleNamespace(data_dir=root/'data'))
            result = load_family_source_context(engine, {'captured_ts':now,'strategy':{'instrument':'NAS100'}}, sha)
            print('CURRENT_SOURCE_READER='+json.dumps(result['edge_family_source_bundle_audit'],sort_keys=True))
            path = root/'data/research/mathematical_edge_latest.json'
            model = load_artifact(path, now)
            print('CURRENT_MODEL_READER='+json.dumps({'accepted':model is not None,'published_for_sha':(model or {}).get('published_for_sha')},sort_keys=True))
            for name in ('mathematical_edge_latest.json','edge_family_sources_latest.json'):
                path=root/'data/research'/name
                if not path.is_file() or path.stat().st_size>8_000_000:
                    print('ARTIFACT='+json.dumps({'name':name,'bounded_available':False}));continue
                data=json.loads(path.read_bytes())
                matrix=data.get('family_market_models') or {}
                statuses={}
                for families in matrix.values():
                    for row in families.values():
                        status=row.get('status','UNKNOWN')
                        statuses[status]=statuses.get(status,0)+1
                print('ARTIFACT='+json.dumps({'name':name,'bytes':path.stat().st_size,
                    **{k:data.get(k) for k in ('contract_version','published_for_sha','created_ts','captured_ts','publication_contract_version')},
                    'instrument_n':len(data.get('instruments') or {}),'family_model_statuses':statuses},sort_keys=True))
            conn=sqlite3.connect((root/'data/trades.db').as_uri()+'?mode=ro',uri=True,timeout=3)
            conn.execute('PRAGMA query_only=ON')
            deadline=time.monotonic()+8
            conn.set_progress_handler(lambda:int(time.monotonic()>deadline),2000)
            def code(value):
                return value if isinstance(value,str) and re.fullmatch(r'[A-Za-z0-9_.:-]{0,96}',value) else None
            for row in conn.execute('SELECT id,ts,model,snapshot_json FROM ai_verdicts ORDER BY id DESC LIMIT 3'):
                if len(row[3])>1_000_000:continue
                snapshot=json.loads(row[3]); manager=snapshot.get('policy_manager') or {}
                shadow=snapshot.get('llm_shadow_decision') or {}
                unified=manager.get('unified_edge_ensemble') or {}
                market=snapshot.get('edge_family_market_context') or {}
                print('SAVED_REVIEW='+json.dumps({'row_id':row[0],'ts':row[1],'model':row[2],
                    'captured_ts':snapshot.get('captured_ts'),'provider_status':snapshot.get('ai_provider_status'),
                    'llm_status':shadow.get('status'),'llm_reason':code(shadow.get('reason_code')),
                    'components':[{k:c.get(k) for k in ('component_id','available','effective_weight','reason')} for c in unified.get('components',[])],
                    'source_audit':snapshot.get('edge_family_source_bundle_audit'),
                    'market_context':{k:market.get(k) for k in ('available','reason','failed_source_checks','market_observation_ts')}},sort_keys=True))
            conn.close()
            # One pure recalculation of the already-frozen smoke snapshot.
            # No engine/journal/provider is passed; never publish this replay.
            import cProfile, pstats
            from seiltanzer.active_management import select_active_management
            from seiltanzer.unified_edge_ensemble import build_unified_ensemble
            if row[0]==390:
                raise AssertionError('expected three historical rows, not a replay of the loop variable')
            profile_conn=sqlite3.connect((root/'data/trades.db').as_uri()+'?mode=ro',uri=True,timeout=3)
            profile_conn.execute('PRAGMA query_only=ON')
            profile_row=profile_conn.execute('SELECT snapshot_json FROM ai_verdicts WHERE id=390').fetchone()
            profile_conn.close()
            assert profile_row and len(profile_row[0])<=1_000_000
            replay=json.loads(profile_row[0])
            import types, sys, copy, hashlib
            def calculate():
                frozen=copy.deepcopy(replay)
                started=time.perf_counter()
                select_active_management(frozen)
                audit=build_unified_ensemble(frozen,frozen.get('llm_shadow_decision'))
                return time.perf_counter()-started, frozen['active_management_candidates'], audit
            before, old_rows, old_audit=calculate()
            source_map={"seiltanzer/execution_simulator.py":"\"\"\"Authoritative path-dependent execution contract for managed positions.\n\nThe option model produces paths in R-space.  This module is the only place\nwhere those paths are converted into strategy cash flows.  In particular,\nbreak-even is an absorbing barrier after it is armed; it is not a terminal\npayoff adjustment based on the path maximum.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Iterable, Sequence\n\nimport numpy as np\n\n\nSIMULATOR_VERSION = \"execution-simulator-f0-v1\"\nEPSILON = 1e-10\n\n\n@dataclass(frozen=True)\nclass ExecutionSpec:\n    \"\"\"Execution rules expressed per unit of the position remaining now.\"\"\"\n\n    current_r: float\n    max_r: float\n    take_r: float\n    rungs: tuple[float, ...]\n    rung_fraction_original: float\n    be_after_r: float\n    stop_r: float = -1.0\n    spike_r: float | None = None\n    spike_fraction: float = 0.0\n    time_stop_fraction: float | None = None\n    be_execution_confirmed: bool | None = None\n\n    def __post_init__(self):\n        if self.be_execution_confirmed is not None and not isinstance(self.be_execution_confirmed, bool):\n            raise ValueError(\"INVALID_BE_EXECUTION_CONFIRMATION\")\n\n    @classmethod\n    def from_values(\n        cls, *, current_r: float, max_r: float, take_r: float,\n        rungs: Iterable[float], rung_fraction_original: float,\n        be_after_r: float, stop_r: float = -1.0,\n        be_execution_confirmed: bool | None = None,\n    ) -> \"ExecutionSpec\":\n        return cls(\n            current_r=float(current_r), max_r=float(max_r),\n            take_r=float(take_r),\n            rungs=tuple(sorted({float(value) for value in rungs})),\n            rung_fraction_original=float(rung_fraction_original),\n            be_after_r=float(be_after_r), stop_r=float(stop_r),\n            be_execution_confirmed=be_execution_confirmed,\n        )\n\n    @property\n    def past_rung_count(self) -> int:\n        return sum(self.max_r >= rung - EPSILON for rung in self.rungs)\n\n    @property\n    def original_remaining(self) -> float:\n        return max(1.0 - self.rung_fraction_original * self.past_rung_count,\n                   EPSILON)\n\n    @property\n    def future_fill_fraction(self) -> float:\n        return min(self.rung_fraction_original / self.original_remaining, 1.0)\n\n    @property\n    def future_rungs(self) -> tuple[float, ...]:\n        return tuple(\n            rung for rung in self.rungs\n            if rung > self.max_r + EPSILON and rung <= self.take_r + EPSILON\n        )\n\n\n@dataclass(frozen=True)\nclass ExecutionResult:\n    outcome_r: float\n    exit_r: float\n    exit_reason: str\n    exit_step: int\n    exit_fraction: float\n    be_armed: bool\n    be_armed_step: int | None\n    filled_rungs: tuple[float, ...]\n    remaining_fraction: float\n    events: tuple[dict, ...] = ()\n\n    def as_dict(self) -> dict:\n        return {\n            \"simulator_version\": SIMULATOR_VERSION,\n            \"outcome_r\": self.outcome_r,\n            \"exit_r\": self.exit_r,\n            \"exit_reason\": self.exit_reason,\n            \"exit_step\": self.exit_step,\n            \"exit_fraction\": self.exit_fraction,\n            \"be_armed\": self.be_armed,\n            \"be_armed_step\": self.be_armed_step,\n            \"filled_rungs\": list(self.filled_rungs),\n            \"remaining_fraction\": self.remaining_fraction,\n            \"events\": [dict(event) for event in self.events],\n        }\n\n\ndef _crossing_fraction(previous: float, current: float, level: float) -> float:\n    delta = current - previous\n    if abs(delta) <= EPSILON:\n        return 0.0\n    return min(max((level - previous) / delta, 0.0), 1.0)\n\n\ndef _event_segment_mask(values: np.ndarray, spec: ExecutionSpec) -> np.ndarray:\n    \"\"\"Keep every possible crossing; stateful ordering still owns all fills.\n\n    Levels are a superset: BE may not yet be armed and a rung may already be\n    filled. Including those segments is harmless. Omit only segments that\n    cannot change execution state, using the same epsilon comparisons below.\n    \"\"\"\n    previous, current = values[..., :-1], values[..., 1:]\n    upward = current >= previous\n    relevant = np.zeros(previous.shape, dtype=bool)\n    levels = (*spec.future_rungs, spec.be_after_r, spec.take_r)\n    if spec.spike_r is not None:\n        levels = (*levels, spec.spike_r)\n    for level in levels:\n        relevant |= upward & (previous < level - EPSILON) & (level - EPSILON <= current + EPSILON)\n    downward = ~upward\n    for stop in (spec.stop_r, max(0.0, spec.stop_r)):\n        relevant |= downward & (current <= stop + EPSILON) & (stop + EPSILON < previous)\n    return relevant\n\n\ndef replay_execution_path(path: Sequence[float], spec: ExecutionSpec) -> ExecutionResult:\n    \"\"\"Replay one piecewise-linear R path using explicit event ordering.\n\n    Each adjacent pair is treated as a continuous segment.  This is exact for\n    the diffusion paths used by the Monte Carlo discretisation.  For observed\n    bar-close replay it is an explicit ``barrier-fill/no-slippage`` assumption;\n    callers must not silently represent it as tick-exact execution.\n    \"\"\"\n    values = np.asarray(path, dtype=float)\n    if values.ndim != 1 or values.size == 0 or not np.all(np.isfinite(values)):\n        raise ValueError(\"path must be a non-empty finite one-dimensional sequence\")\n    if abs(float(values[0]) - spec.current_r) > 1e-7:\n        raise ValueError(\"path must start at ExecutionSpec.current_r\")\n    if spec.time_stop_fraction is not None:\n        if not 0 < spec.time_stop_fraction <= 1:\n            raise ValueError(\"invalid time stop fraction\")\n        coordinate = (values.size - 1) * spec.time_stop_fraction\n        index = int(coordinate)\n        endpoint = float(np.interp(coordinate, np.arange(values.size), values))\n        values = np.concatenate((values[:index + 1], [endpoint]))\n    if not 0 <= spec.spike_fraction <= 1:\n        raise ValueError(\"invalid spike close fraction\")\n\n    segments = np.flatnonzero(_event_segment_mask(values, spec)) + 1\n    return _replay_execution_values(values, spec, segments)\n\n\ndef replay_execution_paths(paths: Sequence[Sequence[float]], spec: ExecutionSpec) -> list[ExecutionResult]:\n    \"\"\"Replay every path with the scalar event contract and bounded batch masks.\"\"\"\n    values = np.asarray(paths, dtype=float)\n    if (values.ndim != 2 or not values.shape[0] or not values.shape[1]\n            or not np.all(np.isfinite(values))):\n        raise ValueError(\"paths must be a non-empty finite two-dimensional sequence\")\n    if np.any(np.abs(values[:, 0] - spec.current_r) > 1e-7):\n        raise ValueError(\"path must start at ExecutionSpec.current_r\")\n    if not 0 <= spec.spike_fraction <= 1:\n        raise ValueError(\"invalid spike close fraction\")\n    if spec.time_stop_fraction is not None:\n        # Retain the exact scalar np.interp rounding and fractional deadline.\n        return [replay_execution_path(path, spec) for path in values]\n    results = []\n    for start in range(0, len(values), 256):\n        chunk = values[start:start + 256]\n        masks = _event_segment_mask(chunk, spec)\n        results.extend(_replay_execution_values(path, spec, np.flatnonzero(mask) + 1)\n                       for path, mask in zip(chunk, masks))\n    return results\n\n\ndef _replay_execution_values(values: np.ndarray, spec: ExecutionSpec,\n                             segments: np.ndarray) -> ExecutionResult:\n\n    remaining = 1.0\n    realized = 0.0\n    filled: list[float] = []\n    event_timeline: list[dict] = []\n    pending = list(spec.future_rungs)\n    be_armed = (spec.be_execution_confirmed is True if spec.be_execution_confirmed is not None\n                else spec.max_r >= spec.be_after_r - EPSILON)\n    be_step: int | None = 0 if be_armed else None\n    spike_pending = spec.spike_r is not None and spec.spike_r > spec.current_r + EPSILON\n\n    def finish(exit_r: float, reason: str, step: int,\n               fraction: float) -> ExecutionResult:\n        events = [*event_timeline, {\n            \"type\": reason, \"r\": float(exit_r), \"step\": int(step),\n            \"segment_fraction\": float(fraction), \"remaining_after\": 0.0,\n        }]\n        return ExecutionResult(\n            outcome_r=float(realized + remaining * exit_r),\n            exit_r=float(exit_r), exit_reason=reason, exit_step=step,\n            exit_fraction=float(fraction), be_armed=be_armed,\n            be_armed_step=be_step, filled_rungs=tuple(filled),\n            remaining_fraction=float(remaining), events=tuple(events),\n        )\n\n    if values.size == 1:\n        return finish(float(values[0]), \"horizon\", 0, 0.0)\n\n    for segment in segments:\n        step = int(segment)\n        previous, current = float(values[step - 1]), float(values[step])\n        if current >= previous:\n            events: list[tuple[float, int, str, float]] = []\n            if spike_pending and previous < spec.spike_r - EPSILON <= current + EPSILON:\n                events.append((_crossing_fraction(previous, current, spec.spike_r),\n                               0, \"spike\", spec.spike_r))\n            for rung in pending:\n                if previous < rung - EPSILON <= current + EPSILON:\n                    # A rung at the BE level is booked before BE is armed.  Both\n                    # occur at the same price, so this only makes cashflow order\n                    # explicit and does not change the barrier price.\n                    events.append((_crossing_fraction(previous, current, rung),\n                                   0, \"rung\", rung))\n            if (not be_armed and\n                    previous < spec.be_after_r - EPSILON <= current + EPSILON):\n                events.append((_crossing_fraction(previous, current, spec.be_after_r),\n                               1, \"be_arm\", spec.be_after_r))\n            if previous < spec.take_r - EPSILON <= current + EPSILON:\n                events.append((_crossing_fraction(previous, current, spec.take_r),\n                               2, \"take\", spec.take_r))\n            for fraction, _priority, kind, level in sorted(events):\n                if kind == \"spike\" and spike_pending:\n                    # Broker quantity is frozen at arming, in units of T0\n                    # remainder. An oversized order is not an executable fill.\n                    fill = spec.spike_fraction if spec.spike_fraction <= remaining + EPSILON else 0.0\n                    realized += fill * level\n                    remaining -= fill\n                    spike_pending = False\n                    event_timeline.append({\"type\": \"spike\", \"r\": float(level),\n                        \"step\": step, \"segment_fraction\": float(fraction),\n                        \"fill_fraction\": float(fill),\n                        \"remaining_after\": float(remaining)})\n                    if remaining <= EPSILON:\n                        return finish(level, \"take\", step, fraction)\n                elif kind == \"rung\" and level in pending and remaining > EPSILON:\n                    fill = min(spec.future_fill_fraction, remaining)\n                    realized += fill * level\n                    remaining -= fill\n                    filled.append(level)\n                    pending.remove(level)\n                    event_timeline.append({\n                        \"type\": \"rung\", \"r\": float(level), \"step\": int(step),\n                        \"segment_fraction\": float(fraction),\n                        \"fill_fraction\": float(fill),\n                        \"remaining_after\": float(remaining),\n                    })\n                    if remaining <= EPSILON:\n                        # A fully exhausted ladder is a favourable terminal\n                        # resolution even when the geometric final TAKE lies above it.\n                        return finish(level, \"take\", step, fraction)\n                elif kind == \"be_arm\":\n                    be_armed = True\n                    be_step = step\n                    event_timeline.append({\n                        \"type\": \"be_arm\", \"r\": float(level), \"step\": int(step),\n                        \"segment_fraction\": float(fraction),\n                        \"remaining_after\": float(remaining),\n                    })\n                elif kind == \"take\":\n                    return finish(spec.take_r, \"take\", step, fraction)\n        else:\n            active_stop = max(0.0, spec.stop_r) if be_armed else spec.stop_r\n            if current <= active_stop + EPSILON < previous:\n                return finish(\n                    active_stop, \"breakeven\" if be_armed else \"stop\", step,\n                    _crossing_fraction(previous, current, active_stop),\n                )\n\n    return finish(float(values[-1]), \"time_stop\" if spec.time_stop_fraction is not None\n                  else \"horizon\", values.size - 1, 1.0)\n\n\ndef execution_contract(spec: ExecutionSpec) -> dict:\n    \"\"\"Serializable assumptions attached to policy snapshots and audits.\"\"\"\n    return {\n        \"simulator_version\": SIMULATOR_VERSION,\n        \"state_space\": \"R_multiple_of_initial_risk\",\n        \"event_ordering\": \"continuous_segment_first_crossing\",\n        \"break_even\": \"absorbing_0R_after_be_after\",\n        \"ladder_fill\": \"level_fill_original_position_fraction\",\n        \"current_remainder_normalization\": spec.future_fill_fraction,\n        \"observed_bar_assumption\": \"piecewise_linear_barrier_fill_no_slippage\",\n        \"execution_costs\": \"applied_by_policy_cost_layer\",\n        \"common_random_numbers\": True,\n    }\n","seiltanzer/extended_policy_evaluation.py":"\"\"\"Counterfactual risk check for a proposed extended management action.\n\nThe LLM supplies a policy name. Prices come from frozen trade geometry; this\nmodule independently replays the *same* stochastic drivers for HOLD and the\nproposed stop/take change. It never creates a broker order.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import replace\nimport math\nfrom typing import Any\n\nimport numpy as np\n\nfrom .ai_policy_base import PolicyInputs, simulate_option_paths\n\n\nSTOP_POLICIES = {\"MOVE_TO_BE\", \"TRAIL_GAMMA_FLIP\", \"TIGHTEN_STOP\"}\nTAKE_POLICIES = {\"EXTEND_TAKE\", \"REDUCE_TAKE\"}\nCONDITIONAL_POLICIES = {\"SCALE_OUT_ON_SPIKE\", \"TIME_STOP\"}\n\n\ndef _conditional_outcomes(inputs, params, policy, captured, seed):\n    \"\"\"Shared option-driver paths; explicit piecewise-linear event assumption.\"\"\"\n    from .ai_policy_base import _centered_skew_noise\n    from .execution_simulator import ExecutionSpec, replay_execution_paths\n    steps, count = 160, 600\n    rng = np.random.default_rng(seed)\n    shape = np.exp(np.clip(inputs.term_slope, -.8, .8) *\n                   ((np.arange(steps) + .5) / steps - .5))\n    variance = inputs.sigma_R ** 2 * shape ** 2 / np.sum(shape ** 2)\n    noise = _centered_skew_noise(rng.standard_normal((count, steps)), inputs.skew_R)\n    paths = np.column_stack((np.full(count, inputs.r0),\n        inputs.r0 + np.cumsum(inputs.drift_R / steps + noise * np.sqrt(variance), axis=1)))\n    base = ExecutionSpec.from_values(current_r=inputs.r0, max_r=inputs.max_r,\n        take_r=inputs.T, rungs=inputs.rungs, rung_fraction_original=inputs.rung_fraction,\n        be_after_r=inputs.be_after, stop_r=inputs.stop_r,\n        be_execution_confirmed=inputs.be_execution_confirmed)\n    if policy == \"TIME_STOP\":\n        fraction = (float(params[\"deadline_ts\"]) - captured) / (60 * inputs.horizon_minutes)\n        variant = replace(base, time_stop_fraction=fraction)\n    else:\n        variant = replace(base, spike_r=float(params[\"target_r\"]),\n                          spike_fraction=float(params[\"close_fraction\"]))\n    return (np.array([result.outcome_r for result in replay_execution_paths(paths, base)]),\n            np.array([result.outcome_r for result in replay_execution_paths(paths, variant)]))\n\n\ndef _number(value: Any) -> float | None:\n    try:\n        value = float(value)\n    except (TypeError, ValueError, OverflowError):\n        return None\n    return value if math.isfinite(value) else None\n\n\ndef _blocked(reason: str, **details: Any) -> dict[str, Any]:\n    return {\"status\": \"blocked\", \"reason\": reason, \"production_authority\": False,\n            \"automatic_execution_allowed\": False, **details}\n\n\ndef _cvar(values: np.ndarray) -> float:\n    n = max(1, math.ceil(values.size * .1))\n    return float(np.mean(np.partition(values, n - 1)[:n]))\n\n\ndef evaluate_extended_action(snapshot: dict, action: dict) -> dict[str, Any]:\n    \"\"\"Require source authority, hard CVaR and material paired-path benefit.\"\"\"\n    manager = snapshot.get(\"policy_manager\") or {}\n    policy = str(action.get(\"policy\") or \"\")\n    if policy not in STOP_POLICIES | TAKE_POLICIES | CONDITIONAL_POLICIES:\n        # A strategy time limit or a distinct, non-duplicating scale-out\n        # trigger is not present in the current policy contract.\n        return _blocked(\"CONDITIONAL_POLICY_HAS_NO_QUANTIFIED_EXECUTION_CONTRACT\")\n    if action.get(\"status\") != \"READY_FOR_MANUAL_CONFIRMATION\":\n        return _blocked(str(action.get(\"reason\") or \"ACTION_PARAMETERS_UNAVAILABLE\"))\n    price = (((manager.get(\"input_audit\") or {}).get(\"rows\") or {})\n             .get(\"instrument_price\") or {})\n    source = str(price.get(\"source\") or \"\")\n    if (price.get(\"available\") is not True\n            or price.get(\"production_authority\") is False\n            or str(price.get(\"status\") or \"\").lower() not in {\"live\", \"ok\"}\n            or source.startswith((\"Bybit \", \"yfinance \"))):\n        return _blocked(\"AUTHORITATIVE_INSTRUMENT_PRICE_UNAVAILABLE\")\n    from .management_contract import decision_reliability\n    quality = decision_reliability(snapshot)\n    if not quality[\"available\"]:\n        return _blocked(\"DATA_RELIABILITY_UNAVAILABLE\")\n    reliability = quality[\"level\"]\n    if reliability in {\"низкая\", \"low\"}:\n        overlay = (manager.get(\"gate\") or {}).get(\"degraded_authority_overlay\") or {}\n        evidence = overlay.get(\"evidence\") or {}\n        independent_support = (len(evidence.get(\"adverse_families\") or []) >= 2\n                and len(evidence.get(\"live_adverse_families\") or []) >= 1\n                and int(evidence.get(\"observed_adverse_item_count\") or 0) >= 2)\n        from .unified_edge_ensemble import _manual_candidate_preflight\n        # Manual model comparison does not require the legacy directional\n        # vote to win first. All geometry/source, hard CVaR and paired-benefit\n        # checks below still apply; missing inputs and automatic execution do not.\n        if not independent_support and not _manual_candidate_preflight(snapshot):\n            return _blocked(\"LOW_DATA_RELIABILITY_FOR_EXTENDED_OVERRIDE\")\n    rule = manager.get(\"selection_rule\") or {}\n    if \"HOLD\" not in (rule.get(\"eligible\") or []):\n        return _blocked(\"HOLD_OUTSIDE_HARD_CVAR_FEASIBLE_SET\")\n    floor = _number((manager.get(\"risk_constraint\") or {}).get(\"gross_cvar_floor_r\"))\n    if floor is None:\n        return _blocked(\"HARD_CVAR_FLOOR_UNAVAILABLE\")\n    data = manager.get(\"inputs\") or {}\n    if not data.get(\"option_available\"):\n        return _blocked(\"OPTION_PATH_DISTRIBUTION_UNAVAILABLE\")\n    try:\n        inputs = PolicyInputs(**{**data, \"rungs\": tuple(data[\"rungs\"])})\n    except (TypeError, ValueError, KeyError):\n        return _blocked(\"POLICY_INPUTS_INCOMPLETE\")\n    geometry = snapshot.get(\"trade_geometry\") or {}\n    entry = _number(geometry.get(\"entry\"))\n    stop = _number(geometry.get(\"original_stop\"))\n    current = _number(geometry.get(\"current\"))\n    if None in (entry, stop, current) or entry == stop:\n        return _blocked(\"TRADE_GEOMETRY_UNAVAILABLE\")\n    sign = 1.0 if stop < entry else -1.0\n    risk = abs(entry - stop)\n    params = action.get(\"parameters\") or {}\n    if (policy == \"TRAIL_GAMMA_FLIP\" or params.get(\"anchor\") == \"ZERO_GAMMA\") and (\n        data.get(\"chain_status\") not in {\"live\", \"ok\"}\n        or _number(data.get(\"chain_age_sec\")) is None\n        or float(data[\"chain_age_sec\"]) > 120\n    ):\n        return _blocked(\"GEX_CONTEXT_NOT_A_VERIFIED_EXECUTION_ANCHOR\")\n    if policy == \"EXTEND_TAKE\" and (data.get(\"chain_status\") not in {\"live\", \"ok\"}\n        or _number(data.get(\"chain_age_sec\")) is None or float(data[\"chain_age_sec\"]) > 120):\n        return _blocked(\"OPTION_WALL_NOT_A_VERIFIED_EXECUTION_ANCHOR\")\n    target = _number(params.get(\"stop_price\" if policy in STOP_POLICIES else \"take_price\"))\n    captured = _number(snapshot.get(\"captured_ts\"))\n    if policy in CONDITIONAL_POLICIES:\n        if policy == \"TIME_STOP\":\n            deadline = _number(params.get(\"deadline_ts\"))\n            if captured is None or deadline is None or not captured < deadline <= captured + inputs.horizon_minutes * 60:\n                return _blocked(\"INVALID_TIME_STOP_DEADLINE\")\n        else:\n            trigger = _number(params.get(\"trigger_price\"))\n            fraction = _number(params.get(\"close_fraction\"))\n            if trigger is None or fraction is None or not 0 < fraction < 1:\n                return _blocked(\"INVALID_SPIKE_PARAMETERS\")\n            target_r = sign * (trigger - entry) / risk\n            if not inputs.r0 < target_r < inputs.T:\n                return _blocked(\"SPIKE_TRIGGER_ALREADY_CROSSED_OR_OUTSIDE_TAKE\")\n            if any(abs(target_r - rung) < .05 for rung in inputs.rungs):\n                return _blocked(\"SPIKE_DUPLICATES_STRATEGY_RUNG\")\n            params = {**params, \"target_r\": target_r}\n        target_r = None if policy == \"TIME_STOP\" else target_r\n        alternate = inputs\n    elif target is None:\n        return _blocked(\"EXACT_TARGET_PRICE_UNAVAILABLE\")\n    else:\n        target_r = sign * (target - entry) / risk\n    if policy in STOP_POLICIES:\n        if not inputs.stop_r + 1e-8 < target_r < inputs.r0 - 1e-8:\n            return _blocked(\"STOP_MUST_TIGHTEN_BELOW_CURRENT_PRICE\")\n        alternate = replace(inputs, stop_r=target_r)\n    elif policy in TAKE_POLICIES:\n        if target_r <= inputs.r0 + 1e-8:\n            return _blocked(\"TAKE_ALREADY_PASSED\")\n        if policy == \"EXTEND_TAKE\" and target_r <= inputs.T + 1e-8:\n            return _blocked(\"TAKE_NOT_EXTENDED\")\n        if policy == \"REDUCE_TAKE\" and target_r >= inputs.T - 1e-8:\n            return _blocked(\"TAKE_NOT_REDUCED\")\n        alternate = replace(inputs, T=target_r)\n\n    costs = (manager.get(\"execution_cost_model\") or rule.get(\"execution_cost_model\") or {})\n    deferred_cost = _number(costs.get(\"deferred_full_close_r\"))\n    if deferred_cost is None or deferred_cost < 0:\n        return _blocked(\"EXECUTION_COST_MODEL_UNAVAILABLE\")\n    net_floor = floor - deferred_cost\n    deltas: list[float] = []\n    cvars: list[float] = []\n    means: list[float] = []\n    base_means: list[float] = []\n    base_cvars: list[float] = []\n    seed_lower_bounds: list[float] = []\n    for seed in (0xA17E, 0xB17E):\n        if policy in CONDITIONAL_POLICIES:\n            base_out, variant_out = _conditional_outcomes(inputs, params, policy, captured, seed)\n            base_means.append(float(np.mean(base_out)))\n            base_cvars.append(_cvar(base_out))\n            seed_delta = variant_out - base_out\n            seed_lower_bounds.append(float(np.mean(seed_delta) - 1.96 *\n                np.std(seed_delta, ddof=1) / math.sqrt(seed_delta.size)))\n            deltas.extend(seed_delta.tolist())\n            means.append(float(np.mean(variant_out)))\n            cvars.append(_cvar(variant_out))\n            continue\n        base = simulate_option_paths(inputs, n_paths=1200, n_steps=160, seed=seed,\n                                     paired_stable_stream=True)\n        variant = simulate_option_paths(alternate, n_paths=1200, n_steps=160, seed=seed,\n                                        paired_stable_stream=True)\n        if base.strategy_outcome is None or variant.strategy_outcome is None:\n            return _blocked(\"EXECUTION_OUTCOMES_UNAVAILABLE\")\n        base_out = np.asarray(base.strategy_outcome, dtype=float)\n        variant_out = np.asarray(variant.strategy_outcome, dtype=float)\n        if not np.isfinite(base_out).all() or not np.isfinite(variant_out).all():\n            return _blocked(\"NONFINITE_EXECUTION_OUTCOMES\")\n        base_means.append(float(np.mean(base_out)))\n        base_cvars.append(_cvar(base_out))\n        seed_delta = variant_out - base_out\n        seed_lower_bounds.append(float(np.mean(seed_delta) - 1.96 *\n            np.std(seed_delta, ddof=1) / math.sqrt(seed_delta.size)))\n        deltas.extend(seed_delta.tolist())\n        means.append(float(np.mean(variant_out)))\n        cvars.append(_cvar(variant_out))\n    paired = np.asarray(deltas)\n    gain = float(np.mean(paired))\n    standard_error = float(np.std(paired, ddof=1) / math.sqrt(paired.size))\n    lower = min(gain - 1.96 * standard_error, *seed_lower_bounds)\n    # Constant unit-volume future close cost is applied equally to both replays.\n    # It cancels in the paired delta; assumed costs remain explicitly labelled.\n    variant_cvar = min(cvars)\n    matched_tail_gain = min(v - h for v, h in zip(cvars, base_cvars))\n    band = _number(rule.get(\"indifference_band_r\"))\n    material = max(0.0, band if band is not None else .03)\n    evidence = {\n        \"target_r\": round(target_r, 5) if target_r is not None else None, \"paths\": len(deltas),\n        \"expected_delta_vs_hold_r\": round(gain, 5),\n        \"paired_delta_ci95_lower_r\": round(lower, 5),\n        \"expected_variant_gross_r\": round(float(np.mean(means)), 5),\n        \"expected_variant_net_r\": round(float(np.mean(means)) - deferred_cost, 5),\n        \"expected_hold_net_r\": round(float(np.mean(base_means)) - deferred_cost, 5),\n        \"worst_seed_hold_cvar10_net_r\": round(min(base_cvars) - deferred_cost, 5),\n        \"seed_delta_ci95_lower_r\": [round(x, 5) for x in seed_lower_bounds],\n        \"matched_seed_tail_gain_lower_r\": round(matched_tail_gain, 5),\n        \"worst_seed_cvar10_net_r\": round(variant_cvar - deferred_cost, 5),\n        \"hard_net_floor_r\": net_floor,\n        \"execution_cost_r\": deferred_cost,\n        \"cost_source\": costs.get(\"source\") or \"UNAVAILABLE\",\n        \"cost_assumed\": costs.get(\"assumed\") is not False,\n        \"data_reliability\": reliability,\n        \"worst_seed_cvar10_gross_r\": round(variant_cvar, 5),\n        \"hard_gross_floor_r\": floor, \"materiality_band_r\": material,\n        \"broker_execution_cost_measured\": costs.get(\"assumed\") is False,\n        \"method\": (\"two_seed_piecewise_linear_paired_option_paths\" if policy in CONDITIONAL_POLICIES\n                   else \"two_seed_stable_path_id_paired_counterfactual_execution_paths\"),\n        \"statistically_validated_advantage\": False,\n        \"authority_mode\": \"degraded_manual\" if reliability in {\"низкая\", \"low\"} else \"manual\",\n    }\n    if variant_cvar - deferred_cost < net_floor - 1e-8:\n        return _blocked(\"VARIANT_CVAR_BELOW_HARD_FLOOR\", **evidence)\n    from .management_benefit import benefit_assessment\n    benefit = benefit_assessment(policy, gain, matched_tail_gain, material,\n                                 expected_lower_r=lower, tail_lower_r=matched_tail_gain)\n    evidence['benefit_assessment'] = benefit\n    if not benefit['allowed']:\n        return _blocked(\"NO_MATERIAL_ROBUST_EXPECTED_GAIN\", **evidence)\n    return {\"status\": \"eligible\", \"reason\": (\"BOUNDED_TAIL_PROTECTION_AND_CVAR_PASS\"\n            if benefit['basis'] == 'BOUNDED_TAIL_PROTECTION' else \"ROBUST_EXPECTED_GAIN_AND_CVAR_PASS\"),\n            \"production_authority\": True, \"manual_confirmation_required\": True,\n            \"automatic_execution_allowed\": False, **evidence}\n","seiltanzer/unified_candidate_economics.py":"\"\"\"Price every management candidate on one frozen, weighted scenario bank.\n\nThe old authoritative simulator retains absorbed outcomes rather than complete\nmarket paths. Its bank cannot be reconstructed from a policy snapshot. Unless\nan explicit full-path bank is supplied, this module therefore creates one\nbounded *comparison* bank from the same option-driver parameters. It labels the\npiecewise-linear execution assumption and never changes original admission or\nclaims to reproduce the authoritative simulator's Brownian-bridge events.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import replace\nimport hashlib\nimport math\n\nimport numpy as np\n\nfrom .ai_policy_base import PolicyInputs, _centered_skew_noise\nfrom .execution_simulator import ExecutionSpec, replay_execution_paths\nfrom .rollover_economics import frozen_rollover_schedule, replay_rollover_cost\n\n\nVERSION = \"unified-candidate-economics-v1\"\nBASE_FRACTIONS = {\"HOLD\": 0., \"CLOSE_10\": .1, \"CLOSE_25\": .25,\n                  \"CLOSE_50\": .5, \"EXIT\": 1.}\nSTOP_POLICIES = {\"MOVE_TO_BE\", \"TIGHTEN_STOP\", \"TRAIL_GAMMA_FLIP\"}\nTAKE_POLICIES = {\"REDUCE_TAKE\", \"EXTEND_TAKE\"}\nSEEDS = (0xA17E, 0xB17E)\nPATHS_PER_SEED = 600\nSTEPS = 160\n\n\ndef _number(value):\n    if isinstance(value, bool):\n        return None\n    try:\n        out = float(value)\n    except (TypeError, ValueError, OverflowError):\n        return None\n    return out if math.isfinite(out) else None\n\n\ndef _unavailable(reason):\n    return {\"version\": VERSION, \"available\": False, \"reason\": reason,\n            \"candidates\": {}, \"shared_scenario_bank\": False,\n            \"authoritative_bank_reused\": False,\n            \"changes_original_admission\": False}\n\n\ndef _option_driver_bank(inputs):\n    \"\"\"Draw once by stable path ID; policies never influence random draws.\"\"\"\n    mid = (np.arange(STEPS, dtype=float) + .5) / STEPS\n    shape = np.exp(np.clip(inputs.term_slope, -.8, .8) * (mid - .5))\n    variance = inputs.sigma_R ** 2 * shape ** 2 / np.sum(shape ** 2)\n    batches = []\n    for seed in SEEDS:\n        rng = np.random.default_rng(seed)\n        # Draw in time-major order, matching the indexed stable option stream.\n        noise = _centered_skew_noise(\n            rng.standard_normal((STEPS, PATHS_PER_SEED)).T, inputs.skew_R)\n        increments = inputs.drift_R / STEPS + noise * np.sqrt(variance)\n        paths = np.column_stack((np.full(PATHS_PER_SEED, inputs.r0),\n                                  inputs.r0 + np.cumsum(increments, axis=1)))\n        batches.append(paths)\n    return (np.concatenate(batches), np.full(PATHS_PER_SEED * len(SEEDS),\n                                            1. / (PATHS_PER_SEED * len(SEEDS))),\n            np.repeat(np.asarray(SEEDS), PATHS_PER_SEED))\n\n\ndef _bank(snapshot, inputs):\n    manager = snapshot.get(\"policy_manager\") or {}\n    supplied = manager.get(\"unified_scenario_bank\", snapshot.get(\"unified_scenario_bank\"))\n    if supplied is None:\n        # A weighted/empirical distribution is not recoverable from scalar\n        # sigma/skew/drift. Never replace a declared such bank with new noise.\n        declaration = str(manager.get(\"scenario_distribution_kind\") or \"\").lower()\n        if declaration in {\"empirical\", \"weighted_empirical\", \"historical\", \"weighted_paths\"}:\n            raise ValueError(\"DECLARED_PATH_DISTRIBUTION_REQUIRES_FULL_FROZEN_BANK\")\n        paths, weights, groups = _option_driver_bank(inputs)\n        metadata = {\"source\": \"frozen_option_driver_comparison\",\n                    \"distribution_kind\": \"option_parameter_diffusion\",\n                    \"exact_authoritative_bank\": False,\n                    \"bridge_events_reproduced\": False,\n                    \"measure\": \"option_driver_model_not_empirical_return_probability\",\n                    \"seeds\": list(SEEDS)}\n    else:\n        if not isinstance(supplied, dict):\n            raise ValueError(\"INVALID_FROZEN_SCENARIO_BANK\")\n        horizon = _number(supplied.get(\"horizon_minutes\"))\n        if horizon is None or abs(horizon - inputs.horizon_minutes) > 1e-8:\n            raise ValueError(\"FROZEN_BANK_HORIZON_MISMATCH\")\n        if supplied.get(\"state_space\") != \"R_multiple_of_initial_risk\":\n            raise ValueError(\"FROZEN_BANK_STATE_SPACE_UNAVAILABLE\")\n        captured, bank_captured = (_number(snapshot.get(\"captured_ts\")),\n                                   _number(supplied.get(\"captured_ts\")))\n        if captured is not None and bank_captured is None:\n            raise ValueError(\"FROZEN_BANK_SNAPSHOT_TIMESTAMP_UNAVAILABLE\")\n        if bank_captured is not None and (captured is None or abs(captured - bank_captured) > 1e-6):\n            raise ValueError(\"FROZEN_BANK_SNAPSHOT_TIMESTAMP_MISMATCH\")\n        try:\n            paths = np.array(supplied.get(\"r_paths\"), dtype=float, copy=True)\n            weights = np.asarray(supplied.get(\"weights\"), dtype=float)\n            groups = np.asarray(supplied.get(\"seed_ids\", [0] * len(paths)))\n        except (TypeError, ValueError, OverflowError):\n            raise ValueError(\"INVALID_FROZEN_SCENARIO_BANK\") from None\n        metadata = {\"source\": supplied.get(\"source\") or \"explicit_frozen_path_bank\",\n                    \"distribution_kind\": supplied.get(\"distribution_kind\") or \"supplied_weighted_paths\",\n                    \"exact_authoritative_bank\": supplied.get(\"exact_authoritative_bank\") is True,\n                    \"bridge_events_reproduced\": False,\n                    \"measure\": supplied.get(\"measure\") or \"supplied_measure_not_reinterpreted\",\n                    \"seeds\": np.unique(groups).tolist()}\n    if (paths.ndim != 2 or not 1 <= paths.shape[0] <= 10000\n            or not 2 <= paths.shape[1] <= 2001 or not np.isfinite(paths).all()):\n        raise ValueError(\"INVALID_FROZEN_SCENARIO_PATHS\")\n    if (weights.ndim != 1 or len(weights) != len(paths)\n            or not np.isfinite(weights).all() or np.any(weights < 0)\n            or not float(weights.sum()) > 0):\n        raise ValueError(\"INVALID_FROZEN_SCENARIO_WEIGHTS\")\n    if groups.ndim != 1 or len(groups) != len(paths):\n        raise ValueError(\"INVALID_FROZEN_SCENARIO_GROUPS\")\n    if not np.allclose(paths[:, 0], inputs.r0, rtol=0, atol=1e-7):\n        raise ValueError(\"FROZEN_BANK_START_R_MISMATCH\")\n    weights = weights / weights.sum()\n    paths.setflags(write=False)\n    weights.setflags(write=False)\n    fingerprint = hashlib.sha256()\n    fingerprint.update(paths.tobytes())\n    fingerprint.update(weights.tobytes())\n    metadata.update({\"bank_id\": fingerprint.hexdigest()[:24],\n                     \"path_count\": len(paths), \"step_count\": paths.shape[1] - 1,\n                     \"horizon_minutes\": inputs.horizon_minutes,\n                     \"captured_ts\": _number(snapshot.get(\"captured_ts\")),\n                     \"weights_preserved\": True,\n                     \"effective_path_count\": float(1. / np.sum(weights ** 2)),\n                     \"execution_assumption\": \"piecewise_linear_barrier_fill_no_slippage\",\n                     \"changes_original_admission\": False})\n    return paths, weights, groups, metadata\n\n\ndef _weighted_cvar(values, weights, alpha=.10):\n    \"\"\"Mean of the worst alpha probability mass, including partial boundary.\"\"\"\n    order = np.argsort(values, kind=\"stable\")\n    w = weights[order]\n    mass = np.minimum(w, np.maximum(alpha - (np.cumsum(w) - w), 0.))\n    return float(np.sum(values[order] * mass) / alpha)\n\n\ndef _variant(base, row, snapshot, inputs):\n    policy, params = row.get(\"policy\"), row.get(\"parameters\") or {}\n    if policy in BASE_FRACTIONS:\n        return base\n    if policy == \"TIME_STOP\":\n        captured, deadline = _number(snapshot.get(\"captured_ts\")), _number(params.get(\"deadline_ts\"))\n        if captured is None or deadline is None:\n            raise ValueError(\"TIME_STOP_DEADLINE_UNAVAILABLE\")\n        fraction = (deadline - captured) / (60. * inputs.horizon_minutes)\n        if not 0 < fraction <= 1:\n            raise ValueError(\"INVALID_TIME_STOP_DEADLINE\")\n        return replace(base, time_stop_fraction=fraction)\n    geometry = snapshot.get(\"trade_geometry\") or {}\n    entry, original_stop = _number(geometry.get(\"entry\")), _number(geometry.get(\"original_stop\"))\n    if entry is None or original_stop is None or entry == original_stop:\n        raise ValueError(\"TRADE_GEOMETRY_UNAVAILABLE\")\n    sign = 1. if original_stop < entry else -1.\n    risk = abs(entry - original_stop)\n    if policy in STOP_POLICIES:\n        target = _number(params.get(\"stop_price\"))\n        if target is None:\n            raise ValueError(\"EXACT_STOP_PRICE_UNAVAILABLE\")\n        target_r = sign * (target - entry) / risk\n        if not inputs.stop_r + 1e-8 < target_r < inputs.r0 - 1e-8:\n            raise ValueError(\"STOP_MUST_TIGHTEN_BELOW_CURRENT_PRICE\")\n        return replace(base, stop_r=target_r)\n    if policy in TAKE_POLICIES:\n        target = _number(params.get(\"take_price\"))\n        if target is None:\n            raise ValueError(\"EXACT_TAKE_PRICE_UNAVAILABLE\")\n        target_r = sign * (target - entry) / risk\n        if target_r <= inputs.r0 + 1e-8:\n            raise ValueError(\"TAKE_ALREADY_CROSSED\")\n        if policy == \"EXTEND_TAKE\" and ta