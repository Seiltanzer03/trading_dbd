name: cleanup-ai-policy-payload

on:
  push:
    branches:
      - agent/ai-quant-policy-manager

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-quant-policy-manager
      - name: Remove one-shot staging files
        run: |
          rm -rf .github/agent_payload
          rm -f .github/agent_apply_ai.py
          rm -f .github/workflows/agent_apply_ai.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-shot AI payload staging"
          git push origin HEAD:agent/ai-quant-policy-manager
