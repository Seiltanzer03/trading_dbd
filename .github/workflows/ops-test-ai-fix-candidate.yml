name: ops-test-ai-fix-candidate

on:
  push:
    branches:
      - ops/diagnose-ai-provider-live-20260821
    paths:
      - .github/workflows/ops-test-ai-fix-candidate.yml

permissions:
  contents: read
  statuses: write

jobs:
  candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - name: Candidate projection on latest production snapshot
        id: projection
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = 3edd97c48fc9f1b63c80f2dcf4349d9b1ad9d636
            curl -fsSL --max-time 20 \
              https://raw.githubusercontent.com/Seiltanzer03/trading_dbd/f9017e51e9754c6b1233a70293e93d7b37ed6b65/seiltanzer/ai_provider_guard.py \
              -o /tmp/ai_provider_guard_candidate.py
            /opt/seiltanzer/.venv/bin/python - <<'PY'
            import importlib.util, json, sqlite3
            from pathlib import Path
            spec=importlib.util.spec_from_file_location('candidate_guard','/tmp/ai_provider_guard_candidate.py')
            mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
            snapshot=None
            for path in sorted(Path('/opt/seiltanzer/data').rglob('*.sqlite3')):
                try:
                    con=sqlite3.connect(f'file:{path}?mode=ro',uri=True,timeout=0.2)
                    if con.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='ai_verdicts'").fetchone():
                        row=con.execute('SELECT snapshot_json FROM ai_verdicts ORDER BY ts DESC LIMIT 1').fetchone()
                        if row and row[0]: snapshot=json.loads(row[0]); con.close(); break
                    con.close()
                except Exception:
                    continue
            assert isinstance(snapshot,dict), 'snapshot not found'
            projected=mod.compact_provider_snapshot(snapshot)
            size=mod._json_bytes(projected)
            print(f'CANDIDATE_PROJECTION bytes={size} tier={projected.get("provider_projection",{}).get("compaction_tier")}')
            assert size <= mod.PROVIDER_SNAPSHOT_LIMIT_BYTES
            assert projected.get('policy_manager',{}).get('recommendation')
            PY

      - name: Candidate projected snapshot through real provider and validation
        id: provider
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            set -euo pipefail
            PID=$(systemctl show -p MainPID --value seiltanzer)
            /opt/seiltanzer/.venv/bin/python - "$PID" <<'PY'
            import importlib.util, json, os, sqlite3, sys, time
            from pathlib import Path
            spec=importlib.util.spec_from_file_location('candidate_guard','/tmp/ai_provider_guard_candidate.py')
            mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
            raw=open(f'/proc/{sys.argv[1]}/environ','rb').read().split(b'\0')
            service_env={k.decode():v.decode() for k,v in (item.split(b'=',1) for item in raw if b'=' in item)}
            for key in ('OPENROUTER_API_KEY','OPENROUTER_MODEL','OPENROUTER_PROXY'):
                if service_env.get(key): os.environ[key]=service_env[key]
            snapshot=None
            for path in sorted(Path('/opt/seiltanzer/data').rglob('*.sqlite3')):
                try:
                    con=sqlite3.connect(f'file:{path}?mode=ro',uri=True,timeout=0.2)
                    if con.execute("SELECT 1 FROM sqlite_master WHERE type='table' AND name='ai_verdicts'").fetchone():
                        row=con.execute('SELECT snapshot_json FROM ai_verdicts ORDER BY ts DESC LIMIT 1').fetchone()
                        if row and row[0]: snapshot=json.loads(row[0]); con.close(); break
                    con.close()
                except Exception:
                    continue
            assert isinstance(snapshot,dict), 'snapshot not found'
            projected=mod.compact_provider_snapshot(snapshot)
            from seiltanzer import ai_verdict
            started=time.monotonic(); result=ai_verdict.request_verdict(projected); elapsed=(time.monotonic()-started)*1000
            model=str(result.get('model') or '')
            print(f'CANDIDATE_UNGUARDED model={model} elapsed_ms={elapsed:.1f}')
            assert model and model != 'deterministic-policy-fallback', 'provider response normalized to fallback'
            PY

      - name: Publish candidate diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECTION: ${{ steps.projection.outcome }}
          PROVIDER: ${{ steps.provider.outcome }}
        run: |
          set -euo pipefail
          publish() {
            outcome="$1" context="$2" ok="$3" bad="$4"
            if [ "$outcome" = success ]; then state=success; desc="$ok"; else state=failure; desc="$bad"; fi
            payload=$(python3 - "$state" "$context" "$desc" <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':sys.argv[2],'description':sys.argv[3]}))
          PY
            )
            curl -fsS -X POST -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" -d "$payload" >/dev/null
          }
          publish "$PROJECTION" diagnostic/candidate-projection "Candidate projects live snapshot under 18 KB" "Candidate projection still fails live snapshot"
          publish "$PROVIDER" diagnostic/candidate-provider "Candidate projection yields validated LLM report" "Candidate reaches provider but still falls back"
