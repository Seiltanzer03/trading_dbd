name: prod-evidence-audit

on:
  push:
    branches: [agent/evidence-audit-20260812]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen P3B branch
        uses: actions/checkout@v4
        with:
          ref: agent/g1s-path-geometry-wf-20260813
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run real Yahoo 60d P3B volatility hardening audit
        run: |
          python - <<'PY'
          import json, resource, subprocess, tempfile, time
          from seiltanzer.config import Settings
          from seiltanzer.engine import Engine
          from seiltanzer.g1_short_horizon_p3_volatility_hardening import (
              P3B_CONTRACT_VERSION, run_p3b_volatility_hardening,
          )

          expected_sha='fc627238f1000e0c10ca7eda860f5cfd6c408fbd'
          branch_sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          print('P3B_BRANCH_SHA',branch_sha)
          assert branch_sha==expected_sha,(branch_sha,expected_sha)
          with tempfile.TemporaryDirectory() as td:
              engine=Engine(Settings(demo=True,data_dir=td))
              try:
                  rt=engine.short_horizon
                  p1_started=time.time()
                  p1=rt.materialize_historical_walkforward(force=True)
                  print('P1B',json.dumps({
                      'duration_sec':round(time.time()-p1_started,2),
                      'source_count':p1.get('source_count'),'run_count':p1.get('run_count'),
                      'provisional_count':p1.get('provisional_count'),
                      'source_set':p1.get('source_set_sha256')},sort_keys=True))
                  assert p1.get('source_count')==10 and p1.get('run_count')==10

                  started=time.time()
                  result=run_p3b_volatility_hardening(rt)
                  elapsed=time.time()-started
                  compact=[]
                  for row in result.get('results') or []:
                      compact.append({
                          'horizon_minutes':row.get('horizon_minutes'),
                          'historical_winner':row.get('historical_winner'),
                          'raw_n':row.get('raw_n'),'effective_n':row.get('effective_n'),
                          'mae_relative_improvement':row.get('mae_relative_improvement'),
                          'rmse_relative_improvement':row.get('rmse_relative_improvement'),
                          'fold_joint_non_degrade_n':row.get('fold_joint_non_degrade_n'),
                          'best_mae_baseline':row.get('best_mae_baseline'),
                          'best_rmse_baseline':row.get('best_rmse_baseline'),
                          'instrument_positive_both_n':row.get('instrument_positive_both_n'),
                          'instrument_count':row.get('instrument_count'),
                          'instrument_heterogeneity':row.get('instrument_heterogeneity'),
                      })
                  print('P3B_RESULT',json.dumps({
                      'branch_sha':branch_sha,
                      'contract':result.get('contract_version'),
                      'parent_contract':result.get('parent_contract_version'),
                      'source_set':result.get('source_set_sha256'),
                      'run_count':result.get('run_count'),
                      'winner_count':result.get('winner_count'),
                      'duration_sec':round(elapsed,2),
                      'max_rss_mb':round(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss/1024,1),
                      'strong_baselines':result.get('strong_baselines'),
                      'har_contract':result.get('har_contract'),
                      'ewma_contract':result.get('ewma_contract'),
                      'instrument_heterogeneity_is_descriptive_only':result.get('instrument_heterogeneity_is_descriptive_only'),
                      'posthoc_instrument_selection_allowed':result.get('posthoc_instrument_selection_allowed'),
                      'outer_test_used_for_model_selection':result.get('outer_test_used_for_model_selection'),
                      'historical_options_used':result.get('historical_options_used'),
                      'live_parity_ready':result.get('live_parity_ready'),
                      'auto_promotion':result.get('auto_promotion'),
                      'production_authority':result.get('production_authority'),
                      'results':compact,
                  },sort_keys=True))
                  assert result.get('contract_version')==P3B_CONTRACT_VERSION,result
                  assert result.get('run_count')==5,result
                  assert 'har_5m_log_vol_ridge' in (result.get('strong_baselines') or []),result
                  assert 'ewma240_persistence' in (result.get('strong_baselines') or []),result
                  assert result.get('instrument_heterogeneity_is_descriptive_only') is True,result
                  assert result.get('posthoc_instrument_selection_allowed') is False,result
                  assert result.get('outer_test_used_for_model_selection') is False,result
                  assert result.get('historical_options_used') is False,result
                  assert result.get('live_parity_ready') is False,result
                  assert result.get('auto_promotion') is False,result
                  assert result.get('production_authority') is False,result
              finally:
                  engine.close()
          PY
