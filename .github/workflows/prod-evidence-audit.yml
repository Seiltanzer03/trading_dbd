name: prod-evidence-audit

on:
  push:
    branches: [agent/evidence-audit-20260812]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact P2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/g1s-regime-challengers-20260813
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run P1B then exact-fast nested P2 on real Yahoo 5m data
        run: |
          python - <<'PY'
          import json, resource, subprocess, tempfile, time
          from seiltanzer.config import Settings
          from seiltanzer.engine import Engine
          from seiltanzer.g1_short_horizon_p2_regime_research import p2_status
          from seiltanzer.g1_short_horizon_p2_fast_gbt import (
              FAST_CROSS_VERSION, FAST_GBT_VERSION, run_p2_nested_research_fast,
          )

          branch_sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          print('P2_BRANCH_SHA',branch_sha)
          with tempfile.TemporaryDirectory() as td:
              engine=Engine(Settings(demo=True,data_dir=td))
              try:
                  rt=engine.short_horizon
                  p1_started=time.time()
                  p1=rt.materialize_historical_walkforward(force=True)
                  print('P1B',json.dumps({
                      'duration_sec':round(time.time()-p1_started,2),
                      'source_count':p1.get('source_count'),'run_count':p1.get('run_count'),
                      'provisional_count':p1.get('provisional_count'),
                      'source_set':p1.get('source_set_sha256')},sort_keys=True))
                  assert p1.get('source_count')==10 and p1.get('run_count')==10

                  started=time.time()
                  result=run_p2_nested_research_fast(rt,force=True)
                  elapsed=time.time()-started
                  status=p2_status(rt)
                  compact=[]
                  for row in result.get('results') or []:
                      compact.append({k:row.get(k) for k in (
                          'target','horizon_minutes','historical_winner','verdict',
                          'raw_n','effective_n','first_relative_improvement',
                          'second_relative_improvement','fold_joint_non_degrade_n',
                          'selection_counts')})
                  print('P2_RESULT',json.dumps({
                      'branch_sha':branch_sha,
                      'contract':result.get('contract_version'),
                      'gbt_compute_contract':result.get('gbt_compute_contract'),
                      'cross_compute_contract':result.get('cross_compute_contract'),
                      'source_set':result.get('source_set_sha256'),
                      'run_count':result.get('run_count'),
                      'winner_count':result.get('winner_count'),
                      'duration_sec':round(elapsed,2),
                      'max_rss_mb':round(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss/1024,1),
                      'results':compact,
                  },sort_keys=True))
                  print('P2_STATUS',json.dumps({
                      'state':status.get('state'),'run_count':status.get('run_count'),
                      'winner_count':status.get('winner_count'),
                      'outer_test_used_for_selection':status.get('outer_test_used_for_selection'),
                      'historical_options_used':status.get('historical_options_used'),
                      'live_parity_ready':status.get('live_parity_ready'),
                      'auto_promotion':status.get('auto_promotion'),
                      'production_authority':status.get('production_authority'),
                  },sort_keys=True))
                  assert result.get('gbt_compute_contract')==FAST_GBT_VERSION,result
                  assert result.get('cross_compute_contract')==FAST_CROSS_VERSION,result
                  assert status.get('state')=='COMPLETE',status
                  assert result.get('run_count')==10,result
                  assert status.get('outer_test_used_for_selection') is False,status
                  assert status.get('historical_options_used') is False,status
                  assert status.get('live_parity_ready') is False,status
                  assert status.get('auto_promotion') is False,status
                  assert status.get('production_authority') is False,status
              finally:
                  engine.close()
          PY
