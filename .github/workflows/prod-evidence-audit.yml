name: prod-evidence-audit

on:
  push:
    branches: [agent/evidence-audit-20260812]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen P2D branch
        uses: actions/checkout@v4
        with:
          ref: agent/g1s-regime-challengers-20260813
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run real Yahoo 60d persistence-offset nested audit
        run: |
          python - <<'PY'
          import json, resource, subprocess, tempfile, time
          from seiltanzer.config import Settings
          from seiltanzer.engine import Engine
          from seiltanzer.g1_short_horizon_p2_persistence_offset import OFFSET_CONTRACT_VERSION
          from seiltanzer.g1_short_horizon_p2_offset_interactions import (
              INTERACTION_CONTRACT_VERSION, run_offset_experiment_interactions,
          )

          expected_sha='037879ee532ab8165f01f4f2470c4bd478ef71d1'
          branch_sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          print('P2D_BRANCH_SHA',branch_sha)
          assert branch_sha==expected_sha,(branch_sha,expected_sha)
          with tempfile.TemporaryDirectory() as td:
              engine=Engine(Settings(demo=True,data_dir=td))
              try:
                  rt=engine.short_horizon
                  p1_started=time.time()
                  p1=rt.materialize_historical_walkforward(force=True)
                  print('P1B',json.dumps({
                      'duration_sec':round(time.time()-p1_started,2),
                      'source_count':p1.get('source_count'),'run_count':p1.get('run_count'),
                      'provisional_count':p1.get('provisional_count'),
                      'source_set':p1.get('source_set_sha256')},sort_keys=True))
                  assert p1.get('source_count')==10 and p1.get('run_count')==10

                  started=time.time()
                  result=run_offset_experiment_interactions(rt)
                  elapsed=time.time()-started
                  print('P2D_RESULT',json.dumps({
                      'branch_sha':branch_sha,
                      'contract':result.get('contract_version'),
                      'interaction_contract':result.get('interaction_contract_version'),
                      'source_set':result.get('source_set_sha256'),
                      'run_count':result.get('run_count'),
                      'winner_count':result.get('winner_count'),
                      'duration_sec':round(elapsed,2),
                      'max_rss_mb':round(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss/1024,1),
                      'results':result.get('results'),
                      'outer_test_used_for_selection':result.get('outer_test_used_for_selection'),
                      'baseline_is_exact_model_offset':result.get('baseline_is_exact_model_offset'),
                      'beta_zero_recovers_ret5_persistence':result.get('beta_zero_recovers_ret5_persistence'),
                      'sign_context_interactions':result.get('sign_context_interactions'),
                      'historical_options_used':result.get('historical_options_used'),
                      'live_parity_ready':result.get('live_parity_ready'),
                      'auto_promotion':result.get('auto_promotion'),
                      'production_authority':result.get('production_authority'),
                  },sort_keys=True))
                  assert result.get('contract_version')==OFFSET_CONTRACT_VERSION,result
                  assert result.get('interaction_contract_version')==INTERACTION_CONTRACT_VERSION,result
                  assert result.get('run_count')==5,result
                  assert result.get('outer_test_used_for_selection') is False,result
                  assert result.get('baseline_is_exact_model_offset') is True,result
                  assert result.get('beta_zero_recovers_ret5_persistence') is True,result
                  assert result.get('sign_context_interactions') is True,result
                  assert result.get('historical_options_used') is False,result
                  assert result.get('live_parity_ready') is False,result
                  assert result.get('auto_promotion') is False,result
                  assert result.get('production_authority') is False,result
              finally:
                  engine.close()
          PY
