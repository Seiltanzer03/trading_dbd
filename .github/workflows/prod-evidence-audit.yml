name: prod-evidence-audit

on:
  push:
    branches: [agent/evidence-audit-20260812]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Audit historical market-data depth on production
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 11m
          script: |
            set -euo pipefail
            echo "PROD_SHA $(git -C /opt/seiltanzer rev-parse HEAD)"
            echo "SERVICE $(systemctl is-active seiltanzer)"
            cd /opt/seiltanzer
            /opt/seiltanzer/.venv/bin/python - <<'PY'
            import json, sqlite3, time
            import yfinance as yf
            from seiltanzer.config import INSTRUMENTS

            out=[]
            for code,inst in INSTRUMENTS.items():
                item={'code':code,'ticker':inst.yahoo}
                for interval,period in [('5m','60d'),('1m','7d')]:
                    key=f'{interval}_{period}'
                    try:
                        hist=yf.Ticker(inst.yahoo).history(period=period,interval=interval,auto_adjust=False)
                        if len(hist):
                            index=hist.index
                            item[key]={
                                'n':int(len(hist)),
                                'first':index[0].isoformat(),
                                'last':index[-1].isoformat(),
                                'days':round((index[-1].timestamp()-index[0].timestamp())/86400,2),
                                'non_null_close':int(hist['Close'].notna().sum()),
                                'non_null_volume':int(hist['Volume'].notna().sum()) if 'Volume' in hist else 0,
                            }
                        else:
                            item[key]={'n':0}
                    except Exception as exc:
                        item[key]={'error':f'{type(exc).__name__}: {exc}'[:300]}
                out.append(item)
            print('BAR_DEPTH',json.dumps(out,sort_keys=True))

            cache=sqlite3.connect('file:/opt/seiltanzer/data/cache.db?mode=ro',uri=True)
            cache.row_factory=sqlite3.Row
            tables={r['name'] for r in cache.execute("SELECT name FROM sqlite_master WHERE type='table'")}
            chain=[]
            if 'chain_snapshots' in tables:
                chain=[dict(r) for r in cache.execute("""
                    SELECT ticker,COUNT(*) n,MIN(ts) first_ts,MAX(ts) last_ts,
                           (MAX(ts)-MIN(ts))/86400.0 span_days
                    FROM chain_snapshots GROUP BY ticker ORDER BY ticker
                """)]
            kv=[]
            if 'kv' in tables:
                kv=[dict(r) for r in cache.execute("SELECT key,ts FROM kv ORDER BY key")]
            print('CHAIN_CACHE',json.dumps(chain,sort_keys=True))
            print('CACHE_KEYS',json.dumps(kv,sort_keys=True))
            cache.close()

            db=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True)
            db.row_factory=sqlite3.Row
            tables={r['name'] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
            candidates=[]
            for table in sorted(tables):
                cols={r['name'] for r in db.execute(f'PRAGMA table_info({table})')}
                if {'captured_ts','instrument'} <= cols:
                    row=db.execute(f'SELECT COUNT(*) n,MIN(captured_ts) first_ts,MAX(captured_ts) last_ts FROM {table}').fetchone()
                    candidates.append({'table':table,**dict(row)})
            print('TIMESTAMPED_MARKET_TABLES',json.dumps(candidates,sort_keys=True))
            db.close()
            PY
