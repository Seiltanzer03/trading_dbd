name: prod-evidence-audit

on:
  push:
    branches: [agent/evidence-audit-20260812]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact P1B feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/g1s-historical-wf-20260812
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Real Yahoo 5m historical walk-forward in temporary DB
        run: |
          python - <<'PY'
          import json, os, resource, tempfile, time
          from seiltanzer.config import Settings
          from seiltanzer.engine import Engine

          with tempfile.TemporaryDirectory() as td:
              settings=Settings(demo=True,data_dir=td)
              engine=Engine(settings)
              try:
                  runtime=engine.short_horizon
                  started=time.time()
                  result=runtime.materialize_historical_walkforward(force=True)
                  elapsed=time.time()-started
                  status=runtime.historical_walkforward_status()
                  print('REAL_WF_RESULT',json.dumps(result,sort_keys=True))
                  print('REAL_WF_STATUS',json.dumps({
                      'state':status.get('state'),
                      'source_count':status.get('source_count'),
                      'run_count':status.get('run_count'),
                      'provisional_count':status.get('provisional_count'),
                      'source_set':status.get('source_set_sha256'),
                      'source_set_isolated':status.get('current_source_set_isolated'),
                      'sources':[{k:x.get(k) for k in ('instrument','ticker','bar_count','calendar_span_days')} for x in status.get('sources') or []],
                      'runs':status.get('runs'),
                      'elapsed_sec':round(elapsed,2),
                      'max_rss_mb':round(resource.getrusage(resource.RUSAGE_SELF).ru_maxrss/1024,1),
                      'historical_option_features':status.get('historical_option_features'),
                      'production_authority':status.get('production_authority'),
                      'auto_promotion':status.get('auto_promotion'),
                  },sort_keys=True))
                  assert status.get('state')=='COMPLETE', status
                  assert status.get('source_count')==10, status
                  assert status.get('run_count')==10, status
                  assert len(status.get('sources') or [])==10, status
                  assert all(int(x.get('bar_count') or 0)>=1000 for x in status.get('sources') or []), status
                  assert {int(x.get('horizon_minutes')) for x in status.get('runs') or []}=={15,30,60,120,240}, status
                  assert {str(x.get('target')) for x in status.get('runs') or []}=={'direction_up','terminal_log_return'}, status
                  assert status.get('historical_option_features')=='UNAVAILABLE_NOT_SYNTHESIZED', status
                  assert status.get('production_authority') is False, status
                  assert status.get('auto_promotion') is False, status
                  cohorts=runtime.champion_status().get('items') or []
                  hist=[x for x in cohorts if x.get('source')=='HISTORICAL_WALK_FORWARD']
                  winners={str(x.get('provisional_model_id')) for x in status.get('runs') or [] if x.get('historical_winner')}
                  assert {str(x.get('champion_model_id')) for x in hist}==winners, (hist,winners)
                  assert all(float(x.get('training_cutoff_ts') or 0)<float(x.get('oos_start_ts') or 0) for x in hist), hist
                  print('REAL_WF_COHORTS',json.dumps({'winner_ids':sorted(winners),'cohort_n':len(hist)},sort_keys=True))
              finally:
                  engine.close()
          PY
