name: prod-evidence-audit

on:
  push:
    branches: [agent/evidence-audit-20260812]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Read latest production AI snapshot over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 4m
          script: |
            set -euo pipefail
            /opt/seiltanzer/.venv/bin/python - <<'PY'
            import json, sqlite3
            db=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro', uri=True); db.row_factory=sqlite3.Row
            active=db.execute("SELECT id,entry,stop,take,status FROM trades WHERE status='open' ORDER BY opened_at DESC,id DESC LIMIT 1").fetchone()
            print('ACTIVE', json.dumps(dict(active) if active else None, sort_keys=True))
            if active:
                row=db.execute('SELECT id,ts,snapshot_json,verdict,model FROM ai_verdicts WHERE trade_id=? ORDER BY ts DESC,id DESC LIMIT 1',(int(active['id']),)).fetchone()
                if row:
                    s=json.loads(row['snapshot_json']); m=s.get('policy_manager') or {}; ev=m.get('evidence') or {}; rootcov=s.get('metric_coverage') or {}; mcov=m.get('metric_coverage')
                    print('AI_META', json.dumps({'id':row['id'],'ts':row['ts'],'model':row['model'],'root_metric_coverage_present':bool(rootcov),'manager_metric_coverage_present':bool(mcov)}, sort_keys=True))
                    print('ROOT_COVERAGE', json.dumps(rootcov.get('summary') or rootcov, sort_keys=True)[:10000])
                    audit=m.get('input_audit') or {}; print('INPUT_AUDIT', json.dumps({'available_count':audit.get('available_count'),'total_count':audit.get('total_count'),'rows':audit.get('rows')}, sort_keys=True)[:16000])
                    risk=m.get('risk_constraint') or {}; rule=m.get('selection_rule') or {}; print('RISK_FLOORS',json.dumps({'risk':risk,'selection_floor':rule.get('cvar_floor_r'),'eligible':rule.get('eligible'),'ineligible':rule.get('ineligible')},sort_keys=True)[:8000])
                    ods=m.get('option_derivative_state') or ev.get('option_derivative_state') or {}; metrics=ods.get('metrics') or {}
                    compact={k:{x:v.get(x) for x in ('available','value','slope','acceleration','confidence','sample_count','time_span_minutes','source_quality','reason','units','value_units','slope_units')} for k,v in metrics.items() if isinstance(v,dict)}
                    print('OPTION_DERIVATIVE_METRICS',json.dumps(compact,sort_keys=True)[:24000])
                    print('EVIDENCE_KEYS', json.dumps(sorted(ev.keys())))
                    print('MANAGER_KEYS', json.dumps(sorted(m.keys())))
                    dq=((ev.get('data_quality') or {}).get('reliability') or {}); print('RELIABILITY',json.dumps(dq,sort_keys=True))
                    print('GEOMETRY',json.dumps({'trade_geometry':s.get('trade_geometry'),'scenario_geometry':m.get('scenario_geometry')},sort_keys=True)[:10000])
            db.close()
            PY
