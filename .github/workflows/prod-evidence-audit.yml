name: prod-evidence-audit

on:
  push:
    branches: [agent/evidence-audit-20260812]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    steps:
      - name: Diagnose P1B baseline gaps on production
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 6m
          script: |
            set -euo pipefail
            cd /opt/seiltanzer
            test "$(git rev-parse HEAD)" = "33bbd33ea70ba56b902e9b104b0a55953c9b4caa"
            /opt/seiltanzer/.venv/bin/python - <<'PY'
            import json, sqlite3
            db=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True)
            db.row_factory=sqlite3.Row
            state=db.execute('SELECT source_set_sha256,state FROM g1s_historical_wf_state WHERE id=1').fetchone()
            source_set=str(state['source_set_sha256'])
            assert state['state']=='COMPLETE'
            rows=db.execute('''
                SELECT target,horizon_minutes,model_family,artifact_json
                FROM g1s_historical_wf_runs
                WHERE source_set_sha256=?
                ORDER BY target,horizon_minutes
            ''',(source_set,)).fetchall()
            summary=[]
            for row in rows:
                a=json.loads(row['artifact_json'])
                ev=a.get('evaluation') or {}
                model=ev.get('model') or {}
                baselines=ev.get('baselines') or {}
                gate=a.get('selection_gate') or {}
                folds=ev.get('folds') or []
                target=str(row['target'])
                if target=='direction_up':
                    primary=('brier','logloss')
                else:
                    primary=('mae','rmse')
                metric_rows={}
                for metric in primary:
                    mv=model.get(metric)
                    available=[(name,vals.get(metric)) for name,vals in baselines.items() if vals.get(metric) is not None]
                    best=min(available,key=lambda x:float(x[1])) if available else (None,None)
                    gap=None
                    if mv is not None and best[1] not in (None,0):
                        gap=(float(mv)/float(best[1])-1.0)*100.0
                    metric_rows[metric]={
                        'model':mv,'best_baseline':best[0],'best':best[1],
                        'model_minus_best_pct':gap,
                    }
                fold_detail=[]
                for f in folds:
                    fm=f.get('model') or {}; fb=f.get('baselines') or {}
                    fold_metrics={}
                    for metric in primary:
                        mv=fm.get(metric)
                        avail=[(name,vals.get(metric)) for name,vals in fb.items() if vals.get(metric) is not None]
                        best=min(avail,key=lambda x:float(x[1])) if avail else (None,None)
                        fold_metrics[metric]={
                            'model':mv,'best_baseline':best[0],'best':best[1],
                            'beats_best': bool(mv is not None and best[1] is not None and float(mv)<float(best[1])),
                        }
                    fold_detail.append({'fold':f.get('fold_index'),'test_raw_n':f.get('test_raw_n'),'metrics':fold_metrics})
                summary.append({
                    'target':target,'horizon':int(row['horizon_minutes']),
                    'family':row['model_family'],'raw_n':a.get('sample',{}).get('raw_n'),
                    'effective_n':a.get('sample',{}).get('effective_n'),
                    'metrics':metric_rows,'folds':fold_detail,'gate':gate,
                })
            print('WF_GAP_SUMMARY',json.dumps(summary,sort_keys=True))

            # Aggregate which baseline wins most often and whether failure is
            # broad or concentrated in individual folds/horizons.
            aggregate={}
            for item in summary:
                key=item['target']; agg=aggregate.setdefault(key,{'metric_best_counts':{},'fold_wins':0,'fold_total':0,'near_best_1pct':0})
                for metric,m in item['metrics'].items():
                    b=m['best_baseline']; agg['metric_best_counts'][f'{metric}:{b}']=agg['metric_best_counts'].get(f'{metric}:{b}',0)+1
                    gap=m['model_minus_best_pct']
                    if gap is not None and gap<=1.0: agg['near_best_1pct']+=1
                for fold in item['folds']:
                    for metric,m in fold['metrics'].items():
                        agg['fold_total']+=1
                        if m['beats_best']: agg['fold_wins']+=1
            print('WF_GAP_AGGREGATE',json.dumps(aggregate,sort_keys=True))
            db.close()
            PY
