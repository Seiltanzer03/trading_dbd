name: production-ede-v13-audit

on:
  workflow_run:
    workflows: ["production-functional-smoke"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  snapshot:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install snapshot transport
        run: pip install paramiko
      - name: Materialize point-in-time macro archives before immutable snapshot
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 15m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"

            refresh_endpoint() {
              label="$1"
              endpoint="$2"
              allowed="$3"
              status=""
              payload=""
              for attempt in $(seq 1 60); do
                payload="$(curl -fsS --max-time 240 -X POST "$endpoint")"
                status="$(printf '%s' "$payload" | python3 -c \
                  'import json,sys; print(str(json.load(sys.stdin).get("status") or ""))')"
                if [ "$status" != "IN_PROGRESS" ]; then
                  printf '%s=%s\n' "$label" "$payload"
                  break
                fi
                sleep 5
              done
              case "|$allowed|" in
                *"|$status|"*) ;;
                *) echo "$label did not reach an allowed terminal state: $status" >&2; exit 1 ;;
              esac
            }

            refresh_endpoint \
              "BLS_HISTORICAL_BOOTSTRAP" \
              "http://127.0.0.1:8790/api/research/macro/historical-bls/refresh" \
              "OK|PARTIAL|NO_OBSERVATIONS"
            refresh_endpoint \
              "ISM_HISTORICAL_BOOTSTRAP" \
              "http://127.0.0.1:8790/api/research/macro/historical-ism/refresh" \
              "OK|PARTIAL|NO_OBSERVATIONS"
            refresh_endpoint \
              "FOMC_DETERMINISTIC_BOOTSTRAP" \
              "http://127.0.0.1:8790/api/research/macro/fomc-deterministic/refresh" \
              "OK|PARTIAL"
      - name: Export immutable production DB and release exact-run gate
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INVENTORY_MARKER_ID: ${{ github.event.workflow_run.id || github.run_id }}
          RUN_ID: ${{ github.run_id }}
          OUTPUT_DB: ${{ runner.temp }}/ede-source.sqlite3
        run: |
          python scripts/production_ede_offload.py snapshot \
            --password "$SSH_PASSWORD" \
            --expected-sha "$EXPECTED_SHA" \
            --event-name "$EVENT_NAME" \
            --marker-id "$INVENTORY_MARKER_ID" \
            --run-id "$RUN_ID" \
            --output-db "$OUTPUT_DB"
      - uses: actions/upload-artifact@v4
        with:
          name: ede-production-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/ede-source.sqlite3
          retention-days: 1

  audit:
    needs: snapshot
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    concurrency:
      group: ede-v13-heavy-research
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research runtime
        run: |
          pip install -e ".[dev]"
          pip install paramiko
      - uses: actions/download-artifact@v4
        with:
          name: ede-production-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/ede-source
      - name: Fetch latest serialized EDE ledgers
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/ede-output
        run: |
          python scripts/production_ede_offload.py fetch-ledgers \
            --password "$SSH_PASSWORD" \
            --expected-sha "$EXPECTED_SHA" \
            --output-dir "$OUTPUT_DIR"
      - name: Run EDE v1.3 research off production VPS
        env:
          SOURCE_DB: ${{ runner.temp }}/ede-source/ede-source.sqlite3
          OUTPUT_DIR: ${{ runner.temp }}/ede-output
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          python scripts/production_ede_v13_audit.py \
            --database "$SOURCE_DB" \
            --output "$OUTPUT_DIR/ede_v13_latest_audit.json" \
            --evidence-ledger "$OUTPUT_DIR/ede_frozen_evidence.jsonl" \
            --candidate-registry "$OUTPUT_DIR/ede_v13_candidate_registry.jsonl"
          python scripts/production_ede_transition_audit.py \
            --database "$SOURCE_DB" \
            --output "$OUTPUT_DIR/ede_transition_latest_audit.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ede-v13-research-${{ github.run_id }}
          path: ${{ runner.temp }}/ede-output
          retention-days: 30

  publish:
    needs: audit
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install paramiko
      - uses: actions/download-artifact@v4
        with:
          name: ede-v13-research-${{ github.run_id }}
          path: ${{ runner.temp }}/ede-output
      - name: Publish compact EDE research outputs without production compute
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          OUTPUT_DIR: ${{ runner.temp }}/ede-output
          RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/production_ede_offload.py publish \
            --password "$SSH_PASSWORD" \
            --expected-sha "$EXPECTED_SHA" \
            --output-dir "$OUTPUT_DIR" \
            --run-id "$RUN_ID"