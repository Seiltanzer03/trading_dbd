name: production-ede-v13-audit

on:
  workflow_run:
    # Keep the same workflow_run depth as inventory: deploy -> readiness -> smoke.
    # The two sibling workflows synchronize on a smoke-run marker on the VPS so
    # their heavy research reads never overlap.
    workflows: ["production-functional-smoke"]
    types: [completed]
  workflow_dispatch:
  # Refresh frozen selective candidates without waiting for another deployment.
  # Full discovery remains off the request path and runs only every six hours.
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    # 20% CPU intentionally makes research slower than the former 40% cap.
    # Give the bounded research enough wall time without raising its CPU share.
    timeout-minutes: 90
    steps:
      - name: Run EDE v1.3 selective search on immutable production DB copy
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INVENTORY_MARKER_ID: ${{ github.event.workflow_run.id || github.run_id }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 85m
          envs: EXPECTED_SHA,EVENT_NAME,INVENTORY_MARKER_ID
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            mkdir -p /opt/seiltanzer/data/research /var/lock

            # Post-smoke inventory and the EDE load audit are sibling workflows.
            # Inventory is an unbounded read-heavy scan and previously overlapped
            # the first EDE probe. Wait for completion of this exact upstream
            # smoke-run before starting CPU-heavy EDE. Scheduled/manual audits do
            # not depend on a sibling inventory run.
            if [ "$EVENT_NAME" = "workflow_run" ]; then
              inventory_marker="/var/lock/seiltanzer-ede-inventory-${INVENTORY_MARKER_ID}.done"
              inventory_ready=0
              for _ in $(seq 1 120); do
                if [ -f "$inventory_marker" ]; then
                  marker_sha=$(cat "$inventory_marker")
                  if [ "$marker_sha" != "$EXPECTED_SHA" ]; then
                    echo "Inventory marker SHA mismatch: marker=$marker_sha expected=$EXPECTED_SHA"
                    exit 1
                  fi
                  inventory_ready=1
                  break
                fi
                sleep 2
              done
              if [ "$inventory_ready" -ne 1 ]; then
                echo "Timed out waiting for post-smoke EDE inventory marker: $inventory_marker"
                exit 1
              fi
              echo "Post-smoke EDE inventory completed for $EXPECTED_SHA"
            fi

            # One heavy EDE search at a time on the production VPS. A scheduled,
            # post-deploy or manual EDE/EDE overlap is research-only and may be skipped.
            exec 9>/var/lock/seiltanzer-ede-v13-audit.lock
            if ! flock -n 9; then
              echo "Another EDE audit is already running; skipping overlapping research run."
              exit 0
            fi

            run_research() {
              local label="$1"
              shift
              local unit="seiltanzer-ede-${label}-$$"
              # Keep the conservative production-safe cap. The post-smoke
              # orchestration fix removes the independent inventory workload
              # rather than buying research speed with more production CPU.
              systemd-run --quiet --collect --wait --pipe \
                --unit="$unit" \
                --property=CPUQuota=20% \
                --property=Nice=15 \
                --setenv=OMP_NUM_THREADS=1 \
                --setenv=OPENBLAS_NUM_THREADS=1 \
                --setenv=MKL_NUM_THREADS=1 \
                --setenv=NUMEXPR_NUM_THREADS=1 \
                --setenv=VECLIB_MAXIMUM_THREADS=1 \
                /usr/bin/ionice -c2 -n7 "$@"
            }

            probe_api() {
              local path="$1"
              local started elapsed code
              started=$(date +%s%3N)
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 3 "http://127.0.0.1:8790${path}" || true)
              elapsed=$(( $(date +%s%3N) - started ))
              echo "research-load-probe path=${path} code=${code} elapsed_ms=${elapsed}"
              test "$code" = "200"
              test "$elapsed" -lt 3000
            }

            # The primary audit freezes/refits canonical rules. It deliberately
            # does not back-apply a new rule to older pending T0 rows.
            run_research primary /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/production_ede_v13_audit.py \
              --database /opt/seiltanzer/data/trades.db \
              --output /opt/seiltanzer/data/research/ede_v13_latest_audit.json \
              --evidence-ledger /opt/seiltanzer/data/research/ede_frozen_evidence.jsonl \
              --candidate-registry /opt/seiltanzer/data/research/ede_v13_candidate_registry.jsonl &
            audit_pid=$!
            audit_unit="seiltanzer-ede-primary-$$"

            abort_primary() {
              # A failed acceptance probe must not leave the transient research
              # unit running until the SSH timeout; stop only this audit unit.
              systemctl stop "$audit_unit" >/dev/null 2>&1 || true
              kill "$audit_pid" >/dev/null 2>&1 || true
              wait "$audit_pid" >/dev/null 2>&1 || true
              exit 1
            }

            probe_or_abort() {
              if ! probe_api "$1"; then
                abort_primary
              fi
            }

            # Verify the live API throughout the complete CPU-heavy primary
            # audit. Do not stop probing after a fixed iteration count merely
            # because a lower CPU quota makes research intentionally slower.
            probes=0
            while kill -0 "$audit_pid" 2>/dev/null; do
              sleep 15
              probe_or_abort /api/state
              if [ $((probes % 4)) -eq 0 ]; then
                probe_or_abort /api/analytics/gex-migration
                probe_or_abort /api/analytics/regime-phase
                probe_or_abort /api/analytics/wavelet
                probe_or_abort /api/analytics/correlation-graph
                probe_or_abort /api/ai/history
              fi
              probes=$((probes + 1))
            done
            wait "$audit_pid"

            # v1.3.4: use additional macro/wavelet transition metrics that were
            # already frozen by g1s_evidence_v3. This is a separate bounded
            # diagnostic universe: no canonical promotion, no shadow authority.
            run_research transition /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/production_ede_transition_audit.py \
              --database /opt/seiltanzer/data/trades.db \
              --output /opt/seiltanzer/data/research/ede_transition_latest_audit.json
