name: production-ede-v12-audit

on:
  workflow_run:
    workflows: ["production-ede-inventory"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Run EDE v1.2 on an immutable read-only production DB copy
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 30m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/production_ede_v12_audit.py \
              --database /opt/seiltanzer/data/trades.db
