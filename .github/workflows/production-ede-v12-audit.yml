name: production-ede-v13-audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
      acceptance_run_id:
        required: true
        type: string
  schedule:
    # Heavy research once daily (04:17 Moscow); exact deploy handoffs stay explicit.
    - cron: "17 1 * * *"

permissions:
  actions: write
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      expected_sha: ${{ steps.contract.outputs.expected_sha }}
      acceptance_run_id: ${{ steps.contract.outputs.acceptance_run_id }}
      exact_chain: ${{ steps.contract.outputs.exact_chain }}
    steps:
      - name: Resolve explicit dispatch or scheduled contract
        id: contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.expected_sha }}
          DISPATCH_ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          SCHEDULE_SHA: ${{ github.sha }}
          SCHEDULE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test -n "$DISPATCH_SHA"
            case "$DISPATCH_ACCEPTANCE_RUN_ID" in
              ''|*[!0-9]*) echo "invalid acceptance_run_id" >&2; exit 1 ;;
            esac
            echo "expected_sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
            echo "acceptance_run_id=$DISPATCH_ACCEPTANCE_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "exact_chain=true" >> "$GITHUB_OUTPUT"
          else
            test "$EVENT_NAME" = "schedule"
            echo "expected_sha=$SCHEDULE_SHA" >> "$GITHUB_OUTPUT"
            echo "acceptance_run_id=$SCHEDULE_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "exact_chain=false" >> "$GITHUB_OUTPUT"
          fi

  snapshot:
    needs: resolve
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
      ACCEPTANCE_RUN_ID: ${{ needs.resolve.outputs.acceptance_run_id }}
      EXACT_CHAIN: ${{ needs.resolve.outputs.exact_chain }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.expected_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install snapshot transport
        run: pip install paramiko -e '.[research]'
      - name: Build exact-SHA historical BLS/ISM/FOMC bundle off-host
        run: |
          set -euo pipefail
          python scripts/build_offhost_historical_macro_bundle.py \
            --expected-sha "$EXPECTED_SHA" \
            --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
            --output "historical-macro-${{ github.run_id }}.json"
      - name: Transfer and install historical bundle with bounded SSH retries
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
          ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/production_ede_offload.py install-historical-bundle \
            --password "$SSH_PASSWORD" \
            --expected-sha "$EXPECTED_SHA" \
            --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
            --run-id "$RUN_ID" \
            --input "historical-macro-${RUN_ID}.json"
      - name: Remove only stale closed EDE snapshot leftovers
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 3m
          script: |
            set -euo pipefail
            command -v lsof >/dev/null 2>&1 || {
              echo "lsof is required for fail-closed stale EDE snapshot cleanup" >&2
              exit 1
            }

            removed=0
            removed_bytes=0
            while IFS= read -r -d '' candidate; do
              case "$candidate" in
                /tmp/seiltanzer-ede-source-*.sqlite3|\
                /tmp/seiltanzer-ede-source-*.sqlite3-wal|\
                /tmp/seiltanzer-ede-source-*.sqlite3-shm) ;;
                *)
                  echo "Refusing unexpected EDE cleanup path: $candidate" >&2
                  exit 1
                  ;;
              esac
              if lsof -- "$candidate" >/dev/null 2>&1; then
                echo "KEEP_OPEN_EDE_SNAPSHOT=$candidate"
                continue
              fi
              size=$(stat -c '%s' "$candidate" 2>/dev/null || echo 0)
              rm -f -- "$candidate"
              removed=$((removed + 1))
              removed_bytes=$((removed_bytes + size))
            done < <(find /tmp -maxdepth 1 -type f \
              \( -name 'seiltanzer-ede-source-*.sqlite3' \
                 -o -name 'seiltanzer-ede-source-*.sqlite3-wal' \
                 -o -name 'seiltanzer-ede-source-*.sqlite3-shm' \) \
              -mmin +360 -print0 2>/dev/null)

            echo "EDE_STALE_REMOTE_SNAPSHOTS_REMOVED=$removed"
            echo "EDE_STALE_REMOTE_SNAPSHOT_BYTES_REMOVED=$removed_bytes"
            df -h /
      - name: Materialize point-in-time macro archives before immutable snapshot
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 15m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"

            refresh_endpoint() {
              label="$1"
              endpoint="$2"
              allowed="$3"
              status=""
              payload=""
              for attempt in $(seq 1 60); do
                payload="$(curl -fsS --max-time 240 -X POST "$endpoint")"
                status="$(printf '%s' "$payload" | python3 -c \
                  'import json,sys; print(str(json.load(sys.stdin).get("status") or ""))')"
                if [ "$status" != "IN_PROGRESS" ]; then
                  printf '%s=%s\n' "$label" "$payload"
                  break
                fi
                sleep 5
              done
              case "|$allowed|" in
                *"|$status|"*) ;;
                *) echo "$label did not reach an allowed terminal state: $status" >&2; exit 1 ;;
              esac
            }

            refresh_endpoint \
              "BLS_HISTORICAL_BOOTSTRAP" \
              "http://127.0.0.1:8790/api/research/macro/historical-bls/refresh" \
              "OK|PARTIAL|NO_OBSERVATIONS"
            refresh_endpoint \
              "ISM_HISTORICAL_BOOTSTRAP" \
              "http://127.0.0.1:8790/api/research/macro/historical-ism/refresh" \
              "OK|PARTIAL|NO_OBSERVATIONS"
            refresh_endpoint \
              "FOMC_DETERMINISTIC_BOOTSTRAP" \
              "http://127.0.0.1:8790/api/research/macro/fomc-deterministic/refresh" \
              "OK|PARTIAL"

  audit:
    needs: [resolve, snapshot]
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    concurrency:
      group: ede-v13-heavy-research
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.expected_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research runtime
        run: |
          pip install -e ".[dev]"
          pip install paramiko boto3
      - name: Export a consistent live DB directly to this offhost worker
        id: snapshot_export
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
          ACCEPTANCE_RUN_ID: ${{ needs.resolve.outputs.acceptance_run_id }}
          EXACT_CHAIN: ${{ needs.resolve.outputs.exact_chain }}
          RUN_ID: ${{ github.run_id }}
          OUTPUT_DB: ${{ runner.temp }}/ede-source/ede-source.sqlite3
        run: |
          set -euo pipefail
          args=(--password "$SSH_PASSWORD" --expected-sha "$EXPECTED_SHA"
                --acceptance-run-id "$ACCEPTANCE_RUN_ID" --run-id "$RUN_ID"
                --output-db "$OUTPUT_DB")
          if [ "$EXACT_CHAIN" = "true" ]; then
            args+=(--require-acceptance-marker)
          fi
          python scripts/production_ede_offload.py live-snapshot "${args[@]}"
      - name: Store the verified snapshot in bounded private Object Storage slots
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
          SOURCE_DB: ${{ runner.temp }}/ede-source/ede-source.sqlite3
          BUCKET: trading-dbd-backups-2026
        run: |
          set -euo pipefail
          slot="$(( $(date -u +%s) / 86400 % 7 ))"
          key="backups/v1/daily-slot-${slot}/snapshot.sqlite3.gz"
          python scripts/upload_verified_snapshot.py \
            --database "$SOURCE_DB" \
            --source-manifest "$SOURCE_DB.manifest.json" \
            --bucket "$BUCKET" --key "$key" \
            --output-manifest "$SOURCE_DB.offhost-manifest.json"
      - name: Reverify immutable input before research
        env:
          SOURCE_DB: ${{ runner.temp }}/ede-source/ede-source.sqlite3
        run: |
          python scripts/verify_immutable_snapshot.py \
            --database "$SOURCE_DB" \
            --manifest "$SOURCE_DB.manifest.json"
      - name: Release gate if live export failed before normal release
        if: always() && needs.resolve.outputs.exact_chain == 'true' && steps.snapshot_export.outcome != 'success'
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
          ACCEPTANCE_RUN_ID: ${{ needs.resolve.outputs.acceptance_run_id }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
          script: |
            /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/production_research_acceptance.py release-gate \
              --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA" || true
      - name: Fetch latest serialized EDE ledgers
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
          OUTPUT_DIR: ${{ runner.temp }}/ede-output
        run: |
          python scripts/production_ede_offload.py fetch-ledgers \
            --password "$SSH_PASSWORD" \
            --expected-sha "$EXPECTED_SHA" \
            --output-dir "$OUTPUT_DIR"
      - name: Run EDE v1.3 research off production VPS
        env:
          SOURCE_DB: ${{ runner.temp }}/ede-source/ede-source.sqlite3
          OUTPUT_DIR: ${{ runner.temp }}/ede-output
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          python scripts/production_ede_v13_audit.py \
            --database "$SOURCE_DB" \
            --output "$OUTPUT_DIR/ede_v13_latest_audit.json" \
            --evidence-ledger "$OUTPUT_DIR/ede_frozen_evidence.jsonl" \
            --candidate-registry "$OUTPUT_DIR/ede_v13_candidate_registry.jsonl" \
            --verified-immutable-input
          python scripts/production_ede_transition_audit.py \
            --database "$SOURCE_DB" \
            --output "$OUTPUT_DIR/ede_transition_latest_audit.json" \
            --verified-immutable-input
      - uses: actions/upload-artifact@v4
        with:
          name: ede-v13-research-${{ github.run_id }}
          path: ${{ runner.temp }}/ede-output
          retention-days: 30

  publish:
    needs: [resolve, audit]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.expected_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install paramiko
      - uses: actions/download-artifact@v4
        with:
          name: ede-v13-research-${{ github.run_id }}
          path: ${{ runner.temp }}/ede-output
      - name: Publish compact EDE research outputs without production compute
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
          OUTPUT_DIR: ${{ runner.temp }}/ede-output
          RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/production_ede_offload.py publish \
            --password "$SSH_PASSWORD" \
            --expected-sha "$EXPECTED_SHA" \
            --output-dir "$OUTPUT_DIR" \
            --run-id "$RUN_ID"

  handoff-active-edge:
    needs: [resolve, publish]
    runs-on: ubuntu-22.04
    steps:
      - name: Continue with active edge reports for the same exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.expected_sha }}
          ACCEPTANCE_RUN_ID: ${{ needs.resolve.outputs.acceptance_run_id }}
        run: |
          set -euo pipefail
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "expected_sha": os.environ["EXPECTED_SHA"],
                  "acceptance_run_id": os.environ["ACCEPTANCE_RUN_ID"],
              },
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 2 --retry-max-time 30 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/production-active-edge.yml/dispatches" \
            -d "$payload"
