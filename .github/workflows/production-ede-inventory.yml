name: production-ede-inventory

on:
  workflow_run:
    workflows: ["production-functional-smoke"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Audit real immutable G1S observations and all EDE features
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 6m
          script: |
            set -euo pipefail
            /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/production_ede_inventory.py \
              --database /opt/seiltanzer/data/trades.db
