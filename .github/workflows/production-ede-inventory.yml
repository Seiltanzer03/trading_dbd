name: production-ede-inventory

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
      acceptance_run_id:
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Audit real immutable G1S observations and all EDE features
        id: inventory
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
          ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 37m
          envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            mkdir -p /var/lock
            PY=/opt/seiltanzer/.venv/bin/python
            ORCH=/opt/seiltanzer/scripts/production_research_acceptance.py
            keep_gate=0

            cleanup_gate_on_failure() {
              if [ "$keep_gate" -ne 1 ]; then
                "$PY" "$ORCH" release-gate \
                  --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
                  --expected-sha "$EXPECTED_SHA" || true
              fi
            }
            trap cleanup_gate_on_failure EXIT

            "$PY" "$ORCH" wait-marker \
              --stage g1m-local-edge \
              --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA" \
              --timeout-seconds 1800 \
              --poll-seconds 5
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            "$PY" "$ORCH" validate-gate \
              --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA"

            "$PY" /opt/seiltanzer/scripts/production_ede_inventory.py \
              --database /opt/seiltanzer/data/trades.db

            "$PY" "$ORCH" write-marker \
              --stage ede-inventory \
              --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA"

            keep_gate=1
            trap - EXIT

      - name: Continue exact-SHA chain with immutable EDE snapshot
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "expected_sha": os.environ["EXPECTED_SHA"],
                  "acceptance_run_id": os.environ["ACCEPTANCE_RUN_ID"],
              },
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 2 --retry-max-time 30 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/production-ede-v12-audit.yml/dispatches" \
            -d "$payload"

      - name: Release gate if downstream dispatch failed
        if: always() && steps.inventory.outcome == 'success' && steps.handoff.outcome != 'success'
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
          ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
          script: |
            /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/production_research_acceptance.py release-gate \
              --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA" || true
