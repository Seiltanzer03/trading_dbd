name: production-g1m-local-edge

on:
  workflow_run:
    workflows: ["production-functional-smoke"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Verify G1-M.1 local edge on production
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          SMOKE_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 27m
          envs: EXPECTED_SHA,SMOKE_RUN_ID
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            PY=/opt/seiltanzer/.venv/bin/python
            ORCH=/opt/seiltanzer/scripts/production_research_acceptance.py
            keep_gate=0

            cleanup_gate_on_failure() {
              if [ "$keep_gate" -ne 1 ]; then
                "$PY" "$ORCH" release-gate \
                  --smoke-run-id "$SMOKE_RUN_ID" \
                  --expected-sha "$EXPECTED_SHA" || true
              fi
            }
            trap cleanup_gate_on_failure EXIT

            # Do not execute the expensive local-edge report while the required
            # worker maintenance cycle is still running. The marker is exact to
            # this upstream smoke run and its content is the deployed SHA.
            "$PY" "$ORCH" wait-marker \
              --stage post-research \
              --smoke-run-id "$SMOKE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA" \
              --timeout-seconds 1500 \
              --poll-seconds 5
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            "$PY" "$ORCH" validate-gate \
              --smoke-run-id "$SMOKE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA"

            "$PY" - <<'PY'
            import json, time, urllib.request

            url = "http://127.0.0.1:8790/api/research/g1/management/local-edge"
            started = time.monotonic()
            with urllib.request.urlopen(url, timeout=5.0) as response:
                payload = json.loads(response.read().decode("utf-8"))
                assert response.status == 200
            elapsed_ms = (time.monotonic()-started)*1000.0
            assert elapsed_ms < 3000.0, elapsed_ms
            assert payload.get("production_authority") is False, payload
            assert payload.get("auto_promotion") is False, payload
            assert payload.get("may_trigger_exit_or_close") is False, payload
            assert payload.get("edge_claim_allowed") is False, payload
            assert payload.get("management_shadow", {}).get("auto_activation") is False, payload

            attribution = payload.get("active_edge_decision_attribution") or {}
            assert attribution, payload
            assert attribution.get("production_authority") is False, attribution
            assert attribution.get("production_directional_authority") is False, attribution
            assert attribution.get("decision_weight_applied") is False, attribution
            assert attribution.get("auto_promotion") is False, attribution
            assert attribution.get("automatic_execution") is False, attribution
            assert attribution.get("may_trigger_exit_or_close") is False, attribution
            assert attribution.get("edge_claim_allowed") is False, attribution

            pairwise = []
            for row in payload.get("pairwise") or []:
                prospective = row.get("prospective") or {}
                descriptive = row.get("descriptive_all") or {}
                pairwise.append({
                    "h": row.get("horizon_minutes"),
                    "comparison": f"{row.get('left_action')} vs {row.get('right_action')}",
                    "prospective_effective_n": prospective.get("effective_n"),
                    "prospective_mean_delta_r": prospective.get("mean_delta_r"),
                    "prospective_maturity": prospective.get("maturity"),
                    "descriptive_effective_n": descriptive.get("effective_n"),
                    "descriptive_mean_delta_r": descriptive.get("mean_delta_r"),
                })

            attribution_variants = []
            for row in attribution.get("variants") or []:
                metric = row.get("hold_vs_exit") or {}
                if metric.get("raw_n"):
                    attribution_variants.append({
                        "variant": row.get("variant"),
                        "h": row.get("local_horizon_minutes"),
                        "raw_n": metric.get("raw_n"),
                        "effective_n": metric.get("effective_n"),
                        "mean_aligned_delta_r": metric.get("mean_aligned_delta_r"),
                        "maturity": metric.get("maturity"),
                    })
            summary = {
                "elapsed_ms": round(elapsed_ms, 1),
                "contract_version": payload.get("contract_version"),
                "local_contract_version": payload.get("local_contract_version"),
                "dataset": payload.get("dataset"),
                "maturity": payload.get("maturity_contract"),
                "verdict": payload.get("verdict"),
                "pairwise": pairwise,
                "where_it_helps": payload.get("where_it_helps"),
                "where_it_hurts": payload.get("where_it_hurts"),
                "management_shadow": payload.get("management_shadow"),
                "active_edge_attribution": {
                    "contract_version": attribution.get("contract_version"),
                    "coverage": attribution.get("coverage"),
                    "maturity": attribution.get("maturity_contract"),
                    "verdict": attribution.get("verdict"),
                    "variants_with_data": attribution_variants,
                    "target_horizon_row_n": len(
                        attribution.get("target_horizon_attribution") or []),
                },
            }
            print("G1M_LOCAL_EDGE_ACCEPTANCE=" + json.dumps(summary, sort_keys=True))
            PY

            "$PY" "$ORCH" write-marker \
              --stage g1m-local-edge \
              --smoke-run-id "$SMOKE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA"
            keep_gate=1
            trap - EXIT