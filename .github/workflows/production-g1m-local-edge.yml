name: production-g1m-local-edge

on:
  workflow_run:
    workflows: ["production-functional-smoke"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Verify G1-M.1 local edge on production
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 3m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            /opt/seiltanzer/.venv/bin/python - <<'PY'
            import json, time, urllib.request

            url = "http://127.0.0.1:8790/api/research/g1/management/local-edge"
            started = time.monotonic()
            with urllib.request.urlopen(url, timeout=5.0) as response:
                payload = json.loads(response.read().decode("utf-8"))
                assert response.status == 200
            elapsed_ms = (time.monotonic()-started)*1000.0
            assert elapsed_ms < 3000.0, elapsed_ms
            assert payload.get("production_authority") is False, payload
            assert payload.get("auto_promotion") is False, payload
            assert payload.get("may_trigger_exit_or_close") is False, payload
            assert payload.get("edge_claim_allowed") is False, payload
            assert payload.get("management_shadow", {}).get("auto_activation") is False, payload

            pairwise = []
            for row in payload.get("pairwise") or []:
                prospective = row.get("prospective") or {}
                descriptive = row.get("descriptive_all") or {}
                pairwise.append({
                    "h": row.get("horizon_minutes"),
                    "comparison": f"{row.get('left_action')} vs {row.get('right_action')}",
                    "prospective_effective_n": prospective.get("effective_n"),
                    "prospective_mean_delta_r": prospective.get("mean_delta_r"),
                    "prospective_maturity": prospective.get("maturity"),
                    "descriptive_effective_n": descriptive.get("effective_n"),
                    "descriptive_mean_delta_r": descriptive.get("mean_delta_r"),
                })
            summary = {
                "elapsed_ms": round(elapsed_ms, 1),
                "contract_version": payload.get("contract_version"),
                "local_contract_version": payload.get("local_contract_version"),
                "dataset": payload.get("dataset"),
                "maturity": payload.get("maturity_contract"),
                "verdict": payload.get("verdict"),
                "pairwise": pairwise,
                "where_it_helps": payload.get("where_it_helps"),
                "where_it_hurts": payload.get("where_it_hurts"),
                "management_shadow": payload.get("management_shadow"),
            }
            print("G1M_LOCAL_EDGE_ACCEPTANCE=" + json.dumps(summary, sort_keys=True))
            PY
