name: production-conditional-history-audit

on:
  workflow_run:
    workflows: ["deploy"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Replay six manual management hypotheses against immutable reviews
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_sha }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 5m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            cd /opt/seiltanzer
            PYTHONPATH=/opt/seiltanzer .venv/bin/python \
              scripts/audit_historical_conditional_management.py \
              --database /opt/seiltanzer/data/trades.db
