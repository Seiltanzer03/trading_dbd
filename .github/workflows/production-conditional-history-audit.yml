name: production-conditional-history-audit

# The baseline and six hypotheses have been measured on production. Rerun
# deliberately for a specific deployed SHA instead of scanning the live 9+ GiB
# database after every unrelated deploy. The SSH guard rejects SHA drift.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Replay six manual management hypotheses against immutable reviews
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 5m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            cd /opt/seiltanzer
            PYTHONPATH=/opt/seiltanzer .venv/bin/python \
              scripts/audit_historical_conditional_management.py \
              --database /opt/seiltanzer/data/trades.db
