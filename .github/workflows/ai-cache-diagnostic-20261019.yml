name: read-only-ai-cache-diagnostic
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-cache-diagnostic-20261019.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Read exact-SHA cached snapshot readiness only
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: bcb22bb5acbc33ecd3965cae620be693d9c172ba
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 1m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            PYTHONDONTWRITEBYTECODE=1 /opt/seiltanzer/.venv/bin/python - <<'PY'
            import json,math,os,sys,urllib.request
            sys.excepthook=lambda kind,value,tb:print(json.dumps({'diagnostic_failed':kind.__name__}))
            with urllib.request.urlopen('http://127.0.0.1:8790/api/ai/snapshot/status',timeout=5) as response:
                raw=response.read(1000001)
            if len(raw)>1000000:raise ValueError('bounded_response_exceeded')
            status=json.loads(raw)
            result=dict(contract='readonly-ai-cache-diagnostic-v1',application_sha=os.environ['EXPECTED_SHA'],
                evidence_scope='CURRENT_CACHED_STATUS_ONLY',verdict_requested=False,llm_called=False,
                database_opened=False,production_mutation=False)
            for key in ('ready','building','canonical_quote_available','request_path_heavy_build','periodic_heavy_recompute'):
                value=status.get(key)
                result[key]=value if isinstance(value,bool) else None
            for key in ('age_sec','build_ms','build_n','failure_retry_in_sec'):
                value=status.get(key)
                result[key]=value if type(value) in (int,float) and math.isfinite(value) else None
            result['current_trade_present']=status.get('current_trade_id') is not None
            result['snapshot_trade_matches']=status.get('current_trade_id') is not None and status.get('current_trade_id')==status.get('snapshot_trade_id')
            reason=status.get('invalidated_reason')
            safe_reason=isinstance(reason,str) and 0<len(reason)<=128 and all(c.isupper() or c.isdigit() or c=='_' for c in reason)
            result['invalidated_reason']=reason if safe_reason else None
            result['invalidation_present']=reason is not None
            error=status.get('last_error')
            result['last_error_present']=bool(error)
            kind=error.split(':',1)[0] if isinstance(error,str) else ''
            result['last_error_type']=kind if kind.isidentifier() and len(kind)<=80 else None
            print(json.dumps(result,sort_keys=True,allow_nan=False))
            PY
