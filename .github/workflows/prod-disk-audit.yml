name: prod-disk-audit

on:
  push:
    branches: [agent/prod-disk-recovery]

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Read-only disk audit over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 3m
          script: |
            set -u
            echo '=== DF BYTES ==='
            df -h / /opt/seiltanzer 2>&1 || true
            echo '=== DF INODES ==='
            df -i / /opt/seiltanzer 2>&1 || true
            echo '=== TOP /OPT/SEILTANZER ==='
            du -x -h --max-depth=2 /opt/seiltanzer 2>/dev/null | sort -h | tail -40 || true
            echo '=== AUTHORITATIVE DATA ==='
            du -x -h --max-depth=3 /opt/seiltanzer/data 2>/dev/null | sort -h | tail -50 || true
            echo '=== DB FILES ==='
            find /opt/seiltanzer -maxdepth 4 -type f \( -name 'trades.db' -o -name 'trades.db-wal' -o -name 'trades.db-shm' \) -printf '%s %p\n' 2>/dev/null | sort -n || true
            echo '=== LOCAL BACKUP SUMMARY ==='
            python3 - <<'PY'
            from pathlib import Path
            import json
            d=Path('/opt/seiltanzer/data/backups/local')
            files=list(d.glob('*')) if d.exists() else []
            dbs=sorted(d.glob('*.sqlite3'), key=lambda p:p.stat().st_mtime)
            manifests=sorted(d.glob('*.manifest.json'), key=lambda p:p.stat().st_mtime)
            total=sum(p.stat().st_size for p in files if p.is_file())
            print('directory_exists=', d.exists())
            print('files=',len(files),'db_snapshots=',len(dbs),'manifests=',len(manifests),'total_bytes=',total)
            for p in dbs[-30:]:
                print('snapshot',p.stat().st_size,int(p.stat().st_mtime),p.name)
            if manifests:
                try:
                    m=json.loads(manifests[-1].read_text())
                    print('latest_verified=',m.get('verified'),'backup_id=',m.get('backup_id'),'db_size=',m.get('database_size_bytes'))
                except Exception as e:
                    print('manifest_error',type(e).__name__)
            PY
            echo '=== ACTIONS RUNNER ==='
            for d in /opt/actions-runner /home/*/actions-runner /root/actions-runner; do
              if [ -d "$d" ]; then
                echo "runner=$d"
                du -x -h --max-depth=2 "$d" 2>/dev/null | sort -h | tail -30 || true
              fi
            done
            echo '=== PIP CACHE ==='
            du -sh /root/.cache/pip /home/*/.cache/pip 2>/dev/null || true
            echo '=== JOURNAL ==='
            journalctl --disk-usage 2>&1 || true
            echo '=== /VAR TOP ==='
            du -x -h --max-depth=2 /var 2>/dev/null | sort -h | tail -35 || true
            echo '=== GIT OBJECTS ==='
            git -C /opt/seiltanzer count-objects -vH 2>&1 || true
            echo '=== LARGEST FILES UNDER /OPT ==='
            find /opt -xdev -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -35 || true

      - name: Publish audit locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"success\",\"context\":\"diag/prod-disk-audit\",\"description\":\"Read-only production disk audit completed\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
