name: capacity-bootstrap-cache-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/capacity-bootstrap-cache-20261020.yml]
permissions:
  contents: read
concurrency:
  group: production-seiltanzer
  queue: max
  cancel-in-progress: false
jobs:
  recover-cache:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Reclaim canonical reproducible APT indexes and inspect remaining allocation
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = bcb22bb5acbc33ecd3965cae620be693d9c172ba
            if [ -e /opt/seiltanzer/data/cutover.active ] || [ -L /opt/seiltanzer/data/cutover.active ]; then exit 1; fi
            /usr/bin/python3 /usr/local/lib/seiltanzer-history-start-guard.py --database /opt/seiltanzer/data/trades.db --application-root /opt/seiltanzer
            git -C /opt/seiltanzer diff --exit-code --quiet -- scripts/reclaim_apt_cache.py
            /usr/bin/python3 /opt/seiltanzer/scripts/reclaim_apt_cache.py --apply
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = bcb22bb5acbc33ecd3965cae620be693d9c172ba
            systemctl is-active --quiet seiltanzer
            df -B1 /
            timeout 20s du -xhd2 /root/seiltanzer_bot /opt/seiltanzer/.git /opt/seiltanzer/cache.db /opt/trend_share 2>/dev/null | sort -h | tail -n 45 || true
            /usr/bin/python3 /opt/seiltanzer/scripts/compact_deployment_git.py --repo /opt/seiltanzer --expected-sha bcb22bb5acbc33ecd3965cae620be693d9c172ba
            code=$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8790/api/state)
            echo "HTTP=$code"
