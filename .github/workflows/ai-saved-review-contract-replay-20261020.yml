name: saved-ai-review-contract-replay-20261020
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/ai-saved-review-contract-replay-20261020.yml]
permissions:
  contents: read
concurrency:
  group: production-seiltanzer
  queue: max
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - name: Replay latest saved review read-only with offline provider fixture
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 90s
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = bb672aad636cf4e9aba9d3e1cd453aa35402c650
            exec 9</opt/seiltanzer/.deployment-git-maintenance.lock
            flock -sn 9 || { echo SOURCE_FENCED; exit 1; }
            test ! -e /opt/seiltanzer/data/cutover.active
            test ! -L /opt/seiltanzer/data/cutover.active
            cd /opt/seiltanzer
            .venv/bin/python - <<'PY'
            import hashlib,json,os,sqlite3,time,urllib.request
            import httpx
            from seiltanzer import ai_verdict
            from seiltanzer import ai_runtime_report_v20 as report
            from seiltanzer import ai_provider_transport as transport
            from seiltanzer.llm_decision_shadow import VALID_POLICIES
            with urllib.request.urlopen('http://127.0.0.1:8790/api/ai/history',timeout=5) as response:
                raw=response.read(1048577)
            if len(raw)>1048576:raise ValueError('HISTORY_BOUND')
            trade_id=json.loads(raw).get('trade_id')
            if type(trade_id) is not int:raise SystemExit('NO_ACTIVE_SAVED_REVIEW')
            end=time.monotonic()+5
            with sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=1) as conn:
                conn.execute('PRAGMA query_only=ON')
                conn.set_progress_handler(lambda: time.monotonic()>end,5000)
                row=conn.execute('SELECT ts,length(snapshot_json),snapshot_json FROM ai_verdicts WHERE trade_id=? ORDER BY ts DESC,id DESC LIMIT 1',(trade_id,)).fetchone()
            if not row or not 0<row[1]<=2*1024**2:raise ValueError('SNAPSHOT_BOUND')
            snapshot=json.loads(row[2])
            if not isinstance(snapshot,dict) or snapshot.get('trade_id')!=trade_id:raise ValueError('SNAPSHOT_IDENTITY')
            before=json.dumps(snapshot,sort_keys=True,separators=(',',':'))
            report.install_ai_runtime_report_v20()
            os.environ['OPENROUTER_API_KEY']='offline-contract-replay'
            os.environ.pop('OPENROUTER_PROXY',None)
            def hard(text):
                return [v for v in ai_verdict._validate_model_report(text,snapshot)
                    if v=='изменено рассчитанное действие'
                    or v.startswith('нет политики ') or v.startswith('изменено или пропущено ')]
            def safe_violation(v):
                if v=='изменено рассчитанное действие':return 'ACTION_CHANGED'
                for prefix,label in [('нет политики ','POLICY_MISSING'),('изменено или пропущено ','METRIC_MISSING')]:
                    if v.startswith(prefix):
                        suffix=v[len(prefix):]
                        if suffix.split('.')[0] in VALID_POLICIES:return label+':'+suffix
                return 'OTHER_INTEGRITY_FAILURE'
            baseline=ai_verdict.render_policy_report(snapshot)
            print(json.dumps({'saved_review_ts':row[0],'captured_ts':snapshot.get('captured_ts'),
                'snapshot_bytes':len(row[2].encode()),'baseline_hard_violations':[safe_violation(v) for v in hard(baseline)]},sort_keys=True))
            allowed={'combined_provider_hard_integrity_failure','combined_provider_missing_shadow',
             'combined_provider_missing_policy_scores','combined_provider_invalid_response_budget',
             'shadow_invalid_policy','shadow_invalid_confidence','shadow_missing_reason','shadow_invalid_policy_scores'}
            for policy in sorted(VALID_POLICIES):
                shadow={'policy':policy,'confidence':.7,'reason_ru':'Изолированная проверка контракта, не торговое решение.',
                    'policy_scores':{p:float(p==policy) for p in VALID_POLICIES},
                    'key_evidence':[],'counter_evidence':[],'evidence_families':[],
                    'family_assessments':{},'invalidation_conditions':[]}
                payload={'model':'offline-contract-replay','choices':[{'message':{'content':
                    json.dumps({'shadow_decision':shadow},ensure_ascii=False)},'finish_reason':'stop'}]}
                def post(*args,**kwargs):
                    return httpx.Response(200,json=payload,request=httpx.Request('POST','https://example.invalid'))
                transport.post_json=post
                try:
                    result=report.request_explanation_with_shadow(snapshot,authoritative_snapshot=snapshot)
                    print(json.dumps({'replayed_policy':policy,'result':'VALIDATED_OFFLINE',
                        'shadow_status':result['llm_shadow_decision'].get('status')},sort_keys=True))
                except RuntimeError as exc:
                    reason=str(exc)
                    print(json.dumps({'replayed_policy':policy,'result':'REJECTED',
                        'reason_code':reason if reason in allowed else 'OTHER_RUNTIME_REJECTION'},sort_keys=True))
            print(json.dumps({'input_unchanged':json.dumps(snapshot,sort_keys=True,separators=(',',':'))==before,
                'database_connection_read_only':True,'provider_calls':0,'acks':0,'broker_orders':0,'production_mutation':False}))
            PY
            
