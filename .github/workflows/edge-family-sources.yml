name: edge-family-sources

on:
  pull_request:
    branches: [main]
    paths:
      - 'seiltanzer/edge_family*.py'
      - 'scripts/build_edge_family_sources.py'
      - 'scripts/audit_readiness_matrix.py'
      - 'scripts/publish_active_edge_report.py'
      - 'tests/test_edge_family_source*.py'
      - 'tests/test_readiness_matrix_audit.py'
      - '.github/workflows/edge-family-sources.yml'
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read

concurrency:
  group: edge-family-sources-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 7
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -q -e '.[dev]' paramiko
      - name: Verify bounded causal collectors and local reader
        run: python -m pytest -q tests/test_edge_family_sources.py tests/test_edge_family_source_runtime.py tests/test_readiness_matrix_audit.py
      - name: Collect public source facts off-host, never fabricate models
        run: |
          set -euo pipefail
          python -m scripts.build_edge_family_sources --output edge_family_sources_latest.json
          python - <<'PY'
          import json
          from pathlib import Path
          from seiltanzer.config import ALL_INSTRUMENTS
          from seiltanzer.edge_family_adapters import FAMILIES
          path = Path('edge_family_sources_latest.json')
          report = json.loads(path.read_text())
          assert path.stat().st_size < 950_000, 'local reader has 1MB hard bound'
          assert set(report['instruments']) == set(ALL_INSTRUMENTS)
          assert report['models_produced'] == 0 and report['production_authority'] is False
          assert report['collection_limits']['requests'] <= 16
          assert report['collection_limits']['body_bytes_received'] <= 16_000_000
          assert report['refresh_policy']['scheduled_interval_sec'] == 600
          assert report['refresh_policy']['order_flow_max_age_sec'] == 60
          assert report['refresh_policy']['order_flow_continuous_freshness_guaranteed'] is False
          assert all('api.binance' not in row['official_url'] for row in report['raw_sources'].values())
          for source in report['raw_sources'].values():
              assert source['received_ts'] <= report['captured_ts']
              if source['fetch_status'] == 'FETCHED':
                  assert len(source['body_sha256']) == 64
          for code, row in report['instruments'].items():
              assert set(row['readiness']) == set(FAMILIES)
              assert all(not status['forecast_available'] for status in row['readiness'].values())
              print('EDGE_SOURCE_READINESS', code, json.dumps(row['readiness'], sort_keys=True))
          print('EDGE_SOURCE_COLLECTION_PASS', len(report['instruments']), 'models=0')
          PY
      - name: Audit every configured family from the saved capture
        run: >-
          python -m scripts.audit_readiness_matrix --input edge_family_sources_latest.json
          --json --code-sha "$EXPECTED_SHA" > edge_family_readiness_audit.json
      - name: Publish source facts for exact production SHA only
        if: github.event_name != 'pull_request'
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: >-
          python scripts/publish_active_edge_report.py --password "$SSH_PASSWORD"
          --expected-sha "$EXPECTED_SHA" --input edge_family_sources_latest.json
          --remote-name edge_family_sources_latest.json --run-id "${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-family-sources-${{ env.EXPECTED_SHA }}
          path: |
            edge_family_sources_latest.json
            edge_family_readiness_audit.json
          if-no-files-found: error
          retention-days: 14
