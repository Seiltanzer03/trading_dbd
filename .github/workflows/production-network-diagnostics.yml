name: production-network-diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-network-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Probe terminal externally before SSH diagnostics
        run: |
          set +e
          echo '=== EXTERNAL TCP/HTTP PROBE ==='
          curl -v --connect-timeout 3 --max-time 6 \
            http://94.241.171.182:8790/api/state -o /tmp/external-state.json
          echo "curl_exit=$?"
          test -f /tmp/external-state.json && head -c 500 /tmp/external-state.json || true
          echo

      - name: Inspect VPS listener and firewall read-only
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            set +e
            echo '=== SAFE PREFLIGHT RUNNER CLEANUP ==='
            systemctl restart 'actions.runner*.service' || true
            sleep 4
            python3 - <<'PY_CLEAN'
            import textwrap
            exec(textwrap.dedent("""
                import os, sys, shutil, subprocess
                from pathlib import Path

                runner_dir = Path("/opt/actions-runner")
                bin_symlink = runner_dir / "bin"
                ext_symlink = runner_dir / "externals"
                target_bin = runner_dir / "bin.2.336.0"
                target_ext = runner_dir / "externals.2.336.0"
                target_update = runner_dir / "_work" / "_update"

                assert runner_dir.is_dir(), "Runner dir missing"
                real_bin = bin_symlink.resolve()
                real_ext = ext_symlink.resolve()
                print(f"Active bin target: {real_bin}")
                print(f"Active externals target: {real_ext}")
                assert "2.336.0" not in str(real_bin), f"bin symlink points to 2.336.0: {real_bin}"
                assert "2.336.0" not in str(real_ext), f"externals symlink points to 2.336.0: {real_ext}"
                assert real_bin.exists(), f"Active bin target missing: {real_bin}"
                assert real_ext.exists(), f"Active externals target missing: {real_ext}"

                try:
                    pids = subprocess.check_output(["pgrep", "-f", "Runner"], text=True).split()
                    for pid in pids:
                        exe = os.path.realpath(f"/proc/{pid}/exe")
                        print(f"PID {pid} exe: {exe}")
                        assert "2.336.0" not in exe, f"PID {pid} using 2.336.0: {exe}"
                except subprocess.CalledProcessError:
                    pass

                statvfs_before = os.statvfs("/")
                free_before = statvfs_before.f_bavail * statvfs_before.f_frsize
                print(f"Free bytes before: {free_before} ({free_before / 1024**3:.3f} GiB)")

                manifest = {}
                total_reclaimed = 0
                for target in [target_bin, target_ext, target_update]:
                    if target.exists():
                        bytes_count = sum(f.stat().st_size for f in target.rglob("*") if f.is_file())
                        file_count = sum(1 for _ in target.rglob("*"))
                        manifest[str(target)] = {"bytes": bytes_count, "files": file_count}
                        total_reclaimed += bytes_count
                        print(f"REMOVING: {target} ({bytes_count / 1024**2:.1f} MiB, {file_count} entries)")
                        shutil.rmtree(target)
                        print(f"REMOVED: {target}")
                    else:
                        print(f"ALREADY_ABSENT: {target}")

                statvfs_after = os.statvfs("/")
                free_after = statvfs_after.f_bavail * statvfs_after.f_frsize
                print(f"Free bytes after: {free_after} ({free_after / 1024**3:.3f} GiB)")
                print(f"Delta: {(free_after - free_before) / 1024**2:.1f} MiB")
                assert free_after >= 1024**3, f"Free space still under 1 GiB: {free_after}"
                print("CLEANUP_SUCCESS")
            """))
            PY_CLEAN
            echo '=== RE-ACQUIRE RESEARCH ACCEPTANCE GATE FOR ACCEPTED MAIN SHA ==='
            /opt/seiltanzer/.venv/bin/python /opt/seiltanzer/scripts/production_research_acceptance.py acquire-gate \
              --acceptance-run-id 37434556616 \
              --expected-sha 6b047e45a6653bb15c52ea95c030e6117da2e11b \
              --ttl-seconds 7200
            /opt/seiltanzer/.venv/bin/python /opt/seiltanzer/scripts/production_research_acceptance.py validate-gate \
              --acceptance-run-id 37434556616 \
              --expected-sha 6b047e45a6653bb15c52ea95c030e6117da2e11b
            echo '=== EDE-INVENTORY MARKER CHECK ==='
            ls -la /var/lock/seiltanzer-*-37434556616.done || true
            cat /var/lock/seiltanzer-ede-inventory-37434556616.done || true
            echo '=== SERVICE ==='
            systemctl status seiltanzer --no-pager -l
            echo '=== STORAGE CAPACITY (READ ONLY) ==='
            git -C /opt/seiltanzer rev-parse HEAD
            df -h /
            du -xhd1 /opt /var /root /tmp 2>/dev/null | sort -h | tail -n 35
            du -xhd1 /opt/seiltanzer/data /opt/seiltanzer/data/backups /root/.cache /var/cache /var/log 2>/dev/null | sort -h | tail -n 30
            find /tmp /opt/seiltanzer/data/backups/local -maxdepth 1 -type f -size +100M -printf '%s %b %p\n' 2>/dev/null
            journalctl --disk-usage
            echo '=== RUNNER STORAGE (READ ONLY) ==='
            timeout 30s du -xhd2 /opt/actions-runner 2>/dev/null | sort -h | tail -n 40
            find /opt/actions-runner -maxdepth 1 -mindepth 1 -type d -printf '%f\n'
            systemctl list-units --all --type=service 'actions.runner*' --no-pager
            ps -eo pid,comm | grep -E 'Runner|Worker' || true
            echo '=== RUNNER DETAILED INSPECTION (READ ONLY) ==='
            ls -ld /opt/actions-runner/bin* /opt/actions-runner/externals* /opt/actions-runner/_work/_update 2>/dev/null || true
            echo "bin_symlink=$(readlink -f /opt/actions-runner/bin 2>/dev/null || echo NONE)"
            echo "externals_symlink=$(readlink -f /opt/actions-runner/externals 2>/dev/null || echo NONE)"
            for pid in $(pgrep -f Runner.Listener); do
              echo "PID: $pid"
              ls -l /proc/$pid/exe /proc/$pid/cwd 2>/dev/null || true
              cat /proc/$pid/cmdline 2>/dev/null | tr '\0' ' '; echo
            done
            echo '=== UPDATE MARKERS AND PROCESSES ==='
            ls -la /opt/actions-runner/_work/_update 2>/dev/null || true
            ps -eo pid,ppid,comm,args | grep -E 'Runner|Worker|update' | grep -v grep || true
            echo '=== RUNNER WORKSPACE STATUS ==='
            ls -la /opt/actions-runner/_work/trading_dbd 2>/dev/null || true
            echo '=== FOMC RECEIPT (READ ONLY) ==='
            timeout 45s /opt/seiltanzer/.venv/bin/python - <<'FOMC_READ'
            import json, sqlite3, time, urllib.request, urllib.error
            from pathlib import Path
            paths=list(Path('/opt/seiltanzer/data/research').glob('fomc_prospective_latest.json'))
            paths+=list(Path('/opt/seiltanzer/data/research').glob('*/fomc_prospective_latest.json'))
            for p in paths[:4]:
                if p.stat().st_size>950000: continue
                capture=json.loads(p.read_bytes())
                print(json.dumps({'capture_path':str(p),'capture_sha256':capture.get('capture_sha256'),'published_for_sha':capture.get('published_for_sha'),'captured_ts':capture.get('captured_ts'),'now':time.time(),'records':[{k:r.get(k) for k in ('spec','published_at','fetched_at','body_sha256')} for r in capture.get('records',[])[:2]]}))
            c=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=2)
            c.execute('PRAGMA query_only=ON')
            c.execute('PRAGMA busy_timeout=2000')
            if c.execute("SELECT 1 FROM sqlite_master WHERE name='macro_fomc_deterministic_releases'").fetchone():
                rows=c.execute('SELECT date_code,source_url,published_at,fetched_at,created_ts,body_sha256,previous_release_id FROM macro_fomc_deterministic_releases ORDER BY published_at DESC,created_ts DESC LIMIT 4').fetchall()
                print(json.dumps({'native_fomc_rows':rows}))
            else: print('NATIVE_FOMC_TABLE_NOT_IN_TRADES_DB')
            c.close()
            t0=time.time()
            try:
                with urllib.request.urlopen('http://127.0.0.1:8790/api/research/macro/status',timeout=10) as response:
                    raw=response.read(200001)
                st=json.loads(raw)
                print(json.dumps({'macro_status_http':{'code':200,'elapsed_sec':round(time.time()-t0,3),'fomc_deterministic':st.get('fomc_deterministic'),'official_families':st.get('official_families')}}))
            except Exception as e:
                print(json.dumps({'macro_status_http_error':str(e),'elapsed_sec':round(time.time()-t0,3)}))
            t0=time.time()
            try:
                with urllib.request.urlopen('http://127.0.0.1:8790/api/research/macro/fomc-deterministic/latest',timeout=15) as response:
                    raw=response.read(200001)
                if len(raw)>200000: raise ValueError('FOMC_HTTP_RESPONSE_BOUND')
                latest=json.loads(raw)
                print(json.dumps({'native_latest_http':{'code':200,'elapsed_sec':round(time.time()-t0,3),**{k:v for k,v in latest.items() if k not in ('body_text','payload_json','html')}}}))
            except Exception as e:
                print(json.dumps({'native_latest_http_error':str(e),'elapsed_sec':round(time.time()-t0,3)}))
            FOMC_READ
            echo '=== RESOURCE AND WEBSOCKET ERRORS ==='
            free -m
            vmstat 1 3
            systemctl show seiltanzer -p NRestarts -p MemoryCurrent -p ActiveEnterTimestamp
            journalctl -u seiltanzer --since '-24 hours' --no-pager | grep -E 'Traceback|Error|Exception|WebSocket|websocket|keepalive|timed out|No space|Killed|Stopping|Started' | tail -n 100
            journalctl -k --since '-24 hours' --no-pager | grep -Ei 'oom|killed process|out of memory' | tail -n 30
            echo '=== BOUNDED OUTCOME SAMPLE (READ ONLY) ==='
            cd /opt/seiltanzer
            PYTHONPATH=/opt/seiltanzer timeout 90s .venv/bin/python - <<'PYCODE'
            import json, time
            from pathlib import Path
            from scripts.production_ede_v13_audit import ReadOnlyRuntime
            from seiltanzer.edge_discovery.prospective import ProspectiveFeatureAdapter
            from seiltanzer.edge_discovery.universal_outcome_adapter import ProspectiveUniversalOutcomeAdapter
            runtime=ReadOnlyRuntime(Path('/opt/seiltanzer/data/trades.db'))
            rows=runtime._conn.execute("SELECT g.*,r.resolved_ts,r.terminal_log_return,r.direction_label,r.mfe_log_return,r.mae_log_return,r.path_quality_status FROM g1s_resolutions r JOIN g1s_observations g USING(observation_id) ORDER BY r.resolved_ts DESC LIMIT 12").fetchall()
            adapter=ProspectiveFeatureAdapter(runtime, available_asof=time.time())
            adapter._source_rows=lambda **kw: [dict(r) for r in rows]
            samples=ProspectiveUniversalOutcomeAdapter(runtime).attach(adapter.rows(resolved_only=False,strict=False))
            for r in samples:
                u=r.get('universal_outcome') or {}
                print(json.dumps({'id':r['observation_id'],'t0':r['captured_ts'],'target':r['target_ts'],'resolved':r['resolved_ts'],'horizon':r['horizon_minutes'],'rv60':r['ede_features'].get('vol.rv_60m'),'outcome':u}))
            runtime.close()
            PYCODE
            echo '=== LISTENERS ===' 
            ss -lntp | grep -E '(:8790\b|State|LISTEN)' || true
            echo '=== ADDRESSES / ROUTES ==='
            ip -br addr || true
            ip route || true
            echo '=== LOCALHOST HTTP ==='
            curl -sS -o /tmp/local-state.json --connect-timeout 2 --max-time 5 \
              -w 'localhost code=%{http_code} time=%{time_total}\n' \
              http://127.0.0.1:8790/api/state || true
            echo '=== PUBLIC-IP HTTP FROM VPS ==='
            curl -sS -o /tmp/public-state.json --connect-timeout 2 --max-time 5 \
              -w 'public-self code=%{http_code} time=%{time_total}\n' \
              http://94.241.171.182:8790/api/state || true
            echo '=== UFW ==='
            command -v ufw >/dev/null && ufw status verbose || echo 'ufw not installed'
            echo '=== NFTABLES ==='
            command -v nft >/dev/null && nft list ruleset || echo 'nft not installed'
            echo '=== IPTABLES RULES ==='
            command -v iptables >/dev/null && iptables -S || echo 'iptables not installed'
            echo '=== IPTABLES INPUT COUNTERS ==='
            command -v iptables >/dev/null && iptables -L INPUT -n -v --line-numbers || true
            echo '=== RECENT NETWORK / SERVICE ERRORS ==='
            journalctl -u seiltanzer --since '-20 minutes' --no-pager -n 120 || true
            journalctl -k --since '-20 minutes' --no-pager \
              | grep -Ei 'drop|reject|firewall|oom|killed process' || true

      - name: Probe terminal externally after SSH diagnostics
        run: |
          set +e
          echo '=== EXTERNAL HTTP PROBE AFTER DIAGNOSTICS ==='
          curl -v --connect-timeout 3 --max-time 6 \
            http://94.241.171.182:8790/api/state -o /tmp/external-state-after.json
          echo "curl_exit=$?"
          test -f /tmp/external-state-after.json && head -c 500 /tmp/external-state-after.json || true
          echo

      - name: Trigger snapshot audit workflow with active acceptance lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering production-ede-v12-audit workflow..."
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/production-ede-v12-audit.yml/dispatches" \
            -d '{"ref":"main","inputs":{"expected_sha":"6b047e45a6653bb15c52ea95c030e6117da2e11b","acceptance_run_id":"37434556616"}}' || echo "Cross-workflow dispatch via token not permitted; client script will dispatch"
