name: production-hypothesis-cloud-diagnostics
on:
  push:
    branches: [agent/offhost-headroom-recovery]
    paths: [.github/workflows/production-network-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/offhost-headroom-recovery
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install boto3 -e ".[dev]"
      - name: Restore verified cloud snapshot and diagnose frozen folds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
          EXPECTED_SHA: d8f01d9fdd33ae3706c93f54d2053d032efda2c4
          BACKUP_KEY: backups/v1/daily-slot-2/snapshot.sqlite3.gz
        run: python scripts/verify_cloud_backup_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hypothesis-fold-diagnostics
          path: ${{ runner.temp }}/verified-research.json
          retention-days: 14
