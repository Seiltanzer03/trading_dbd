name: production-network-diagnostics

# One-off exact-SHA capacity inventory; only reads metadata and small receipts.
on:
  push:
    branches: ["ops/capacity-fdffdbd-20261014"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      EXPECTED_SHA: fdffdbde030164bf4cd00fba24ef8f6d0d133121
    steps:
      - name: Inventory exact-SHA disk allocation read-only
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 5m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            systemctl is-active seiltanzer
            df -B1 /
            for directory in /opt/seiltanzer/.git /opt/seiltanzer/data/research /opt/actions-runner /var/log /root/.cache /var/cache /tmp; do
              timeout 20s du -xhd2 "$directory" 2>/dev/null | sort -n | tail -n 14 || true
            done
            find /opt/seiltanzer/data/research /var/log /opt/actions-runner -xdev -maxdepth 3 -type f -size +5M -printf '%s %b %T@ %p\n' 2>/dev/null | sort -nr | head -n 55 || true
            for file in /opt/seiltanzer/data/trades.db /opt/seiltanzer/data/trades.db-wal /opt/seiltanzer/data/trades.db-shm; do
              stat -c 'DATABASE_STAT size=%s blocks=%b path=%n' "$file" 2>/dev/null || true
            done
            journalctl --disk-usage
            /opt/seiltanzer/.venv/bin/python - <<'PY'
            import json
            from pathlib import Path
            root = Path('/opt/seiltanzer/data/research')
            ledger = root / 'ede_v13_candidate_registry.jsonl'
            for path in (ledger, Path(str(ledger) + '.gz'), Path(str(ledger) + '.archive.json')):
                if path.exists():
                    info = path.stat()
                    print('LEDGER_STAT', json.dumps({'path': str(path), 'size': info.st_size, 'allocated': info.st_blocks * 512, 'mtime_ns': info.st_mtime_ns}))
            receipt = Path(str(ledger) + '.archive.json')
            if receipt.is_file() and receipt.stat().st_size <= 65536:
                value = json.loads(receipt.read_text())
                keys = ('contract_version', 'source_name', 'source_sha256', 'source_size_bytes', 'compressed_sha256', 'compressed_size_bytes', 'verified_full_get', 'object_key', 'expected_sha')
                print('LEDGER_RECEIPT', json.dumps({key: value.get(key) for key in keys}))
            PY
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            systemctl is-active seiltanzer
            curl -fsS --max-time 8 http://127.0.0.1:8790/api/state -o /dev/null
            echo "CAPACITY_INVENTORY_READ_ONLY_PASS expected_sha=$EXPECTED_SHA"
