name: production-network-diagnostics

# One-off archive operation using existing Yandex storage, no runtime deployment.
on:
  push:
    branches: ["ops/yandex-closed-systemlogs-fdffdbd-20261014"]

permissions:
  contents: read

concurrency:
  group: production-seiltanzer
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: fdffdbde030164bf4cd00fba24ef8f6d0d133121
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check archive safety and existing metadata repair
        run: |
          python -m pip install --quiet pytest paramiko boto3 PyYAML
          python -m pytest -q tests/test_ops_yandex_closed_logs.py tests/test_ede_ledger_archive.py tests/test_compact_deployment_git.py
      - name: Require existing green exact-SHA CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 8 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${EXPECTED_SHA}/status" \
            | python3 -c 'import json,sys; body=json.load(sys.stdin); assert any(r["context"]=="ci/full-webkit" and r["state"]=="success" for r in body["statuses"])'
      - name: Archive fully verified closed logs through Yandex Storage
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: "true"
        run: python scripts/ops_yandex_closed_logs.py --expected-sha "$EXPECTED_SHA" --apply --rotate-btmp
      - name: Verify capacity and compact only reconstructible Git metadata if needed
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 12m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            free=$(python3 -c 'import os;v=os.statvfs("/opt/seiltanzer");print(v.f_bavail*v.f_frsize)')
            if [ "$free" -lt 1288490188 ]; then
              /opt/seiltanzer/.venv/bin/python /opt/seiltanzer/scripts/compact_deployment_git.py \
                --repo /opt/seiltanzer --expected-sha "$EXPECTED_SHA" --apply
            fi
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            systemctl is-active seiltanzer
            curl -fsS --max-time 8 http://127.0.0.1:8790/api/state -o /dev/null
            df -B1 /
            python3 -c 'import json,os;v=os.statvfs("/opt/seiltanzer");n=v.f_bavail*v.f_frsize;print("CAPACITY_RESULT="+json.dumps({"free_bytes":n,"research_reserve_bytes":1073741824,"reserve_available":n>=1073741824,"runtime_sha":os.environ["EXPECTED_SHA"]}))'
            python3 - <<'PY'
            import json,stat,subprocess,tempfile
            from pathlib import Path
            for name in ('btmp','btmp.1','btmp.1.gz'):
                p=Path('/var/log')/name
                print('BTMP_PATH='+json.dumps({'path':str(p),'exists':p.exists(),'symlink':p.is_symlink(),'size':p.stat().st_size if p.is_file() else None}))
            p=Path('/var/log/btmp')
            mode=format(stat.S_IMODE(p.stat().st_mode),'04o')
            with tempfile.TemporaryDirectory(prefix='btmp-readonly-debug-') as tmp:
                config=Path(tmp)/'config'
                config.write_text('/var/log/btmp {\nsu root utmp\nrotate -1\ncreate '+mode+' root utmp\nnocompress\nmissingok\nnotifempty\n}\n')
                config.chmod(0o600)
                r=subprocess.run(['/usr/sbin/logrotate','--debug','--force','--state',str(Path(tmp)/'state'),str(config)],capture_output=True,text=True,timeout=30)
                print('BTMP_LOGROTATE_READONLY_DEBUG='+json.dumps({'returncode':r.returncode,'stderr':r.stderr[-6000:]}))
            PY
