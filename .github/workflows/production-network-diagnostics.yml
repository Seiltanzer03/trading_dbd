name: production-network-diagnostics
on:
  workflow_dispatch:
    inputs:
      compact_git:
        description: Must remain false for this read-only history diagnostic
        type: boolean
        default: false
      expected_sha:
        description: Exact installed production SHA
        type: string
        required: true
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && !inputs.compact_git
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Install existing SSH client on the disposable worker
        run: pip install 'paramiko>=3.3,<6'
      - name: Measure bounded SFTP reads of the public Python executable only
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python - <<'PYTHON'
          import os,time,json,paramiko
          client=paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())
          client.connect('94.241.171.182',username='root',password=os.environ['SSH_PASSWORD'],
                         look_for_keys=False,allow_agent=False,timeout=15,auth_timeout=30)
          try:
              sftp=client.open_sftp();sftp.get_channel().settimeout(20)
              try:
                  path='/usr/bin/python3'
                  size=sftp.stat(path).st_size
                  assert 1048576<=size<=64*1048576
                  for requests in (32,64):
                      started=time.monotonic();offset=0;window_end=0
                      with sftp.open(path,'rb') as source:
                          while True:
                              if offset<size and offset>=window_end:
                                  window_end=min(offset+4*1048576,size)
                                  source.prefetch(file_size=window_end,max_concurrent_requests=requests)
                              chunk=source.read(1048576)
                              if not chunk:break
                              offset+=len(chunk)
                              assert time.monotonic()-started<90
                      assert offset==size
                      elapsed=time.monotonic()-started
                      print(json.dumps({'scope':'public_python_binary_only','requests':requests,
                            'bytes':offset,'elapsed_sec':round(elapsed,3),
                            'mib_per_sec':round(offset/1048576/elapsed,3)}),flush=True)
              finally:sftp.close()
              for window in (2*1048576,16*1048576):
                  started=time.monotonic();offset=0
                  channel=client.get_transport().open_session(window_size=window)
                  channel.settimeout(20)
                  try:
                      channel.exec_command('/bin/cat -- /usr/bin/python3')
                      with channel.makefile('rb') as source:
                          while True:
                              chunk=source.read(1048576)
                              if not chunk:break
                              offset+=len(chunk)
                      assert channel.recv_exit_status()==0 and offset==size
                  finally:channel.close()
                  elapsed=time.monotonic()-started
                  print(json.dumps({'scope':'public_python_binary_ssh_stream','window_bytes':window,
                        'bytes':offset,'elapsed_sec':round(elapsed,3),
                        'mib_per_sec':round(offset/1048576/elapsed,3)}),flush=True)
              import gzip
              started=time.monotonic();offset=0
              channel=client.get_transport().open_session(window_size=16*1048576)
              channel.settimeout(20)
              try:
                  channel.exec_command('/bin/gzip -1 -c -- /usr/bin/python3')
                  with channel.makefile('rb') as wire,gzip.GzipFile(fileobj=wire,mode='rb') as source:
                      while True:
                          chunk=source.read(1048576)
                          if not chunk:break
                          offset+=len(chunk)
                  assert channel.recv_exit_status()==0 and offset==size
              finally:channel.close()
              elapsed=time.monotonic()-started
              print(json.dumps({'scope':'public_python_binary_gzip_ssh_stream','bytes':offset,
                    'elapsed_sec':round(elapsed,3),'mib_per_sec':round(offset/1048576/elapsed,3)}),flush=True)
          finally:client.close()
          PYTHON
