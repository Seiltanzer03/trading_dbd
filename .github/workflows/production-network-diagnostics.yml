name: production-network-diagnostics
on:
  workflow_dispatch:
    inputs:
      compact_git:
        description: Must remain false for this read-only history diagnostic
        type: boolean
        default: false
      expected_sha:
        description: Exact installed production SHA
        type: string
        required: true
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && !inputs.compact_git
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Read native history metadata without opening SQLite or changing service
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            df -B1 /
            systemctl show seiltanzer.service -p Id -p LoadState -p ActiveState -p SubState -p Result -p ExecMainStatus -p ActiveEnterTimestamp -p InactiveEnterTimestamp
            /usr/bin/python3 - <<'PY'
            import json, os, stat, time
            from pathlib import Path
            root=Path('/opt/seiltanzer/data')
            fields=('contract','run_id','application_sha','phase','service_started','abort_reason','started_wall_ts','started_monotonic','production_retirement_observed','reason','admitted','free_bytes','required_free_bytes')
            names=('cutover.active','cutover.preparation.json','cutover.journal.json','cutover.result.json','cutover.capacity.json','cutover.plan.json','cutover.request.json','cutover.abort.json')
            for name in names:
                p=root/name
                try:
                    fd=os.open(p,os.O_RDONLY|os.O_NOFOLLOW)
                except FileNotFoundError:
                    print(json.dumps({'file':name,'present':False}));continue
                try:
                    info=os.fstat(fd)
                    if not stat.S_ISREG(info.st_mode) or info.st_uid!=0 or info.st_mode&0o077 or info.st_size>262144:
                        raise ValueError('unsafe_metadata')
                    with os.fdopen(fd,'rb',closefd=False) as f: raw=f.read(262145)
                    data=json.loads(raw)
                    output={'file':name,'present':True,'mtime':info.st_mtime,**{k:data[k] for k in fields if k in data}}
                    if name=='cutover.preparation.json' and isinstance(data.get('source'),dict):
                        output['source_identity']=data['source'].get('identity')
                    print(json.dumps(output,sort_keys=True))
                finally:os.close(fd)
            p=root/'trades.db';s=p.stat()
            print(json.dumps({'database_size_bytes':s.st_size,'allocated_bytes':s.st_blocks*512,'now':time.time()}))
            PY
            journalctl -u seiltanzer --since '-10 hours' --no-pager -o cat | grep '^STARTUP_PHASE' | tail -n 20 || true
            code=$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8790/api/state || true)
            echo "CURRENT_HTTP=$code"
