name: production-network-diagnostics
on:
  push:
    branches: [agent/offhost-headroom-recovery]
    paths: [.github/workflows/production-network-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 5m
          script: |
            set -eu
            git -C /opt/seiltanzer rev-parse HEAD
            df -B1 /
            du -xhd1 /root/.cache /var/cache /var/log /tmp /opt/seiltanzer/data /opt/seiltanzer/.git 2>/dev/null | sort -h
            journalctl --disk-usage
            find /tmp /opt/seiltanzer/data/backups/local -maxdepth 1 -type f -size +50M -printf '%s %b %p\n'
            ls -lh /opt/seiltanzer/data/trades.db*
            systemctl show seiltanzer -p ActiveState -p NRestarts -p MemoryCurrent
