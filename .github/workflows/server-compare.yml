name: Compare server code with GitHub

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/server-compare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Compare /opt/seiltanzer with origin/main
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 5m
          script: |
            set -e
            cd /opt/seiltanzer
            git fetch origin main

            echo "=== SERVER HEAD ==="
            git rev-parse HEAD

            echo "=== GITHUB MAIN ==="
            git rev-parse origin/main

            echo "=== TRACKED CHANGES ==="
            git diff --name-status origin/main -- . || true

            echo "=== UNTRACKED FILES ==="
            git ls-files --others --exclude-standard || true

            echo "=== WORKTREE STATUS ==="
            git status --short

            if git diff --quiet origin/main -- . && [ -z "$(git ls-files --others --exclude-standard)" ]; then
              echo "RESULT: SERVER_CODE_MATCHES_GITHUB_MAIN"
            else
              echo "RESULT: SERVER_CODE_DIFFERS_FROM_GITHUB_MAIN"
            fi
