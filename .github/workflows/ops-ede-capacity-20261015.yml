name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  runner-and-runtime-readonly:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 55fe3f784604ce8007e98e074a73ff33fc672466
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet paramiko
      - name: Verify runner identity and actual AI readiness without generation
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import os,sys,shlex
          sys.path.insert(0,'scripts')
          from production_ede_offload import _connect,_exec,_verify_sha
          client=_connect(os.environ['SSH_PASSWORD'],attempts=1)
          try:
              _verify_sha(client,'55fe3f784604ce8007e98e074a73ff33fc672466')
              code="""
          import pathlib,json,subprocess,time,urllib.request,os
          for name in ('bin','externals'):
              p=pathlib.Path('/opt/actions-runner')/name
              print('RUNNER_LINK='+json.dumps({'path':str(p),'symlink':p.is_symlink(),'target':str(p.resolve()),'exists':p.exists()}),flush=True)
          print(subprocess.check_output(['ps','-eo','pid,comm,rss','--sort=-rss'],text=True,timeout=5).splitlines()[:8],flush=True)
          memory={k:v.strip() for k,v in (line.split(':',1) for line in pathlib.Path('/proc/meminfo').read_text().splitlines()) if k in ('MemAvailable','MemTotal','SwapFree','SwapTotal')}
          print('MEMORY='+json.dumps(memory),flush=True)
          for p in pathlib.Path('/proc').iterdir():
              if not p.name.isdigit():continue
              try:exe=os.readlink(p/'exe')
              except OSError:continue
              if exe.startswith('/opt/actions-runner/'):
                  print('RUNNER_PROCESS='+json.dumps({'pid':p.name,'exe':exe}),flush=True)
          with urllib.request.urlopen('http://127.0.0.1:8790/api/ai/snapshot/status',timeout=5) as response:
              body=json.loads(response.read(1000000))
              print('AI_STATUS='+json.dumps({'http':response.status,'ready':body.get('ready'),'building':body.get('building'),'active_trade_present':body.get('current_trade_id') is not None,'snapshot_present':body.get('snapshot_trade_id') is not None,'invalidated_reason':body.get('invalidated_reason'),'build_n':body.get('build_n'),'error_present':body.get('last_error') is not None}),flush=True)
          """
              print(_exec(client,'python3 -c '+shlex.quote(code),timeout=25),flush=True)
          finally:client.close()
          PY
