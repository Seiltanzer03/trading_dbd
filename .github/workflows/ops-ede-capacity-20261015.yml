name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  actual-disk-admission-readonly:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9bf0e5dfd7e32406a3c5f3aeeca3a3e8836e65f0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet paramiko
      - name: Verify actual optional-write pause without orders or provider calls
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import os,sys,shlex
          sys.path.insert(0,'scripts')
          from production_ede_offload import _connect,_exec,_verify_sha
          client=_connect(os.environ['SSH_PASSWORD'],attempts=1)
          try:
              _verify_sha(client,'9bf0e5dfd7e32406a3c5f3aeeca3a3e8836e65f0')
              code=r'''
          import json,urllib.request,time
          from types import SimpleNamespace
          from seiltanzer.background_disk_admission import disk_state,REASON
          pressure=disk_state(SimpleNamespace(settings=SimpleNamespace(demo=False,data_dir='/opt/seiltanzer/data')))
          def read(path):
              started=time.monotonic()
              with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=5) as response:
                  raw=response.read(1024**2+1)
                  if len(raw)>1024**2:raise ValueError('Read-only response exceeds bound')
                  return json.loads(raw),round((time.monotonic()-started)*1000,1)
          worker,worker_ms=read('/api/research/runtime/worker-status')
          passive,passive_ms=read('/api/research/passive/status')
          ai,ai_ms=read('/api/ai/snapshot/status')
          if pressure['pause_background'] and passive.get('last_skip_reason')!=REASON:
              raise ValueError('Low disk did not expose actual passive pause')
          state=worker.get('worker') or {}
          print('ACTUAL_DISK_ADMISSION='+json.dumps({'checked_out_code_sha':'9bf0e5dfd7e32406a3c5f3aeeca3a3e8836e65f0',
              'pressure':pressure,'passive':{'collector_status':passive.get('collector_status'),'last_skip_reason':passive.get('last_skip_reason'),'latest_error':passive.get('latest_error'),'elapsed_ms':passive_ms},
              'worker':{k:state.get(k) for k in ('current_phase','disk_pause_active','disk_pressure','memory_pause_active','last_error')},
              'worker_elapsed_ms':worker_ms,'ai':{'ready':ai.get('ready'),'building':ai.get('building'),'canonical_quote_available':ai.get('canonical_quote_available'),'elapsed_ms':ai_ms},
              'orders_sent':0,'provider_calls':0,'database_mutations':0,'production_authority':False}),flush=True)
          '''
              print(_exec(client,'cd /opt/seiltanzer && /opt/seiltanzer/.venv/bin/python -c '+shlex.quote(code),timeout=25),flush=True)
          finally:client.close()
          PY
