name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  exact-startup-state-readonly:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a62a1c03519f7611121148eb542d4443b9c3ba1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet paramiko
      - name: Observe exact startup and quote authority without generation or restart
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import os,sys,shlex,ast
          sys.path.insert(0,'scripts')
          from production_ede_offload import _connect,_exec
          code="import json,shutil,subprocess,time,urllib.request\nsha=subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True,timeout=3).strip()\nallowed={'9bf0e5dfd7e32406a3c5f3aeeca3a3e8836e65f0','011b363d6cf985b0a00a35964d74a81331558bb4','4a62a1c03519f7611121148eb542d4443b9c3ba1'}\nif sha not in allowed:raise ValueError('Unreviewed production SHA')\nservice=subprocess.check_output(['systemctl','show','seiltanzer','--property=ActiveState,SubState,ExecMainStatus,NRestarts,MainPID,MemoryCurrent'],text=True,timeout=3)\nprint('STARTUP_SERVICE='+json.dumps({'code_sha':sha,'properties':dict(line.split('=',1) for line in service.splitlines() if '=' in line),'free_bytes':shutil.disk_usage('/opt/seiltanzer').free}),flush=True)\nfor label,path in [('state','/api/state'),('ai','/api/ai/snapshot/status'),('worker','/api/research/runtime/worker-status')]:\n    start=time.monotonic()\n    try:\n        with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=3) as response:\n            raw=response.read(1048577)\n        if len(raw)>1048576:raise ValueError('Status exceeds bound')\n        value=json.loads(raw)\n        if label=='ai':\n            data={k:value.get(k) for k in ('ready','building','build_n','build_ms','build_started_at','invalidated_reason','canonical_quote_available')}\n            data['error_type']=str(value.get('last_error') or '').split(':')[0] or None\n        elif label=='worker':\n            value=value.get('worker') or {}\n            data={k:value.get(k) for k in ('current_phase','disk_pause_active','memory_pause_active','first_core_completed_ts','last_core_completed_ts')}\n        else:\n            feeds=value.get('feeds') or (value.get('tick') or {}).get('feeds') or {}\n            quote=feeds.get('price') or {}\n            data={'quote':{k:quote.get(k) for k in ('source','status','fresh','production_authority','derived','is_proxy')}}\n        print('STARTUP_HTTP='+json.dumps({'route':label,'available':True,'elapsed_ms':round((time.monotonic()-start)*1000,1),'data':data}),flush=True)\n    except Exception as exc:\n        print('STARTUP_HTTP='+json.dumps({'route':label,'available':False,'elapsed_ms':round((time.monotonic()-start)*1000,1),'error_type':type(exc).__name__}),flush=True)\nprint('READONLY_SCOPE='+json.dumps({'provider_calls':0,'llm_requests':0,'database_reads':0,'database_mutations':0,'service_mutations':0}),flush=True)"
          ast.parse(code)
          client=_connect(os.environ['SSH_PASSWORD'],attempts=1)
          try:
              _exec(client,'python3 -c '+shlex.quote(code),timeout=25)
          finally:client.close()
          PY
