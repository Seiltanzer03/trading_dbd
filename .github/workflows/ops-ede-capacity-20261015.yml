name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
  actions: write
jobs:
  finalize-bounded-diagnostics:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Finalize only our unused local-runner diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          base='https://api.github.com/repos/${{ github.repository }}/actions/runs/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def request(path,method='GET'):
              r=urllib.request.urlopen(urllib.request.Request(base+path,headers=headers,method=method),timeout=15)
              body=r.read()
              return json.loads(body) if body else {}
          for rid in ('38803679910','38803965683'):
              run=request(rid)
              assert run['head_branch']=='ops/ede-capacity-20261015'
              print('LOCAL_DIAGNOSTIC_RUN='+json.dumps({'id':rid,'status':run['status'],'conclusion':run['conclusion']}),flush=True)
              if run['status']!='completed':
                  try:
                      request(rid+'/force-cancel','POST')
                      print('UNUSED_LOCAL_CHECK_FORCE_CANCEL='+rid,flush=True)
                  except urllib.error.HTTPError as e:
                      if e.code!=409:raise
          PY
      - name: Record final bounded public reachability
        run: |
          code=$(curl -sS --connect-timeout 3 --max-time 6 -o /dev/null -w '%{http_code}' http://94.241.171.182:8790/api/state || true)
          echo "FINAL_PUBLIC_API_HTTP=$code"
