name: ops-ede-capacity-20261015
'on':
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  disposable-systemd-history-fence:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 98ded14f43d56013e6da2d58971e99c20af416c2
      - name: Prove real systemd refuses guarded prestart without production access
        run: sudo /usr/bin/python3 scripts/history_service_fence_drill.py --output /tmp/history-systemd-proof.json
      - name: Preserve bounded disposable proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-systemd-history-fence-proof
          path: /tmp/history-systemd-proof.json
          if-no-files-found: warn
          retention-days: 7
