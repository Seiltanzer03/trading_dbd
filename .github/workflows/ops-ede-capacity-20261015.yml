name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
  actions: write
jobs:
  finalize-failed-attempt:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - name: Finalize only the confirmed failed export with stuck cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}/actions/runs/38778692434"
          curl -fsS --max-time 10 -H "Authorization: Bearer $GH_TOKEN" "$api/jobs" > "$RUNNER_TEMP/jobs.json"
          python - <<'PY'
          import json,os,pathlib
          jobs=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'jobs.json').read_text())['jobs']
          audit=next(j for j in jobs if j['name']=='audit')
          assert audit['id']==116651229993
          assert any(s['name']=='Export a current consistent live snapshot without VPS disk use' and s['conclusion']=='failure' for s in audit['steps'])
          assert not any(s['name']=='Run EDE v1.3 research off production VPS' and s['status']!='queued' and s.get('conclusion') not in (None,'skipped') for s in audit['steps'])
          PY
          curl -fsS --max-time 20 -X POST -H "Authorization: Bearer $GH_TOKEN" "$api/cancel"
          echo CONFIRMED_FAILED_EXPORT_CLEANUP_CANCEL_REQUESTED=38778692434
      - name: Probe public state with a fixed network deadline
        run: |
          code=$(curl -sS --connect-timeout 3 --max-time 6 -o /dev/null -w '%{http_code}' http://94.241.171.182:8790/api/state || true)
          echo "PUBLIC_API_HTTP=$code"
