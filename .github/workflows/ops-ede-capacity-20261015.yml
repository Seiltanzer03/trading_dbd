name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  resumed-host-diagnostics:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 588edd8d9093717848530ece5f9bbcea5bed08ed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet paramiko
      - name: Read exact restart cause and release only our failed acceptance owner
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import os,sys,shlex
          sys.path.insert(0,'scripts')
          from production_ede_offload import _connect,_exec,_verify_sha
          client=_connect(os.environ['SSH_PASSWORD'],attempts=1)
          try:
              _verify_sha(client,'588edd8d9093717848530ece5f9bbcea5bed08ed')
              code="""
          import json,pathlib,subprocess
          mem={k:v.strip() for k,v in (s.split(':',1) for s in pathlib.Path('/proc/meminfo').read_text().splitlines()) if k in ('MemTotal','MemAvailable','SwapTotal','SwapFree')}
          print('MEMORY='+json.dumps(mem),flush=True)
          for command in (['uptime','-s'],['df','-B1','/'],['systemctl','show','seiltanzer','-p','ActiveState','-p','SubState','-p','NRestarts','-p','MainPID','-p','ExecMainStartTimestamp','-p','MemoryCurrent','-p','MemoryPeak','-p','Result']):
              print(subprocess.check_output(command,text=True,timeout=5),flush=True)
          print(subprocess.check_output(['ps','-eo','pid,comm,rss,pcpu','--sort=-rss'],text=True,timeout=5).splitlines()[:10],flush=True)
          for unit in ('kernel','application'):
              command=['journalctl','--since','2026-10-15 20:22:00 UTC','-n','250','--no-pager','-o','cat']
              command+=['-k'] if unit=='kernel' else ['-u','seiltanzer']
              result=subprocess.run(command,capture_output=True,text=True,timeout=8)
              for line in result.stdout.splitlines():
                  if (unit=='kernel' and any(w in line.lower() for w in ('out of memory','oom','killed process'))) or (unit=='application' and (line.startswith(('STARTUP_PHASE ','INFO:     Started server','INFO:     Waiting for application','INFO:     Application startup','INFO:     Uvicorn')) or any(w in line.lower() for w in ('main process exited','oom-kill','failed with result','scheduled restart','starting seiltanzer')))):
                      print(unit.upper()+'='+line[:900],flush=True)
          """
              print(_exec(client,'python3 -c '+shlex.quote(code),timeout=35),flush=True)
              print(_exec(client,'/opt/seiltanzer/.venv/bin/python /opt/seiltanzer/scripts/production_research_acceptance.py release-gate --acceptance-run-id 38771372036 --expected-sha 588edd8d9093717848530ece5f9bbcea5bed08ed',timeout=30),flush=True)
          finally:client.close()
          PY
