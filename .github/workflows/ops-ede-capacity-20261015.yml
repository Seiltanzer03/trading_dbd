name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  current-capacity-readonly:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 55fe3f784604ce8007e98e074a73ff33fc672466
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet paramiko
      - name: Read bounded capacity metadata and current API status
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import os,sys,shlex
          sys.path.insert(0,'scripts')
          from production_ede_offload import _connect,_exec,_verify_sha
          client=_connect(os.environ['SSH_PASSWORD'],attempts=1)
          try:
              _verify_sha(client,'55fe3f784604ce8007e98e074a73ff33fc672466')
              code="""
          import os,pathlib,time,json,subprocess,stat,urllib.request
          root=pathlib.Path('/opt/seiltanzer')
          v=os.statvfs(root)
          print('CAPACITY='+json.dumps({'free_bytes':v.f_bavail*v.f_frsize,'required_bytes':1024**3}),flush=True)
          for base in (root,pathlib.Path('/opt/actions-runner'),pathlib.Path('/root/wheels')):
              if not base.is_dir() or base.is_symlink():continue
              for child in sorted(base.iterdir()):
                  if child.is_symlink():continue
                  if base==root and child.name in ('data','.venv','.git'):continue
                  if child.is_dir():
                      try:
                          result=subprocess.run(['du','-sx','-B1',str(child)],text=True,capture_output=True,timeout=5)
                          size=int(result.stdout.split()[0]) if result.returncode==0 else None
                      except (subprocess.TimeoutExpired,ValueError,IndexError):size=None
                  elif child.is_file():size=child.stat().st_blocks*512
                  else:continue
                  if size is None or size>1024**2:print('ROOT_CHILD='+json.dumps({'path':str(child),'allocated':size}),flush=True)
          for directory in ('data/research','data/backups','data','venv','.venv','.git'):
              base=root/directory
              if not base.is_dir() or base.is_symlink():continue
              started=time.monotonic(); entries=[]; total=0; limited=False; seen=0
              for current,dirs,files in os.walk(base,followlinks=False):
                  dirs[:]=[d for d in dirs if not pathlib.Path(current,d).is_symlink()]
                  for name in files:
                      seen+=1
                      if seen>12000 or time.monotonic()-started>6:limited=True;break
                      path=pathlib.Path(current,name)
                      try:s=path.lstat()
                      except OSError:continue
                      if not stat.S_ISREG(s.st_mode):continue
                      allocated=s.st_blocks*512;total+=allocated
                      entries.append({'path':str(path),'bytes':s.st_size,'allocated':allocated,'mtime':int(s.st_mtime),'links':s.st_nlink})
                  if limited:break
              print('FILES='+json.dumps({'root':str(base),'allocated_seen':total,'limited':limited,'largest':sorted(entries,key=lambda e:e['allocated'],reverse=True)[:12]}),flush=True)
          for directory in ('/var/log','/root/.cache','/tmp','/opt/actions-runner/_diag'):
              base=pathlib.Path(directory);entries=[];start=time.monotonic();seen=0
              if not base.is_dir() or base.is_symlink():continue
              for current,dirs,files in os.walk(base,followlinks=False):
                  dirs[:]=[d for d in dirs if not pathlib.Path(current,d).is_symlink()]
                  for name in files:
                      seen+=1
                      if seen>6000 or time.monotonic()-start>4:break
                      p=pathlib.Path(current,name)
                      try:s=p.lstat()
                      except OSError:continue
                      if stat.S_ISREG(s.st_mode):entries.append({'path':str(p),'bytes':s.st_size,'allocated':s.st_blocks*512})
                  if seen>6000 or time.monotonic()-start>4:break
              print('SYSTEM_FILES='+json.dumps({'root':directory,'largest':sorted(entries,key=lambda e:e['allocated'],reverse=True)[:10]}),flush=True)
          print(subprocess.check_output(['systemctl','show','seiltanzer','-p','ActiveState','-p','SubState','-p','NRestarts','-p','MemoryCurrent','-p','MemoryPeak'],text=True,timeout=5),flush=True)
          for route in ('/api/state','/api/research/runtime/worker-status','/api/ai/snapshot/status'):
              started=time.monotonic()
              with urllib.request.urlopen('http://127.0.0.1:8790'+route,timeout=5) as response:
                  raw=response.read(2000001);body=json.loads(raw) if len(raw)<=2000000 else {}
                  worker=body.get('worker') or {}
                  summary={k:worker.get(k) for k in ('current_phase','core_stage','last_error','acceptance_pause_active','acceptance_gate_run_id')}
                  if route.endswith('/snapshot/status'):summary={k:body.get(k) for k in ('ready','status','running','last_error','reason','has_active_trade')}
                  print('API='+json.dumps({'route':route,'http':response.status,'ms':round((time.monotonic()-started)*1000,1),'status':summary}),flush=True)
          """
              print(_exec(client,'python3 -c '+shlex.quote(code),timeout=75),flush=True)
          finally:client.close()
          PY
