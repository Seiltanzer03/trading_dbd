name: ops-ede-capacity-20261015
'on':
  push:
    branches:
    - ops/ede-capacity-20261015
    paths:
    - .github/workflows/ops-ede-capacity-20261015.yml
permissions:
  contents: read
jobs:
  g1-source-dependency-readonly:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 5fe2e56d6a5d1f8da20c9a918fe3592d3e6eb5d4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python -m pip install --quiet paramiko
    - name: Read bounded G1S source dependency metadata without mutation
      env:
        SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      run: 'python - <<''PY''

        import os,sys,shlex,ast

        sys.path.insert(0,''scripts'')

        from production_ede_offload import _connect,_exec

        code="import json,os,resource,sqlite3,subprocess,time\n\nEXPECTED=''5fe2e56d6a5d1f8da20c9a918fe3592d3e6eb5d4''\nresource.setrlimit(resource.RLIMIT_AS,(192*1024**2,192*1024**2))\nactual=subprocess.check_output([''git'',''-C'',''/opt/seiltanzer'',''rev-parse'',''HEAD''],text=True,timeout=3).strip()\nif actual!=EXPECTED:raise ValueError(''Unexpected source generation'')\nstarted=time.monotonic(); overall=started+30\nconn=sqlite3.connect(''file:/opt/seiltanzer/data/trades.db?mode=ro'',uri=True,timeout=1)\nconn.execute(''PRAGMA query_only=ON'');conn.execute(''PRAGMA trusted_schema=OFF'');conn.execute(''PRAGMA cache_size=-2048'')\nconn.setlimit(sqlite3.SQLITE_LIMIT_LENGTH,65536)\ndiagnostics={}; deadline=overall\nconn.set_progress_handler(lambda:time.monotonic()>=deadline,1000)\ndef bounded(sql):\n global deadline\n deadline=min(overall,time.monotonic()+5)\n for row in conn.execute(sql):\n  if time.monotonic()>=deadline:raise TimeoutError(''Bounded metadata read expired'')\n  yield row\ndef names(label,sql):\n result=set(); size=0\n for (value,) in bounded(sql+'' LIMIT 100001''):\n  if value is None:continue\n  if not isinstance(value,str) or len(value)>4096:raise ValueError(''Invalid metadata identity'')\n  size+=len(value.encode(''utf8''));result.add(value)\n  if len(result)>100000 or size>16*1024**2:raise ValueError(''Metadata set exceeds bound'')\n diagnostics[label]={''distinct_ids'':len(result),''text_bytes_upper_bound'':size}\n return result\ntry:\n protected=set()\n sources=(\n  (''q_capture'',\"SELECT created_observation_id FROM g1_q_capture_attempts WHERE created_observation_id IS NOT NULL\"),\n  (''cut_members'',\"SELECT observation_id FROM g1_dataset_cut_members WHERE observation_id IS NOT NULL\"),\n  (''shadow_predictions'',\"SELECT observation_id FROM g1c_shadow_predictions WHERE observation_id IS NOT NULL\"),\n  (''pending_virtual'',\"SELECT passive_observation_id FROM virtual_position_observations WHERE resolution_status=''pending'' AND passive_observation_id IS NOT NULL\"),\n  (''eligible_membership'',\"SELECT observation_id FROM g1_dataset_membership WHERE forecast_eval_eligible=1 OR q_to_p_eligible=1\"),\n )\n for label,sql in sources:protected.update(names(label,sql))\n g1=names(''g1s_source_identity'',\"SELECT source_observation_id FROM g1s_observations\")\n counts={''catalog_ifd_rows'':0,''existing_rule_candidates'':0,''candidates_with_g1s_parent_link'':0,''remaining_if_all_g1s_parents_retained'':0}\n for rowid,obs in bounded(\"SELECT rowid,observation_id FROM passive_market_observations WHERE resolution_status=''insufficient_future_data'' AND rowid<132923\"):\n  counts[''catalog_ifd_rows'']+=1\n  if obs not in protected:\n   counts[''existing_rule_candidates'']+=1\n   counts[''candidates_with_g1s_parent_link'']+=obs in g1\n   counts[''remaining_if_all_g1s_parents_retained'']+=obs not in g1\n stat=os.statvfs(''/opt/seiltanzer/data'')\n print(''G1_SOURCE_DEPENDENCY_METADATA=''+json.dumps({''source_sha'':actual,''catalog_boundary'':132923,''counts'':counts,''source_sets'':diagnostics,''scope'':''METADATA_ONLY_NOT_COLD_BYTE_ELIGIBILITY'',''source_free_bytes'':stat.f_bavail*stat.f_frsize,''elapsed_ms'':round((time.monotonic()-started)*1000,1),''database_mutations'':0,''provider_refreshes_requested'':0,''paid_llm_calls'':0,''orders_sent'':0},sort_keys=True),flush=True)\nfinally:conn.close()\n"

        ast.parse(code)

        client=_connect(os.environ[''SSH_PASSWORD''],attempts=1)

        try:print(_exec(client,''python3 -c ''+shlex.quote(code),timeout=45),flush=True)

        finally:client.close()

        PY

        '
