name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  ai-model-readiness-readonly:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 011b363d6cf985b0a00a35964d74a81331558bb4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet paramiko
      - name: Read actual AI build and model publication state without generation
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import os,sys,shlex
          sys.path.insert(0,'scripts')
          from production_ede_offload import _connect,_exec
          client=_connect(os.environ['SSH_PASSWORD'],attempts=1)
          try:
              code=r'''
          import hashlib,json,pathlib,sqlite3,subprocess,time,urllib.request
          sha=subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True).strip()
          if sha not in {'9bf0e5dfd7e32406a3c5f3aeeca3a3e8836e65f0','011b363d6cf985b0a00a35964d74a81331558bb4'}:raise ValueError('Unreviewed production revision')
          now=time.time()
          def read(path):
              started=time.monotonic()
              with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=5) as response:
                  raw=response.read(1024**2+1)
                  if len(raw)>1024**2:raise ValueError('Status response exceeds bound')
              return json.loads(raw),round((time.monotonic()-started)*1000,1)
          ai,ai_ms=read('/api/ai/snapshot/status');math,math_ms=read('/api/research/mathematical-edge')
          model_path=pathlib.Path('/opt/seiltanzer/data/research/mathematical_edge_latest.json')
          old={};file_state={'present':model_path.exists()}
          if model_path.exists():
              if model_path.stat().st_size>500000:raise ValueError('Model exceeds existing runtime bound')
              with model_path.open('rb') as body:raw=body.read(500001)
              if len(raw)>500000:raise ValueError('Model exceeds existing runtime bound')
              old=json.loads(raw)
              file_state.update(bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),published_for_sha=old.get('published_for_sha'),
                  created_ts=old.get('created_ts'),age_seconds=now-old['created_ts'] if type(old.get('created_ts')) in (int,float) else None,
                  family_summary=old.get('family_market_model_summary'))
          observations=[];conn=sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro',uri=True,timeout=1)
          try:
              conn.execute('PRAGMA query_only=ON');conn.execute('PRAGMA trusted_schema=OFF');conn.execute('PRAGMA cache_size=-2048')
              deadline=time.monotonic()+3;conn.set_progress_handler(lambda:time.monotonic()>=deadline,1000)
              for instrument,model in (old.get('instruments') or {}).items():
                  cutoff=model.get('training_cutoff')
                  row=conn.execute("SELECT bar_end_ts,kind,created_ts FROM passive_market_bars WHERE instrument=? ORDER BY bar_start_ts DESC LIMIT 1",(instrument,)).fetchone()
                  if row and type(cutoff) in (int,float):
                      observations.append({'instrument':instrument,'training_cutoff':cutoff,'latest_retained_bar_end':row[0],
                          'direct_completed_new_bar':row[1]=='direct' and row[2]>=row[0] and cutoff<row[0]<=now})
          finally:conn.close()
          print('AI_MODEL_READINESS='+json.dumps({'code_sha':sha,'snapshot':{k:ai.get(k) for k in ('ready','building','age_sec','invalidated_reason','build_ms','build_started_at','build_n','canonical_quote_available')},
              'build_age_seconds':now-ai['build_started_at'] if ai.get('building') and ai.get('build_started_at') else None,
              'ai_error_type':str(ai.get('last_error') or '').split(':')[0] or None,'ai_status_ms':ai_ms,
              'math_runtime_state':math.get('state'),'math_status_ms':math_ms,'model_file':file_state,
              'new_retained_observations':observations,'llm_requests':0,'fits':0,'database_mutations':0,'production_authority':False}),flush=True)
          '''
              _exec(client,'python3 -c '+shlex.quote(code),timeout=25)
          finally:client.close()
          PY
