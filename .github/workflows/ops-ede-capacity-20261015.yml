name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  price-source-sequence-readonly:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a62a1c03519f7611121148eb542d4443b9c3ba1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet paramiko
      - name: Read canonical published and active price source sequence to identify real source transitions
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import os,sys,shlex,ast
          sys.path.insert(0,'scripts')
          from production_ede_offload import _connect,_exec
          code="import json,urllib.request,subprocess,time\nexpected='a2a48108cd0fd924e5fcf684be16af5043e48388'\nsha=subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True,timeout=3).strip()\nif sha!=expected:raise ValueError('Unexpected source generation')\ndef read(path,limit):\n with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=5) as r:raw=r.read(limit+1)\n if len(raw)>limit:raise ValueError('Read-only response exceeds bound')\n return json.loads(raw)\nsamples=[]\nfor index in range(8):\n state=read('/api/state',1024**2);tick=state.get('tick') or {}\n row=(tick.get('feeds') or {}).get('price') or {}\n direct=read('/api/market/bybit',512*1024).get('active_price') or {}\n ai=read('/api/ai/snapshot/status',64*1024)\n samples.append({'observed_ts':time.time(),'published_tick_ts':tick.get('ts'),'canonical_published_price':{k:row.get(k) for k in ('value','status','source','fresh','production_authority','derived','is_proxy','ts','timestamp')},'direct_active_price':direct,'ai':{k:ai.get(k) for k in ('ready','building','invalidated_reason','build_n','age_sec','baseline_r','live_r','canonical_quote_available')}})\n if index<7:time.sleep(10)\nprint('LIVE_AI_PRICE_SOURCE_SEQUENCE='+json.dumps({'expected_sha':expected,'samples':samples,'database_mutations':0,'provider_refreshes_requested':0,'paid_llm_calls':0,'orders_sent':0,'baseline_private_snapshot_not_inspected':True}),flush=True)\n"
          ast.parse(code)
          client=_connect(os.environ['SSH_PASSWORD'],attempts=1)
          try:
              print(_exec(client,'python3 -c '+shlex.quote(code),timeout=195),flush=True)
          finally:client.close()
          PY
