name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  runner-and-runtime-readonly:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 55fe3f784604ce8007e98e074a73ff33fc672466
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet paramiko
      - name: Read deployment startup state without API or database access
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python - <<'PYREMOTE'
          import os,sys,shlex
          sys.path.insert(0,'scripts')
          from production_ede_offload import _connect,_exec
          client=_connect(os.environ['SSH_PASSWORD'],attempts=1)
          try:
              code="""
          import pathlib,json,subprocess
          print('INSTALLED_SHA='+subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True,timeout=5).strip(),flush=True)
          print(subprocess.check_output(['systemctl','show','seiltanzer','-p','ActiveState','-p','SubState','-p','MainPID','-p','NRestarts','-p','ActiveEnterTimestamp'],text=True,timeout=5),flush=True)
          memory={k:v.strip() for k,v in (line.split(':',1) for line in pathlib.Path('/proc/meminfo').read_text().splitlines()) if k in ('MemAvailable','MemTotal','SwapFree','SwapTotal')}
          print('MEMORY='+json.dumps(memory),flush=True)
          print(subprocess.check_output(['ps','-eo','pid,comm,rss,etime','--sort=-rss'],text=True,timeout=5).splitlines()[:6],flush=True)
          print(subprocess.check_output(['journalctl','-u','seiltanzer','--since','-20 minutes','--no-pager','-n','35'],text=True,timeout=5),flush=True)
          """
              print(_exec(client,'python3 -c '+shlex.quote(code),timeout=25),flush=True)
          finally:client.close()
          PYREMOTE
