name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  g1m-latency-diagnostics:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 11e4a09bc39aa5c23d90c6d6b6f53e95c96f6a94
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet paramiko
      - name: Measure bounded G1M reads under the original acceptance owner
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import os,sys,shlex
          sys.path.insert(0,'scripts')
          from production_ede_offload import _connect,_exec,_verify_sha
          client=_connect(os.environ['SSH_PASSWORD'],attempts=1)
          sha='11e4a09bc39aa5c23d90c6d6b6f53e95c96f6a94'
          owner='38866349515'
          py='/opt/seiltanzer/.venv/bin/python'
          orch=py+' /opt/seiltanzer/scripts/production_research_acceptance.py'
          keep=False
          try:
              _verify_sha(client,sha)
              print(_exec(client,orch+' acquire-gate --acceptance-run-id '+owner+' --expected-sha '+sha+' --ttl-seconds 1800',timeout=30),flush=True)
              print(_exec(client,py+' /opt/seiltanzer/scripts/production_post_research_check.py --expected-sha '+sha+' --acceptance-run-id '+owner,timeout=1200),flush=True)
              code="""
          import json,time,urllib.request,subprocess,pathlib,os
          samples=[]
          for index in range(3):
              started=time.monotonic()
              with urllib.request.urlopen('http://127.0.0.1:8790/api/research/g1/management/local-edge',timeout=6) as response:
                  raw=response.read(8388609)
                  assert len(raw)<=8388608, 'G1M report payload exceeds diagnostic budget'
                  payload=json.loads(raw)
                  assert response.status==200
              elapsed=(time.monotonic()-started)*1000
              samples.append(elapsed)
              print('G1M_LATENCY_SAMPLE='+json.dumps({'sample':index+1,'ms':round(elapsed,1),'bytes':len(raw),'dataset':payload.get('dataset'),'production_authority':payload.get('production_authority'),'attribution_version':(payload.get('active_edge_decision_attribution') or {}).get('contract_version')}),flush=True)
              assert payload.get('production_authority') is False
          print(subprocess.check_output(['systemctl','show','seiltanzer','-p','ActiveState','-p','SubState','-p','NRestarts','-p','MemoryCurrent','-p','MemoryPeak'],text=True,timeout=5),flush=True)
          print('G1M_DIAGNOSTIC_RESULT='+json.dumps({'all_below_3000_ms':all(t<3000 for t in samples),'max_ms':round(max(samples),1),'threshold_changed':False}),flush=True)
          assert all(t<3000 for t in samples), 'G1M latency reproduced under acceptance pause'
          """
              print(_exec(client,py+' -c '+shlex.quote(code),timeout=35),flush=True)
              keep=True
              print('ORIGINAL_ACCEPTANCE_OWNER_RETAINED_FOR_SINGLE_G1M_CONTINUATION',flush=True)
          finally:
              if not keep:
                  try:print(_exec(client,orch+' release-gate --acceptance-run-id '+owner+' --expected-sha '+sha,timeout=30),flush=True)
                  except Exception as exc:print('RELEASE_UNCONFIRMED='+type(exc).__name__,flush=True)
              client.close()
          PY
