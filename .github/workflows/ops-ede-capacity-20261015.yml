name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  recovered-storage-acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 588edd8d9093717848530ece5f9bbcea5bed08ed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet paramiko
      - name: Checkpoint committed WAL and recheck unchanged source admission
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import os,sys,shlex,pathlib,json
          sys.path.insert(0,'scripts')
          from production_ede_offload import _connect,_exec,_verify_sha,_probe_api
          from offhost_sqlite_snapshot import source_preflight
          client=_connect(os.environ['SSH_PASSWORD'],attempts=1)
          try:
              sha='588edd8d9093717848530ece5f9bbcea5bed08ed'
              _verify_sha(client,sha);_probe_api(client)
              code="""
          import json,pathlib,sqlite3,os,time,urllib.request,subprocess
          path=pathlib.Path('/opt/seiltanzer/data/trades.db')
          assert path.is_file() and not path.is_symlink()
          def measure():
              v=os.statvfs(path)
              wal=pathlib.Path(str(path)+'-wal')
              return {'free_bytes':v.f_bavail*v.f_frsize,'database_bytes':path.stat().st_size,'wal_bytes':wal.stat().st_size if wal.exists() else 0}
          before=measure()
          with sqlite3.connect(path,timeout=0.5,isolation_level=None) as conn:
              conn.execute('PRAGMA busy_timeout=500')
              assert conn.execute('PRAGMA journal_mode').fetchone()[0]=='wal'
              result=conn.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchone()
          print('NATIVE_SQLITE_CHECKPOINT='+json.dumps({'before':before,'result':result,'after':measure(),'observations_deleted':False}),flush=True)
          for route in ('/api/state','/api/research/runtime/worker-status'):
              started=time.monotonic()
              with urllib.request.urlopen('http://127.0.0.1:8790'+route,timeout=4) as response:
                  raw=response.read(1000001)
                  body=json.loads(raw) if len(raw)<=1000000 else {}
                  worker=body.get('worker') or {}
                  print('RECOVERED_HTTP='+json.dumps({'route':route,'http':response.status,'ms':round((time.monotonic()-started)*1000),'worker':{k:worker.get(k) for k in ('current_phase','core_stage','last_finished_ts','last_error','acceptance_pause_active')}}),flush=True)
          print(subprocess.check_output(['systemctl','show','seiltanzer','-p','ActiveState','-p','SubState','-p','NRestarts','-p','MemoryCurrent'],text=True,timeout=5),flush=True)
          """
              print(_exec(client,'python3 -c '+shlex.quote(code),timeout=40),flush=True)
              report=source_preflight(client,expected_sha=sha,output=pathlib.Path(os.environ['RUNNER_TEMP'])/'final-preflight/source.sqlite3')
              print('FINAL_SOURCE_ADMISSION='+json.dumps(report,sort_keys=True),flush=True)
          finally:client.close()
          PY
