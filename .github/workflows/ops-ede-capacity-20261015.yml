name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  post-delivery-ai-observation:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a62a1c03519f7611121148eb542d4443b9c3ba1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet paramiko
      - name: Observe post-startup AI stability over one completed build without LLM calls
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import os,sys,shlex,ast
          sys.path.insert(0,'scripts')
          from production_ede_offload import _connect,_exec
          code="import json,urllib.request,subprocess,time\nexpected='a2a48108cd0fd924e5fcf684be16af5043e48388'\ndef code_sha():return subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True,timeout=3).strip()\nif code_sha()!=expected:raise ValueError('Unexpected source generation')\ndef read(path,limit=1024**2):\n started=time.monotonic()\n with urllib.request.urlopen('http://127.0.0.1:8790'+path,timeout=5) as response:\n  raw=response.read(limit+1);status=response.status\n if len(raw)>limit:raise ValueError('Read-only response exceeds bound')\n return json.loads(raw),{'http_status':status,'elapsed_ms':round((time.monotonic()-started)*1000,1),'response_bytes':len(raw)}\nstate,state_http=read('/api/state',8*1024**2)\nworker,worker_http=read('/api/research/runtime/worker-status')\nstate_price={key:(state.get('feeds',{}).get('price') or {}).get(key) for key in ('value','status','fresh','production_authority','derived','is_proxy','age_sec')}\nsamples=[]\nfor index in range(6):\n value,http=read('/api/ai/snapshot/status')\n sample={k:value.get(k) for k in ('ready','building','age_sec','canonical_quote_available','invalidated_reason','build_ms','build_n','baseline_r','live_r','request_path_heavy_build','periodic_heavy_recompute')}\n sample['last_error_present']=value.get('last_error') is not None\n sample['http']=http;sample['observed_ts']=time.time();samples.append(sample)\n if index<5:time.sleep(15)\nif code_sha()!=expected:raise ValueError('Source generation changed during observation')\nservice=subprocess.check_output(['systemctl','show','seiltanzer','--property=MainPID,NRestarts,ActiveState,SubState'],text=True,timeout=3).strip().splitlines()\nw=worker.get('worker') or {}\nprint('ACTUAL_AI_QUOTE_FIX_OBSERVATION='+json.dumps({'expected_sha':expected,'state_http':state_http,'state_price':state_price,'worker_http':worker_http,'worker':{k:w.get(k) for k in ('current_phase','disk_pause_active','disk_pressure','last_error')},'samples':samples,'service':service,'false_authority_change_observed':any(s['invalidated_reason']=='PRICE_AUTHORITY_CHANGED' for s in samples),'scope':'BOUNDED_READ_ONLY_POST_DELIVERY_OBSERVATION_NOT_FULL_PRODUCTION_ACCEPTANCE','paid_llm_calls':0,'provider_refreshes_requested':0,'orders_sent':0,'database_mutations':0}),flush=True)\n"
          ast.parse(code)
          client=_connect(os.environ['SSH_PASSWORD'],attempts=1)
          try:
              print(_exec(client,'python3 -c '+shlex.quote(code),timeout=135),flush=True)
          finally:client.close()
          PY
