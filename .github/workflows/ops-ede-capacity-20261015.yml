name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  startup-owner-trace-readonly:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4a62a1c03519f7611121148eb542d4443b9c3ba1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet paramiko
      - name: Read existing startup phase markers and watchdog frames without attaching a profiler
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import os,sys,shlex,ast
          sys.path.insert(0,'scripts')
          from production_ede_offload import _connect,_exec
          code="import json,re,subprocess,pathlib\nsha=subprocess.check_output(['git','-C','/opt/seiltanzer','rev-parse','HEAD'],text=True,timeout=3).strip()\nif sha not in {'011b363d6cf985b0a00a35964d74a81331558bb4','4a62a1c03519f7611121148eb542d4443b9c3ba1'}:raise ValueError('Unexpected source generation')\npid=subprocess.check_output(['systemctl','show','seiltanzer','--property=MainPID','--value'],text=True,timeout=3).strip()\nif not pid.isdigit() or int(pid)<=1:raise ValueError('No active application PID')\nargs=['journalctl','--no-pager','-o','cat','--since=-25min','-n','600','_SYSTEMD_UNIT=seiltanzer.service','_PID='+pid]\nprocess=subprocess.Popen(args,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL)\ntry:\n    raw=process.stdout.read(2097153)\n    if len(raw)>2097152:raise ValueError('Startup journal exceeds bound')\n    process.wait(timeout=3)\nfinally:\n    if process.poll() is None:process.kill();process.wait(timeout=3)\nlines=raw.decode('utf8','replace').splitlines()\nselected=[line for line in lines if line.startswith('STARTUP_PHASE phase=') or re.match(r'^\\s*File \"[^\"\\r\\n]+\", line [0-9]+ in [A-Za-z0-9_<>.]+$',line) or line.startswith('Timeout (') or re.match(r'^Thread 0x[0-9a-f]+',line)]\nprint('STARTUP_TRACE_CONTEXT='+json.dumps({'code_sha':sha,'pid':pid,'frame_and_phase_lines':len(selected),'no_local_variables':True,'database_reads':0,'service_mutations':0}),flush=True)\nfor line in selected[-160:]:print(line,flush=True)\nprint('STARTUP_WCHAN='+json.dumps({'wait_channel':pathlib.Path('/proc/'+pid+'/wchan').read_text().strip()}),flush=True)"
          ast.parse(code)
          client=_connect(os.environ['SSH_PASSWORD'],attempts=1)
          try:
              _exec(client,'python3 -c '+shlex.quote(code),timeout=25)
          finally:client.close()
          PY
