name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  stage1-complete-fk-and-catalog-delta-readonly:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 5fe2e56d6a5d1f8da20c9a918fe3592d3e6eb5d4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python -m pip install --quiet paramiko boto3
    - name: Read complete 12-table FK status, orphan provenance, S3 prefixes, and hot/cold watermark delta
      env:
        SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ru-central1
        AWS_EC2_METADATA_DISABLED: 'true'
      run: |
        python - <<'PY'
        import ast, json, os, shlex, sys, textwrap
        import boto3
        from botocore.config import Config
        sys.path.insert(0, 'scripts')
        from production_ede_offload import _connect, _exec
        from restore_verified_snapshot import ENDPOINT

        s3 = boto3.client(
            's3',
            endpoint_url=ENDPOINT,
            region_name='ru-central1',
            config=Config(connect_timeout=10, read_timeout=30, retries={'max_attempts': 2}),
        )
        bucket = 'trading-dbd-backups-2026'
        non_history_objects = []
        paginator = s3.get_paginator('list_objects_v2')
        for page in paginator.paginate(Bucket=bucket):
            for obj in page.get('Contents') or []:
                key = obj['Key']
                if not key.startswith('research/sqlite-history/v1/'):
                    non_history_objects.append({
                        'key': key,
                        'size': obj['Size'],
                        'last_modified': obj['LastModified'].isoformat(),
                    })
        print('YANDEX_NON_HISTORY_OBJECTS=' + json.dumps(non_history_objects, sort_keys=True), flush=True)

        remote_code = """
        import json, os, sqlite3, subprocess, time, urllib.request
        os.nice(10)
        sha = subprocess.check_output(['git', '-C', '/opt/seiltanzer', 'rev-parse', 'HEAD'], text=True, timeout=3).strip()
        with urllib.request.urlopen('http://127.0.0.1:8790/api/ai/snapshot/status', timeout=5) as r:
            ai_status = json.loads(r.read(65536))

        local_backups = []
        bdir = '/opt/seiltanzer/data/backups/local'
        if os.path.isdir(bdir):
            for name in sorted(os.listdir(bdir)):
                p = os.path.join(bdir, name)
                if os.path.isfile(p):
                    local_backups.append({'name': name, 'size': os.path.getsize(p), 'mtime': os.path.getmtime(p)})

        conn = sqlite3.connect('file:/opt/seiltanzer/data/trades.db?mode=ro', uri=True, timeout=2.0)
        started = time.monotonic()
        overall = started + 90.0
        deadline = overall
        conn.execute('PRAGMA query_only=ON')
        conn.execute('PRAGMA trusted_schema=OFF')
        conn.execute('PRAGMA cache_size=-16384')
        conn.set_progress_handler(lambda: time.monotonic() >= deadline, 5000)
        def q(v):
            return '"' + v.replace('"', '""') + '"'
        try:
            tables = [r[0] for r in conn.execute("SELECT name FROM sqlite_schema WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name")]
            names = set(tables)
            fk_tables = []
            for t in tables:
                deadline = min(overall, time.monotonic() + 2.0)
                keys = conn.execute('PRAGMA foreign_key_list(' + q(t) + ')').fetchall()
                if keys:
                    fk_tables.append({
                        'table': t,
                        'references': [{'id': r[0], 'parent': r[2], 'parent_exists': r[2] in names, 'from_column': r[3], 'to_column': r[4]} for r in keys]
                    })

            fk_results = []
            for item in fk_tables:
                t = item['table']
                t0 = time.monotonic()
                entry = {'table': t, 'join_orphans': [], 'pragma_status': None}
                for ref in item['references']:
                    parent = ref['parent']
                    fcol = ref['from_column']
                    tcol = ref['to_column']
                    deadline = min(overall, time.monotonic() + 10.0)
                    if t == 'decision_path_points' and fcol == 'review_id':
                        sql = f'''
                        WITH RECURSIVE distinct_keys(k) AS (
                            SELECT MIN({q(fcol)}) FROM {q(t)}
                            UNION ALL
                            SELECT (SELECT MIN({q(fcol)}) FROM {q(t)} WHERE {q(fcol)} > distinct_keys.k)
                            FROM distinct_keys WHERE k IS NOT NULL
                        )
                        SELECT k FROM distinct_keys
                        WHERE k IS NOT NULL AND NOT EXISTS (
                            SELECT 1 FROM {q(parent)} p WHERE p.{q(tcol)} = distinct_keys.k
                        )
                        '''
                        orphans = [r[0] for r in conn.execute(sql).fetchall()]
                        distinct_cnt = conn.execute(f'''
                        WITH RECURSIVE distinct_keys(k) AS (
                            SELECT MIN({q(fcol)}) FROM {q(t)}
                            UNION ALL
                            SELECT (SELECT MIN({q(fcol)}) FROM {q(t)} WHERE {q(fcol)} > distinct_keys.k)
                            FROM distinct_keys WHERE k IS NOT NULL
                        )
                        SELECT COUNT(*) FROM distinct_keys WHERE k IS NOT NULL
                        ''').fetchone()[0]
                        entry['distinct_review_ids'] = distinct_cnt
                    else:
                        sql = f'''
                        SELECT DISTINCT c.{q(fcol)}
                        FROM {q(t)} c
                        LEFT JOIN {q(parent)} p ON p.{q(tcol)} = c.{q(fcol)}
                        WHERE c.{q(fcol)} IS NOT NULL AND p.{q(tcol)} IS NULL
                        LIMIT 50
                        '''
                        orphans = [r[0] for r in conn.execute(sql).fetchall()]
                    entry['join_orphans'].append({'parent': parent, 'from': fcol, 'to': tcol, 'missing_keys': orphans})
                try:
                    deadline = min(overall, time.monotonic() + (35.0 if t == 'decision_path_points' else 5.0))
                    row = conn.execute('PRAGMA foreign_key_check(' + q(t) + ')').fetchone()
                    entry['pragma_status'] = 'VIOLATION_FOUND' if row is not None else 'CHECK_PASSED'
                    entry['first_violation'] = None if row is None else {'table': row[0], 'rowid': row[1], 'parent': row[2], 'fkid': row[3]}
                except sqlite3.Error as exc:
                    entry['pragma_status'] = 'UNAVAILABLE:' + type(exc).__name__
                entry['elapsed_ms'] = round((time.monotonic() - t0) * 1000, 1)
                fk_results.append(entry)

            deadline = min(overall, time.monotonic() + 10.0)
            ack_rows = [dict(zip(['id','trade_id','decision_id','policy','status','ts','note_len'], r))
                        for r in conn.execute('SELECT id, trade_id, decision_id, policy, status, ts, length(COALESCE(note, \"\")) FROM ai_decision_acks WHERE trade_id IN (77, 96) ORDER BY id')]
            neighbor_trades = [dict(zip(['id','opened_at','closed_at','setup','instrument','direction','status','deleted_at'], r))
                               for r in conn.execute('SELECT id, opened_at, closed_at, setup, instrument, direction, status, deleted_at FROM trades WHERE id BETWEEN 70 AND 105 ORDER BY id')]
            first_deleted_trade = conn.execute('SELECT MIN(id), MIN(deleted_at), COUNT(*) FROM trades WHERE deleted_at IS NOT NULL').fetchone()

            tables_with_77_96 = {}
            for t in tables:
                if t in ('passive_market_observations', 'g1s_observations', 'decision_path_points'):
                    continue
                cols = [r[1] for r in conn.execute('PRAGMA table_info(' + q(t) + ')')]
                if 'trade_id' in cols:
                    deadline = min(overall, time.monotonic() + 2.0)
                    found = [r[0] for r in conn.execute(f'SELECT DISTINCT trade_id FROM {q(t)} WHERE trade_id IN (77, 96)')]
                    if found:
                        tables_with_77_96[t] = found

            deadline = min(overall, time.monotonic() + 10.0)
            pmo_stats = conn.execute('SELECT COUNT(*), MIN(rowid), MAX(rowid) FROM passive_market_observations').fetchone()
            pmo_res = dict(conn.execute('SELECT COALESCE(resolution_status, \"NULL\"), COUNT(*) FROM passive_market_observations GROUP BY resolution_status').fetchall())
            g1s_stats = conn.execute('SELECT COUNT(*), MIN(rowid), MAX(rowid) FROM g1s_observations').fetchone()
            seq = dict(conn.execute('SELECT name, seq FROM sqlite_sequence').fetchall()) if 'sqlite_sequence' in [r[0] for r in conn.execute("SELECT name FROM sqlite_schema WHERE type='table'")] else {}

            print('STAGE1_COMPLETE_AUDIT=' + json.dumps({
                'code_sha': sha,
                'ai_status': {k: ai_status.get(k) for k in ('ready', 'building', 'invalidated_reason', 'build_n', 'age_sec', 'canonical_quote_available')},
                'local_backups': local_backups,
                'fk_results': fk_results,
                'ack_rows_77_96': ack_rows,
                'neighbor_trades_70_105': neighbor_trades,
                'tombstone_summary': {'min_id': first_deleted_trade[0], 'min_deleted_at': first_deleted_trade[1], 'count': first_deleted_trade[2]},
                'tables_referencing_77_96': tables_with_77_96,
                'hot_table_watermarks': {
                    'passive_market_observations': {'count': pmo_stats[0], 'min_rowid': pmo_stats[1], 'max_rowid': pmo_stats[2], 'by_status': pmo_res},
                    'g1s_observations': {'count': g1s_stats[0], 'min_rowid': g1s_stats[1], 'max_rowid': g1s_stats[2]},
                    'sqlite_sequence': seq,
                },
                'elapsed_ms': round((time.monotonic() - started) * 1000, 1),
                'database_mutations': 0,
            }, sort_keys=True), flush=True)
        finally:
            conn.close()
        """
        remote_code = textwrap.dedent(remote_code).strip()
        ast.parse(remote_code)
        client = _connect(os.environ['SSH_PASSWORD'], attempts=1)
        try:
            print(_exec(client, 'python3 -c ' + shlex.quote(remote_code), timeout=110), flush=True)
        finally:
            client.close()
        PY
