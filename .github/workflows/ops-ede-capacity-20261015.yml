name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  stage2-offhost-cutover-and-union-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Free runner disk space for 20GB disposable SQLite proof
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@v4
        with:
          ref: 58d6dc9e5c753059992084bce5b64cd21692232f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet boto3
      - name: Verify rowid-preserving hot compaction, FK closure, post-cutover writes, and full cold hydration off-host
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: 'true'
          TASK_DIRECTORY: ${{ runner.temp }}/stage2-cutover-proof-20261018
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil, sqlite3, sys, time
          from contextlib import closing
          from pathlib import Path
          import boto3
          from botocore.config import Config
          sys.path.insert(0, '.')
          sys.path.insert(0, 'scripts')
          from restore_verified_snapshot import restore, ENDPOINT, manifest_digest
          from managed_verified_seed import ManagedRestoreClient
          from scripts import sqlite_history_partition as archive
          from scripts.sqlite_history_catalog import verify_full_tables
          from scripts.sqlite_history_cutover import build_hot_cutover_snapshot
          from scripts.sqlite_history_union import hydrate_snapshot

          SOURCE_SHA = 'd6e8c423f21585f68cd28b0d837eb08c944d2b273bbba59ad963927e33434535'
          CATALOG_SHA = '7b78d25d13f249f1ab967828675419a6656fe6b69787e5b78644076a54411a63'
          CATALOG_KEY = f'research/sqlite-history/v1/{SOURCE_SHA}/catalogs/{CATALOG_SHA}.json'
          SNAPSHOT_KEY = 'backups/v1/daily-slot-0/snapshot.sqlite3.gz'

          root = Path(os.environ['TASK_DIRECTORY'])
          root.mkdir(mode=0o700, exist_ok=False)
          client = boto3.client(
              's3',
              endpoint_url=ENDPOINT,
              region_name='ru-central1',
              config=Config(connect_timeout=10, read_timeout=120, retries={'max_attempts': 3}),
          )

          print('STAGE2_STEP=1_download_catalog', flush=True)
          with client.get_object(Bucket=archive.BUCKET, Key=CATALOG_KEY)['Body'] as body:
              catalog_bytes = body.read(8 * 1024**2 + 1)
          if hashlib.sha256(catalog_bytes).hexdigest() != CATALOG_SHA:
              raise ValueError('Downloaded catalog SHA256 mismatch')
          catalog = json.loads(catalog_bytes)

          print('STAGE2_STEP=2_restore_disposable_source', flush=True)
          source = root / 'source.sqlite3'
          proof = restore(
              bucket=archive.BUCKET,
              key=SNAPSHOT_KEY,
              destination=source,
              result_path=root / 'private-source-receipt.json',
              snapshot_drill=True,
              client=ManagedRestoreClient(client, temp_dir=root),
          )
          if proof['database_sha256'] != SOURCE_SHA:
              raise ValueError(f"Restored snapshot SHA {proof['database_sha256']} != {SOURCE_SHA}")
          print('STAGE2_SOURCE_RESTORED=' + json.dumps({
              'database_sha256': proof['database_sha256'],
              'database_size_bytes': proof['database_size_bytes'],
              'free_bytes_after_restore': shutil.disk_usage(root).free,
          }, sort_keys=True), flush=True)

          print('STAGE2_STEP=3_build_hot_cutover_snapshot', flush=True)
          t0 = time.monotonic()
          hot = root / 'hot.sqlite3'
          cutover_report = build_hot_cutover_snapshot(
              source,
              hot,
              catalog_bytes=catalog_bytes,
              expected_catalog_sha256=CATALOG_SHA,
              source_receipt=proof,
          )
          cutover_elapsed_sec = round(time.monotonic() - t0, 2)
          print('STAGE2_CUTOVER_REPORT=' + json.dumps({
              k: v for k, v in cutover_report.items() if k != 'hot_restore_proof'
          }, sort_keys=True), flush=True)

          # Delete original 19.28 GB source now that cutover is built so we have plenty of room for hydration
          for suffix in ('', '-wal', '-shm', '-journal'):
              (root / ('source.sqlite3' + suffix)).unlink(missing_ok=True)

          print('STAGE2_STEP=4_verify_hot_watermarks_and_fk', flush=True)
          with closing(sqlite3.connect(hot.resolve().as_uri() + '?mode=ro&immutable=1', uri=True)) as conn:
              conn.execute('PRAGMA trusted_schema=OFF')
              fk_errors = conn.execute('PRAGMA foreign_key_check').fetchall()
              if fk_errors:
                  raise ValueError(f'Hot DB FK check failed: {fk_errors}')
              acks = conn.execute('SELECT id, trade_id, status FROM ai_decision_acks ORDER BY id').fetchall()
              identities = conn.execute(
                  "SELECT trade_id, lifecycle_origin FROM trade_lifecycle_identities WHERE trade_id IN (77, 96) ORDER BY trade_id"
              ).fetchall()
              g1s_wm = conn.execute('SELECT source_watermark FROM g1s_materialization_state').fetchall()
              g1s_status_wm = conn.execute('SELECT observation_rowid_watermark FROM g1s_status_materialization_state').fetchall()
              max_pmo_rowid = conn.execute('SELECT MAX(rowid) FROM passive_market_observations').fetchone()[0]
              max_g1s_rowid = conn.execute('SELECT MAX(rowid) FROM g1s_observations').fetchone()[0]

          print('STAGE2_STEP=5_hydrate_hot_with_cold_catalog', flush=True)
          t1 = time.monotonic()
          union_path = root / 'union.sqlite3'
          union_report = hydrate_snapshot(
              hot,
              union_path,
              source_receipt=cutover_report['hot_restore_proof'],
              catalog_bytes=catalog_bytes,
              client=client,
          )
          hydrate_elapsed_sec = round(time.monotonic() - t1, 2)
          with closing(sqlite3.connect(union_path.resolve().as_uri() + '?mode=ro&immutable=1', uri=True)) as conn:
              conn.execute('PRAGMA trusted_schema=OFF')
              verify_full_tables(conn, catalog)
          for suffix in ('', '-wal', '-shm', '-journal'):
              (root / ('union.sqlite3' + suffix)).unlink(missing_ok=True)

          print('STAGE2_STEP=6_verify_post_cutover_write_continuity', flush=True)
          with closing(sqlite3.connect(hot)) as conn:
              conn.execute('PRAGMA foreign_keys=ON')
              conn.execute('PRAGMA journal_mode=DELETE')
              cols = [r[1] for r in conn.execute('PRAGMA table_xinfo("passive_market_observations")').fetchall() if not r[6]]
              non_pk_cols = [c for c in cols if c != 'observation_id']
              q_non_pk = ','.join('"' + c + '"' for c in non_pk_cols)
              conn.execute(
                  f'INSERT INTO passive_market_observations("observation_id", {q_non_pk}) '
                  f"SELECT 'stage2-drill-post-write', {q_non_pk} FROM passive_market_observations WHERE rowid=?",
                  (max_pmo_rowid,),
              )
              inserted_rowid = conn.execute(
                  "SELECT rowid FROM passive_market_observations WHERE observation_id='stage2-drill-post-write'"
              ).fetchone()[0]
              if inserted_rowid <= max_pmo_rowid:
                  raise ValueError(f'Post-cutover insert rowid {inserted_rowid} <= {max_pmo_rowid}')
              conn.commit()

          public_proof = {
              'contract': 'stage2-offhost-cutover-and-union-proof-v1',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'checked_out_code_sha': '58d6dc9e5c753059992084bce5b64cd21692232f',
              'source_database_sha256': SOURCE_SHA,
              'catalog_sha256': CATALOG_SHA,
              'source_database_size_bytes': cutover_report['source_database_size_bytes'],
              'hot_database_size_bytes': cutover_report['hot_database_size_bytes'],
              'reclaimed_bytes': cutover_report['reclaimed_bytes'],
              'reclaimed_gib': round(cutover_report['reclaimed_bytes'] / (1024**3), 3),
              'source_target_row_count': cutover_report['source_target_row_count'],
              'retired_row_count': cutover_report['retired_row_count'],
              'hot_target_row_count': cutover_report['hot_target_row_count'],
              'protected_observation_count': cutover_report['protected_observation_count'],
              'protected_observation_breakdown': cutover_report['protected_observation_breakdown'],
              'hot_status_counts': cutover_report['hot_status_counts'],
              'source_max_rowid': cutover_report['source_max_rowid'],
              'hot_max_rowid': cutover_report['hot_max_rowid'],
              'post_cutover_inserted_rowid': inserted_rowid,
              'g1s_max_rowid': max_g1s_rowid,
              'g1s_materialization_watermarks': [r[0] for r in g1s_wm],
              'g1s_status_watermarks': [r[0] for r in g1s_status_wm],
              'ai_decision_acks_count': len(acks),
              'pre_tombstone_identities_77_96': identities,
              'freelist_count': cutover_report['freelist_count'],
              'quick_check': cutover_report['quick_check'],
              'foreign_key_violations': cutover_report['foreign_key_violations'],
              'cutover_elapsed_sec': cutover_elapsed_sec,
              'hydrate_elapsed_sec': hydrate_elapsed_sec,
              'history_union_verified': union_report['history_union_verified'],
              'full_selected_tables_verified': union_report['full_selected_tables_verified'],
              'typed_values_verified': union_report['typed_values_verified'],
              'production_connection': False,
          }
          (root / 'public-proof.json').write_text(json.dumps(public_proof, sort_keys=True, indent=2) + '\n')
          print('STAGE2_COMPLETE_PROOF=' + json.dumps(public_proof, sort_keys=True), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage2-offhost-cutover-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/stage2-cutover-proof-20261018/public-proof.json
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup disposable files
        if: always()
        env:
          TASK_DIRECTORY: ${{ runner.temp }}/stage2-cutover-proof-20261018
        run: rm -rf "$TASK_DIRECTORY"
