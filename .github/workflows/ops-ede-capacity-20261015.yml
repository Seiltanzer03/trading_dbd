name: ops-ede-capacity-20261015
on:
  push:
    branches: [ops/ede-capacity-20261015]
    paths: [.github/workflows/ops-ede-capacity-20261015.yml]
permissions:
  contents: read
jobs:
  legacy-runtime-capacity-readonly:
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a1e9ebdbe6e405e51a2397ebc23c82168c023b4b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet paramiko
      - name: Read legacy terminal directory ownership without modifying files
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          python - <<'PY'
          import os,sys,shlex
          sys.path.insert(0,'scripts')
          from production_ede_offload import _connect,_exec,_verify_sha
          client=_connect(os.environ['SSH_PASSWORD'],attempts=1)
          try:
              _verify_sha(client,'a1e9ebdbe6e405e51a2397ebc23c82168c023b4b')
              code=r'''
          import pathlib,subprocess,json,os,time,shutil
          root=pathlib.Path('/root/seiltanzer_bot')
          print('SPACE='+json.dumps({'free_bytes':shutil.disk_usage('/opt/seiltanzer').free}),flush=True)
          print(subprocess.check_output(['du','-x','--max-depth=2','-B1',str(root)],text=True,timeout=20),flush=True)
          deadline=time.monotonic()+15;refs=[];incomplete=False
          for p in pathlib.Path('/proc').iterdir():
              if time.monotonic()>deadline:incomplete=True;break
              if not p.name.isdigit():continue
              try:
                  matches=[]
                  for field in ('cwd','exe'):
                      try:
                          if str(root) in os.readlink(p/field):matches.append(field)
                      except OSError:pass
                  if str(root).encode() in (p/'cmdline').read_bytes():matches.append('cmdline')
                  for fd in (p/'fd').iterdir():
                      if time.monotonic()>deadline:incomplete=True;break
                      try:
                          if str(root) in os.readlink(fd):matches.append('fd');break
                      except OSError:pass
                  if matches:refs.append({'pid':p.name,'refs':matches})
              except (OSError,PermissionError):pass
          units=[]
          for base in ('/etc/systemd/system','/lib/systemd/system'):
              for p in pathlib.Path(base).glob('*.service'):
                  try:
                      if p.stat().st_size<=1024**2 and str(root) in p.read_text(errors='replace'):units.append(p.name)
                  except OSError:pass
          print('LEGACY_REFERENCES='+json.dumps({'process_references':refs,'service_unit_references':sorted(set(units)),'scan_incomplete':incomplete}),flush=True)
          '''
              print(_exec(client,'python3 -c '+shlex.quote(code),timeout=40),flush=True)
          finally:client.close()
          PY
