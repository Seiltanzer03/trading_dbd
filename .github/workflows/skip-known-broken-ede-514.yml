name: stop-known-broken-ede-514-before-export
on:
  push:
    branches: [ops/history-cutover-status-20261019]
    paths: [.github/workflows/skip-known-broken-ede-514.yml]
permissions:
  contents: read
  actions: write
jobs:
  stop_before_export:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Cancel only the known sidecar-broken generation before any export job starts
        id: stop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -u - <<'PY'
          import json,os,time,urllib.request
          repo='Seiltanzer03/trading_dbd'
          expected='392f6486cf698ead53ca0b175f4611baa102653c'
          base='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def api(path,method='GET'):
              request=urllib.request.Request(base+path,headers=headers,method=method)
              with urllib.request.urlopen(request,timeout=20) as response:
                  raw=response.read()
                  return json.loads(raw) if raw else None
          deadline=time.monotonic()+25*60
          while time.monotonic()<deadline:
              main=api('/git/ref/heads/main')['object']['sha']
              if main!=expected:raise SystemExit('REFUSE: main advanced before controlled cancellation')
              runs=api('/actions/workflows/production-ede-v12-audit.yml/runs?head_sha='+expected+'&per_page=20')['workflow_runs']
              active=[r for r in runs if r['head_sha']==expected and r['head_branch']=='main' and r['event']=='workflow_dispatch' and r['status'] in ('queued','in_progress','pending','waiting','requested')]
              if len(active)>1:raise SystemExit('REFUSE: ambiguous active EDE generation')
              if active:
                  run=active[0];run_id=run['id']
                  jobs=api('/actions/runs/'+str(run_id)+'/jobs?per_page=100')['jobs']
                  audits=[j for j in jobs if j['name']=='audit']
                  if any(j['status'] not in ('queued','waiting','pending') for j in audits):
                      raise SystemExit('REFUSE: audit/export may already have started; no cancellation')
                  print('SAFE_PREEXPORT_CANCELLATION run_id='+str(run_id)+' sha='+expected+' audit_started=false',flush=True)
                  api('/actions/runs/'+str(run_id)+'/cancel','POST')
                  finish=time.monotonic()+120
                  while time.monotonic()<finish:
                      state=api('/actions/runs/'+str(run_id))
                      if state['status']=='completed':
                          if state['conclusion']!='cancelled':raise SystemExit('REFUSE: cancellation not confirmed')
                          # Cancellation must not race the audit job out of its queue.
                          final=api('/actions/runs/'+str(run_id)+'/jobs?per_page=100')['jobs']
                          if any(j['name']=='audit' and any(s.get('started_at') for s in j.get('steps',[])) for j in final):
                              raise SystemExit('REFUSE: audit started during cancellation; inspect owned reader')
                          print('CONFIRMED_NO_EXPORT_READER run_id='+str(run_id),flush=True)
                          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('cancelled_run_id='+str(run_id)+'\n')
                          raise SystemExit(0)
                      time.sleep(2)
                  raise SystemExit('REFUSE: cancellation did not finish within120s')
              print('WAITING_FOR_KNOWN_GENERATION no_run_cancelled=true',flush=True)
              time.sleep(15)
          raise SystemExit('No matching EDE run appeared; nothing cancelled')
          PY
      - name: Release only the cancelled generation acceptance owner
        if: success() && steps.stop.outputs.cancelled_run_id != ''
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30s
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = '392f6486cf698ead53ca0b175f4611baa102653c'
            /opt/seiltanzer/.venv/bin/python /opt/seiltanzer/scripts/production_research_acceptance.py release-gate \
              --expected-sha 392f6486cf698ead53ca0b175f4611baa102653c --acceptance-run-id 40089515901
