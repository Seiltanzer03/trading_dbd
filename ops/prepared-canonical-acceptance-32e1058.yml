name: json-final-canonical-acceptance
'on':
  push:
    branches: [ops/noncrypto-history-inventory-20261026]
    paths: [.github/workflows/noncrypto-history-inventory.yml]
concurrency:
  group: production-seiltanzer
  queue: max
  cancel-in-progress: false
permissions:
  actions: write
  contents: read
  statuses: write
jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      EXPECTED_SHA: 32e1058b786fae902ff55e89b1bb6fd1d301adaf
      ACCEPTANCE_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Verify manual dispatch already has green exact-SHA CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 8 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${EXPECTED_SHA}/status")
          verdict=$(BODY="$body" python3 - <<'PY'
          import json, os
          body=json.loads(os.environ['BODY'])
          states={str(x.get('context')):str(x.get('state')) for x in body.get('statuses',[])}
          print(states.get('ci/full-webkit','missing'))
          PY
          )
          echo "ci/full-webkit state=$verdict"
          if [ "$verdict" != "success" ]; then
            echo "::error::Manual production delivery requires an already-green exact-SHA ci/full-webkit"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Reject superseded main before production mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/require_current_main.sh

      - name: Verify installed release and completed native migration without restart
        id: delivery
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 2m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            /opt/seiltanzer/.venv/bin/python -B -u - <<'PY'
            import os,json,shutil,subprocess,urllib.request
            from pathlib import Path
            root=Path('/opt/seiltanzer');data=root/'data'
            journal=json.loads((data/'json-rebuild-41808108303/cutover.journal.json').read_text())
            assert journal['run_id']=='41808108303' and journal['phase']=='COMMITTED' and journal['service_started'] is True
            assert not os.path.lexists(data/'cutover.active')
            assert shutil.disk_usage(data).free>1024**3+32*1024**2
            expected=os.environ['EXPECTED_SHA']
            assert subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()==expected
            proof=json.loads(subprocess.check_output(['/usr/bin/python3','/usr/local/lib/seiltanzer-history-start-guard.py','--database',str(data/'trades.db'),'--application-root',str(root)],text=True))
            assert proof['start_allowed'] is True
            with urllib.request.urlopen('http://127.0.0.1:8790/api/state',timeout=5) as r:assert r.status==200
            print('INSTALLED_RELEASE_AND_NATIVE_COMMIT_VERIFIED',json.dumps({'sha':expected,'free_bytes':shutil.disk_usage(data).free,'app_restarts':0}),flush=True)
            PY

      - name: Pause research for exact-SHA production acceptance
        id: preacceptance
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
          ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          # Five-minute startup grace + the measured ~9-minute bounded core can
          # legitimately exceed the former 12-minute wall clock allowance.
          command_timeout: 20m
          envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            PY=/opt/seiltanzer/.venv/bin/python
            ORCH=/opt/seiltanzer/scripts/production_research_acceptance.py
            gate_owned=0

            cleanup_gate_on_failure() {
              if [ "$gate_owned" -eq 1 ]; then
                "$PY" "$ORCH" release-gate \
                  --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
                  --expected-sha "$EXPECTED_SHA" || true
              fi
            }
            trap cleanup_gate_on_failure EXIT

            # Acquire the existing cooperative lease immediately after the new
            # service first becomes HTTP-ready. The worker may complete its one
            # required core cycle, but cannot start optional maintenance before
            # the readiness transaction begins.
            "$PY" "$ORCH" acquire-gate \
              --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA" \
              --ttl-seconds 7200
            gate_owned=1

            "$PY" /opt/seiltanzer/scripts/production_post_research_check.py \
              --expected-sha "$EXPECTED_SHA" \
              --acceptance-run-id "$ACCEPTANCE_RUN_ID"
            "$PY" "$ORCH" validate-gate \
              --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA"

            trap - EXIT
            echo "PRE_ACCEPTANCE_RESEARCH_PAUSED expected_sha=$EXPECTED_SHA acceptance_run_id=$ACCEPTANCE_RUN_ID"

      - name: Verify exact production readiness
        id: readiness
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 10m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/production_readiness_check.py \
              --expected-sha "$EXPECTED_SHA" \
              --skip-restore-drill-low-disk

      # Cold start and the first core cycle may exceed the bundle's 20-minute
      # TTL. Acquire official facts only after both finish; keep the runtime
      # freshness, hashes, exact SHA and source validation unchanged.
      # Research publications have their own exact-SHA/source/risk admission.
      # A BLS outage must not suppress unrelated models after readiness passes.
      # Full smoke/public/acceptance still remain mandatory below.
      - name: Start exact-SHA mathematical edge refresh off-host
        id: mathrefresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({'ref': 'main', 'inputs': {'expected_sha': os.environ['EXPECTED_SHA']}}))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 --retry-max-time 15 --retry-all-errors \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/mathematical-edge.yml/dispatches" \
            -d "$payload"
          echo "MATHEMATICAL_EDGE_REFRESH_DISPATCHED expected_sha=$EXPECTED_SHA"

      - name: Start exact-SHA source family collection off-host
        id: sourcerefresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({'ref': 'main', 'inputs': {'expected_sha': os.environ['EXPECTED_SHA']}}))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 --retry-max-time 15 --retry-all-errors \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/edge-family-sources.yml/dispatches" \
            -d "$payload"
          echo "EDGE_FAMILY_SOURCE_REFRESH_DISPATCHED expected_sha=$EXPECTED_SHA"

      - name: Start exact-SHA prospective FOMC capture off-host
        id: fomcrefresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({'ref': 'main', 'inputs': {'expected_sha': os.environ['EXPECTED_SHA']}}))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 --retry-max-time 15 --retry-all-errors \
            -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/fomc-prospective-capture.yml/dispatches" \
            -d "$payload"
          echo "FOMC_PROSPECTIVE_REFRESH_DISPATCHED expected_sha=$EXPECTED_SHA"

      - name: Build exact-SHA official macro transport bundle off-host
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet -e '.[research]'
          python scripts/build_offhost_macro_bundle.py \
            --expected-sha "$EXPECTED_SHA" \
            --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
            --output "official-macro-${ACCEPTANCE_RUN_ID}.json"

      - name: Transfer verified official macro bundle over deploy channel
        uses: appleboy/scp-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: official-macro-${{ github.run_id }}.json
          target: /tmp

      - name: Install fresh exact-SHA official macro bundle before smoke
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
          ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
          script: |
            set -euo pipefail
            case "$ACCEPTANCE_RUN_ID" in
              ''|*[!0-9]*) echo "Invalid acceptance_run_id"; exit 1 ;;
            esac
            bundle_input="/tmp/official-macro-${ACCEPTANCE_RUN_ID}.json"
            trap 'rm -f -- "$bundle_input"' EXIT
            test -f "$bundle_input"
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/install_offhost_macro_bundle.py \
              --input "$bundle_input" \
              --destination /opt/seiltanzer/data/research/official_macro_offhost_latest.json \
              --expected-sha "$EXPECTED_SHA" \
              --acceptance-run-id "$ACCEPTANCE_RUN_ID"

      - name: Exercise exact production routes, AI and official macro data
        id: smoke
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 8m
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            test "$(git -C /opt/seiltanzer rev-parse HEAD)" = "$EXPECTED_SHA"
            /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/production_functional_smoke.py \
              --expected-sha "$EXPECTED_SHA"

      - name: Verify public terminal from GitHub runner
        id: public
        run: |
          set -euo pipefail
          url="http://94.241.171.182:8790/api/state"
          for attempt in 1 2 3; do
            if curl -fsS \
              --connect-timeout 3 \
              --max-time 5 \
              --output /tmp/public-state.json \
              "$url"; then
              bytes=$(wc -c < /tmp/public-state.json)
              echo "public terminal PASS attempt=${attempt} bytes=${bytes}"
              exit 0
            fi
            echo "public terminal attempt=${attempt}/3 failed"
            sleep 2
          done
          echo "::error::Public terminal is unreachable at ${url}"
          exit 1

      - name: Start exact-SHA post-deploy research acceptance
        id: orchestration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$EXPECTED_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "::error::Invalid expected_sha: $EXPECTED_SHA"; exit 1 ;;
          esac
          case "$ACCEPTANCE_RUN_ID" in
            ''|*[!0-9]*) echo "::error::Invalid acceptance_run_id: $ACCEPTANCE_RUN_ID"; exit 1 ;;
          esac
          payload=$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "expected_sha": os.environ["EXPECTED_SHA"],
                  "acceptance_run_id": os.environ["ACCEPTANCE_RUN_ID"],
              },
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 2 --retry-max-time 30 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/production-post-research.yml/dispatches" \
            -d "$payload"
          echo "POST_RESEARCH_DISPATCHED expected_sha=$EXPECTED_SHA acceptance_run_id=$ACCEPTANCE_RUN_ID"

      - name: Release pre-acceptance gate if deploy chain failed
        if: always() && steps.preacceptance.outcome == 'success' && steps.orchestration.outcome != 'success'
        uses: appleboy/ssh-action@v1
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
          ACCEPTANCE_RUN_ID: ${{ env.ACCEPTANCE_RUN_ID }}
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          envs: EXPECTED_SHA,ACCEPTANCE_RUN_ID
          script: |
            /opt/seiltanzer/.venv/bin/python \
              /opt/seiltanzer/scripts/production_research_acceptance.py release-gate \
              --acceptance-run-id "$ACCEPTANCE_RUN_ID" \
              --expected-sha "$EXPECTED_SHA" || true

      - name: Diagnose production failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: 94.241.171.182
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          command_timeout: 2m
          script: |
            set +e
            echo '=== DEPLOYED SHA ==='
            git -C /opt/seiltanzer rev-parse HEAD || true
            echo '=== SERVICE ==='
            systemctl status seiltanzer --no-pager -l || true
            echo '=== AI SNAPSHOT STATUS ==='
            curl -sS --max-time 5 http://127.0.0.1:8790/api/ai/snapshot/status || true
            echo
            echo '=== MACRO STATUS ==='
            curl -sS --max-time 8 http://127.0.0.1:8790/api/research/macro/status || true
            echo
            echo '=== RECENT JOURNAL ==='
            journalctl -u seiltanzer --since '-15 minutes' --no-pager -n 220 || true

      - name: Publish exact-SHA production statuses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY: ${{ steps.delivery.outcome }}
          PREACCEPTANCE: ${{ steps.preacceptance.outcome }}
          READINESS: ${{ steps.readiness.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          PUBLIC: ${{ steps.public.outcome }}
          ORCHESTRATION: ${{ steps.orchestration.outcome }}
          MATHREFRESH: ${{ steps.mathrefresh.outcome }}
          SOURCEREFRESH: ${{ steps.sourcerefresh.outcome }}
          FOMCREFRESH: ${{ steps.fomcrefresh.outcome }}
        run: |
          set -u
          prod_state=failure
          smoke_state=failure
          readiness_state=failure
          if [ "$READINESS" = "success" ]; then readiness_state=success; fi
          if [ "$SMOKE" = "success" ] && [ "$PUBLIC" = "success" ]; then smoke_state=success; fi
          if [ "$DELIVERY" = "success" ] && [ "$PREACCEPTANCE" = "success" ] \
             && [ "$READINESS" = "success" ] \
             && [ "$SMOKE" = "success" ] && [ "$PUBLIC" = "success" ] \
             && [ "$MATHREFRESH" = "success" ] && [ "$SOURCEREFRESH" = "success" ] \
             && [ "$FOMCREFRESH" = "success" ] && [ "$ORCHESTRATION" = "success" ]; then
            prod_state=success
          fi

          publish() {
            state="$1"; context="$2"; description="$3"
            payload="{\"state\":\"$state\",\"context\":\"$context\",\"description\":\"$description\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
            curl --fail-with-body --silent --show-error \
              --retry 5 --retry-delay 2 --retry-max-time 30 --retry-all-errors \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/statuses/${EXPECTED_SHA}" \
              -d "$payload"
          }

          publish "$prod_state" "production/seiltanzer" \
            "Atomic exact-SHA delivery, readiness and functional acceptance"
          publish "$readiness_state" "g1e/storage-intelligence" \
            "Durability and bounded Intelligence readiness"
          publish "$readiness_state" "g1m/management-edge" \
            "Terminal Management Edge readiness"
          publish "$readiness_state" "g1s/short-horizon" \
            "Fast short-horizon evidence and Q maturity readiness"
          publish "$readiness_state" "g1m/local-feedback" \
            "Local management feedback readiness"
          publish "$smoke_state" "production/functional-smoke" \
            "Bounded analytics, AI Verdict, official macro and public endpoint smoke"

          echo "EXPECTED_SHA=$EXPECTED_SHA acceptance_run_id=$ACCEPTANCE_RUN_ID delivery=$DELIVERY readiness=$READINESS smoke=$SMOKE public=$PUBLIC orchestration=$ORCHESTRATION"
          test "$prod_state" = "success"
